<style>
:root{--gold:#e2c27a;--gold2:#a8843f;--ink:#f6ead0;--dim:#b9a98a;--night:#0d0714;--plum:#2a1236;--red:#c2413a;--g:#ff8a5c;--c:#5fd0c4;--p:#b58cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
#ui>*{pointer-events:auto}
button{font-family:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
/* loading */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2a1236,#07030b 70%);z-index:50;transition:opacity .8s}
#loading.out{opacity:0;pointer-events:none}
#loading .orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9 0,#b58cff55 25%,#2a1236 70%);box-shadow:0 0 40px #b58cff66;animation:pulse 1.6s ease-in-out infinite}
#loading p{margin-top:18px;color:var(--dim);letter-spacing:.2em;font-size:14px}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 70px #b58cffaa}}
/* hud */
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:0;right:0;display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:2px 12px;padding:0 12px;pointer-events:none}
#hud>*{pointer-events:auto}
#hudTitle{font-weight:700;font-size:14px;letter-spacing:.12em;color:var(--gold);text-shadow:0 1px 6px #000;opacity:.9}
#hudInfo{text-align:center;font-size:13px;color:var(--ink);text-shadow:0 1px 4px #000}
.iconBtn{width:36px;height:36px;border-radius:50%;border:1px solid #e2c27a66;background:#0d0714aa;font-size:15px;display:grid;place-items:center}
.iconBtn.off{opacity:.45}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#title{background:radial-gradient(ellipse at 50% 40%,#0d071400 20%,#0d0714cc 75%)}
#title h1{margin:0 0 6px;font-size:clamp(38px,10vw,64px);font-weight:800;line-height:1.15;letter-spacing:.08em;color:var(--ink);text-shadow:0 0 18px #b58cff88,0 2px 0 #000}
#title h1 span{display:block}
#title h1 span:last-child{color:var(--gold);padding-left:1.2em}
#title .lead{margin:6px 0 26px;font-size:15px;line-height:1.8;color:var(--ink);text-shadow:0 1px 6px #000}
.modeBtns{display:flex;flex-direction:column;gap:14px;width:min(420px,100%)}
.btn{border:1px solid var(--gold2);background:linear-gradient(180deg,#3a1a48ee,#1b0c26ee);border-radius:14px;padding:12px 16px;box-shadow:0 4px 18px #000a,inset 0 1px 0 #ffffff22;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.big{padding:16px 18px;text-align:left}
.btn.big b{display:block;font-size:21px;color:var(--gold);letter-spacing:.06em}
.btn.big small{display:block;margin-top:4px;font-size:13px;color:var(--ink);opacity:.85;line-height:1.5}
.note{margin-top:18px;font-size:11px;color:var(--dim);line-height:1.7}
/* dialog */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(640px,calc(100% - 20px));min-height:96px;padding:14px 18px 16px;border-radius:14px;border:1px solid #e2c27a88;background:linear-gradient(180deg,#1d0d29ee,#0d0714f2);box-shadow:0 8px 30px #000c;cursor:pointer}
#dialog .name{position:absolute;top:-12px;left:16px;padding:1px 12px;font-size:12px;letter-spacing:.2em;border-radius:20px;background:#3a1a48;border:1px solid var(--gold2);color:var(--gold)}
#dlgText{font-size:16.5px;line-height:1.75;white-space:pre-wrap;min-height:2.6em}
#dlgNext{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* choices */
#choices{position:absolute;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 20px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
#choices .btn{font-size:15px;padding:12px 10px;min-height:52px;line-height:1.35}
#choices .qhead{grid-column:1/-1;font-size:12px;color:var(--gold);letter-spacing:.15em;text-align:left;text-shadow:0 1px 4px #000}
#choices input{grid-column:1/-1;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--gold2);background:#0d0714ee;color:var(--ink);outline:none}
#choices .wide{grid-column:1/-1}
/* prob panel */
#probPanel{position:absolute;top:calc(env(safe-area-inset-top) + 86px);right:10px;width:150px;padding:10px 12px;border-radius:12px;background:#0d0714cc;border:1px solid #e2c27a55;font-size:12px}
#probPanel .t{color:var(--gold);letter-spacing:.15em;margin-bottom:6px}
.pr{display:grid;grid-template-columns:3.3em 1fr 2.8em;align-items:center;gap:6px;margin:4px 0}
.pr .bar{height:7px;border-radius:4px;background:#ffffff1a;overflow:hidden}
.pr .bar i{display:block;height:100%;border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pr .v{text-align:right;font-variant-numeric:tabular-nums}
/* seal */
#sealPanel{position:absolute;top:calc(env(safe-area-inset-top) + 126px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:40px;background:#0d0714dd;border:1px solid #c2413a99;box-shadow:0 4px 16px #000a}
#sealPanel .wax{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e86a5c,#8e1d1a 70%);display:grid;place-items:center;font-weight:800;color:#ffd9c9;font-size:15px;box-shadow:inset 0 -2px 4px #0006}
#sealPanel .lbl{font-size:11px;color:var(--dim);letter-spacing:.1em}
#sealPanel .code{white-space:nowrap;font-size:20px;font-weight:800;letter-spacing:.12em;color:#ffd9c9;font-variant-numeric:tabular-nums}
/* score */
#scoreBar{position:absolute;top:calc(env(safe-area-inset-top) + 84px);left:10px;padding:6px 12px;border-radius:20px;background:#0d0714cc;border:1px solid #e2c27a55;font-size:13px}
/* chant */
#chant{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:clamp(38px,10.5vw,76px);font-weight:800;letter-spacing:.1em;color:var(--ink);text-shadow:0 0 24px #b58cffaa,0 3px 0 #000;pointer-events:none}
#chant.pop{animation:chantPop .35s ease-out}
@keyframes chantPop{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}
#chant small{display:block;margin-top:4px;font-size:clamp(20px,5.5vw,28px);letter-spacing:.2em;color:var(--gold)}
/* janken pad */
#jankenPad{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:14px;align-items:flex-end}
#jankenPad button{width:clamp(86px,26vw,118px);height:clamp(96px,29vw,128px);border-radius:18px;border:1px solid var(--gold2);background:linear-gradient(180deg,#3a1a48f2,#160a20f2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;font-weight:700;box-shadow:0 6px 18px #000b;transition:transform .1s,opacity .2s}
#jankenPad button img{width:70%;height:auto;pointer-events:none;filter:drop-shadow(0 2px 4px #000)}
#jankenPad button:active{transform:scale(.94)}
#jankenPad.locked button{opacity:.35;pointer-events:none}
#jankenPad button.picked{opacity:1!important;border-color:var(--gold);box-shadow:0 0 22px #e2c27aaa}
#timer{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);width:min(360px,80%);height:6px;border-radius:4px;background:#ffffff22;overflow:hidden}
#timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left}
/* result */
#result{justify-content:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 56px) 14px calc(env(safe-area-inset-bottom) + 30px);background:linear-gradient(180deg,#0d071466,#0d0714f0 40%);-webkit-overflow-scrolling:touch}
.rc{width:min(620px,100%);margin:0 auto 14px;padding:16px;border-radius:16px;border:1px solid #e2c27a55;background:linear-gradient(180deg,#22102ef0,#120818f5);text-align:left;box-shadow:0 6px 24px #0009}
.rc h2{margin:0 0 10px;font-size:15px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.rc p{margin:6px 0;font-size:15px;line-height:1.75}
.rc .small{font-size:12px;color:var(--dim);line-height:1.7}
.hero{text-align:center}
.hero .who{font-size:14px;color:var(--dim);letter-spacing:.1em}
.hero .handBig{width:150px;height:150px;margin:4px auto 0;display:block}
.hero .handName{font-size:44px;font-weight:800;letter-spacing:.2em;color:var(--gold);text-shadow:0 0 18px #e2c27a66}
.hero .pct{font-size:15px;margin-top:6px}
.hero .pct b{font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid #e2c27a55;background:#0d071499}
table.q{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.q th,table.q td{border-bottom:1px solid #ffffff18;padding:7px 4px;text-align:center}
table.q th{color:var(--dim);font-weight:500;font-size:12px}
table.q td img{width:34px;height:34px;vertical-align:middle}
table.q td small{display:block;font-size:11px;color:var(--dim)}
.tip{display:flex;gap:10px;margin:10px 0}
.tip .n{flex:0 0 26px;height:26px;border-radius:50%;background:#3a1a48;border:1px solid var(--gold2);display:grid;place-items:center;color:var(--gold);font-size:13px}
.tip b{display:block;font-size:15px}
.tip span{font-size:13px;line-height:1.7;color:#e9dcc0}
.tip em{font-style:normal;white-space:nowrap;display:inline-block;font-size:11px;padding:0 6px;border-radius:10px;border:1px solid #e2c27a55;color:var(--dim);margin-left:4px}
.btnRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btnRow .btn{flex:1 1 160px;font-size:15px;padding:12px}
.btn.gold{background:linear-gradient(180deg,#e2c27a,#a8843f);color:#1b0c26;font-weight:800;border-color:#f3dba0}
.seals{width:100%;font-size:12px;border-collapse:collapse}
.seals td{padding:8px 4px;border-bottom:1px solid #ffffff14;vertical-align:top;line-height:1.6}
.seals code{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:#ffd9c9}
.seals .ok{color:#8fe3a0}
.copy{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--gold2);background:#0d0714}
.bars3{display:grid;gap:6px;margin-top:6px}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:30px;background:#0d0714ee;border:1px solid var(--gold2);font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
@media (min-aspect-ratio:4/3){#probPanel{right:20px;top:104px;width:170px}}
/* ===== [SEC:NKW-UI-CSS] ===== */
html:lang(ko),html:lang(ko) body{font-family:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Shippori Mincho B1",serif}
html:lang(zh-CN),html:lang(zh-CN) body{font-family:"Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun","Shippori Mincho B1",serif}
.nkw-bar{position:fixed;z-index:9000;display:flex;align-items:center;gap:6px;top:max(8px,env(safe-area-inset-top))}
#nkw-left{left:max(8px,env(safe-area-inset-left))}
#nkw-right{right:max(8px,env(safe-area-inset-right))}
.nkw-btn{font:inherit;font-size:14px;line-height:1;color:var(--ink);background:#0d0714b8;border:1px solid #e2c27a66;border-radius:999px;padding:9px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nkw-btn:hover{background:#2a1446d9}
.nkw-btn[hidden]{display:none}
select.nkw-btn{appearance:none;-webkit-appearance:none;padding-right:12px}
select.nkw-btn option{color:#000}
#nkw-confirm{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#nkw-confirm[hidden]{display:none}
.nkw-box{background:#1a0f2a;color:var(--ink);border:1px solid var(--gold2);border-radius:14px;padding:20px;width:min(86vw,340px);text-align:center}
.nkw-box p{margin:0 0 16px;font-size:16px;line-height:1.5}
.nkw-box button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:10px 22px;margin:0 6px;cursor:pointer}
#nkw-yes{background:#b8322a;color:#fff}
#nkw-no{background:#3a2a4a;color:var(--ink)}
#probPanel .t::first-letter,.rc h2::first-letter,.hero .who::first-letter{text-transform:uppercase}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== [SEC:CONFIG] =====
const CONFIG = {
  FIXED: 1/120, MAX_FRAME: 0.1,
  INPUT_WINDOW: 1.5,          // 「じゃん」から押せる秒数
  CHANT_BEAT: 0.4,            // じゃん・けん・ぽんの間隔（秒）
  FAST_BEAT: 0.27,            // 速い掛け声（誘導）の間隔
  OBS_ROUNDS: 10, FINAL_ROUNDS: 5,
  OBS_QUICK: 3,               // 2回目から（前回を覚えている時）の観察の回数
  CONF_STAR: [0.5, 0.6],      // 予言の自信：予言した手の確率がこれ以上で★★、★★★（★★★の予言を破って勝つと2勝ぶん）
  MEM_KEY: 'tsugi_mem_v1', MEM_MAX: 40,   // 前回のあなたを覚えておく場所と、覚えておく回数
  TYPE_SPEED: 30,             // 1秒に出る文字数
  PIXEL_RATIO_MAX: 1.75,
  EXPOSURE: 1.15,
  BLOOM: { strength: 0.45, radius: 0.5, threshold: 0.85 },
  // 研究の数字（芳沢光雄・725人のべ11,567回）：グー・チョキ・パー
  PRIOR_FIRST: [0.350, 0.317, 0.333],
  PRIOR_REPEAT: 0.228,        // 2回続けて同じ手を出す割合
  // 直前の結果ごとの「次の手の変え方」[同じ, 上げる(さっきの手に勝つ手), 下げる(さっきの手に負ける手)]
  PRIOR_AFTER: { W: [0.42, 0.30, 0.28], L: [0.26, 0.38, 0.36], T: [0.24, 0.42, 0.34] },
  PROB_CLAMP: [0.14, 0.62],
  APP_CHOKI: 1.05,            // ボタンで選ぶとチョキがやや増えるはず（真ん中・形を作らなくていい）という仮説
  HAND_CELL: 0.0021,          // 手の形を作る細かさ（m）

function drawMist(t, probs) {

  const base = x.createRadialGradient(c, c, 0, c, c, c); base.addColorStop(0, 'rgba(120,90,200,.25)'); base.addColorStop(1, 'rgba(0,0,0,0)');

    const p = probs ? probs[k] : 1 / 3;
    for (let j = 0; j < 3; j++) {

}

}
function cardReveal() { CARD.anim = { kind: 'reveal', t: 0, dur: 1.1 }; CARD.state = 'up'; }
function cardHide() { CARD.anim = { kind: 'hide', t: 0, dur: 0.4 }; CARD.state = 'hidden'; }
function updateCard(dt) {
  const g = CARD.group; if (!g || !CARD.anim) return;
  const a = CARD.anim; a.t += dt; const u = clamp(a.t / a.dur, 0, 1), e = ease(u);
  if (a.kind === 'place') {
    g.position.set(lerp(-0.08, CARD_SPOT.pos.x, e), CARD_SPOT.pos.y + Math.sin(u * Math.PI) * 0.04, lerp(TZ - 0.25, CARD_SPOT.pos.z, e));
    g.rotation.set(0, lerp(0.6, CARD_SPOT.rotY, e), 0);
  } else if (a.kind === 'reveal') {
    // 封を割ってから、持ち上げて裏返す
    if (u < 0.25) { const k = u / 0.25; CARD.wax.scale.setScalar(1 + k * 0.4); CARD.wax.position.y = 0.0028 + k * 0.01; }

const CANCEL = { cancel: true };
const PENDING = new Set(), TIMERS = [];
const RUN = { id: 0, mode: '', testMode: '' };
function pend(fn) { return new Promise((res, rej) => { const o = { rej }; PENDING.add(o); fn(v => { if (PENDING.has(o)) { PENDING.delete(o); res(v); } }); }); }

function newRun() {
  RUN.id++;
  for (const o of PENDING) o.rej(CANCEL);
  PENDING.clear(); TIMERS.length = 0;
  DLG.res = null; CHO.res = null; JK.active = false; JK.res = null;
  ['dialog', 'choices', 'jankenPad', 'timer', 'probPanel', 'sealPanel', 'scoreBar', 'result', 'title'].forEach(id => $(id).classList.add('hide'));
  $('chant').textContent = ''; $('hudInfo').textContent = '';

  APP.over = false;
}
function runFlow(fn) {
  newRun();
  const id = RUN.id;

function jankenInput(h) {

function updateJanken(dt) {
  if (!JK.active) return;

    chant(JK.words[JK.said]); sfx(['jan', 'ken', 'pon'][JK.said]);
    if (JK.said < 2) { TELLER.shake = 1; PLAYER.shake = 1; setTellerTarget('R', 'shake'); }
    JK.said++;
  }
  // 手の形のフェイント：「けん」で一瞬その形を見せて、「ぽん」の前に握り直す
  if (JK.feint >= 0 && !JK.revealed) {
    if (JK.feintStep === 0 && JK.t >= B) { TELLER.handR.setPose(POSE_OF[JK.feint], 40); JK.feintStep = 1; }
    if (JK.feintStep === 1 && JK.t >= B * 1.7) { TELLER.handR.setPose('rock', 40); JK.feintStep = 2; }

    if (JK.input >= 0 && JK.t >= 2 * B) revealJanken();

async function placeSeal(seal) {
  cardSetFace(seal.pred, 'B'); cardPlace(true); sfx('seal');
  setTellerTarget('R', 'card'); TELLER.handR.setPose('flat'); TELLER.lean = 0.2; TELLER.lookAt.set(0, TY, TZ + 0.2);
  $('sealCode').textContent = seal.code; $('sealPanel').classList.remove('hide');
  await wait(0.8);
  setTellerTarget('R', 'rest'); TELLER.lean = 0; TELLER.lookAt.set(0, 1.15, 0.9);
}
function makeSeal(r, tac, pred, teller, conf) {
  const sw = t('saltWords'), salt = sw[secureInt(sw.length)] + '-' + secureHex(16), lang = LANG;
  const commit = sealText(lang, r, tac, pred, teller, salt, conf), hash = sha256(commit);
  return { r, pred, teller, tac, conf, lang, salt, commit, hash, code: shortCode(hash), revealed: false, player: -1 };
}
async function revealSeal() { await wait(0.15); cardReveal(); sfx('crack'); await wait(0.35); sfx('flip'); await wait(0.7); }
// 観察のじゃんけんの合間に聞く質問（はじめは答えやすい質問、クセの質問はあとのほう）
const QSLOTS = [[0, 1], [2], [7], [8, 13], [9], [3], [4], [5, 10], [11, 12], [6]];

// ===== [SEC:OBS_LINES] =====
// 観察中の占い師のセリフ（文は I18N の obsFirst / obsHand / obsOut* など）
function obsLine(obs, tacs, mem) {
  const n = obs.length, cur = obs[n - 1], h = cur.player, Hh = H[h];
  const pick = arr => {   // 同じセリフをくり返さない
    const fresh = arr.filter(t => !mem.used.has(t));
    const t = (fresh.length ? fresh : arr)[Math.floor(rng() * (fresh.length ? fresh.length : arr.length))];
    mem.used.add(t); return t;
  };
  const OUT = () => pick(t({ W: 'obsOutW', L: 'obsOutL', T: 'obsOutT' }[cur.outcome]));
  if (n === 1) return { text: pick(t('obsFirst')[h]) + t('sentSep') + OUT(), lean: 0.12 };
  const prev = obs[n - 2];
  let run = 1; for (let i = n - 2; i >= 0 && obs[i].player === h; i--) run++;
  // 同じ手が3回以上続いたら揺さぶる
  if (run >= 3) {
    if (!mem.pressed) { mem.pressed = true; return { text: t('pressFirst', { h: Hh }), lean: 0.15 }; }
    return { text: pick(t('pressMore').map(x => fmt(x, { h: Hh, n: run }))), lean: 0.15 };
  }
  // 誘導への反応
  const part = (tacs[n - 1].parts || [])[0], cand = [];
  if (part) {
    if (part.kind === 'feint' && h === part.cue) cand.push(...t('feintFollow').map(x => fmt(x, { h: Hh, c: H[part.cue] })));
    if (part.kind === 'feint' && h === beatsOf(part.cue)) cand.push(t('feintBeat', { c: H[part.cue] }));
    if (part.kind === 'declare' && h === beatsOf(part.cue)) cand.push(t('declBelieve', { c: H[part.cue] }));
    if (part.kind === 'declare' && h !== beatsOf(part.cue)) cand.push(t('declDoubt'));
    if (part.kind === 'speed' && h === prev.player) cand.push(t('speedRepeat', { h: Hh }));
    else if (part.kind === 'speed' && h === 0) cand.push(t('speedHome', { h: Hh }));
  }
  if (cand.length && rng() < 0.8) return { text: pick(cand) };
  // 前の回からの変え方
  if (h === prev.player) {
    if (prev.outcome === 'W') cand.push(...t('stayW').map(x => fmt(x, { h: Hh })));
    else if (prev.outcome === 'L') cand.push(...t('stayL').map(x => fmt(x, { h: Hh })));
    else cand.push(...t('stayT').map(x => fmt(x, { h: Hh })));
  } else {
    if (prev.outcome === 'L' && h === beatsOf(prev.teller)) cand.push(t('revenge', { c: H[prev.teller], h: Hh }));
    if (prev.outcome === 'L' && h === prev.teller) cand.push(t('copyWin', { h: Hh }));
    if (prev.outcome === 'W') cand.push(t('changeAfterWin', { h: Hh }));
    if (prev.outcome === 'T' && h === beatsOf(prev.player)) cand.push(t('tieUp', { c: H[prev.player], h: Hh }));
    if (prev.outcome === 'T' && h === loserOf(prev.player)) cand.push(t('tieDown', { h: Hh }));
  }
  if (cand.length && rng() < 0.7) return { text: pick(cand) };
  return { text: pick(t('obsHand')[h]) + t('sentSep') + OUT() };
}

async function flowB() {
  RUN.mode = 'B';
  Object.assign(GB, { R: null, rounds: [], obs: [], answers: [], seals: [], teaser: null, score: { W: 0, L: 0, T: 0 } });
  TELLER.lookAt.set(0, 1.15, 0.9);
  // 前回のあなたを覚えていたら「続きから」を選べる（質問なし・観察は少し）
  const mem = loadMem();
  let quick = false;
  if (mem) {
    await say(t('bBack'));
    quick = (await choose('', [t('bQuickBtn', { n: CONFIG.OBS_QUICK }), t('bFullBtn', { n: CONFIG.OBS_ROUNDS, q: QB.length })], { wide: true })) === 0;
  }
  const NOBS = quick ? CONFIG.OBS_QUICK : CONFIG.OBS_ROUNDS;
  if (quick) { GB.answers = mem.answers.slice(); await say(t('bQuick1', { n: NOBS })); }
  else { await say(t('bWelcome1')); await say(t('bWelcome2', { n: NOBS })); }
  await say(t('bWelcome3'));
  // 続きからの時は、前回までのクセを先に読みに入れておく
  if (quick) { GB.R = makeReader(profileB(GB.answers)); mem.hist.forEach(x => GB.R.observe(x.p, x.t, x.tac || { parts: [] }, x.pred == null ? -1 : x.pred)); }
  // 観察：占い師はでたらめ。2回目以降は誘導への反応も試す
  const kinds = ['feint', 'feint', 'feint', 'declare', 'declare', 'declare', 'speed', 'speed'];
  for (let i = kinds.length - 1; i > 0; i--) { const j = secureInt(i + 1); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  const sched = quick ? ['none', ...kinds.slice(0, NOBS - 1)] : ['none', 'none', ...kinds];
  const obsScore = { W: 0, L: 0, T: 0 }, obsTac = [];
  let lastO = '', qi = 0;
  const obsMem = { used: new Set(), pressed: false };
  const ask = async (i) => {
    if (qi === 0) await say(t('bAskSelf', { n: QB.length }), { auto: 0.6 });
    qi++;
    setInfo(t('qCount', { i: qi, n: QB.length }));
    sayNow(QB[i].q);
    GB.answers[i] = await choose(t('qCount', { i: qi, n: QB.length }), QB[i].o.map(o => o.t));
  };
  for (let r = 0; r < NOBS; r++) {
    setInfo(t('obsInfo', { i: r + 1, n: NOBS }));
    setScore(scoreText(obsScore, t('obsLbl')));
    const k = sched[r] || 'none', tac = k === 'none' ? { parts: [] } : { parts: [{ kind: k, cue: k === 'speed' ? -1 : secureInt(3) }] };
    const teller = secureInt(3);
    // 1回目は「お試し」：最初の手を当ててみせる（見せ場を最初に）
    let teaser = null;
    if (r === 0) {
      const pred = GB.R ? argmax(GB.R.habit()) : pickW(CONFIG.PRIOR_FIRST.map(x => x ** 4));
      teaser = GB.teaser = makeSeal(0, tac, pred, teller, 0);
      await placeSeal(teaser);
      sayNow(t(quick ? 'teaserSayMem' : 'teaserSay', { code: teaser.code }));
      await choose('', [t('fight')], { gold: 0, wide: true });
    }
    if (declOf(tac) >= 0) await sayDeclare(declOf(tac));
    const res = await jankenUntilDone(teller, tacOpt(tac, lastO === 'T'));
    obsScore[res.outcome]++; lastO = res.outcome;
    GB.obs.push({ player: res.player, teller: res.teller, outcome: res.outcome }); obsTac.push(tac);
    setScore(scoreText(obsScore, t('obsLbl')));
    if (teaser) {
      teaser.player = res.player; teaser.outcome = res.outcome;
      await revealSeal(); teaser.revealed = true;
      const hit = teaser.pred === res.player; if (hit) sfx('hit');
      await say(t(hit ? 'teaserHit' : quick ? 'teaserMissMem' : 'teaserMiss', { h: H[teaser.pred] }) + t('sealShow', { c: teaser.commit }), { auto: 2.0 });
      cardHide(); $('sealPanel').classList.add('hide');
    } else {
      const line = obsLine(GB.obs, obsTac, obsMem);
      TELLER.lean = line.lean || 0;
      await say(line.text, { auto: 0.45 });
      TELLER.lean = 0;
    }
    if (!quick) for (const i of QSLOTS[r] || []) await ask(i);
  }
  if (!quick) for (let i = 0; i < QB.length; i++) if (GB.answers[i] == null) await ask(i);   // 観察の回数を変えた時の残り
  setInfo('');
  $('scoreBar').classList.add('hide');
  TELLER.lean = 0.2; TELLER.lookAt.set(0.1, TY, TZ - 0.18); TELLER.handL.setPose('open', 6);
  await say(t('bThanks'));
  TELLER.lean = 0; TELLER.lookAt.set(0, 1.15, 0.9);
  // 読みの準備：答え → 最初の読み、観察 → クセと誘導への反応
  if (!GB.R) GB.R = makeReader(profileB(GB.answers));
  GB.obs.forEach((o, i) => GB.R.observe(o.player, o.teller, obsTac[i]));
  GB.R.startFinal();
  // 本番
  await say(t('bFinal1', { n: CONFIG.FINAL_ROUNDS }));
  await say(t('bFinal2'));
  await say(t('bFinal3'));
  const sc = GB.score;
  lastO = '';
  for (let r = 0; r < CONFIG.FINAL_ROUNDS; r++) {
    setInfo(t('finInfo', { i: r + 1, n: CONFIG.FINAL_ROUNDS }));
    setScore(scoreText(sc, t('finLbl')));
    const dec = GB.R.decide(), conf = confOf(dec);
    const seal = makeSeal(r + 1, dec.tac, dec.pred, dec.teller, conf); seal.dist = dec.dist;
    GB.seals.push(seal);
    // カードを伏せて置き、封印コードと予言の自信を見せる
    await placeSeal(seal);
    sayNow(t('sealSay', { r: r + 1, code: seal.code }) + t('sentSep') + t('conf' + conf));
    await choose('', [t('fight')], { gold: 0, wide: true });
    if (declOf(dec.tac) >= 0) await sayDeclare(declOf(dec.tac));
    const res = await jankenUntilDone(dec.teller, tacOpt(dec.tac, lastO === 'T'));
    lastO = res.outcome;
    GB.R.observe(res.player, res.teller, dec.tac, dec.pred);
    seal.player = res.player; seal.outcome = res.outcome;
    seal.double = conf === 3 && res.outcome === 'W';   // ★★★の予言を破って勝ったら2勝ぶん
    sc[res.outcome] += seal.double ? 2 : 1;
    setScore(scoreText(sc, t('finLbl')));
    // カードをめくる
    await revealSeal(); seal.revealed = true;
    const hit = seal.pred === res.player;
    if (hit) sfx('hit'); else if (seal.double) sfx('win');
    const msg = seal.double ? t('conf3Win') : t(hit ? 'predHit' : 'predMiss', { h: H[seal.pred] });
    await say(msg + trickLine(dec.tac, dec.teller) + t('sealShow', { c: seal.commit }), { auto: 2.4 });
    cardHide(); $('sealPanel').classList.add('hide');
    await wait(0.3);
  }
  setInfo(''); $('scoreBar').classList.add('hide');
  // 終わりのことば
  const hits = GB.seals.filter(x => x.pred === x.player).length;
  const tW = sc.L, tL = sc.W;
  TELLER.handR.setPose(tW > tL ? 'point' : 'flat'); setTellerTarget('R', tW > tL ? 'beckon' : 'rest');
  const ev = { w: tW, l: tL, t: sc.T, n: CONFIG.FINAL_ROUNDS, h: hits };
  if (tW > tL) await say(t('endWin', ev));
  else if (tW === tL) await say(t('endDraw', ev));
  else await say(t('endLose', ev));
  await say(t('bDone'), { auto: 0.6 });
  $('dialog').classList.add('hide');
  // 次に来た時のために、今回のクセを覚えておく
  const hist = GB.obs.map((o, i) => ({ p: o.player, t: o.teller, tac: obsTac[i] })).concat(GB.seals.map(x => ({ p: x.player, t: x.teller, tac: x.tac, pred: x.pred })));
  saveMem(GB.answers, hist, quick ? mem : null);
  sendStats();
  showResultB();
}

function iconImg(h, cls = '') { return `<img class="${cls}" alt="${H[h]}" src="${ICON.url[h]}">`; }
function bars(p, ref) {
  return `<div class="bars3">` + H.map((n, i) => `<div class="pr"><span style="color:${HCOL[i]}">${n}</span><div class="bar"><i style="width:${Math.min(100, p[i] * 100 / 0.6).toFixed(1)}%;background:${HCOL[i]}"></i></div><span class="v">${pct(p[i])}%</span></div>` + (ref ? `<div class="small" style="margin:-2px 0 2px 3.2em">${t('avg', { p: (ref[i] * 100).toFixed(1) })}</div>` : '')).join('') + `</div>`;
}
function communityLine() {
  const c = STATS.first, n = c[0] + c[1] + c[2];

function tipsA(m, res) {
  const T = m.tags, out = [];
  const add = (pri, title, body, basis) => out.push({ pri, title, body, basis });
  add(5, ...t('tipTie'));
  if (T.has('grip')) add(8, ...t('tipGrip'));
  if (T.has('strong')) add(8, ...t('tipStrong'));
  if (T.has('hot') || T.has('rematch')) add(7, ...t('tipHot'));
  if (m.fam > 0 && m.habit >= 0) add(9, ...t('tipHabit').map(x => fmt(x, { h: H[m.habit], b: H[beatsOf(beatsOf(m.habit))] })));
  if (T.has('kid')) add(7, ...t('tipKid'));
  if (T.has('thinker')) add(7, ...t('tipThinker'));
  if (T.has('mypace')) add(5, ...t('tipMypace'));
  if (m.after.W[0] > 0.42) add(6, ...t('tipWinStay'));
  add(T.has('strong') || T.has('thinker') || T.has('observer') ? 8 : 5, ...t('tip2nd'));
  add(4, ...t('tip3run'));
  out.sort((a, b) => b.pri - a.pri);
  return out.slice(0, 3);
}

function cueHTML(a) {

function induceA(m, r, nm) {

      body: t(contra ? 'indFeintBeat' : 'indFeintFollow', { x: q(H[X]), n: nm, t: q(H[tgt]), b: q(H[B]) }), basis: t(contra ? 'bAns' : 'bExp') });
  }
  {
    const doubt = ind.contra > 0.3 && ind.believe < 0.7;
    const D = doubt ? B : beatsOf(B);
    out.push({ s: 0.3 + 0.25 * ind.believe + 0.2 * Math.abs(ind.contra), title: t('indDeclTitle'),
      body: doubt ? t('indDeclDoubt', { b: H[B], n: nm, c: H[beatsOf(B)] }) : t('indDeclBelieve', { d: H[D], b: H[B], n: nm, c: H[beatsOf(D)] }), basis: t('bPsy') });
  }
  out.push({ s: 0.32 + (T.has('quick') || T.has('tense') || T.has('hot') ? 0.15 : 0) + (T.has('slow') ? -0.08 : 0), title: t('indSpeedTitle'),
    body: t('indSpeedBody', { g: H[0], p: q(H[2]) }), basis: t('bArticle') });
  out.sort((a, b) => b.s - a.s);
  return `<div class="rc"><h2>${t('indH', { n: esc(nm) })}</h2>${out.map((tp, i) => `<div class="tip"><div class="n">${i + 1}</div><div><b>${esc(tp.title)} <span style="color:var(--gold)">${stars(tp.s)}</span><em>${esc(tp.basis)}</em></b><span>${esc(tp.body)}</span></div></div>`).join('')}<p class="small">${t('indNote')}</p></div>`;
}

// 1日最大1万人：Firebase のルールで「前の記録から8.64秒たっていない書き込み」を断る（全体で1日1万回まで）
async function sendStats() {
  if (!CONFIG.FIREBASE || manual) return;
  try {
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('tnt_sent') === today) return;
    localStorage.setItem('tnt_sent', today);
    const v = CONFIG.FIREBASE_VER;
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
    const { getFirestore, doc, updateDoc, increment, serverTimestamp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
    const app = initializeApp(CONFIG.FIREBASE, 'tsugi-no-te');
    const db = getFirestore(app);
    const obs = GB.obs, upd = { n: increment(1), lastTime: serverTimestamp() };
    const f = [0, 0, 0], all = [0, 0, 0], aft = { W: [0, 0, 0], L: [0, 0, 0], T: [0, 0, 0] };
    f[obs[0].player] = 1; obs.forEach(o => all[o.player]++);
    for (let t = 1; t < obs.length; t++) aft[obs[t - 1].outcome][relMove(obs[t - 1].player, obs[t].player)]++;
    for (let i = 0; i < 3; i++) { upd['f' + i] = increment(f[i]); upd['a' + i] = increment(all[i]); for (const o of ['W', 'L', 'T']) upd[o + i] = increment(aft[o][i]); }
    const [col, id] = CONFIG.FB_DOC.split('/');
    await updateDoc(doc(db, col, id), upd);
  } catch (e) { /* 枠が埋まっている時や上限の時は記録しない */ }
}

      const bad = this.check(); if (bad.length) out.push('  ！ ' + bad.join(' / '));
      const i = side === 'R' ? 0 : 1, a = TELLER.arms[i], b = wristBend(i ? TELLER.handL : TELLER.handR, a.W, a.elbow);
      out.push(`${side}.${name}: 曲げ ${b.flex.toFixed(0)}° 横 ${b.dev.toFixed(0)}° 前かがみ ${TELLER.bodyLean.toFixed(2)} ひじ ${a.elbow.toArray().map(x => x.toFixed(2))} ひじ→手首 ${a.W.distanceTo(a.elbow).toFixed(3)} 肩→手首 ${a.W.distanceTo(a.S).toFixed(3)}`);
    }
    return out;
  },
  pose(spotR, poseR, spotL, poseL, cam, pp) {   // 見た目の確認用：占い師の手を置いて、カメラを動かす（pp＝自分の手の形）
    manual = true; newRun(); APP.state = 'play'; $('title').classList.add('hide');
    if (pp) { const [nm, sv] = pp.split('@'); PLAYER.target = PLAYER.show = sv ? +sv : 1; PLAYER.hand.snap(nm); } else PLAYER.target = PLAYER.show = 0;
    setTellerTarget('R', spotR, true); TELLER.handR.snap(poseR); setTellerTarget('L', spotL, true); TELLER.handL.snap(poseL);
    if (cam) { CAM.pos.set(cam[0], cam[1], cam[2]); CAM.look.set(cam[3], cam[4], cam[5]); CAM.curPos.copy(CAM.pos); CAM.curLook.copy(CAM.look); }
    for (let i = 0; i < 30; i++) update(1 / 60);
    render();
  },
  seals() { return GB.seals.map(x => ({ commit: x.commit, hash: x.hash, code: x.code })); },
  ready: false,
};

</script>
