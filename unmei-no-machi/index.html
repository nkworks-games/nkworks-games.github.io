<style>
:root{
  --ink:#eef5f2; --sub:#9fb6b4; --dim:#5e7a7a; --gold:#ffc56b; --gold2:#ffdca0; --aqua:#50e3c2; --aqua2:#a8fff0;
  --card:rgba(9,22,34,.86); --line:rgba(160,220,210,.16);
  --maru:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --ad-h:0px;      /* 広告バナーの高さ（CONFIG.AD_ON で切りかえ） */
  --ad-gap:0px;    /* バナーとゲームの間。まちがって広告を押さないように、広告がある時はいつも75pxあける */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07121f;color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--maru);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:fixed;left:0;right:0;top:0;bottom:calc(var(--ad-h) + var(--ad-gap) + env(safe-area-inset-bottom,0px));overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.hide{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}

/* 上のボタン */
#topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:8px;pointer-events:auto;z-index:5}
.icb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(7,18,31,.6);font-size:18px;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* タイトル */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 34px);text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(7,18,31,0) 35%,rgba(7,18,31,.75) 70%,rgba(7,18,31,.95))}
#title>*{pointer-events:auto}
#title .kicker{font-size:13px;letter-spacing:.3em;color:var(--aqua);margin-bottom:6px}
#title h1{margin:0;font-size:clamp(30px,8.6vw,60px);font-weight:900;letter-spacing:.04em;white-space:nowrap;line-height:1.1;background:linear-gradient(180deg,#fff7e4,var(--gold) 70%,#e89a3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,197,107,.35))}
#title p{margin:14px 0 0;font-size:15px;line-height:1.8;color:#cfe3df;max-width:420px}
#title .count{margin-top:10px;font-size:13px;color:var(--sub)}
#title .count b{color:var(--gold2);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 30px;border-radius:999px;border:0;font-size:18px;font-weight:900;letter-spacing:.08em}
.btn.main{margin-top:22px;background:linear-gradient(180deg,#ffd58c,#ffb347);color:#2a1600;box-shadow:0 6px 24px rgba(255,179,71,.35),inset 0 -3px 0 rgba(0,0,0,.12);min-width:230px}
.btn.main:active{transform:translateY(2px)}

/* 質問 */
#quiz{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:120px;pointer-events:none}
#hud .qno{font-size:13px;color:var(--sub);letter-spacing:.1em}
#hud .left{margin-top:4px;font-size:13px;color:var(--sub)}
#hud .left b{font-size:28px;color:var(--gold2);font-weight:900;letter-spacing:.02em;margin-right:2px;font-variant-numeric:tabular-nums}
#bar{margin-top:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;max-width:240px}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--gold));transition:width .4s}
.card{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#qnote{margin:0 4px 6px;font-size:13px;font-weight:700;color:var(--gold);animation:slide .6s both}
#qtext{margin:2px 4px 14px;font-size:clamp(17px,4.6vw,20px);font-weight:900;line-height:1.55;min-height:2.6em}
#choices{display:grid;gap:9px}
.ch{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid rgba(160,220,210,.22);background:rgba(255,255,255,.04);text-align:left;font-size:clamp(14.5px,3.9vw,16px);font-weight:700;line-height:1.45;transition:background .15s,border-color .15s,transform .1s}
.ch .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:900;background:rgba(80,227,194,.14);color:var(--aqua2)}
.ch:active,.ch.on{background:rgba(255,197,107,.18);border-color:var(--gold);transform:scale(.99)}
.ch.on .k{background:var(--gold);color:#2a1600}
#qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:28px}
#back{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 6px}
#back[disabled]{opacity:.3}
#skip{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.why{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,197,107,.08);border:1px solid rgba(255,197,107,.28)}
.wt{font-size:12px;color:var(--gold2);letter-spacing:.1em}
.wi{margin-top:7px;font-size:14px;line-height:1.6;color:#f6ecd8}
.wq{display:block;font-size:11px;color:var(--sub)}
.wr{display:block;font-size:13px;color:var(--aqua2)}
.slide{animation:slide .35s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 発表 */
#reveal{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18%);text-align:center;pointer-events:none}
#reveal .l1{font-size:18px;color:#cfe3df;letter-spacing:.12em;opacity:0;transition:opacity .8s}
#reveal .l2{margin-top:10px;font-size:clamp(28px,8vw,44px);font-weight:900;color:var(--gold2);opacity:0;transform:scale(.9);transition:opacity .8s,transform .8s;text-shadow:0 0 24px rgba(255,197,107,.5)}
#reveal .l2 small{display:block;font-size:.45em;color:var(--aqua2);letter-spacing:.1em;margin-bottom:4px}
#reveal.s1 .l1{opacity:1}
#reveal.s2 .l2{opacity:1;transform:none}

/* 結果 */
#result{position:absolute;left:0;right:0;bottom:0;top:46%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .6s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#result .card{padding:18px 16px 16px;margin-bottom:12px}
.type{font-size:12px;color:var(--aqua);letter-spacing:.14em}
.typename{margin:4px 0 6px;font-size:clamp(19px,5.2vw,23px);font-weight:900;line-height:1.4}
.typename small{font-size:.62em;color:var(--sub);margin-left:4px}
a.btn{text-decoration:none}
.typedesc{font-size:14px;line-height:1.75;color:#cfe3df;margin:0}
.rank{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);letter-spacing:.1em}
.rank .no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#2a1600;font-weight:900;font-size:14px;letter-spacing:0}
.town{margin:8px 0 2px;font-size:clamp(25px,7vw,32px);font-weight:900;line-height:1.25}
.town small{display:block;font-size:14px;color:var(--sub);font-weight:700;margin-bottom:2px}
.match{display:flex;align-items:baseline;gap:6px;color:var(--gold2);font-weight:900}
.match b{font-size:30px}
.lead{margin:12px 0 6px;font-size:16px;font-weight:900;line-height:1.6;color:#fff}
.body{margin:0;font-size:14.5px;line-height:1.85;color:#d7e7e3}
.you{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(80,227,194,.1);border:1px solid rgba(80,227,194,.25);font-size:14px;line-height:1.75;color:#dffcf5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cfe3df;white-space:nowrap}
.sub3{display:grid;gap:8px}
.mini{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px}
.mini .h{display:flex;align-items:center;gap:10px;width:100%;padding:0;border:0;background:none;text-align:left}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lk{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 8px;border-radius:12px;font-size:14px;font-weight:900;text-decoration:none;text-align:center;line-height:1.3}
.lk.site{background:var(--aqua);color:#05221b}
.lk.map{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink)}
.alt{display:block;margin-top:7px;text-align:right;font-size:11.5px;color:var(--sub)}
.alt a{color:var(--sub)}
.mini .no{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(80,227,194,.18);color:var(--aqua2);font-weight:900;font-size:13px}
.mini .nm{flex:1;font-size:17px;font-weight:900;line-height:1.3}
.mini .nm small{display:block;font-size:11.5px;color:var(--sub);font-weight:700}
.mini .pc{font-size:15px;font-weight:900;color:var(--gold2)}
.mini .more{margin-top:8px}
.mini.open{border-color:rgba(80,227,194,.5)}
.acts{display:grid;gap:10px;margin-top:4px}
.btn.x{background:#000;color:#fff;border:1px solid #333;width:100%}
.btn.again{background:rgba(255,255,255,.08);border:1px solid var(--line);width:100%}
.btn.top1{background:none;border:1px dashed var(--line);width:100%;font-size:14px;min-height:42px}
.follow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;background:rgba(255,255,255,.95);color:#13202a;border-radius:14px;padding:6px 8px 6px 14px;text-align:left;width:100%}
.follow>div{min-width:0}.follow p{margin:0}
.follow .fl{font-size:14px;font-weight:900;line-height:1.3;white-space:nowrap}
.follow .fs{font-size:10px;opacity:.7;line-height:1.3;white-space:nowrap}
.fbtn{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border-radius:999px;background:#000;color:#fff;font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
.tbtn{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border-radius:999px;background:var(--gold);color:#2a1600;font-size:13px;font-weight:900;text-decoration:none;white-space:nowrap}  /* 作者を応援する（.fbtnにするとフォローのリンクで上書きされるので別の名前） */
.credit{font-size:10.5px;line-height:1.7;color:var(--dim);margin:6px 4px 0}

/* 地図のラベル */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-130%);white-space:nowrap;font-size:13px;font-weight:900;padding:4px 9px;border-radius:999px;background:rgba(7,18,31,.82);border:1px solid rgba(255,197,107,.6);color:var(--gold2);transition:opacity .4s}
.lab.r1{font-size:15px;border-color:var(--aqua);color:#fff;box-shadow:0 0 18px rgba(80,227,194,.45)}
.lab i{font-style:normal;color:var(--aqua2);margin-right:4px}

/* 横長（PC・タブレット横） */
@media (min-width:820px) and (min-aspect-ratio:11/10){
  #quiz{left:auto;right:24px;bottom:24px;width:440px;padding:0}
  #result{left:auto;right:24px;top:66px;bottom:20px;width:440px;padding:0 0 10px}
  #title{align-items:flex-start;justify-content:center;padding-left:6vw;text-align:left;background:linear-gradient(90deg,rgba(7,18,31,.92),rgba(7,18,31,.5) 45%,rgba(7,18,31,0) 70%)}
  #hud{left:24px}
}

/* 広告の帯：高さは いつも同じ（広告が出ない時も）。ゲームの操作は この帯では反応しない */
#ad-zone{position:fixed;left:0;right:0;bottom:0;z-index:10;height:calc(var(--ad-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#050d17;touch-action:manipulation}
#ad-banner{width:100%;height:var(--ad-h);max-height:var(--ad-h);overflow:hidden;display:flex;align-items:center;justify-content:center;contain:layout paint}
#ad-banner ins{max-height:var(--ad-h)!important;overflow:hidden}
#ad-banner ins.adsbygoogle[data-ad-status="unfilled"]{display:none!important}
/* アプリの宣伝①：ページを開いた時に1回だけ。×ですぐ閉じられる。宣伝の画像そのものを押すと App Store へ */
#promo{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top, 0px)) 14px 14px;box-sizing:border-box;background:rgba(10,4,2,.6);animation:pmFade .2s ease-out}
#promo.on{display:flex}
#promo .pcard{position:relative;display:flex;flex-direction:column;align-items:center;max-height:100%;box-sizing:border-box;background:#fbf8f3;color:#2a2622;border-radius:20px;padding:8px 8px 10px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:pmPop .28s cubic-bezier(.2,1.3,.4,1)}
#promo p{margin:0}
#promo .pr{font-size:11px;font-weight:700;color:#7a7065;margin:2px 0 6px}
#promo .pr b,.resAd .ra1 b{margin-right:6px;padding:1px 6px;border:1px solid #b9ae9f;border-radius:4px;font-size:10px}
#promo .pshot{display:block;width:auto;height:auto;max-width:min(330px,calc(100vw - 44px));max-height:calc(100vh - 90px - env(safe-area-inset-top, 0px));max-height:calc(100dvh - 90px - env(safe-area-inset-top, 0px));border-radius:12px}
#promo a:active .pshot{transform:scale(.98)}
#promoX{position:absolute;z-index:1;right:-10px;top:-10px;width:38px;height:38px;padding:0;border:none;border-radius:50%;background:#fbf8f3;color:#4a443e;font:inherit;font-size:21px;line-height:38px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)} /* カードの角の外に出して、文字や画像にかぶらないように */
#promoX:active{background:#e8e1d6}
@keyframes pmFade{from{opacity:0}} @keyframes pmPop{from{transform:scale(.88);opacity:0}}
@media (max-height:560px){ #promo .pr span{display:none} } /* 横向きはカードが細いので「PR」だけ */
/* アプリの宣伝②：結果画面のいちばん下に小さく */
.resAd{display:none;align-items:center;gap:10px;width:100%;max-width:360px;box-sizing:border-box;margin-top:4px;padding:6px 8px 6px 8px;background:#fbf8f3;color:#2a2622;border-radius:12px;text-align:left;text-decoration:none;flex-shrink:0}
.resAd.on{display:flex}
.resAd img{width:34px;height:34px;border-radius:8px;flex-shrink:0}
.resAd>div{flex:1;min-width:0}
.resAd p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resAd .ra1{font-size:13px;font-weight:800;line-height:1.35}
.resAd .ra2{font-size:10px;color:#6b6258;line-height:1.3}
.resAd .raBtn{flex-shrink:0;padding:6px 10px;border-radius:999px;background:#111;color:#fff;font-size:11px;font-weight:800;white-space:nowrap}
#result .resAd{max-width:none;margin:2px 0 0}
#title .follow{margin-top:16px;max-width:360px}
#title .follow p{margin:0;color:inherit;line-height:1.3;max-width:none}#title .follow .fl{font-size:14px}#title .follow .fs{font-size:10px;opacity:.7}

/* 友だちの挑戦状・シェア・めずらしさ */
.fr{max-width:420px;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:rgba(80,227,194,.12);border:1px solid rgba(80,227,194,.4);font-size:14px;line-height:1.65;color:#dffcf5}
.fr b{display:block;color:var(--gold2);font-size:18px;font-weight:900}
.rare{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:14px;line-height:1.6;color:#e6f1ee}
.rare b{color:var(--gold2);font-size:20px;font-weight:900}
.rare small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.sharebox img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;border-radius:14px;border:1px solid var(--line);margin:10px 0 12px;background:#0b1d2e}
.sharebox .btn{width:100%;margin-top:8px}
.btn.img{background:linear-gradient(180deg,#ffd58c,#ffb347);color:#2a1600}
.btn.img[disabled]{opacity:.5}
.sharebox .note{font-size:11.5px;color:var(--sub);margin:8px 2px 0;line-height:1.6}
.cmp p{margin:6px 0 0;font-size:14.5px;line-height:1.7;color:#d7e7e3}
.cmp p b{color:#fff}
.cmp .big{margin-top:8px;font-size:clamp(24px,7vw,30px);font-weight:900;color:var(--gold2)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;font-size:15px;line-height:1.8;color:#cfe3df}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="ui">
    <div id="topbar"><button class="icb" id="mute" aria-label="音">🔊</button></div>

    <div id="title">
      <div class="fr hide" id="friend"></div>
      <div class="kicker">20の質問で見つける</div>
      <h1>運命の町、当てます</h1>
      <p>質問に答えると、あなたの性格や考え方、<br>生き方に合う市町村区が見つかります。</p>
      <div class="count">全国 <b id="tcount">0</b> か所の中から</div>
      <button class="btn main" id="start">はじめる</button>
      <div class="follow" id="tfollow"><div><p class="fl">作者をフォロー</p><p class="fs">新作のお知らせをしています</p></div><a class="fbtn" target="_blank" rel="noopener" data-google-vignette="false"></a></div>
    </div>

    <div id="hud" class="hide">
      <div class="qno" id="qno">Q1 / 20</div>
      <div class="left">のこり <b id="left">0</b> か所</div>
      <div id="bar"><i></i></div>
    </div>
    <div id="quiz" class="hide">
      <div class="card" id="qcard">
        <div id="qnote" class="hide">ここからは、あなたの答えに合わせた質問です</div>
        <div id="qtext"></div>
        <div id="choices"></div>
        <div id="qfoot"><button id="back">← ひとつ前へ</button><button id="skip">どれも当てはまらない</button></div>

  // 好み pr の人が、いちばん近い答えを選ぶ（noise：少しだけ迷う）
  nearOpt(pr, noise = 0, rnd = Math.random) { return q => { let best = 0, bd = 1e9; QUESTIONS[q].a.forEach((o, k) => { let d = 0, m = 0; for (const key in o[1]) { const v = o[1][key]; d += ((Array.isArray(v) ? v[0] : v) - pr[AXI[key]]) ** 2; m++; } d = d / m + (noise ? rnd() * noise : 0); if (d < bd) { bd = d; best = k; } }); return best; }; },
