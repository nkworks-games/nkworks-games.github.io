<style>
:root{--gold:#ffcf6b;--ink:#fff7e8;--panel:rgba(14,16,34,.62);--red:#ff7a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#07091a;color:var(--ink);font-family:"Zen Maru Gothic",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%)}
.hide{opacity:0!important;pointer-events:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 46px) 12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .3s}
#steps{display:flex;gap:5px;flex-wrap:nowrap}
.step{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:rgba(255,247,232,.5);border:1px solid rgba(255,255,255,.12);font-weight:700;white-space:nowrap;transition:all .3s}
.step.on{background:linear-gradient(180deg,#ffd987,#f0a347);color:#3a1d05;border-color:transparent;box-shadow:0 0 14px rgba(255,190,90,.45)}
.step.done{color:var(--gold);border-color:rgba(255,207,107,.35)}
#msg{font-size:clamp(14px,3.9vw,18px);font-weight:700;text-align:center;padding:8px 16px;border-radius:14px;background:var(--panel);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:min(92vw,560px);line-height:1.45;text-shadow:0 1px 2px rgba(0,0,0,.5);transition:color .2s}
#msg.hot{color:#ff9a7a}#msg.good{color:var(--gold)}
#topbar{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.ibtn{pointer-events:auto;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:rgba(14,16,34,.55);border:1px solid rgba(255,255,255,.15);transition:opacity .3s}
/* thermometer */
#thermo{position:fixed;right:calc(env(safe-area-inset-right) + 8px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .3s}
#tNum{font-size:20px;font-weight:900;min-width:58px;text-align:center;padding:3px 6px;border-radius:10px;background:var(--panel);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#tNum.good{color:var(--gold)}#tNum.hot{color:#ff7a5a}
#tTube{position:relative;width:16px;height:clamp(150px,36vh,300px);border-radius:9px;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.06) 60%,rgba(255,255,255,.14));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 0 6px rgba(0,0,0,.4)}
#tFill{position:absolute;left:3px;right:3px;bottom:2px;height:10%;border-radius:6px;background:linear-gradient(0deg,#d8261a,#ff5a3a);box-shadow:0 0 8px rgba(255,70,40,.6)}
#tBulb{width:26px;height:26px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a6a,#c81e12 60%);box-shadow:0 0 10px rgba(255,60,30,.5)}
.tick{position:absolute;right:20px;transform:translateY(50%);font-size:10px;color:rgba(255,247,232,.65);white-space:nowrap}
.tick::after{content:"";position:absolute;right:-20px;top:50%;width:14px;height:1px;background:rgba(255,255,255,.45)}
.tick.goal{color:var(--gold);font-weight:900;font-size:11px}.tick.goal::after{background:var(--gold);height:2px;width:22px;right:-24px}
/* controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transition:opacity .3s}
#sodaRow{width:min(560px,94vw);display:flex;justify-content:flex-end}
#sodaBtn{pointer-events:auto;display:flex;align-items:center;gap:9px;padding:10px 16px 10px 10px;border-radius:999px;background:linear-gradient(180deg,#fff3d6,#f3d79a);color:#4a2a08;font-weight:900;font-size:15px;line-height:1.15;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 3px rgba(255,220,140,.25);transition:transform .15s,opacity .3s,filter .3s}
#sodaBtn:active{transform:scale(.95)}
#sodaBtn.off{filter:grayscale(1) brightness(.6);opacity:.55}
#sodaBtn.ready{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 3px rgba(255,220,140,.25)}50%{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 9px rgba(255,220,140,.12)}}
.blob{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#ece6da 60%,#cfc6b6);box-shadow:inset -2px -3px 5px rgba(0,0,0,.15)}
#fireWrap{pointer-events:auto;width:min(560px,94vw);background:var(--panel);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:18px;padding:8px 14px 6px;border:1px solid rgba(255,255,255,.1);transition:opacity .3s}
.fireHead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;color:rgba(255,247,232,.85)}
#fireVal{color:#9cc6ff}
#fireTrack{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#3b3f50 0%,#3b3f50 6%,#22427f 14%,#2f6fe0 55%,#8cc8ff 100%);touch-action:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
#fireThumb{position:absolute;top:50%;left:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;color:#8a8f9e;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.45);transition:color .2s}
#fireThumb.on{color:#3d7cff}
#fireThumb svg{width:26px;height:26px}
.fireLabels{position:relative;height:16px;font-size:11px;color:rgba(255,247,232,.6);margin-top:4px}.fireLabels span{position:absolute;transform:translateX(-50%)}
/* stir hint */
#stirHint{position:fixed;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;transition:opacity .4s}
#stirHint svg{width:100%;height:100%;animation:spin 1.2s linear infinite;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
#pullHint{position:fixed;left:0;top:0;width:90px;height:150px;margin:-140px 0 0 -45px;pointer-events:none;transition:opacity .25s}
#pullHint svg{width:100%;height:100%;animation:rise 0.9s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,180,60,.9))}
@keyframes rise{0%{transform:translateY(25px);opacity:0}30%{opacity:1}100%{transform:translateY(-15px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* toast */
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,54px);font-weight:900;color:#fff;text-shadow:0 0 18px rgba(255,170,60,.9),0 3px 0 #b5520d,0 6px 14px rgba(0,0,0,.5);pointer-events:none;opacity:0;white-space:nowrap}
#toast.show{animation:toast 1.3s ease-out forwards}
#toast.sad{text-shadow:0 0 14px rgba(120,150,255,.7),0 3px 0 #2c3b7a,0 6px 14px rgba(0,0,0,.5)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
/* screens */
.screen{position:fixed;inset:0;display:flex;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);transition:opacity .45s}
.card{background:rgba(16,18,38,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,207,107,.25);border-radius:22px;padding:20px 20px 16px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.btn{display:block;width:100%;padding:14px 10px;border-radius:14px;font-size:18px;font-weight:900;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(180deg,#ffd987,#f09a3c);color:#3a1d05;box-shadow:0 6px 0 #a85a12,0 10px 20px rgba(0,0,0,.35)}
.btn.sub{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:16px}
#title{flex-direction:column;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(5,6,16,.55),rgba(5,6,16,0) 35%,rgba(5,6,16,0) 55%,rgba(5,6,16,.6))}
.tTop{text-align:center;margin-top:3vh}
.logoSub{font-size:clamp(14px,3.6vw,18px);font-weight:700;color:rgba(255,236,200,.85);letter-spacing:.2em}
.logo{margin:.1em 0 0;font-size:clamp(44px,13vw,86px);font-weight:900;line-height:1.05;background:linear-gradient(180deg,#fff2c8 10%,#ffc45c 55%,#e57f22);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a3a0a) drop-shadow(0 0 22px rgba(255,160,60,.45))}
.howto ol{margin:0 0 14px;padding-left:1.4em;font-size:14px;line-height:1.7}
.howto b{color:var(--gold)}
.bestLine{text-align:center;margin-top:12px;font-size:13px;color:rgba(255,247,232,.7)}
.credit{font-size:11px;letter-spacing:.2em;color:rgba(255,247,232,.4);margin-top:8px;text-align:center}
#result{align-items:flex-end;justify-content:center}
@media (orientation:landscape) and (min-width:700px){#result{align-items:center;justify-content:flex-end;padding-right:5vw}}
.rHead{text-align:center;font-size:14px;letter-spacing:.3em;color:rgba(255,236,200,.8)}
.rScore{text-align:center;font-size:64px;font-weight:900;line-height:1.05;color:#fff;text-shadow:0 0 20px rgba(255,180,80,.6)}
.rScore small{font-size:22px;margin-left:4px}
.rRank{text-align:center;font-size:20px;font-weight:900;color:var(--gold);margin:2px 0 10px}
.row{display:grid;grid-template-columns:8.8em 1fr 3.2em;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#f0a347,#ffd987);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row b{text-align:right}
.rTip{margin:10px 0 6px;padding:9px 12px;border-radius:12px;background:rgba(255,207,107,.1);border:1px solid rgba(255,207,107,.25);font-size:13px;line-height:1.55}
.rTip::before{content:"ワンポイント";display:block;font-size:11px;font-weight:900;color:var(--gold);margin-bottom:2px}
.rBest{text-align:center;font-size:13px;color:rgba(255,247,232,.75);margin:6px 0 10px}
.newb{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:#ff5a3a;color:#fff;font-weight:900;font-size:11px;animation:pulse2 .8s ease-in-out infinite alternate}
@keyframes pulse2{to{transform:scale(1.12)}}
.rBtns{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
/* 作者をフォロー（タイトルと結果画面だけ。サイトのほかのゲームと同じ形） */
.follow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;margin-top:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 8px 6px 14px;text-align:left}
.follow>div{min-width:0}.follow p{margin:0}
.follow .fl{font-size:14px;font-weight:800;line-height:1.3;white-space:nowrap}
.follow .fs{font-size:10px;color:rgba(255,255,255,.72);line-height:1.3;white-space:nowrap}
.fbtn{flex-shrink:0;display:inline-block;padding:8px 12px;border-radius:999px;background:#000;color:#fff;border:1px solid #4a4f66;font-size:13px;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #333;white-space:nowrap}
.fbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #333}
@media (max-width:420px){.follow{gap:8px;padding:6px 6px 6px 12px}.follow .fs{display:none}.follow .fl{font-size:13px}.fbtn{font-size:12px;padding:8px 10px}}
@media (max-height:620px){.follow{padding:4px 6px 4px 12px;margin-top:8px}.follow .fs{display:none}}
.tBtns{display:grid;gap:10px}.tNote{margin:-6px 0 12px;font-size:12px;color:rgba(255,236,200,.75);text-align:center}
.linkBtn{display:block;margin:10px auto 0;background:none;font-size:13px;color:rgba(255,247,232,.6);text-decoration:underline}
#dayBar{font-size:13px;font-weight:900;padding:4px 12px;border-radius:999px;background:rgba(255,207,107,.16);border:1px solid rgba(255,207,107,.35);color:var(--gold)}
#orderCard{font-size:13px;font-weight:900;padding:5px 12px;border-radius:10px;background:rgba(255,250,240,.93);color:#4a2a08;box-shadow:0 3px 10px rgba(0,0,0,.35);text-align:center;max-width:min(92vw,460px)}
#orderCard:empty{display:none}#orderCard small{display:block;font-size:11px;font-weight:700;color:#a0601e}
#bubble{position:fixed;left:0;top:0;max-width:min(78vw,320px);padding:9px 14px 10px;border-radius:16px;background:#fff;color:#3a1d05;font-weight:900;font-size:clamp(15px,4.2vw,19px);line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;transform:translate(-50%,-100%);transition:opacity .25s;white-space:nowrap}
#bubble b{display:block;font-size:11px;color:#a0601e;margin-bottom:1px}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#cookBtn{pointer-events:auto;width:min(320px,80vw);font-size:22px}
#sugarRow{pointer-events:auto;display:flex;gap:8px;justify-content:center;width:min(420px,94vw)}
.sbtn{flex:1;padding:8px 4px;border-radius:14px;background:rgba(14,16,34,.72);border:2px solid rgba(255,255,255,.15);font-weight:900;font-size:16px;line-height:1.2;transition:all .15s}
.sbtn small{display:block;font-size:10px;font-weight:700;color:rgba(255,247,232,.65)}
.sbtn.on{border-color:var(--gold);background:rgba(255,207,107,.22);box-shadow:0 0 12px rgba(255,190,90,.4)}
.sbtn i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.4)}
body:not([data-phase="order"]) #sugarRow{display:none}
body[data-phase="order"] #fireWrap,body[data-phase="order"] #sodaRow,body[data-phase="serve"] #fireWrap,body[data-phase="serve"] #sodaRow{display:none}
body:not([data-phase="order"]) #cookBtn{display:none}
body[data-phase="order"] #thermo,body[data-phase="serve"] #thermo,body[data-phase="order"] #steps,body[data-phase="serve"] #steps{opacity:0}
body[data-mode="practice"] #dayBar{display:none}
.srow{display:grid;grid-template-columns:1fr auto 4.2em;gap:10px;align-items:center;font-size:13px;margin:6px 0;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.srow small{display:block;font-size:11px;color:rgba(255,236,200,.65)}.srow b{text-align:right}.srow .y{color:var(--gold)}
@media (max-height:620px){.rScore{font-size:46px}.row{margin:3px 0}.rTip{margin:6px 0 4px}#hud{padding-top:calc(env(safe-area-inset-top) + 40px)}}
</style>

<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud" class="hide">
  <div id="dayBar"></div>
  <div id="steps"><span class="step">① 火加減</span><span class="step">② 重曹</span><span class="step">③ 混ぜる</span><span class="step">④ 抜く</span></div>
  <div id="msg"></div>
  <div id="orderCard"></div>
</div>
<div id="topbar"><button id="retryBtn" class="ibtn hide">↺ やり直す</button><button id="muteBtn" class="ibtn">♪ 音あり</button></div>
<div id="thermo" class="hide"><div id="tNum">22℃</div><div id="tTube"><div id="tFill"></div></div><div id="tBulb"></div></div>
<div id="ctrl" class="hide">
  <div id="sugarRow"></div>
  <button id="cookBtn" class="btn main">つくる！</button>
  <div id="sodaRow"><button id="sodaBtn" class="off"><span class="blob"></span><span>重曹を<br>入れる</span></button></div>
  <div id="fireWrap">
    <div class="fireHead"><span>火加減（左右にスライド）</span><span id="fireVal">消火</span></div>
    <div id="fireTrack"><div id="fireThumb"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.3 2c.8 3.4 4.9 5.4 4.9 10.3A5.2 5.2 0 0 1 6.8 12.6c0-2.3 1.2-3.9 2.4-5.1.3 1.7 1.2 2.7 2.3 3.1.1-3.3-.5-6 .8-8.6z"/></svg></div></div>
    <div class="fireLabels"><span style="left:calc(22px + 0%)">消</span><span style="left:calc(22px + 0.25 * (100% - 44px))">弱</span><span style="left:calc(22px + 0.62 * (100% - 44px))">中</span><span style="left:calc(22px + 0.9 * (100% - 44px))">強</span></div>
  </div>
</div>
<div id="stirHint" class="hide"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-dasharray="210 70" stroke-linecap="round"/><path d="M96 34 l10 -2 -4 12z" fill="rgba(255,255,255,.85)"/></svg></div>
<div id="pullHint" class="hide"><svg viewBox="0 0 90 150"><path d="M15 70 L45 40 L75 70" fill="none" stroke="#ffd36b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 110 L45 80 L75 110" fill="none" stroke="rgba(255,211,107,.6)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="bubble" class="hide"><b id="bName"></b><span id="bText"></span></div>
<div id="toast"></div>
<div id="title" class="screen">
  <div class="tTop"><div class="logoSub">縁日の味をつくろう</div><h1 class="logo">カルメ焼き名人</h1></div>
  <div>
    <div class="card howto">
      <ol>
        <li><b>火加減</b>を左右にスライド。<b>125℃</b>をめざす</li>
        <li>火を止めて泡がおさまったら<b>重曹</b>を入れる</li>
        <li>指で<b>ぐるぐる</b>手早く混ぜる</li>
        <li><b>「今だ！」</b>が出たら、真ん中から<b>上へスッ</b>と棒を抜く</li>
      </ol>

function makeFlames(n, ringR, tilt, scale, inner) {
  const geo = new THREE.ConeGeometry(0.42 * scale, 1, 10, 6, true); geo.translate(0, 0.5, 0);
  const seeds = new Float32Array(n); for (let i = 0; i < n; i++) seeds[i] = i * 1.618 % 1 * 10;
  geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));

    uniforms: flameUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `attribute float aSeed; uniform float uTime, uLevel; varying float vH; varying float vEdge;
      void main(){ vec3 p = position; float h = p.y; vH = h;
        float fl = 1.0 + 0.16*sin(uTime*23.0 + aSeed*13.0) + 0.1*sin(uTime*37.0 + aSeed*7.0);
        p.y *= uLevel * ${scale.toFixed(2)} * fl; p.xz *= mix(1.0, 0.3, h);
        p.x += sin(uTime*11.0 + aSeed*5.0 + h*3.0) * 0.07 * h;
        vec4 mv = modelViewMatrix * instanceMatrix * vec4(p, 1.0);
        vec3 n = normalize(normalMatrix * mat3(instanceMatrix) * normal);

    fragmentShader: `varying float vH; varying float vEdge;
      void main(){ vec3 base = ${inner ? 'vec3(0.45,0.95,3.0)' : 'vec3(0.22,0.45,2.8)'}; vec3 tip = vec3(0.7,0.35,1.4);
        vec3 c = mix(base, tip, smoothstep(0.2, 1.0, vH));
        float a = pow(clamp(1.0 - vH, 0.0, 1.0), 1.3) * smoothstep(0.0, 0.5, clamp(vEdge, 0.0, 1.0)) * ${inner ? '0.6' : '0.5'};
        gl_FragColor = vec4(c * a, a); }`,
  });
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;

  T: CONFIG.ROOM_T, H: 0, flameSet: 0, flame: 0, Tmax: CONFIG.ROOM_T, scorch: 0, boil: 0, evap: 0,
  baseLevel: L.fill0, level: L.fill0, soda: null,
  M: 0, bins: [0, 0, 0], overStir: 0, tReady: -1, stirSpeed: 0, swirlRot: 0,

const TI = { stir: null };   // テスト用の入力（指の代わり）
function startGame(seed, mode = G.mode) {

}

    phase: 'heat', pt: 0, T: CONFIG.ROOM_T, H: 0, flameSet: 0, flame: 0, Tmax: CONFIG.ROOM_T, scorch: 0, boil: 0, evap: 0,
    baseLevel: L.fill0, level: L.fill0, soda: null, M: 0, bins: [0, 0, 0], overStir: 0, tReady: -1, stirSpeed: 0, swirlRot: 0,
    lift: 0, pullPrev: false, pull: null, res: null, failKind: null, reheat: 0, serve: null, sugar: 'zarame',

}
function setFlame(v) {

}
function addSoda() {

  G.soda = { T: G.T, boil: G.boil, flame: G.flameSet };

}
function startStir() {

}
function fail(kind) {

}
function finishOne() {   // 1個できた（または失敗した）あと

}
function toResult() {
  G.state = 'result';

  showResult(); SND.result(G.res.total);

function puffReset() { if (puffGroup.parent !== scene) scene.attach(puffGroup); puffGroup.scale.set(1, 1, 1); puffGroup.visible = true; P.active = false; P.lifted = 0; P.rot = 0; P.collapse = 0; puffMesh.visible = false; puffGroup.position.set(0, PIVOT_Y, 0); puffGroup.rotation.set(0, 0, 0); }

// ===== [SEC:SIM] =====
function flameVis() { return G.state === 'title' ? 0.3 : Math.max(G.flame, G.reheat); }
function thermoTick(dt) {
  const T = G.T;
  const mul = T < CONFIG.PLATEAU_LO ? 1 : T < CONFIG.PLATEAU_HI ? CONFIG.PLATEAU_MUL : CONFIG.ABOVE_MUL;
  G.H += (G.flame * CONFIG.HEAT_POWER * mul - G.H) * (1 - Math.exp(-dt / CONFIG.HEAT_LAG));
  const cool = CONFIG.COOL_K * (T - CONFIG.ROOM_T) * (G.phase === 'stir' ? CONFIG.STIR_COOL_MUL : 1);
  G.T = Math.max(CONFIG.ROOM_T, T + (G.H - cool) * dt);
  G.Tmax = Math.max(G.Tmax, G.T);
  if (G.flame > CONFIG.SCORCH_FLAME && G.T > 110) G.scorch += (G.flame - CONFIG.SCORCH_FLAME) / (1 - CONFIG.SCORCH_FLAME) * CONFIG.SCORCH_RATE * dt;
  if (G.T > SUGARS[G.sugar].scorchT) G.scorch += (G.T - SUGARS[G.sugar].scorchT) / 40 * dt;   // 黒砂糖は低い温度から焦げはじめる
  G.scorch = Math.min(G.scorch, 2);
  G.evap = Math.max(G.evap, clamp((G.T - 100) / 25));
  let bt = G.T > 70 ? clamp(G.H / CONFIG.BOIL_REF, 0, 1.2) * smooth(70, 102, G.T) : 0;
  if (G.phase === 'stir') bt *= 0.3;
  G.boil += (bt - G.boil) * (1 - Math.exp(-dt / (bt > G.boil ? CONFIG.BOIL_UP : CONFIG.BOIL_CALM)));
}
function stirTick(dt) {
  const d = Math.hypot(G.tip.x - G.prevTip.x, G.tip.z - G.prevTip.z);
  const a0 = Math.atan2(G.prevTip.z, G.prevTip.x), a1 = Math.atan2(G.tip.z, G.tip.x);
  let da = a1 - a0; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
  if (Math.hypot(G.tip.x, G.tip.z) > 0.3) G.swirlRot += da;
  G.prevTip.copy(G.tip);
  const speed = d / dt;
  G.stirSpeed += (speed - G.stirSpeed) * (1 - Math.exp(-dt / 0.15));
  if (d > 0 && !G.pullPrev) {
    const eff = clamp(speed / (2 * Math.PI * CONFIG.STIR_R * CONFIG.MIX_SPEED_GOOD), 0.5, 1);
    if (G.M < 1) {
      G.M = Math.min(1, G.M + d * eff / (2 * Math.PI * CONFIG.STIR_R * CONFIG.MIX_REVS));
      const rr = Math.hypot(G.tip.x, G.tip.z) / rMax(G.baseLevel);
      G.bins[rr < 0.4 ? 0 : rr < 0.75 ? 1 : 2] += d * eff;
      if (G.M >= 1) { G.tReady = G.pt; SND.ready(); toast('今だ！'); }
    } else G.overStir += d / (2 * Math.PI * CONFIG.STIR_R);
  }
  const since = G.tReady >= 0 ? G.pt - G.tReady : -1;
  G.level = G.baseLevel + 0.45 * G.M + (since >= 0 ? 0.45 * smooth(0, CONFIG.PULL_LATE, since) : 0);
  if (G.T < CONFIG.HARDEN_T || since > CONFIG.PULL_LATE + 2.5) fail('harden');
}
function simTick(dt) {
  const prev = G.flame;
  G.flame += (G.flameSet - G.flame) * (1 - Math.exp(-dt / 0.12));
  if (G.flameSet === 0 && G.flame < 0.01) G.flame = 0;
  if (prev === 0 && G.flame > 0) SND.ignite();
  const ph = G.phase;
  if (ph === 'heat' || ph === 'dip' || ph === 'stir') thermoTick(dt);
  if (ph === 'heat') { G.baseLevel = L.fill0 - 0.25 * G.evap; G.level = G.baseLevel; }
  else if (ph === 'dip') { G.level = G.baseLevel; if (G.pt >= CONFIG.DIP_TIME) startStir(); }
  else if (ph === 'stir') stirTick(dt);
  else if (ph === 'puff') puffTick();
  else if (ph === 'show') showTick();
  else if (ph === 'fail') { G.T = Math.max(CONFIG.ROOM_T, G.T - 4 * dt); if (G.pt >= 1.6) finishOne(); }
  else if (ph === 'serve') serveTick(dt);
  if (G.state === 'play' && (G.phase === 'heat' || G.phase === 'dip' || G.phase === 'stir') && G.T >= CONFIG.BURN_FAIL + SUGARS[G.sugar].burn) fail('burn');
}
function puffTick() {
  const r = G.res, u = clamp(G.pt / CONFIG.PUFF_TIME);
  const g = clamp(easeOut3(u) + Math.sin(u * Math.PI * 2.5) * 0.035 * (1 - u), 0, 1.03);
  P.top = r.ySurf + (r.peakTop - r.ySurf) * g;
  P.bake = lerp(clamp(0.3 + SUGARS[G.sugar].off, 0, 2), r.bake, smooth(0.1, 1, u)); P.dirty = true;
  if (G.pt >= CONFIG.PUFF_TIME) { G.phase = 'show'; G.pt = 0; if (r.S > 0.15) SND.sigh(); }
}
function showTick() {
  const r = G.res, t = G.pt, S1 = CONFIG.SETTLE_TIME, S2 = S1 + CONFIG.COOL_TIME, S3 = S2 + CONFIG.LIFT_TIME;
  const e = ease(clamp(t / S1));

  if (t >= S2) { const u = clamp((t - S2) / CONFIG.LIFT_TIME); G.reheat = u < 0.35 ? 0.5 : 0; P.lifted = ease(clamp((u - 0.3) / 0.7)); }

}
function stickTick(dt) {

      const u = clamp(SK.t / CONFIG.DIP_TIME), above = V3(0, L.rim + 3.5, 0), start = V3(0, tipYAt(0), 0);

        const v = ease(u / 0.62); SK.tip.lerpVectors(REST_TIP, above, v); SK.tip.y += Math.sin(v * Math.PI) * 8;
        SK.dir.copy(REST_DIR).lerp(stirDir(above), v).normalize();
      } else { const v = ease((u - 0.62) / 0.38); SK.tip.lerpVectors(above, start, v); stirDir(SK.tip, SK.dir); }

      else if (t < 1.1) {
        const v = ease((t - 0.35) / 0.75), from = SK.outFrom.clone(); from.y += 13;
        SK.tip.lerpVectors(from, REST_TIP, v); SK.tip.y += Math.sin(v * Math.PI) * 6; SK.dir.copy(SK.outDir).lerp(REST_DIR, v).normalize();
      } else { SK.mode = 'rest'; SK.tip.copy(REST_TIP); SK.dir.copy(REST_DIR); }
      SK.blob = 0;

    }
  }
}

// ===== [SEC:SCORE] =====
function bakeParam(t, sc) {
  let c;
  if (t <= 110) c = 0.15; else if (t <= 124) c = lerp(0.15, 0.85, (t - 110) / 14); else if (t <= 131) c = lerp(0.85, 1.1, (t - 124) / 7);
  else if (t <= 145) c = lerp(1.1, 1.5, (t - 131) / 14); else if (t <= 160) c = lerp(1.5, 1.9, (t - 145) / 15); else c = 2;
  return Math.min(2.2, c + sc * 0.4);
}
function colorScore(c) { return 25 * clamp(c < 0.85 ? 1 - (0.85 - c) : c <= 1.12 ? 1 : 1 - (c - 1.12) * 1.15); }
function curOrder() { return G.mode === 'stall' && DAY.list[DAY.idx] ? ORDERS[DAY.list[DAY.idx].order] : ORDERS.normal; }
const RANKS = [[98, '伝説のカルメ焼き名人'], [90, '縁日の名人'], [80, '屋台の看板職人'], [65, 'カルメ焼き師'], [50, '理科室の優等生'], [35, '縁日のお手伝い'], [0, '見習いの見習い']];
function computeResult() {
  const p = G.pull, s = G.soda, Tmax = G.Tmax, Ts = s.T, ord = curOrder();
  const fConc = smooth(110, 121, Tmax);
  const fSoda = Ts < 104 ? 0.08 : Math.exp(-Math.pow((Ts - CONFIG.SODA_BEST) / CONFIG.SODA_SIGMA, 2));
  const early = p.M < 1 ? 1 - p.M : 0;
  const fMix = p.M >= 1 ? 1 : Math.pow(smooth(0.3, 1, p.M), 1.2);
  const lateN = p.M < 1 ? 0 : clamp((p.late - CONFIG.PULL_GOOD) / (CONFIG.PULL_LATE - CONFIG.PULL_GOOD));
  const fLate = p.M < 1 ? 1 : (p.late > CONFIG.PULL_LATE ? 0.5 : 1 - 0.45 * lateN);
  const bubN = clamp((s.boil - CONFIG.BOIL_OK) / 0.6);
  const slow = p.dur > CONFIG.PULL_SLOW ? 1 : 0;
  const overN = clamp(p.overStir / 6);
  const hotN = Ts > 134 ? 1 - Math.exp(-(Ts - 134) / 12) : 0;
  const SG = SUGARS[G.sugar];
  const q = Math.min(1, fConc * fSoda * fMix * fLate * (1 - 0.12 * bubN) * (1 - 0.1 * slow) * (1 - 0.3 * overN) * (1 - hotN) * SG.puff);
  const ySurf = G.level;
  const peakTop = ySurf + (L.rim + CONFIG.PUFF_MAX - ySurf) * (0.04 + 0.96 * q);
  const S = clamp(0.5 * lateN + 0.35 * overN + Math.max(0, (Ts - 132) / 16) + 0.35 * early + 0.08 * slow, 0, 0.85);
  const finalTop = peakTop - S * (peakTop - ySurf) * 0.55;
  const ang = Math.abs(p.angle);
  const crack = clamp(clamp((lateN - 0.6) * 2.5) + clamp((Ts - 136) / 6) + clamp((ang - 28) / 15));
  const tot = G.bins[0] + G.bins[1] + G.bins[2] || 1, tgt = [0.25, 0.4, 0.35], sh = G.bins.map(b => b / tot);
  const cov = clamp(1 - sh.reduce((a, b, i) => a + Math.abs(b - tgt[i]), 0) / 1.4);
  const angN = clamp(ang / 40), posN = clamp((p.posR - 0.45) / 0.55);
  const hRatio = clamp((finalTop - (L.yb + 1.5)) / (L.rim + CONFIG.PUFF_IDEAL - (L.yb + 1.5)));
  const rose = clamp(hRatio * 1.6);
  const c0 = bakeParam(Tmax, G.scorch), c = clamp(c0 + SG.off, 0, 2.2);   // c0：温度で決まる焼け具合／c：砂糖の色を足した見た目
  const wrong = ord.sugar !== G.sugar;
  const shapeLoss = 0.35 * (1 - cov) + 0.5 * angN + 0.4 * posN + 0.6 * early + 0.2 * bubN;
  const items = [
    25 * Math.pow(hRatio, 1.1),
    25 * (1 - clamp(shapeLoss)) * (0.4 + 0.6 * rose),
    colorScore(c0) * (wrong ? 0.1 : 1),   // 注文とちがう砂糖だと焼き色はほぼ0点
    Math.max(0, 25 * (1 - S / 0.85) - 6 * crack) * rose,
  ].map(v => Math.round(clamp(v, 0, 25)));
  const total = items.reduce((a, b) => a + b, 0);
  const sat = Math.round(items.reduce((a, v, i) => a + v * ord.w[i], 0) / (25 * ord.w.reduce((a, b) => a + b, 0)) * 100 * (wrong ? 0.8 : 1));   // 注文に合わせた満足度（砂糖ちがいは2割引き）
  const burnt = Tmax >= 158 + SG.burn || c0 >= 1.85, flat = hRatio < 0.2;
  // ワンポイント：いちばん点を落とした原因
  const tips = [];
  const T0 = Math.round(Tmax), Ts0 = Math.round(Ts);
  if (wrong) tips.push([60, ord.sugar === 'zarame' ? `ふだんの注文はザラメで作ろう（${SG.label}を使った）` : `「${ord.label}」の注文には${SUGARS[ord.sugar].label}を選ぼう（${SG.label}を使った）`]);
  if (Tmax < 123) tips.push([(25 - colorScore(c0)) + 25 * (1 - fConc), `温度が足りなかった（最高${T0}℃）。泡が細かくなる125℃くらいまで上げよう`]);
  if (Tmax > 133) tips.push([25 - colorScore(bakeParam(Tmax, 0)), `温度が上がりすぎ（最高${T0}℃）。泡が細かくなったら早めに火を止めよう`]);
  if (G.scorch > 0.05) tips.push([G.scorch * 0.4 * 1.15 * 25, '強火すぎて、ふちが焦げた。中火くらいがちょうどいい']);
  if (Ts < CONFIG.SODA_BEST - 3) tips.push([25 * (1 - fSoda) * 1.2, `重曹を入れた時の温度が低め（${Ts0}℃）。冷めすぎる前に入れよう`]);
  if (Ts > CONFIG.SODA_BEST + 3) tips.push([25 * (1 - fSoda) * 1.2 + 25 * hotN, `重曹を入れた時がまだ熱すぎ（${Ts0}℃）。火を止めて少し待ってから`]);
  if (bubN > 0) tips.push([25 * 0.32 * bubN, '泡立ちがおさまる前に重曹を入れた。少し待つとムラが減る']);
  if (early > 0) tips.push([25 * (1 - fMix) + 25 * 0.6 * early, '棒を抜くのが早かった。「今だ！」が出るまで混ぜよう']);
  if (lateN > 0) tips.push([25 * 0.45 * lateN + 25 * 0.6 * lateN, `棒を抜くのが遅かった（「今だ！」から${p.late.toFixed(1)}秒）。出たらすぐ抜こう`]);
  if (overN > 0.05) tips.push([25 * 0.3 * overN + 25 * 0.4 * overN, '「今だ！」のあとも混ぜすぎて泡がつぶれた。すぐ手を止めて抜こう']);
  if (cov < 0.9) tips.push([25 * 0.35 * (1 - cov), sh[2] < 0.18 ? 'お玉のふちのほうまで、大きく混ぜよう' : sh[0] < 0.12 ? '真ん中もしっかり混ぜよう' : '円の大きさを変えながら、お玉の底全体を混ぜよう']);
  if (angN > 0.15) tips.push([25 * 0.5 * angN, '棒をななめに抜いた。まっすぐ上へスッと']);
  if (posN > 0.05) tips.push([25 * 0.4 * posN, '棒を端のほうで抜いた。真ん中から抜くと形がきれい']);
  if (slow) tips.push([25 * 0.17, '抜くのがゆっくりすぎた。スッと素早く']);
  tips.sort((a, b) => b[0] - a[0]);
  const tip = !tips.length || tips[0][0] < 1.5 ? 'ほぼ完ぺき！縁日の主役になれる出来です' : tips[0][1];
  const rank = burnt ? '焦がし屋' : flat ? 'せんべい屋' : RANKS.find(r => total >= r[0])[1];
  const tiltMag = angN * 1.1 + posN * 0.8, dl = Math.hypot(p.dirX, p.dirZ) || 1;
  const sgn = Math.sign(p.angle) || 0;
  const tilt = { x: sgn * angN * 1.1 + (p.dirX / dl) * posN * 0.8, z: (p.dirZ / dl) * posN * 0.8 };
  return { items, total, sat, burnt, wrong, rank, tip, ySurf, peakTop, finalTop, S, bake: c, crack: clamp(crack), big: crack > 0.5 ? clamp(crack) : 0, tilt, tiltMag, lump: 0.12 * (1 - cov) + 0.25 * early + 0.1 * bubN };
}
function computeFail(kind) {
  if (kind === 'burn') return { items: [0, 0, 0, 0], total: 0, sat: 0, burnt: true, rank: '焦がし屋', tip: `温度が上がりすぎて焦げた（${Math.round(G.T)}℃）。125℃くらいで火を止めよう` };
  const sC = Math.round(colorScore(bakeParam(G.Tmax, G.scorch)) * 0.5 * (curOrder().sugar === G.sugar ? 1 : 0.4));
  const tip = G.M < 0.3 ? '混ぜる前に冷えて固まった。重曹を入れたらすぐ、ぐるぐる手早く混ぜよう'
    : G.tReady >= 0 ? '棒を抜くタイミングを逃して固まった。「今だ！」が出たら上へスッ！' : '混ぜ終わる前に冷えて固まった。もっと手早く混ぜよう';
  const items = [1, 2, sC, 0];
  return { items, total: items.reduce((a, b) => a + b, 0), sat: 0, burnt: false, rank: 'せんべい屋', tip };
}

// ===== [SEC:STALL] =====
// 屋台モード：お客さん（Quaternius のマネキン・CC0）・注文・お代
const STEP_H = 30, GROUND_Y = -90, CUST_Z = -78, CUST_IN_X = -150, CUST_X = 30, CUST_OUT_X = 170, CUST_H = 174; // cm（お客さんはコンロの右うしろに立つ）
const ORDERS = {
  normal: { label: 'ふつう', hint: '', w: [1, 1, 1, 1], sugar: 'zarame' },

  } else if (G.phase === 'puff' || G.phase === 'show') { c = V3(0, lerp(13.3, 16, smooth(0, 1, (P.top - L.rim) / 5)), 0); needW = portrait ? 19 : 26; needH = 24; elev = 0.6; }

function update(frameDt) {

function frame(now) {

  if (!paused && !manual) update((now - last) / 1000);

  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); if (AU.ctx) { if (paused) AU.ctx.suspend(); else AU.ctx.resume(); } });
addEventListener('resize', resize);
resize(); showTitle();
SK.tip.copy(REST_TIP); SK.dir.copy(REST_DIR);
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
// 自動チェック用（画面には何も出さない）
const BOT = {
  cutT: 125, calm: 0.4, pullAt: 6,
  init() { const r = G.rng; this.cutT = 100 + r() * 80; this.calm = 0.2 + r() * 0.8; this.pullAt = 2 + r() * 10; },
};
function stickViolations(v) {
  const C = V3(0, L.cy, 0), p = V3();
  for (let s = 0; s <= STICK_LEN; s += 0.25) {
    p.copy(SK.dir).multiplyScalar(s).add(SK.tip);
    if (p.y < -0.02) { v.push(`棒が机の下（y=${p.y.toFixed(2)}）`); return; }
    if (Math.abs(p.x) < STOVE.hx && Math.abs(p.z) < STOVE.hz && p.y < STOVE.top) { v.push('棒がコンロにめり込み'); return; }
    const dc = p.distanceTo(C);
    if (p.y < L.rim + STICK_R && dc < L.Ro + STICK_R && p.y > L.yb - L.wall - STICK_R) {
      if (L.Rs - dc < STICK_R - 0.03) { v.push(`棒がお玉にめり込み（s=${s.toFixed(2)} すき間=${(L.Rs - dc).toFixed(3)}）`); return; }
    }
  }
}
window.__TEST__ = {
  keys: [],
  randomInput(r) {
    if (G.state === 'title') { startGame(G.seed + 1); return; }
    if (G.state === 'result') { if (r < 0.3) startGame(G.seed + 1); return; }
    if (G.phase === 'order') { if (r < 0.6) { setSugar(Object.keys(SUGARS)[Math.floor(r / 0.6 * 3)]); startCooking(); } return; }
    if (G.phase === 'heat') {
      if (G.T < BOT.cutT) setFlame(0.25 + 0.75 * r);
      else { setFlame(0); if (G.boil < BOT.calm || r < 0.08) addSoda(); }
    } else if (G.phase === 'stir') {
      if (r < 0.8) TI.stir = { rate: 0.6 + 3.2 * r, rad: (r * 7) % 1, ang: TI.stir ? TI.stir.ang : 0, spiral: r < 0.3 };
      else if (r > 0.9 || G.pt > BOT.pullAt) { TI.stir = null; doPull({ dur: 0.1 + r * 0.9, angle: (r - 0.95) * 400 }); }
      else TI.stir = null;
    }
  },
  act(name, a) {
    if (name === 'flame') setFlame(a);
    else if (name === 'soda') return addSoda();
    else if (name === 'stir') TI.stir = a ? { rate: a.rate, rad: a.rad ?? 0.5, ang: TI.stir ? TI.stir.ang : 0, spiral: !!a.spiral } : null;
    else if (name === 'pull') { TI.stir = null; return doPull(a); }
    else if (name === 'title') { showTitle(); }
    else if (name === 'cook') return startCooking();
    else if (name === 'sugar') setSugar(a);
    return true;
  },
  reset(seed, mode = 'stall') { manual = true; acc = 0; startGame(seed, mode); },
  screenOf(x, y, z) { camApply(); camera.updateMatrixWorld(); const v = V3(x, y, z).project(camera); return { x: (v.x * 0.5 + 0.5) * VIEW.w, y: (-v.y * 0.5 + 0.5) * VIEW.h }; },
  level() { return G.level; },
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); render(frameDt); },
  run(sec, frameDt = 1 / 60) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); },  // 描かずに進める（採点の調整用）
  state() {
    return { state: G.state, phase: G.phase, T: +G.T.toFixed(1), Tmax: +G.Tmax.toFixed(1), flame: +G.flameSet.toFixed(2), boil: +G.boil.toFixed(2), M: +G.M.toFixed(2),
      ready: G.tReady >= 0 ? +(G.pt - G.tReady).toFixed(2) : -1, soda: G.soda && +G.soda.T.toFixed(1), res: G.res && { total: G.res.total, sat: G.res.sat, items: G.res.items, rank: G.res.rank, tip: G.res.tip },
      mode: G.mode, sugar: G.sugar, order: DAY.list[DAY.idx] && DAY.list[DAY.idx].order, day: DAY.idx, sales: DAY.sales, results: DAY.results.map(x => [x.name, x.label, x.sat, x.yen]), cust: CUST.mode, over: G.state === 'result' };
  },
  check() {
    const v = [];
    for (const [k, x] of Object.entries({ T: G.T, H: G.H, M: G.M, lvl: G.level, tipx: SK.tip.x, tipy: SK.tip.y, tipz: SK.tip.z, dir: SK.dir.length(), top: P.top, cam: CAM.pos.x + CAM.pos.y + CAM.pos.z + CAM.tgt.y + CAM.ox + CAM.oy, proj: camera.projectionMatrix.elements.reduce((a, b) => a + b, 0), target: G.target.x + G.target.z }))
      if (!Number.isFinite(x)) v.push(`${k} が数値でない`);
    if (G.T < CONFIG.ROOM_T - 0.01 || G.T > 260) v.push(`温度がおかしい ${G.T}`);
    if (G.M < 0 || G.M > 1) v.push('混ぜ具合が範囲外');
    if (G.level < L.yb || G.level > L.rim) v.push('砂糖水の高さがお玉の外');
    if (Math.abs(SK.dir.length() - 1) > 1e-3) v.push('棒の向きが壊れた');
    if (!SUGARS[G.sugar]) v.push('砂糖の種類がおかしい');
    if (G.mode === 'stall' && DAY.list.some(d => !ORDERS[d.order] || !d.type.orders[d.order])) v.push('注文がおかしい');
    if (SK.mode !== 'rest') stickViolations(v);
    if (G.phase === 'stir') { const r = Math.hypot(G.tip.x, G.tip.z); if (r > rMax(G.baseLevel) + 1e-3) v.push('混ぜる棒が範囲外'); }
    if (P.active && P.lifted < 1e-4) {
      if (P.dirty) updatePuffGeo(), P.dirty = false;
      const a = puffGeo.attributes.position.array, Rg = L.Rs;
      for (let i = 0; i < a.length; i += 9) {
        const x = a[i], y = a[i + 1], z = a[i + 2];
        if (!Number.isFinite(x + y + z)) { v.push('カルメ焼きの形が数値でない'); break; }
        if (y <= L.rim && Math.hypot(x, y - L.cy, z) > Rg + 0.02) { v.push(`カルメ焼きがお玉にめり込み y=${y.toFixed(2)}`); break; }
        if (y < L.yb - 0.02) { v.push('カルメ焼きがお玉の底を抜けた'); break; }
      }
    }
    if (G.res) {
      if (G.res.items && G.res.items.some(x => !(x >= 0 && x <= 25 && Number.isInteger(x)))) v.push('項目の点数が範囲外');
      if (!(G.res.total >= 0 && G.res.total <= (G.phase === 'done' ? 1500 : 100))) v.push('合計点が範囲外');
    }
    if (PART.list.filter(p => p.life > 0).length > PART.list.length) v.push('湯気が多すぎ');
    if (CUST.loaded && CUST.root.visible) {   // お客さん
      const p = CUST.root.position;
      if (![p.x, p.y, p.z, CUST.mixer.time].every(Number.isFinite)) v.push('お客さんの位置か動きが数値でない');
      if (Math.abs(p.y - GROUND_Y - CUST.base - CUST.dy) > 1e-6 || Math.abs(p.z - CUST_Z - CUST.dz) > 1e-6 || CUST.dy < -1e-6 || CUST.dy > 5 || CUST.dz > 1e-6 || Math.abs(p.x) > CUST_OUT_X + 5) v.push('お客さんが立ち位置の外');
      CUST.root.updateMatrixWorld(true);
      const q = V3();
      CUST.root.traverse(o => { if (!o.isSkinnedMesh || v.length) return; const n = o.geometry.attributes.position.count;
        for (let i = 0; i < n; i += 17) { o.getVertexPosition(i, q); q.applyMatrix4(o.matrixWorld);
          if (!Number.isFinite(q.x + q.y + q.z)) { v.push('お客さんの形が数値でない'); return; }
          if (q.z > -42 && q.y < -0.5) { v.push(`お客さんがカウンターにめり込んだ（z=${q.z.toFixed(1)} y=${q.y.toFixed(1)} ${CUST.mode}）`); return; }
          if (q.z > -20) { v.push(`お客さんが身を乗り出しすぎ（z=${q.z.toFixed(1)} ${CUST.mode}）`); return; }
          if (q.y < GROUND_Y + CUST.base - 2) { v.push(`お客さんが地面（踏み台）にめり込んだ（y=${q.y.toFixed(1)}）`); return; } } });
    }
    if (G.serve && G.serve.attached && P.active && puffGroup.visible && CUST.loaded) {
      if (P.dirty) { updatePuffGeo(); P.dirty = false; }
      puffGroup.updateWorldMatrix(true, true); CUST.root.updateWorldMatrix(true, true);
      const inv = puffMesh.matrixWorld.clone().invert(), q = V3();
      for (const [k, b] of Object.entries(HB)) {
        b.getWorldPosition(q); q.applyMatrix4(inv);
        const rr = Math.hypot(q.x, q.z), R = puffRadiusAt(q.y);
        if (R > 0 && rr < R - 0.15) { v.push(`カルメ焼きが手にめり込んでいる（${k} 内側へ${(R - rr).toFixed(2)}cm）`); break; }
      }
    }
    if (G.serve && P.active) { const q = V3(); puffGroup.getWorldPosition(q); if (!Number.isFinite(q.x + q.y + q.z)) v.push('渡したカルメ焼きの位置が数値でない'); }
    if (G.mode === 'stall') {
      if (DAY.sales < 0 || DAY.sales > 1500) v.push('売上が範囲外');
      if (DAY.results.some(x => !(x.sat >= 0 && x.sat <= 100) || x.yen < 0 || x.yen > 500)) v.push('お代が範囲外');
      if (DAY.idx > DAY.list.length || DAY.results.length > DAY.list.length) v.push('お客さんの番号がおかしい');
    }
    return v;
  },
  get ready() { return CUST.loaded || CUST.failed; },   // マネキンを読み終わったら
};
