const ROOM = CONFIG.ROOM;

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, cast = true) {

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);

}

function setCyl(m, a, b, r) {
  const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, len = Math.max(1e-4, Math.hypot(dx, dy, dz));
  m.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  m.scale.set(r, len, r);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx / len, dy / len, dz / len));
}

function makeClock() {
  const g = new THREE.Group(); scene.add(g);
  const wob = new THREE.Group(); g.add(wob);
  const R = 0.17, T = 0.13, LEG = 0.05;
  const red = M(0xe84a3c, { roughness: 0.35, metalness: 0.25 });
  const gold = M(0xf2c14e, { roughness: 0.3, metalness: 0.6, side: THREE.DoubleSide });
  const faceM = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: 0.6, emissive: 0xfff3c4, emissiveIntensity: 0.25 });
  const ink = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const body = mesh(new THREE.CylinderGeometry(R, R, T, 32), red, 0, LEG + R, 0, wob); body.rotation.x = Math.PI / 2;
  const fz = T / 2 + 0.002, cy = LEG + R;
  mesh(new THREE.CircleGeometry(R * 0.84, 32), faceM, 0, cy, fz, wob, false);
  mesh(new THREE.TorusGeometry(R * 0.88, 0.018, 8, 32), gold, 0, cy, fz, wob, false);
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; mesh(new THREE.BoxGeometry(0.008, i % 3 ? 0.012 : 0.022, 0.002), ink, Math.sin(a) * R * 0.72, cy + Math.cos(a) * R * 0.72, fz + 0.002, wob, false).rotation.z = -a; }
  const mkHandPiv = (len, w) => { const p = new THREE.Group(); p.position.set(0, cy, fz + 0.004); wob.add(p); mesh(new THREE.BoxGeometry(w, len, 0.003), ink, 0, len / 2, 0, p, false); return p; };
  const hourH = mkHandPiv(0.06, 0.013), minH = mkHandPiv(0.09, 0.009);
  const eyes = new THREE.Group(); wob.add(eyes);
  for (const s of [-1, 1]) {
    const e = mesh(new THREE.CircleGeometry(0.02, 16), ink, s * 0.05, cy + 0.035, fz + 0.006, eyes, false); e.scale.y = 1.4;
    mesh(new THREE.CircleGeometry(0.007, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }), s * 0.05 + 0.006, cy + 0.045, fz + 0.007, eyes, false);
  }
  const xEyes = new THREE.Group(); wob.add(xEyes); xEyes.visible = false;
  for (const s of [-1, 1]) for (const r of [0.8, -0.8]) mesh(new THREE.BoxGeometry(0.05, 0.01, 0.002), ink, s * 0.05, cy + 0.035, fz + 0.006, xEyes, false).rotation.z = r;
  const mouth = mesh(new THREE.CircleGeometry(0.03, 16, Math.PI, Math.PI), new THREE.MeshBasicMaterial({ color: 0x9b2a20 }), 0, cy - 0.045, fz + 0.006, wob, false);
  const bells = [];
  for (const s of [-1, 1]) {
    const b = mesh(new THREE.SphereGeometry(0.075, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), gold, s * 0.105, LEG + R + 0.115, 0, wob);
    b.rotation.z = -s * 0.5; bells.push(b);
  }
  const hammer = mesh(new THREE.SphereGeometry(0.026, 10, 8), gold, 0, LEG + 2 * R + 0.035, 0, wob);
  mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.05, 6), gold, 0, LEG + 2 * R + 0.005, 0, wob);
  const legs = [];
  for (const s of [-1, 1]) { const l = mesh(new THREE.CylinderGeometry(0.018, 0.026, LEG + 0.03, 8), M(0x333333), s * 0.085, (LEG + 0.03) / 2, 0, wob); legs.push(l); }
  const light = new THREE.PointLight(0xfff0b0, 0, 2.8, 1.4); light.position.set(0, 0.35, 0.15); g.add(light);
  const stars = new THREE.Group(); g.add(stars);
  for (let i = 0; i < 3; i++) mesh(new THREE.OctahedronGeometry(0.035), new THREE.MeshBasicMaterial({ color: 0xffe14d }), 0, 0, 0, stars, false);
  return { g, wob, body, hourH, minH, eyes, xEyes, mouth, bells, hammer, legs, light, stars };
}
function makeHuman() {

  const spriteTex = new THREE.CanvasTexture(spriteCanvas); spriteTex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: spriteTex, depthTest: false, transparent: true }));
  sprite.scale.set(0.9, 0.27, 1); sprite.renderOrder = 10; scene.add(sprite);

}

      const ex = clamp(clock.x + clock.vx * lead, ROOM.minX + 0.2, ROOM.maxX - 0.2), ez = clamp(clock.z + clock.vz * lead, ROOM.minZ + 0.2, ROOM.maxZ - 0.2);
      pillows.push({ sx: hu.x, sy: 1.55 + hu.y, sz: hu.z, ex, ez, ey: groundAt(ex, ez), t: 0, landed: false, life: 0, spin: rnd() * 6 });

    }
  }
  for (let i = pillows.length - 1; i >= 0; i--) {
    const p = pillows[i];
    if (!p.landed) {

        p.landed = true; p.life = 2.0; SFX.boff();

}

// ===== [SEC:CAT] =====
function separate() {
  const dx = cat.x - vac.x, dz = cat.z - vac.z, d = Math.hypot(dx, dz), m = cat.R + vac.R;
  if (d >= m) return;
  const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0, p = (m - d) / 2 + 1e-4;
  cat.x += nx * p; cat.z += nz * p; vac.x -= nx * p; vac.z -= nz * p;
  pushOut(cat, cat.R, FLOOR_BOXES); pushOut(vac, vac.R, FLOOR_BOXES);
}
function catStep(dt) {
  if (!has('cat')) return;
  cat.t += dt;
  let speed = 0;
  const onFloor = clock.y < 0.15 && targetable();
  const d = Math.hypot(clock.x - cat.x, clock.z - cat.z);
  if (cat.rest > 0) { cat.rest -= dt; cat.mode = 'rest'; }
  else if (onFloor && d < CONFIG.CAT_SIGHT && state === 'play') {
    if (cat.mode !== 'chase') SFX.meow();
    cat.mode = 'chase'; cat.tx = clock.x; cat.tz = clock.z; speed = CONFIG.CAT_SPEED * scale;
  } else {
    if (cat.mode !== 'wander' || cat.t > 3.5 || Math.hypot(cat.tx - cat.x, cat.tz - cat.z) < 0.15) { const p = randomFloorPoint(cat.R); cat.tx = p.x; cat.tz = p.z; cat.t = 0; }
    cat.mode = 'wander'; speed = CONFIG.CAT_WANDER;
  }
  const dx = cat.tx - cat.x, dz = cat.tz - cat.z, l = Math.hypot(dx, dz);
  const tvx = l > 0.05 ? dx / l * speed : 0, tvz = l > 0.05 ? dz / l * speed : 0;
  const k = Math.min(1, 8 * dt);
  cat.vx += (tvx - cat.vx) * k; cat.vz += (tvz - cat.vz) * k;
  cat.x += cat.vx * dt; cat.z += cat.vz * dt;
  pushOut(cat, cat.R, FLOOR_BOXES);
  if (Math.hypot(cat.vx, cat.vz) > 0.05) cat.face = angLerp(cat.face, Math.atan2(cat.vx, cat.vz), Math.min(1, 10 * dt));
  if (cat.mode === 'chase' && d < cat.R + clock.R && clock.y < 0.25 && state === 'play') {
    const nx = d > 1e-6 ? (clock.x - cat.x) / d : 1, nz = d > 1e-6 ? (clock.z - cat.z) / d : 0;
    clock.vx = nx * CONFIG.CAT_KNOCK; clock.vz = nz * CONFIG.CAT_KNOCK; clock.vy = 2.6; clock.grounded = false;
    clock.stun = Math.max(clock.stun, CONFIG.CAT_STUN); clock.stuck = 0;
    cat.rest = CONFIG.CAT_REST; cat.vx = cat.vz = 0; SFX.meow(); popup('ペシッ！', clock.x, clock.y + 0.5, clock.z, '#ffb36b');
  }
}

// ===== [SEC:VACUUM] =====
function vacStep(dt) {
  if (!has('vacuum')) return;
  vac.t += dt; vac.rest = Math.max(0, vac.rest - dt);
  if (vac.mode === 'carry') {
    const dx = vac.cx - vac.x, dz = vac.cz - vac.z, d = Math.hypot(dx, dz);
    if (d > 1e-6) { vac.hx = dx / d; vac.hz = dz / d; }
    const s = Math.min(d, CONFIG.VAC_CARRY_SPEED * dt);
    vac.x += vac.hx * s; vac.z += vac.hz * s;
    pushOut(vac, vac.R, FLOOR_BOXES);
    clock.x = vac.x; clock.z = vac.z; clock.y = 0.095; clock.vx = clock.vz = clock.vy = 0;
    if (d < 0.08 || vac.t > CONFIG.VAC_CARRY_MAX || state !== 'play') releaseFromVac();
    return;
  }
  vac.x += vac.hx * CONFIG.VAC_SPEED * scale * dt; vac.z += vac.hz * CONFIG.VAC_SPEED * scale * dt;
  const ox = vac.x, oz = vac.z;
  pushOut(vac, vac.R, FLOOR_BOXES);
  const wall = vac.x < ROOM.minX + vac.R + 1e-3 || vac.x > ROOM.maxX - vac.R - 1e-3 || vac.z < ROOM.minZ + vac.R + 1e-3 || vac.z > ROOM.maxZ - vac.R - 1e-3;
  if (Math.hypot(vac.x - ox, vac.z - oz) > 1e-5 || wall) {
    const a = Math.atan2(vac.hz, vac.hx) + Math.PI + (rnd() - 0.5) * 2.2;
    vac.hx = Math.cos(a); vac.hz = Math.sin(a);
    vac.x += vac.hx * 0.01; vac.z += vac.hz * 0.01; pushOut(vac, vac.R, FLOOR_BOXES);
  }
  if (state === 'play' && vac.rest <= 0 && targetable() && clock.y < 0.15 && Math.hypot(clock.x - vac.x, clock.z - vac.z) < vac.R + clock.R * 0.8) {
    vac.mode = 'carry'; vac.t = 0; clock.carried = true; clock.stuck = 0; clock.boxed = false;
    const hp = { x: hu.x, z: hu.z }, corners = [[ROOM.minX + 0.35, ROOM.maxZ - 0.35], [ROOM.maxX - 0.35, ROOM.maxZ - 0.35]];
    const c = corners.sort((a, b) => Math.hypot(b[0] - hp.x, b[1] - hp.z) - Math.hypot(a[0] - hp.x, a[1] - hp.z))[rnd() < 0.5 ? 0 : 1];
    vac.cx = c[0]; vac.cz = c[1]; SFX.vac(); popup('ウィーン…', clock.x, clock.y + 0.5, clock.z, '#9effc4');

}
function releaseFromVac() {
  vac.mode = 'roam'; vac.rest = CONFIG.VAC_REST; vac.t = 0;
  clock.carried = false;
  clock.x = vac.x + vac.hx * (vac.R + clock.R + 0.03); clock.z = vac.z + vac.hz * (vac.R + clock.R + 0.03); clock.y = 0;
  settleClock();
  const g = groundAt(clock.x, clock.z); if (clock.y < g) clock.y = g;
  if (Math.hypot(clock.x - vac.x, clock.z - vac.z) < vac.R + clock.R) { clock.x = vac.x; clock.z = vac.z; clock.y = 0; }
  vac.hx = -vac.hx; vac.hz = -vac.hz;
}

// ===== [SEC:BOX] =====
function boxStep(dt) {
  if (!has('box')) return;
  const hp = { x: hu.x, z: hu.z };
  switch (boxC.phase) {
    case 'none':
      if (state !== 'play') return;
      boxC.timer -= dt;
      if (boxC.timer <= 0 && targetable() && Math.hypot(clock.x - hp.x, clock.z - hp.z) < CONFIG.BOX_RANGE) { boxC.phase = 'track'; boxC.t = 0; boxC.x = clock.x; boxC.z = clock.z; }
      break;
    case 'track': {
      boxC.t += dt; const k = 1 - Math.exp(-6 * scale * dt);
      boxC.x = lerp(boxC.x, clock.x, k); boxC.z = lerp(boxC.z, clock.z, k);
      if (boxC.t >= CONFIG.BOX_TRACK) { boxC.phase = 'lock'; boxC.t = 0; }
      break;
    }
    case 'lock':
      boxC.t += dt; if (boxC.t >= CONFIG.BOX_LOCK / Math.sqrt(scale)) { boxC.phase = 'drop'; boxC.t = 0; boxC.ground = groundAt(boxC.x, boxC.z); SFX.whoosh(); }
      break;
    case 'drop':
      boxC.t += dt; boxC.y = lerp(2.4, boxC.ground, Math.min(1, (boxC.t / CONFIG.BOX_DROP) ** 2));
      if (boxC.t >= CONFIG.BOX_DROP) {
        SFX.boff();
        const inside = Math.abs(clock.x - boxC.x) < CONFIG.BOX_HALF && Math.abs(clock.z - boxC.z) < CONFIG.BOX_HALF;
        if (state === 'play' && inside && targetable() && Math.abs(clock.y - boxC.ground) < 0.3) {
          clock.boxed = true; clock.mash = 0; clock.stuck = 0; boxC.phase = 'on'; popup('かぶされた！', clock.x, clock.y + 0.7, clock.z);
        } else { boxC.phase = 'lying'; boxC.t = 0; }
      }
      break;
    case 'on':
      boxC.x = clock.x; boxC.z = clock.z; boxC.ground = clock.y;
      if (!clock.boxed) { boxC.phase = 'fly'; boxC.t = 0; }
      break;
    case 'fly':
      boxC.t += dt; if (boxC.t > 0.6) { boxC.phase = 'none'; boxC.timer = CONFIG.BOX_INTERVAL / scale * (0.8 + 0.4 * rnd()); }
      break;
    case 'lying':
      boxC.t += dt; if (boxC.t > 1.4) { boxC.phase = 'none'; boxC.timer = CONFIG.BOX_INTERVAL / scale * (0.8 + 0.4 * rnd()); }
      break;
  }
}

// ===== [SEC:GAUGE] =====
function gaugeStep(dt) {
  let mult = clock.bell ? CONFIG.BELL_MULT : 1;
  if (has('earplug')) mult *= clock.bell ? CONFIG.EARPLUG_BELL : CONFIG.EARPLUG_NORMAL;
  if (clock.boxed) mult = 0;
  gauge = clamp(gauge + CONFIG.GAUGE_RATE * mult * dt, 0, 100);
  if (gauge >= 100) clear();
}

// ===== [SEC:FLOW] =====

function clockStepIdle(dt) {

// ===== [SEC:POPUP] =====
const pops = [];
const _v = new THREE.Vector3();
