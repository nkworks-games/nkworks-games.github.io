<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>はみ出しタワー</title>
<meta name="description" content="手でつまんだ積み木を、前のブロックより少しでも外へ。出ていなかったら即終了。目と指の感覚だけで、何個積める？設計図のような3Dゲーム。">
<meta name="theme-color" content="#0b2f57">
<meta property="og:title" content="はみ出しタワー">
<meta property="og:description" content="前のブロックより、少しでも外へ。何個積める？">
<meta name="google-adsense-account" content="ca-pub-2073267239630350">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2073267239630350" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e3a68; --bg2:#0b2f57; --panel:rgba(8,34,66,.95); --line:#eaf6ff; --line2:rgba(214,236,255,.55); --dim:#9fc3e6;
  --cyan:#6fe3ff; --yellow:#ffd166; --red:#ff6b57; --green:#57f2b0;
  --ad-h:50px; --ad-gap:75px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --mono:'M PLUS 1 Code',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --math:'Cambria Math','STIX Two Math','Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--line);overflow:hidden;overscroll-behavior:none;font-family:var(--mono);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{position:fixed;left:0;right:0;top:0;bottom:calc(var(--ad-h) + var(--ad-gap) + var(--safe-b));overflow:hidden;touch-action:none;background:var(--bg)}
#app canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ad{position:fixed;left:0;right:0;bottom:var(--safe-b);height:var(--ad-h);display:flex;justify-content:center;align-items:center;overflow:hidden}
#ad ins{display:inline-block;width:320px;height:50px}
.bp{background:var(--panel);border:1px solid var(--line2);border-radius:5px;box-shadow:0 0 0 4px rgba(8,34,66,.25),0 8px 24px rgba(0,10,30,.35);position:relative}
.bp:before,.bp:after{content:"";position:absolute;width:8px;height:8px;border:1.5px solid var(--cyan);pointer-events:none}
.bp:before{left:-1px;top:-1px;border-right:none;border-bottom:none}
.bp:after{right:-1px;bottom:-1px;border-left:none;border-top:none}

/* ---- 3Dの位置に付く文字 ---- */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.wl.dim{font-size:12px;font-weight:700;color:var(--cyan);background:rgba(14,58,104,.85);padding:0 4px}
.wl.com{font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:2px 7px;border-radius:3px}
.wl.prev{font-size:10px;font-weight:700;color:var(--red);border:1px solid var(--red);background:rgba(14,58,104,.85);padding:0 5px;border-radius:2px}
.wl.best{font-size:11px;font-weight:700;color:var(--bg2);background:var(--yellow);padding:1px 7px;border-radius:2px}
.wl.you{font-size:13px;font-weight:700;color:var(--bg2);background:var(--line);padding:2px 8px;border-radius:3px;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.popt{position:absolute;left:0;top:0;pointer-events:none;font-weight:700;white-space:nowrap;animation:floatUp 1.25s ease-out forwards;text-shadow:0 0 6px rgba(8,34,66,.95),0 0 2px rgba(8,34,66,1)}
.popt.creak{font-size:14px;color:var(--yellow)}
.popt.no{font-size:24px;color:var(--red);animation-duration:1.6s}
.popt.plain{font-size:16px;color:var(--line)}
.popt.good{font-size:17px;color:var(--cyan)}
.popt.god{font-size:20px;color:var(--yellow)}
.popt.best{font-size:16px;color:var(--yellow)}
@keyframes floatUp{0%{opacity:0;transform:var(--p) translateY(6px) scale(.85)}15%{opacity:1;transform:var(--p) translateY(0) scale(1.06)}100%{opacity:0;transform:var(--p) translateY(-28px) scale(1)}}
@keyframes pop{0%{opacity:0;transform:var(--p,none) scale(.5)}100%{opacity:1}}

/* ---- 上 ---- */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 10px 0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:7px}
#hud .row{width:100%;max-width:560px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
#hud .grp{display:flex;gap:7px;justify-self:start}
#hud .grp.r{justify-self:end}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--line)}
.iconbtn svg{width:21px;height:21px}
.iconbtn:active{transform:translateY(2px)}
#bestPill{font-weight:700;font-size:13px;background:var(--panel);border:1px solid var(--line2);padding:8px 14px;border-radius:5px;letter-spacing:.06em;color:var(--dim)}
#bestPill b{color:var(--yellow);margin-left:6px}
#bestPill #toBest{margin-left:8px;font-size:11.5px;color:var(--dim)}
#bestPill #toBest:empty{display:none}
#bestPill.on{background:var(--yellow);border-color:var(--yellow);color:var(--bg2)}
#bestPill.on b,#bestPill.on #toBest{color:var(--bg2)}
#meter{width:100%;max-width:420px;padding:6px 14px 8px}
#meter .top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
#meter .cnt{display:flex;align-items:baseline;gap:6px}
#meter .cnt .lbl{font-size:12px;font-weight:700;color:var(--dim);margin-right:2px}
#cntNum{font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#cntUnit{font-size:13px;color:var(--dim)}
#ovTxt{font-size:12px;color:var(--dim);text-align:right;font-weight:700;padding-bottom:5px}
#ovTxt b{color:var(--cyan);font-size:15px}
#ruleTxt{margin-top:2px;font-size:11.5px;color:var(--dim);border-top:1px dashed rgba(214,236,255,.25);padding-top:4px}
#ruleTxt b{color:var(--cyan)}

/* ---- 下（落とすボタン） ---- */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px 10px;display:flex;justify-content:center;pointer-events:none}
.btn.drop{min-width:220px;font-size:20px;padding:14px 34px;letter-spacing:.12em;touch-action:manipulation}
.btn.drop svg{width:22px;height:22px}
.btn.drop:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 3px 0 #8fb6dc}
.btn{pointer-events:auto;border:none;cursor:pointer;font-weight:700;font-size:15px;color:var(--bg2);background:var(--line);padding:12px 18px;border-radius:5px;
  box-shadow:0 3px 0 #8fb6dc;transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;letter-spacing:.04em}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8fb6dc}
.btn.sub{background:transparent;color:var(--line);border:1.5px solid var(--line2);box-shadow:none}
.btn.big{font-size:21px;padding:15px 48px}
.btn svg{width:17px;height:17px}
#hint{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);color:var(--line);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:4px;pointer-events:none;white-space:nowrap;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---- 開始・バナー・終了理由 ---- */
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.intro .card{padding:16px 24px 14px;text-align:center;animation:cardIn .4s cubic-bezier(.2,1.4,.4,1) both;max-width:340px}
.intro .k1{font-size:12px;font-weight:700;color:var(--cyan);letter-spacing:.2em}
.intro .k2{font-size:24px;font-weight:700;line-height:1.4;margin-top:4px}
.intro .k2 em{font-style:normal;color:var(--cyan)}
.intro .k3{margin-top:8px;font-size:12.5px;color:var(--dim);line-height:1.7}
.intro .k3 .r{color:var(--red)}
.intro.quick .card{padding:10px 30px}
@keyframes cardIn{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}
#banner{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:center;pointer-events:none}
#banner .card{background:var(--yellow);color:var(--bg2);border-radius:4px;padding:10px 24px;text-align:center;box-shadow:0 0 0 4px rgba(255,209,102,.25);animation:bannerIn 2.2s ease both}
#banner b{display:block;font-size:24px}
#banner small{display:block;font-size:12px;font-weight:700;margin-top:2px}
@keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#failMsg{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;pointer-events:none}
#failMsg .card{width:min(92%,420px);padding:11px 15px;font-weight:700;font-size:14px;line-height:1.5;text-align:center;animation:cardIn .35s both}
#failMsg .r{color:var(--red)}#failMsg .g{color:var(--green)}
#failMsg small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
#howto{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);pointer-events:none;text-align:center;width:max-content;max-width:92%}
#howto .card{padding:12px 18px 14px;font-weight:700;font-size:13px;line-height:1.7;animation:fadeIn .4s}
#howto .y{color:var(--yellow)}
#howto .hand{width:120px;height:52px;margin:0 auto 2px;position:relative}
#howto .hand svg{position:absolute;left:40px;top:2px;width:38px;height:46px;animation:swipe 2.4s ease-in-out infinite}
#howto .hand:before{content:"";position:absolute;left:8px;right:8px;top:26px;border-top:1.5px dashed var(--line2)}
@keyframes swipe{0%,100%{transform:translateX(-34px)}40%{transform:translateX(34px)}60%{transform:translateX(30px)}80%{transform:translateX(33px)}}
#idealTag{position:absolute;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);color:var(--cyan);font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:3px;pointer-events:none;white-space:nowrap;animation:cardIn .4s both}

/* ---- 結果 ---- */
#result{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
#result .sheet{pointer-events:auto;width:100%;max-width:560px;padding:12px 15px 13px;border-radius:6px 6px 0 0;border-bottom:none;animation:sheetIn .45s cubic-bezier(.2,1.1,.4,1) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.rsHead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:12px;color:var(--dim)}
.badge{background:var(--yellow);color:var(--bg2);border-radius:3px;padding:2px 9px;font-size:12px;white-space:nowrap;animation:pop .4s .6s both}
.rsMain{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.rsCnt{line-height:1;display:flex;align-items:baseline;gap:6px}
.rsCnt b{font-size:52px;font-variant-numeric:tabular-nums}
.rsCnt span{font-size:15px;font-weight:700}
.rsSub{font-size:12px;font-weight:700;color:var(--dim);margin-top:6px;line-height:1.55}
.rsSub b{color:var(--cyan)}
.rsMax{font-weight:700;font-size:12px;padding:8px 12px;border:1px solid var(--cyan);border-radius:4px;color:var(--cyan);text-align:center;line-height:1.3;white-space:nowrap}
.rsMax b{display:block;font-size:24px}
.rsTip{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--dim);border:1px dashed rgba(111,227,255,.4);border-radius:4px;padding:7px 11px}
.rsTip b{color:var(--cyan)}
.rsBtns{display:flex;gap:8px;margin-top:11px}
.rsBtns .btn{flex:1;padding:11px 6px;font-size:14px}

/* ---- タイトル ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
#scrTitle{justify-content:space-between;padding:calc(var(--safe-t) + 6vh) 16px 3vh}
.logo{position:relative;width:300px;height:196px;margin:0 auto;animation:cardIn .6s both}
.logo .tbl{position:absolute;left:-20px;top:136px;width:170px;height:20px;border:2px solid var(--line);border-left:none;
  background:repeating-linear-gradient(135deg,rgba(234,246,255,.55) 0 1.5px,transparent 1.5px 7px)}
.logo .edge{position:absolute;left:149px;top:6px;height:186px;border-left:1.5px dashed var(--line2)}
.logo .lb{position:absolute;height:58px;width:176px;border:2px solid var(--line);border-radius:2px;display:grid;place-items:center;color:var(--line);font-weight:700;font-size:28px;letter-spacing:.08em;background:rgba(36,104,173,.55)}
.logo .b2{left:17px;top:78px}
.logo .b1{left:105px;top:20px;transform-origin:88px 100%;animation:rock 3.2s ease-in-out infinite}
.logo .dim{position:absolute;height:0;border-top:1.5px solid var(--cyan)}
.logo .dim:before,.logo .dim:after{content:"";position:absolute;top:-5px;border:4px solid transparent}
.logo .dim:before{left:-1px;border-right:7px solid var(--cyan);border-left:none}
.logo .dim:after{right:-1px;border-left:7px solid var(--cyan);border-right:none}
.logo .dim span{position:absolute;left:50%;transform:translateX(-50%);color:var(--cyan);font-size:14px;font-weight:700;white-space:nowrap}
.logo .d1{left:193px;width:88px;top:8px}.logo .d1 span{top:-22px}
.logo .d2{left:150px;width:43px;top:172px}.logo .d2 span{top:2px}
@keyframes rock{0%,70%,100%{transform:none}76%{transform:rotate(3deg)}82%{transform:none}86%{transform:rotate(1.2deg)}90%{transform:none}}
.tagline{margin:14px 0 0;text-align:center;font-weight:700;font-size:15px;line-height:1.7;color:var(--line)}
.tagline .r{color:var(--red)}
#titleBest{margin-top:8px;text-align:center;font-weight:700;font-size:13px}
#titleBest span{display:inline-block;background:var(--yellow);color:var(--bg2);border-radius:3px;padding:3px 12px}
.titleBottom{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.titleblock{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;width:min(100%,360px);border:1px solid var(--line2);font-size:11px;color:var(--line)}
.titleblock div{padding:4px 7px;border-right:1px solid var(--line2)}
.titleblock div:last-child{border-right:none}
.titleblock i{display:block;font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.12em}

/* ---- シェア ---- */
.modal{position:absolute;inset:0;background:rgba(4,20,40,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mcard{width:100%;max-width:460px;padding:13px;text-align:center;animation:cardIn .3s both}
.mcard img{width:100%;border-radius:3px;display:block;border:1px solid var(--line2);-webkit-touch-callout:default}
.note{font-size:11.5px;color:var(--dim);margin:10px 4px 0;line-height:1.5}
.linkbtn{border:none;background:none;margin-top:8px;font-weight:700;color:var(--dim);font-size:13px;cursor:pointer;padding:8px}

/* ---- 横向き・読み込み ---- */
#rotate{position:absolute;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px}
#rotate svg{width:56px;height:56px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){#rotate{display:flex}}
#loading{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;color:var(--dim);text-align:center;padding:20px}
#loading .lb3{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#loading .lb3 i{display:block;width:46px;height:11px;border:1.5px solid var(--line);animation:ld 1s ease-in-out infinite alternate}
#loading .lb3 i:nth-child(1){margin-left:12px;animation-delay:.2s}
#loading .lb3 i:nth-child(2){margin-left:6px;animation-delay:.1s}
@keyframes ld{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@media (max-height:720px){
  #hud{gap:5px} .iconbtn{width:38px;height:38px} #bestPill{padding:6px 12px}
  #meter{padding:4px 12px 6px} #cntNum{font-size:28px}
  #result .sheet{padding:9px 13px 10px} .rsCnt b{font-size:42px} .rsMax b{font-size:20px}
  .rsTip{font-size:11px;padding:5px 9px;line-height:1.5;margin-top:6px}
  .rsBtns{margin-top:8px} .rsBtns .btn{padding:9px 6px;font-size:13px}
  .logo{scale:.85;transform-origin:top center;margin-bottom:-30px}
}
@media (max-width:360px){#cntNum{font-size:26px}.rsCnt b{font-size:40px}.btn.big{font-size:19px}}
</style>

</script>

<body>
<div id="app">
  <div id="labels"></div>

  <div id="hud" hidden>
    <div class="row">
      <div class="grp">
        <button class="iconbtn" id="btnHome" aria-label="タイトルへ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5"/><path d="M6.5 9.5V19h11V9.5"/></svg></button>
        <button class="iconbtn" id="btnRetry" aria-label="やり直し"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      </div>
      <div id="bestPill">ベスト<b id="bestNum">—</b><span id="toBest"></span></div>
      <div class="grp r"><button class="iconbtn sndbtn" aria-label="音のオン・オフ"></button></div>
    </div>
    <div id="meter" class="bp">
      <div class="top">
        <div class="cnt"><span class="lbl">積んだ数</span><span id="cntNum">0</span><span id="cntUnit">個</span></div>
        <div id="ovTxt">はみ出し <b>0.00</b></div>
      </div>
      <div id="ruleTxt">前のブロックより<b>少しでも外</b>へ（出てなかったら即終了）</div>
    </div>
  </div>

  <div id="bottom" hidden>
    <button class="btn drop" id="btnDrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/><path d="M5 21h14"/></svg>落とす</button>
  </div>
  <div id="hint" hidden></div>

  <div id="intro" class="intro" hidden><div class="card bp"><div class="k1" id="inK1"></div><div class="k2" id="inK2"></div><div class="k3" id="inK3"></div></div></div>
  <div id="banner" hidden></div>
  <div id="failMsg" hidden></div>
  <div id="howto" hidden><div class="card bp"><div class="hand"><svg viewBox="0 0 40 48"><path fill="#eaf6ff" d="M14 4a3 3 0 0 1 6 0v16l1-.5V12a3 3 0 0 1 6 0v9l1-.3V15a3 3 0 0 1 6 0v14c0 9-6 16-14 16-6 0-9-3-13-9l-5-8a3 3 0 0 1 5-3l2 3z"/></svg></div><span id="howtoTxt"></span></div></div>

  <div id="result" hidden>
    <div class="sheet bp">
      <div class="rsHead"><span id="rsReason"></span><span id="rsNew" class="badge" hidden>自己ベスト更新！</span></div>
      <div class="rsMain">
        <div><div class="rsCnt"><b id="rsCnt">0</b><span>個 積めた</span></div><div class="rsSub" id="rsSub"></div></div>
      </div>
      <div class="rsBtns">
        <button class="btn sub" id="btnToTitle">タイトル</button>
        <button class="btn sub" id="btnShare">シェア</button>
        <button class="btn" id="btnAgain">もう一度</button>
      </div>
    </div>
  </div>

  <div id="scrTitle" class="screen">
    <div>
      <div class="logo" aria-label="はみ出しタワー">
        <div class="tbl"></div><div class="lb b2">タワー</div><div class="lb b1">はみ出し</div><div class="edge"></div>
        <div class="dim d1"><span>1/2</span></div><div class="dim d2"><span>1/4</span></div>
      </div>
      <p class="tagline">手でつまんだ積み木を、<br>前のブロックより<b style="color:var(--cyan)">少しでも外</b>へ。<br><span class="r">出てなかったら、即終了。</span></p>
      <div id="titleBest" hidden><span></span></div>
    </div>

const GAIN_SLOW = 0.0001;    // 指をゆっくり動かした時、指1pxでブロックが動く量（10pxで0.1%）

const q3 = v => Math.round(v/STEP)*STEP;
// ps[k] = 下から k 段目のブロックの左端の位置（机の端が 0、外向きがプラス）
function analyze(ps){
  const n = ps.length, levels = []; let fail = -1, sum = 0; const X = new Array(n);
  for (let k = n-1; k >= 0; k--){ sum += ps[k] + 0.5; X[k] = sum / (n-k); }
  for (let k = 0; k < n; k++){
    let lo, hi;
    if (k === 0){ lo = Math.max(ps[0], TABLE_X0); hi = Math.min(ps[0] + 1, 0); }
    else { lo = Math.max(ps[k], ps[k-1]); hi = Math.min(ps[k], ps[k-1]) + 1; }
    const ok = hi > lo && X[k] >= lo - EPS && X[k] <= hi + EPS;
    levels.push({ X: X[k], lo, hi, ok, margin: Math.min(X[k] - lo, hi - X[k]) });
    if (!ok && fail < 0) fail = k;
  }
  return { fail, levels };
}
const overhangOf = ps => { let m = 0; for (const p of ps) m = Math.max(m, p + 1); return m; };
const refRight = (ps, k) => k === 0 ? 0 : ps[k-1] + 1;                  // 「前のもの」の右端（1個目は机の端）
const shiftOf = (ps, k, p) => q3(p + 1 - refRight(ps, k));              // 前のものより何個分外に出たか
const IDEAL = (() => { const ps = []; for (let i = 0; ; i++){ ps.push(q3(-1 + MIN_SHIFT*(i + 1))); if (analyze(ps).fail >= 0){ ps.pop(); break; } if (ps.length >= MAXB - 4) break; } return ps; })();

const BP_VERT = `
  uniform vec3 uFill; varying vec2 vUv; varying vec3 vN; varying vec3 vC; varying vec3 vW;
  void main(){
    vUv = uv; vec4 pos = vec4(position, 1.0); vec3 nrm = normal;
    #ifdef USE_INSTANCING
      pos = instanceMatrix * pos; nrm = mat3(instanceMatrix) * nrm;
    #endif

    #else

    #endif

    vec4 w = modelMatrix * pos; vW = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const BP_FRAG = `
  uniform vec3 uLine; uniform float uW; uniform float uFillA; uniform float uLineA; uniform float uDpr; uniform float uHatch;
  varying vec2 vUv; varying vec3 vN; varying vec3 vC; varying vec3 vW;
  void main(){
    vec2 fw = max(fwidth(vUv), vec2(1e-6));
    vec2 dd = min(vUv, 1.0 - vUv) / fw;
    float d = min(dd.x, dd.y);
    float w = uW * uDpr;
    float line = 1.0 - smoothstep(w - 0.7, w + 0.7, d);
    float shade = 0.84 + 0.2 * vN.y + 0.06 * max(vN.z, 0.0) - 0.08 * abs(vN.x);
    vec3 fill = vC * shade;
    if (uHatch > 0.0){

      float h = (1.0 - smoothstep(0.6, 1.6, hd)) * step(0.5, vN.z) * uHatch;

    }
    vec3 col = mix(fill, uLine, line);
    float a = mix(uFillA, uLineA, line);
    gl_FragColor = vec4(col, a);
    #include <colorspace_fragment>
  }`;

const tanHalf = () => Math.tan(THREE.MathUtils.degToRad(camera.fov/2));

function desiredBox(){

function playBox(){

  const p0 = q3(clamp(base + off, lo, hi));

// 指の速さで細かさが変わる：ゆっくり→とても細かく、速く→大きく
function gainFor(speed){ const t = clamp((speed - SPEED_SLOW)/(SPEED_FAST - SPEED_SLOW), 0, 1); return GAIN_SLOW + (GAIN_FAST - GAIN_SLOW)*t*t; }

function land(){
  const c = G.cur, k = c.k; const shift = shiftOf(G.ps, k, c.p);
  G.ps.push(c.p); G.cur = null; curMesh.visible = false;
  towerIM.count = G.ps.length; setBlock(k, c.p + 0.5, k*BH + BH/2);
  sfx.knock(0.9, 1 + (Math.random() - 0.5)*0.1); cam.shake = 0.006; dust(c.p, c.p + 1, k*BH);
  const an = analyze(G.ps);
  if (an.fail >= 0){ buzz([20, 60, 40]); collapse(an.fail, an); return; }          // 倒れた
  if (shift < MIN_SHIFT - EPS){ buzz([40, 50, 40]); notOut(k, shift); return; }    // 出てなかった
  buzz(8);
  G.count = G.ps.length; G.shifts.push(shift); updateHUD();
  // 置いた後だけ、ずらした量を見せる
  const at = new THREE.Vector3(c.p + 1, (k + 1)*BH + 0.03, ZF);
  if (shift <= 0.004 + EPS){ popText(at, `神ギリ ${fmtSh(shift)}`, 'god'); sfx.star(2); }
  else if (shift <= 0.010 + EPS){ popText(at, `ギリギリ ${fmtSh(shift)}`, 'good'); sfx.star(0); }
  else popText(at, fmtSh(shift), 'plain');

  for (let lv = 0; lv < an.levels.length; lv++){ if (an.levels[lv].margin < TIGHT){ wobble(lv, an.levels[lv]); wob = true; break; } }

  const ref = k === 0 ? '机の端' : '前のブロック';
  const how = shift < -EPS ? `ずらした量 ${fmtSh(shift)}（${ref}より内側だった）` : `ずらした量 ${fmtSh(shift)}（${ref}とぴったり同じ）`;
  const el = $('failMsg'); el.innerHTML = `<div class="card bp"><span class="r">${ref}より、出ていなかった</span><small>${how}</small></div>`; show(el, true);

  tween(0.8, (e) => { const t = e*0.8; const th = sgn*A*Math.abs(Math.sin(t*Math.PI*3.4))*Math.exp(-t*4.2); const c = Math.cos(th), s = Math.sin(th);
      for (let i = lv; i < n; i++){ const rx = G.ps[i] + 0.5 - px, ry = i*BH + BH/2 - py; setBlock(i, px + c*rx - s*ry, py + s*rx + c*ry, th); } },

const GRAV = 14, REST = 0.22, MU = 0.55, BODY_I = (1 + BH*BH)/12;

let lastImpact = 0;
function collapse(f, an){
  G.phase = 'collapse'; G.count = G.ps.length - 1; sfx.creak(1);

// 机の角・残った段の角が、落ちているブロックの面にめりこんだら、ブロックを押し出す（角で引っかからずに滑り落ちる）

    if (right ? !keys.r : !keys.l){ keys.hold = 0; if (G.cur){ G.cur.raw = G.cur.p; moveCur((right ? 1 : -1)*KEY_STEP*(e.shiftKey ? 10 : 1)); } }
    if (right) keys.r = true; else keys.l = true;
  } else if (k === ' ' || k === 'Enter'){
    if (!$('share').hidden) return;
    if (G.scr === 'title'){ e.preventDefault(); startGame(); return; }
    if (G.scr === 'play'){ e.preventDefault();
      if (G.phase === 'intro'){ introDone(); return; }
      if (G.phase === 'failShow'){ endGame('fall'); return; }
      if (G.phase === 'result'){ retry(); return; }
      place(); }
  } else if ((k === 'r' || k === 'R') && G.scr === 'play') retry();
  else if (k === 'Escape'){ if (!$('share').hidden) show($('share'), false); else if (G.scr === 'play') goTitle(); }
});
window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft') keys.l = false; if (e.key === 'ArrowRight') keys.r = false; if (e.key === 'Shift') keys.big = false; });
window.addEventListener('blur', () => { keys.l = keys.r = false; drag = null; });
function updateKeys(dt){
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (!dir){ keys.hold = 0; return; }
  keys.hold += dt; if (keys.hold > 0.35) moveCur(dir*Math.min(0.5, 0.01 + Math.pow(keys.hold - 0.35, 2)*0.6)*(keys.big ? 4 : 1)*dt);
}
function retry(){ startGame({ keepPrev: true, quick: true, keepCam: true }); }

/* ---------- ボタン ---------- */
function onClick(id, fn){ $(id).addEventListener('click', e => { e.currentTarget.blur(); sfx.unlock(); sfx.click(); fn(e); }); }
onClick('btnPlay', () => startGame());
onClick('btnHome', goTitle);
onClick('btnRetry', retry);
const dropBtn = $('btnDrop');
dropBtn.addEventListener('click', e => { e.currentTarget.blur(); sfx.unlock(); place(); });
function updateDropBtn(){ const on = G.scr === 'play' && (G.phase === 'aim' || G.phase === 'spawn'); if (dropBtn.disabled === on) dropBtn.disabled = !on; }
onClick('btnAgain', retry);
onClick('btnToTitle', goTitle);
onClick('btnShare', openShare);
onClick('btnDoShare', doShare);
onClick('btnShareClose', () => show($('share'), false));
$('share').addEventListener('click', e => { if (e.target === $('share')) show($('share'), false); });
const SND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.6 6.5a8 8 0 0 1 0 11"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
function renderSound(){ document.querySelectorAll('.sndbtn').forEach(b => { b.innerHTML = sfx.muted ? SND_OFF : SND_ON; b.setAttribute('aria-pressed', String(!sfx.muted)); }); }
document.querySelectorAll('.sndbtn').forEach(b => b.addEventListener('click', e => { e.currentTarget.blur(); sfx.unlock(); sfx.setMuted(!sfx.muted); save.muted = sfx.muted; writeSave(); renderSound(); sfx.click(); }));
renderSound();

/* =========================================================
   毎フレーム
   ========================================================= */
function updateCur(){
  const c = G.cur; if (!c || c.flying || G.phase !== 'aim') return;
  curMesh.position.set(c.p + 0.5, curY(c.k), 0); syncHand();
}
function updateFX(dt){
  for (const d of dusts){ if (d.life <= 0) continue; d.life -= dt; const t = 1 - d.life/d.max;
    d.s.scale.setScalar(0.05 + t*0.18); d.s.material.opacity = 0.35*(1 - t); d.s.position.x += d.vx*dt; d.s.position.y += d.vy*dt; d.vx *= 0.92; d.vy *= 0.92; if (d.life <= 0) d.s.visible = false; }
  if (confP.length){ let alive = 0;
    for (let i = 0; i < confP.length; i++){ const q = confP[i]; q.life -= dt; if (q.life > 0) alive++;
      q.v.y -= 3.2*q.s*dt; q.v.multiplyScalar(Math.pow(0.35, dt)); q.p.addScaledVector(q.v, dt); q.r.x += q.rv.x*dt; q.r.y += q.rv.y*dt; q.r.z += q.rv.z*dt;
      _q.setFromEuler(q.r); const sc = (q.life > 0 ? Math.min(1, q.life*2) : 0)*q.s; _s1.set(sc, q.sh === 0 ? sc*0.25 : sc, sc); _m4.compose(q.p, _q, _s1); conf.setMatrixAt(i, _m4); }
    conf.instanceMatrix.needsUpdate = true; if (!alive){ confP.length = 0; conf.count = 0; } }
  if (G.revealT >= 0){ G.revealT += dt; idealIM.count = Math.min(MAX_COUNT, Math.floor(G.revealT*G.revealT*260)); idealIM.instanceMatrix.needsUpdate = true; }
  if (towerDirty){ towerIM.instanceMatrix.needsUpdate = true; towerDirty = false; }
}
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min(window.__dtMax || 0.05, (now - last)/1000); last = now;
  if (paused) dt = 0;
  G.time += dt;
  updTimers(dt); updTweens(dt); updateKeys(dt); updateCur(); updateFall(dt); updateFX(dt);
  updateCamera(dt); updateLiveHUD(); updateDropBtn();
  renderer.render(scene, camera);
  updateLabels();
}

/* ---------- 起動 ---------- */
new ResizeObserver(resize).observe(app); resize();
window.addEventListener('resize', resize);
goTitle(); frameBox(desiredBox(), frameRect()); snapCamera();
requestAnimationFrame(t => { last = t; loop(t); });
show($('loading'), false); window.__htReady = true;
window.HT = { THREE, towerIM, G, analyze, IDEAL, MAX_COUNT, MIN_SHIFT, startGame, place, moveCur, gainFor, goTitle, openShare, save, hand, setP: p => { if (G.cur){ G.cur.raw = p; G.cur.p = q3(p); } } };
</script>
