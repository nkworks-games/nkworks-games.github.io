<style>
:root{--ink:#22335c;--paper:#fff8e8;--red:#e4472f;--yellow:#ffd95a;--brown:#8a6238;
--fd:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
--fb:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
--ol:-2px -2px 0 var(--paper),2px -2px 0 var(--paper),-2px 2px 0 var(--paper),2px 2px 0 var(--paper),0 3px 0 var(--paper),0 -3px 0 var(--paper),3px 0 0 var(--paper),-3px 0 0 var(--paper)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#bfe4f7;font-family:var(--fb);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.hide{display:none!important}
/* --- 伸ばす時の表示 --- */
#pullTop{position:absolute;left:0;right:0;top:calc(8px + env(safe-area-inset-top));text-align:center}
#len{font:400 clamp(46px,13vw,88px)/1 var(--fd);text-shadow:var(--ol)}
#len small{font-size:.45em;margin-left:.08em}
#thick{display:inline-block;margin-top:6px;font:900 clamp(13px,3.6vw,17px) var(--fb);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 12px}
#kind{margin-left:8px;color:var(--red)}
#boost{position:relative;width:min(50vw,230px);height:22px;margin:6px auto 0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
#boostFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd95a,#ff9d4a 60%,#e4472f)}
#boostTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 12px var(--fb)}
#boost.max{animation:shake .1s infinite}
#boost.keep{border-color:var(--red)}
#giri{position:absolute;right:calc(70px + env(safe-area-inset-right));top:21%;font:400 clamp(24px,7.5vw,44px) var(--fd);color:var(--red);text-shadow:var(--ol);opacity:0;white-space:nowrap;transform-origin:right center}
#giri.on{animation:giri .9s ease both}
@keyframes giri{0%{opacity:0;transform:scale(.4) rotate(-8deg)}18%{opacity:1;transform:scale(1.25) rotate(-8deg)}30%{transform:scale(1) rotate(-8deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg) translateY(-12px)}}
#gauge{position:absolute;right:calc(10px + env(safe-area-inset-right));top:25%;height:45%;width:52px;display:flex;flex-direction:column;align-items:center;gap:5px}
.gl{font:900 12px var(--fb);color:var(--paper);background:var(--red);padding:2px 7px;border-radius:8px;white-space:nowrap}
.gl.bot{background:var(--brown)}
#gTrack{position:relative;flex:1;width:30px;border-radius:16px;border:3px solid var(--ink);background:linear-gradient(to top,#c9a26b 0%,#9ad06f 12%,#6cc36a 45%,#ffd95a 74%,#ff9d4a 100%);box-shadow:0 3px 0 rgba(0,0,0,.2)}
#gRed{position:absolute;left:0;right:0;top:0;border-radius:12px 12px 0 0;background:repeating-linear-gradient(-45deg,#e4472f 0 6px,#b9301c 6px 12px)}
#gFloor{position:absolute;left:0;right:0;bottom:0;height:3%;background:var(--brown);border-radius:0 0 12px 12px}
#gMark{position:absolute;left:-13px;right:-13px;height:12px;margin-bottom:-6px;border-radius:6px;background:var(--paper);border:3px solid var(--ink)}
#gauge.hi #gTrack{animation:shake .12s infinite}
@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
#warnTop,#warnBot{position:absolute;left:0;right:0;height:40%;opacity:0}
#warnTop{top:0;background:linear-gradient(rgba(228,71,47,.6),rgba(228,71,47,0))}
#warnBot{bottom:0;background:linear-gradient(rgba(138,98,56,0),rgba(138,98,56,.7))}
.blbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:900 12px var(--fb);background:var(--ink);color:var(--paper);padding:2px 9px;border-radius:999px;white-space:nowrap}
#toast{position:absolute;left:50%;top:max(20%,calc(clamp(46px,13vw,88px) + 92px + env(safe-area-inset-top)));opacity:0;padding:7px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font:900 clamp(15px,4.4vw,22px) var(--fb);white-space:nowrap;border:3px solid var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.25);transform:translate(-50%,0)}
#toast.on{animation:toast 2.4s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}8%{opacity:1;transform:translate(-50%,0) scale(1.08)}14%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px) scale(1)}}
#big{position:absolute;left:0;right:0;top:calc(clamp(46px,13vw,88px) + 86px + env(safe-area-inset-top));text-align:center;opacity:0;transform:scale(.7);transition:opacity .15s,transform .22s cubic-bezier(.2,1.6,.4,1)}
#big.on{opacity:1;transform:scale(1)}
#bigBox{display:inline-block;background:rgba(255,248,232,.95);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:10px 24px 12px;max-width:94vw}
#bigMain{font:400 clamp(34px,10.5vw,76px)/1.1 var(--fd);color:var(--red)}
#bigSub{font:900 clamp(15px,4.4vw,24px) var(--fb);margin-top:2px}
#hint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);font:900 clamp(14px,4vw,19px) var(--fb);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
#hint.pulse{font-size:clamp(18px,5.6vw,28px);background:var(--yellow);animation:pulse .7s infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.07)}}
/* --- こねる時の表示 --- */
#kTop{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top));text-align:center}
#kTitle{font:400 clamp(22px,6.4vw,38px) var(--fd);text-shadow:var(--ol)}
#kBar{position:relative;width:min(72vw,360px);height:30px;margin:8px auto 0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
#kFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd95a,#ff9d4a)}
#kPct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 15px var(--fb)}
#kProg{width:min(72vw,360px);height:6px;margin:6px auto 0;border-radius:3px;background:rgba(34,51,92,.25);overflow:hidden}
#kProgIn{height:100%;width:100%;background:var(--ink)}
#kFeet{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:center;padding:0 12px}
.foot{flex:1;max-width:260px;height:clamp(70px,15vh,118px);border-radius:22px;background:rgba(255,248,232,.92);border:4px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 clamp(20px,5.6vw,30px) var(--fb);box-shadow:0 6px 0 var(--ink)}
.foot small{font-size:.46em;opacity:.7;white-space:nowrap}
.foot.next{background:var(--yellow)}
.foot.hit{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
#kRing{position:relative;flex:0 0 76px;width:76px;height:76px}
#kIn{position:absolute;inset:0;border-radius:50%;border:6px solid var(--ink);background:rgba(255,248,232,.95);display:flex;align-items:center;justify-content:center;font:400 28px var(--fd)}
#kOut{position:absolute;inset:-3px;border-radius:50%;border:6px solid var(--red)}
#kJudge{position:absolute;left:50%;top:-96px;white-space:nowrap;font:400 26px var(--fd);text-shadow:var(--ol);opacity:0;transform:translateX(-50%)}
#kJudge.on{animation:judge .5s ease both}
#kJudge.q0{color:var(--red)}#kJudge.q1{color:#2f8f4e}#kJudge.q2{color:var(--ink)}#kJudge.q3{color:#777}
@keyframes judge{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-14px) scale(1)}}
/* --- タイトル・結果 --- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#title{justify-content:space-between;padding:calc(46px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,248,232,.93) 0%,rgba(255,248,232,0) 36%,rgba(255,248,232,0) 60%,rgba(255,248,232,.95) 84%)}
.logo{text-align:center;font-family:var(--fd);line-height:1.02}
.logo .l1{display:inline-block;font-size:clamp(28px,8.6vw,54px);color:var(--red);transform:rotate(-5deg);text-shadow:var(--ol)}
.logo .l2{display:block;font-size:clamp(46px,14.5vw,96px);text-shadow:var(--ol)}
.logo svg{display:block;width:min(78vw,430px);margin:2px auto 0}
.lead{font:900 clamp(14px,4vw,19px) var(--fb);text-align:center;margin-top:6px;text-shadow:var(--ol)}
.bottom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.how{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font:700 clamp(12px,3.4vw,15px) var(--fb)}
.how div{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;text-align:center}
.how b{display:block;color:var(--red);font-weight:900}
.btn{pointer-events:auto;cursor:pointer;font:400 clamp(20px,6vw,28px) var(--fd);color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:999px;padding:10px 34px;box-shadow:0 6px 0 var(--ink);touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--yellow)}
#titleBest{font:900 14px var(--fb);min-height:1.2em}
.pc{display:none;font:700 12px var(--fb);opacity:.8}
@media (hover:hover) and (pointer:fine){.pc{display:block}}
#result{justify-content:center;padding:16px;background:rgba(34,51,92,.28)}
.panel{width:min(92vw,420px);background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px 16px 16px;text-align:center;pointer-events:auto;max-height:calc(100% - 14px);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
#rCause{font:900 clamp(15px,4.4vw,19px) var(--fb)}
#rNew{display:inline-block;margin-top:6px;background:var(--red);color:var(--paper);font:900 14px var(--fb);border-radius:999px;padding:3px 14px;transform:rotate(-3deg)}
.rLen{font:400 clamp(46px,14vw,76px)/1.05 var(--fd);margin-top:2px}
.rLen small{font-size:.4em;margin-left:.08em}
#rCmp{font:900 clamp(13px,3.8vw,16px) var(--fb);color:var(--red);min-height:1.3em}
.rows{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0 12px}
.rows div{background:#f6e8c8;border-radius:12px;padding:6px 2px;font:700 11px var(--fb)}
.rows b{display:block;font:900 clamp(12px,3.6vw,17px) var(--fb);white-space:nowrap}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns .btn{font-size:clamp(15px,4.3vw,20px);padding:8px 16px}
#rCard{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:3px solid var(--ink);background:#cfe9f6;margin-bottom:8px;pointer-events:auto;-webkit-touch-callout:default}
.rLen{font-size:clamp(46px,14vw,76px)}
@media (orientation:landscape) and (max-height:600px){.panel{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"img body" "links body";column-gap:14px;row-gap:0;align-items:center;width:min(96vw,820px);padding:10px 14px}#rCard{grid-area:img;margin-bottom:0}.rBody{grid-area:body}.rLinks{grid-area:links}#result{padding:8px}.panel .follow{padding:3px 6px 3px 12px;margin-top:4px}.panel .fbtn,.panel .tbtn{padding:6px 10px}.rLen{font-size:clamp(36px,13vh,60px)}.rows{margin:6px 0 8px}.btns .btn{font-size:15px;padding:6px 13px}}
@media (orientation:landscape) and (max-height:480px){#len{font-size:50px}#thick{margin-top:2px}#boost{display:inline-block;vertical-align:middle;width:170px;margin:2px 0 0 8px}#big{top:98px}#toast{top:98px}#hint{bottom:8px;font-size:14px;padding:4px 14px}#kTop{top:8px}}
#mute{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font:900 12px var(--fb);color:var(--ink);pointer-events:auto;cursor:pointer}
/* 作者をフォロー（タイトルと結果画面だけ。サイトのほかのゲームと同じ形） */
.follow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(400px,100%);margin:6px auto 0;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:5px 8px 5px 14px;text-align:left;pointer-events:auto}
.panel .follow{background:#f6e8c8;border:0;padding:6px 8px 6px 14px}
.follow>div{min-width:0;overflow:hidden}.follow p{margin:0;overflow:hidden;text-overflow:ellipsis}
.follow .fl{font:900 14px/1.3 var(--fb);white-space:nowrap}
.follow .fs{font:700 10px/1.3 var(--fb);color:#6b6455;white-space:nowrap}
.fbtn{flex-shrink:0;display:inline-block;padding:8px 12px;border-radius:999px;background:#000;color:#fff;border:1px solid #4a4f66;font:800 13px var(--fb);text-decoration:none;box-shadow:0 3px 0 #333;white-space:nowrap}
.fbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #333}
/* 作者を応援する（結果画面だけ。OFUSEのページを新しいタブで開く。.fbtnにするとフォローのリンクで上書きされるので別の名前） */
.tbtn{flex-shrink:0;display:inline-block;padding:8px 12px;border-radius:999px;background:linear-gradient(#ffe08a,#ffb53c);color:#3a1a08;font:800 13px var(--fb);text-decoration:none;box-shadow:0 3px 0 #a8580f;white-space:nowrap}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #a8580f}
@media (max-width:420px){.follow{gap:8px;padding-right:6px}.follow .fl{font-size:13px}.fbtn,.tbtn{font-size:12px;padding:8px 10px}}
@media (max-height:700px){.follow .fs{display:none}}
@media (orientation:landscape) and (max-height:480px){#title{padding-top:8px;padding-bottom:8px}.logo .l1{font-size:22px}.logo .l2{font-size:44px}.logo svg{width:220px}.lead{display:none}.how{font-size:11px}.how div{padding:3px 10px}.bottom{gap:5px}#title .btn{padding:6px 28px;font-size:20px}}
#fade{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
</style>

<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud" class="layer">
    <div id="warnTop"></div><div id="warnBot"></div>
    <div id="pullTop" class="hide">
      <div id="len"><span id="lenNum">1.0</span><small>m</small></div>
      <div id="thick">太さ <b id="thickNum">30.0</b>mm<span id="kind">うどん</span></div>
      <div id="boost"><div id="boostFill"></div><div id="boostTxt">加速 0%</div></div>
    </div>
    <div id="gauge" class="hide">
      <div class="gl">切れる</div>
      <div id="gTrack"><div id="gRed"></div><div id="gFloor"></div><div id="gMark"></div></div>
      <div class="gl bot">床</div>
    </div>
    <div id="lblA" class="blbl hide">職人</div>
    <div id="lblB" class="blbl hide">床まで 0cm</div>
    <div id="giri"></div>
    <div id="toast"></div>
    <div id="big"><div id="bigBox"><div id="bigMain"></div><div id="bigSub"></div></div></div>
    <div id="hint" class="hide"></div>
    <div id="kneadHud" class="hide">
      <div id="kTop">
        <div id="kTitle">足ふみで コシ を作れ！</div>
        <div id="kBar"><div id="kFill"></div><div id="kPct">コシ 0%</div></div>
        <div id="kProg"><div id="kProgIn"></div></div>
      </div>
      <div id="kFeet"><div id="kL" class="foot">左足<small>画面の左をタップ</small></div><div id="kRing"><div id="kOut"></div><div id="kIn"></div><div id="kJudge"></div></div><div id="kR" class="foot">右足<small>画面の右をタップ</small></div></div>
    </div>
  </div>
  <div id="title" class="screen">
    <div>
      <div class="logo"><span class="l1">のびろ！</span><span class="l2">一本うどん</span>
        <svg viewBox="0 0 300 26" aria-hidden="true"><path d="M5 14C40-4 70 30 110 13S190-4 232 13s46 9 63-3" fill="none" stroke="#22335c" stroke-width="12" stroke-linecap="round"/><path d="M5 14C40-4 70 30 110 13S190-4 232 13s46 9 63-3" fill="none" stroke="#fff3d6" stroke-width="6.5" stroke-linecap="round"/></svg>
      </div>
      <p class="lead">こねて、引っぱって、切らすな。</p>
    </div>
    <div class="bottom">
      <div class="how"><div><b>① こねる</b>左右を交互にタップ</div><div><b>② 伸ばす</b>長押しで引く（長いほど加速）・離して休む</div></div>
      <div class="pc">パソコン：←→キーで足ふみ ／ スペースキー長押しで引く</div>
      <button id="btnStart" class="btn primary">はじめる</button>
      <div id="titleBest"></div>
      <div class="follow"><div><p class="fl">作者をフォロー</p><p class="fs">新作のお知らせをしています</p></div><a class="fbtn" target="_blank" rel="noopener" data-google-vignette="false"></a></div>
    </div>
  </div>
  <div id="result" class="screen hide">
    <div class="panel">
      <img id="rCard" alt="記録の絵">
      <div class="rBody">
      <div id="rCause"></div>
      <div id="rNew" class="hide">自己ベスト更新！</div>
      <div class="rLen"><span id="rLen">0.0</span><small>m</small></div>
      <div id="rCmp"></div>
      <div class="rows"><div>太さ<b id="rThick">-</b></div><div>コシ<b id="rKoshi">-</b></div><div>ギリギリ<b id="rGiri">-</b></div><div>自己ベスト<b id="rBest">-</b></div></div>
      <div class="btns"><button id="btnRetry" class="btn primary">もう一回</button><button id="btnShare" class="btn">Xでシェア</button><button id="btnSave" class="btn">画像を保存</button></div>
      </div>
      <div class="rLinks"><div class="follow"><div><p class="fl">作者をフォロー</p><p class="fs">新作のお知らせをしています</p></div><a class="fbtn" target="_blank" rel="noopener" data-google-vignette="false"></a></div><div class="follow tip" id="tipCard"><div><p class="fl">作者を応援する</p><p class="fs">100円から送れます</p></div><a class="tbtn" id="tipBtn" target="_blank" rel="noopener" data-google-vignette="false">☕ 応援する</a></div></div>
    </div>
  </div>
  <button id="mute" aria-label="音のオン・オフ">音ON</button>
  <div id="fade"></div>
</div>

<script type="module">
import * as THREE from 'three';

// ===== [SEC:CONFIG] =====
// 調整する数値はここにまとめる（速さは全部「1秒あたり」）
const CONFIG = {
  FIXED: 1 / 120,          // 計算の刻み（秒）
  MAX_FRAME: 0.1,          // 1フレームで進める最大の秒数

}
function drawCardText(x) { // 絵の上に、目印の札・題名・記録を書く

  x.font = `400 52px ${FONT_D}`; x.fillText('m', lx, bandY + 112); lx += x.measureText('m').width + 34;

// ===== [SEC:RENDER] =====
let noodleMinY = 0, tubeClear = 0;

}

  if (creak && AC) { // 引っぱる時のきしむ音

// ===== [SEC:INPUT] =====
const app = $('app');
app.addEventListener('pointerdown', e => {
  if (e.target.closest('button,a,.follow,.panel')) return; // ボタン・リンク・結果のパネル（絵の長押し保存やスクロール）はそのまま通す
  audioInit(); e.preventDefault();
  if (g.state === 'knead') tap(e.clientX < window.innerWidth / 2 ? 'L' : 'R');
  input.ptr.add(e.pointerId); input.presses++;
});
const ptrUp = e => input.ptr.delete(e.pointerId);

// スマホの長押しのはたらき（拡大鏡・文字の選択・メニュー）で、押している指が取り消されないようにする（ボタン・リンク・結果のパネルは除く）

$('btnRetry').addEventListener('click', () => { audioInit(); startGame(); });
$('btnShare').addEventListener('click', shareX); $('btnSave').addEventListener('click', saveCard);
document.querySelectorAll('.fbtn').forEach(a => { a.href = 'https://x.com/intent/follow?screen_name=' + CONFIG.FOLLOW_X; a.textContent = '𝕏 @' + CONFIG.FOLLOW_X; }); // 作者をフォロー

// ===== [SEC:LOOP] =====
let acc = 0, last = performance.now(), manual = false, paused = false;

function update(frameDt) { // 本番もテストもこの関数だけを使う
  acc += Math.min(frameDt, CONFIG.MAX_FRAME) * timeScale();
  while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; }
}
function frame(now) { if (!paused && !manual) update((now - last) / 1000); last = now; render(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { paused = document.hidden; if (paused) { input.keyHold = false; input.ptr.clear(); } last = performance.now(); });
requestAnimationFrame(frame);

let testMaxL = 0;
const _cbox = new THREE.Box3();

  state() { return { state: g.state, t: +g.t.toFixed(3), L: +g.L.toFixed(3), T: +g.T.toFixed(4), v: +g.v.toFixed(3), limit: +g.limit.toFixed(3), koshi: +g.koshi.toFixed(3), hold: input.hold, started: g.started, endKind: g.endKind, best: +g.best.toFixed(3), bub: +g.vis.bub.toFixed(2), boost: +g.boost.toFixed(3), giri: g.giri, card: !!g.cardUrl, over: g.state === 'result' }; },
