<head>

<style>
/* ===== [SEC:CSS] ===== */
:root{--ink:#13324d;--ac:#ffd84a;--ac2:#ff6b4a;--sky:#bfe3f7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--sky);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
.out{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));touch-action:manipulation}
.dim{background:rgba(19,50,77,.38)}
.btn{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:10px 16px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.y{background:var(--ac)}
.btn.r{background:var(--ac2);color:#fff}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--ink);width:min(94vw,460px);max-height:100%;overflow:auto}
h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:12px}
/* タイトル */
#sTitle .logo{font-size:clamp(58px,17vw,104px);font-weight:800;letter-spacing:.04em;line-height:1;transform:rotate(-4deg)}
#sTitle .sub{margin:14px 0 22px;font-weight:800;font-size:16px;background:rgba(255,255,255,.88);border:3px solid var(--ink);border-radius:999px;padding:4px 16px}
#sTitle .modes{display:flex;flex-direction:column;gap:12px;width:min(86vw,360px)}
#sTitle .modes .btn{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 16px;font-size:22px}
#sTitle .modes .btn small{display:block;font-size:12px;font-weight:500;opacity:.8}
#sTitle .modes .btn i{font-style:normal;font-size:28px;width:36px;text-align:center}
#sTitle .row{margin-top:16px}
#sTitle .credit{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;font-weight:800;opacity:.75}
/* 板えらび */
#cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#cards{flex-wrap:nowrap}
.tcard{flex:1 1 0;min-width:0;max-width:150px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 6px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.tcard b{font-size:17px}
.tcard small{font-size:11px;line-height:1.45;text-align:center}
.tcard canvas{width:100%;height:110px}
.back{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;font-size:22px;padding:0}
/* 描く画面 */
#sDraw{background:linear-gradient(#eaf6ff,#cfe9fb);justify-content:flex-start}
#drawHead{width:100%;text-align:center;font-weight:800;font-size:18px;min-height:46px;display:flex;align-items:center;justify-content:center;padding:0 118px 0 56px}
#dUndo{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));padding:8px 12px;font-size:14px;z-index:2}
#drawWrap{flex:1;display:flex;gap:14px;align-items:center;justify-content:center;width:100%;min-height:0}
#cvBox{position:relative;height:100%;max-height:min(66vh,640px);display:flex;align-items:center;justify-content:center}
#dc{height:100%;max-width:42vw;background:#fff;border:3px solid var(--ink);border-radius:14px;touch-action:none;box-shadow:0 4px 0 var(--ink)}
#dmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;font-size:15px;text-align:center;pointer-events:none;width:max-content;max-width:40vw;line-height:1.5;color:#4a6c8a}
#side{display:flex;flex-direction:column;gap:10px;width:min(50vw,280px)}
#stats{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:4px 0}
.stat span{width:6.2em}
.stat .bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#eef4f9}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#43c6ff,#2f86e4);transition:width .25s}
.stat em{font-style:normal;width:1.6em;text-align:right}
#tools{display:flex;flex-direction:column;gap:8px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);padding:0}
.pal button.on{outline:3px solid var(--ac2);outline-offset:2px}
.lab{font-size:12px;font-weight:800}
#drawBtns{display:flex;flex-direction:column;gap:8px}
#drawBtns .row .btn{flex:1;padding:8px 6px;font-size:14px}
@media (max-aspect-ratio:1/1){
  #drawWrap{flex-direction:column;gap:8px}
  #cvBox{height:auto;flex:1;max-height:none;min-height:0;width:100%}
  #dc{height:100%;max-height:52vh;max-width:70vw}
  #dmsg{max-width:60vw}
  #side{width:min(94vw,460px)}
  #stats{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:6px 10px}
  .stat{margin:2px 0}
  .stat span{width:4.6em}
}
/* HUD */
#sHud{position:fixed;inset:0;pointer-events:none}
#hMain{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
#hMain small{font-size:.5em}
#hSub{position:absolute;left:max(15px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + clamp(32px,8vw,46px));font-size:14px;font-weight:800;line-height:1.5}
#hSub b{color:var(--ac)}
#bPause{pointer-events:auto;position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;padding:0;font-size:16px}
#hSpeed{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#hSpeed small{font-size:.6em}
#hCharge{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(46vw,200px);height:16px;border:3px solid var(--ink);border-radius:10px;background:rgba(255,255,255,.8);overflow:hidden;opacity:0;transition:opacity .15s}
#hCharge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff6b4a)}
#hPop{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;width:max-content;max-width:92vw}
#hPop .p1{font-size:clamp(24px,7vw,38px);font-weight:800;line-height:1.15}
#hPop .p2{display:inline-block;margin-top:4px;font-size:15px;font-weight:800;background:rgba(19,50,77,.85);color:#fff;border-radius:12px;padding:4px 12px}
#hPop .p2 b{color:var(--ac)}
.pop{animation:pop .32s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.08);opacity:1}100%{transform:translateX(-50%) scale(1)}}
#hCount{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(70px,22vw,130px);font-weight:800;white-space:nowrap}
#hCount.s{font-size:clamp(44px,13vw,84px)}
#hHint{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(19,50,77,.86);color:#fff;padding:9px 14px;border-radius:14px;font-size:14px;font-weight:800;line-height:1.6;text-align:center;width:max-content;max-width:92vw;transition:opacity .4s}
#hHint b{color:var(--ac)}
#sfx{position:absolute;inset:0;width:100%;height:100%}
#mm{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 56px);width:clamp(88px,24vw,132px);height:clamp(124px,34vw,186px);border:3px solid var(--ink);border-radius:14px;background:rgba(214,232,246,.78);box-shadow:0 3px 0 var(--ink)}
#hFree{position:absolute;left:max(14px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 84px);display:flex;flex-direction:row;gap:8px;pointer-events:auto}
#hFree .btn{padding:7px 10px;font-size:13px}
#hFoot{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;font-size:18px}
/* 結果・ランキング */
#rBig{font-size:clamp(40px,12vw,60px);font-weight:800;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
#rBig small{font-size:.45em}
#rTitle{text-align:center;font-weight:800;font-size:20px}
#rDetail{text-align:center;font-size:13px;font-weight:800;line-height:1.6;margin:6px 0;opacity:.85}
#rBest{text-align:center;font-weight:800;color:#e2553a;min-height:1.4em}
.entry{display:flex;gap:6px;margin:8px 0}
.entry input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font:800 16px "M PLUS Rounded 1c",sans-serif;color:var(--ink)}
.entry .btn{padding:8px 10px;font-size:14px;white-space:nowrap}
.msg{text-align:center;font-size:13px;font-weight:800;min-height:1.4em;color:#2f6fae}
.rlist{list-style:none;margin:6px 0 12px;max-height:34vh;overflow:auto;border:2px solid #d5e4f0;border-radius:12px}
.rlist li{display:flex;gap:8px;padding:5px 10px;font-size:14px;font-weight:800;border-bottom:1px solid #e6eef5;font-variant-numeric:tabular-nums}
.rlist li:nth-child(1) .n{color:#d9a400}.rlist li:nth-child(2) .n{color:#8f9bab}.rlist li:nth-child(3) .n{color:#c47a3a}
.rlist li.me{background:#fff3c4}
.rlist .n{width:2.2em}.rlist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rlist .t{width:1.6em;text-align:center}
.rlist .empty{justify-content:center;opacity:.6}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.tabs .btn{padding:6px 16px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.tabs .btn.on{background:var(--ac)}
#sPause .card{display:flex;flex-direction:column;gap:10px;width:min(86vw,320px)}
#dc.wide{height:auto;max-height:none;width:min(54vw,calc(min(66vh,640px) * 1.5));max-width:none}
#drawBtns .row .btn{white-space:nowrap}
/* 自由：ポーズの画面 */
#sPose{position:fixed;inset:0;pointer-events:none}
#sPose .back,#poseTop,#posePanel,#pZoom{pointer-events:auto}
#poseTop{position:absolute;left:calc(max(12px,env(safe-area-inset-left)) + 56px);top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#poseHead{font-size:18px;font-weight:800}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--ink)}
.seg button{border:0;background:#fff;padding:6px 11px;font-weight:800;font-size:13px;flex:1;white-space:nowrap}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ac)}
#pHint{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px);max-width:min(56vw,460px);background:rgba(19,50,77,.84);color:#fff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;line-height:1.55}
#pHint b{color:var(--ac)}
#pZoom{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px}
#pZoom button{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;font-weight:800;line-height:1;padding:0;box-shadow:0 3px 0 var(--ink);touch-action:manipulation}
#pZoom button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#pZoom button.on{background:var(--ac)}
#posePanel{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));bottom:max(10px,env(safe-area-inset-bottom));width:min(40vw,340px);overflow:auto;background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 5px 0 var(--ink)}
#posePanel .row .btn{flex:1;padding:8px 6px;font-size:14px}
#posePanel>*{flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:4px 9px;font-weight:800;font-size:13px}
.chips button.on{background:var(--ac2);color:#fff}
.chips button.far{background:#ffe08a;border-style:dashed}
#pPreset button.on{background:var(--ac);color:var(--ink)}
#pTilt summary{font-size:12px;font-weight:800;cursor:pointer}
#pTilt label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:4px}
#pTilt label span{width:4.5em}
#pTilt input{flex:1}
#pStats{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px}
.note{text-align:center;font-size:12px;font-weight:800;color:#4a6c8a;margin-top:2px}
@media (max-aspect-ratio:1/1){
  #dc.wide{width:min(92vw,calc(52vh * 1.5));height:auto;max-height:none;max-width:none}
  #posePanel{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:auto;bottom:max(8px,env(safe-area-inset-bottom));width:auto;max-height:46vh;gap:6px;padding:8px 10px}
  #pHint{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 84px);max-width:calc(100vw - 92px);font-size:12px}
  #pZoom{left:auto;bottom:auto;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));flex-direction:column}
  #pStats{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:4px 10px}
  #pStats .note{grid-column:1/3}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<section id="sTitle" class="scr">
  <div class="logo out">カキイタ</div>
  <div class="sub">描いた板で、雪山をすべれ。</div>
  <div class="modes">
    <button class="btn" data-mode="free"><i>🏔</i><span>フリー<small>広い雪山を自由にすべる</small></span></button>
    <button class="btn y" data-mode="score"><i>🎯</i><span>得点<small>ジャンプとレールで技を決める</small></span></button>
    <button class="btn" data-mode="time"><i>⏱</i><span>タイム<small>旗門をぬけてゴールまで</small></span></button>
  </div>
  <div class="row"><button class="btn" id="bRank">🏆 ランキング</button><button class="btn" id="bSnd">🔊</button></div>
  <div class="credit out">N.K. Works</div>
</section>

<section id="sPick" class="scr dim hide">
  <button class="btn back" id="pickBack">←</button>
  <div class="card" style="width:min(96vw,520px)">
    <h2>どの板ですべる？</h2>
    <div id="cards"></div>
  </div>
</section>

<section id="sDraw" class="scr hide">
  <button class="btn back" id="drawBack">←</button>
  <button class="btn" id="dUndo" disabled>↩ 一手前</button>
  <div id="drawHead"></div>
  <div id="drawWrap">
    <div id="cvBox"><canvas id="dc"></canvas><div id="dmsg"></div></div>
    <div id="side">
      <div id="stats"></div>
      <div id="tools" class="hide">
        <div class="lab">ペンの色</div><div class="pal" id="palPen"></div>
        <div class="lab">板の色</div><div class="pal" id="palBase"></div>
      </div>
      <div id="drawBtns"></div>
    </div>
  </div>
</section>

<section id="sPose" class="hide">
  <button class="btn back" id="poseBack">←</button>
  <div id="poseTop"><div id="poseHead" class="out">ポーズと くっつける所</div><div class="seg" id="pView"><button data-v="side">横</button><button data-v="front">前</button><button data-v="top">上</button><button data-v="naname">ななめ</button></div></div>
  <div id="pHint" class="hide"></div>
  <div id="pZoom"><button id="pZin" aria-label="近づく">＋</button><button id="pZout" aria-label="遠ざかる">－</button><button id="pHelp" aria-label="説明">？</button></div>
  <div id="posePanel">
    <div class="lab">ポーズの見本</div><div class="chips" id="pPreset"></div>
    <div class="lab">板にくっつける所（タップで ON／OFF）</div><div class="chips" id="pAttach"></div>
    <div class="seg" id="pMode"><button data-m="one">1枚にまとめる</button><button data-m="each">ばらばら</button></div>
    <details id="pTilt"><summary>体の向き・かたむき</summary><label><span>向き</span><input type="range" id="rYaw" min="-180" max="180" step="5"></label><label><span>前かがみ</span><input type="range" id="rPitch" min="-40" max="180" step="5"></label><label><span>よこ</span><input type="range" id="rRoll" min="-60" max="60" step="5"></label></details>
    <div id="pStats"></div>
    <div class="row"><button class="btn" id="pRedrawB">✏ 板を描き直す</button><button class="btn y" id="pTest">▶ 試しすべり</button></div>
    <button class="btn r" id="pGo" style="font-size:20px">すべる！</button>
  </div>
</section>

<section id="sHud" class="hide">
  <canvas id="sfx"></canvas>
  <div id="hMain" class="out"></div>
  <div id="hSub" class="out"></div>
  <button class="btn" id="bPause">❚❚</button>
  <canvas id="mm"></canvas>
  <div id="hSpeed" class="out"></div>
  <div id="hCharge"><i></i></div>
  <div id="hPop"></div>
  <div id="hCount" class="out"></div>
  <div id="hHint"></div>
  <div id="hFree" class="hide"><button class="btn" id="bTop">⛰ 山頂へ</button><button class="btn" id="bBoard">✏ 板を変える</button></div>
  <button class="btn y hide" id="hFoot">ふもとに着いた！ 山頂へ戻る</button>
</section>

<section id="sPause" class="scr dim hide">
  <div class="card">
    <h2>ひと休み</h2>
    <button class="btn y" id="pResume">つづける</button>
    <button class="btn" id="pRetry">さいしょから</button>
    <button class="btn" id="pRedraw">板を描き直す</button>
    <button class="btn" id="pTitle">タイトルへ</button>
  </div>
</section>

<section id="sResult" class="scr dim hide">
