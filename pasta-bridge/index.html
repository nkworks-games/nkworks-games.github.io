<script>
'use strict';
// ===== [SEC:CONFIG] =====
const CONFIG = {
  PASTA_LEN: 160,       // パスタ1本の長さ（ゲーム内の長さの単位）
  MIN_LEN: 20,          // これより短くは置けない
  MAX_BUNDLE: 4,        // 同じ場所に束ねられる最大本数
  MAX_PASTA: 40,        // 1ステージで置ける最大本数
  ROAD_DEG: 30,         // この傾きまでのパスタが「道」になる（度）
  SNAP_PX: 22,          // 点に吸いつく距離（画面のpx）
  TAP_PX: 14,           // パスタをタップで消せる距離（画面のpx）
  GRAVITY: 900,         // 重力
  SUBSTEPS: 24,         // 1コマあたりの物理計算の回数（多いほど正確）
  DAMP: 1.2,            // 揺れのおさまりやすさ
  PASTA_MASS: 0.5,      // パスタ1本の重さ
  COMPLIANCE: 3e-7,     // パスタの伸びやすさ（小さいほどかたい）
  TENSION: 8000,        // 1本が耐えられる引っぱる力
  BUCKLE_K: 1.85e8,      // 押す力への強さ（この値÷長さ²。長いほど弱い）
  CRUSH: 12000,         // 短いパスタでも、押す力はここまで
  BEND: 140000,         // 車輪が乗った時に耐えられる曲げの強さ
  FILTER: 0.01,         // 力のならし方（小さいほど一瞬の衝撃では折れにくい）
  TRACTION: 1600,       // タイヤのグリップ（加速の上限）
  START_X: -110,        // 車のスタート位置（後輪のx）
  GOAL_X: 50,           // 後輪が向こう岸にこれだけ入ったらゴール
  STALL_SEC: 4,         // この秒数進めなかったら立ち往生
  MAX_SEC: 30,          // テストの最大秒数
  WATER_Y: 250,         // 鍋の水面の高さ（下が＋）
  GOAL_SEC: 1.0,        // ゴールしてから結果が出るまで（秒）
  SINK_SEC: 1.6,        // 鍋に落ちてから結果が出るまで（秒）
  STUCK_SEC: 0.5,       // 立ち往生から結果が出るまで（秒）
  CARS: {
    mini:  { name: 'ミニカー',   mass: 4,  r: 11, base: 46, speed: 110, body: '#e8483b' },
    truck: { name: 'トラック',   mass: 8,  r: 13, base: 58, speed: 100, body: '#2f7fd1' },
    dump:  { name: 'ダンプカー', mass: 10, r: 15, base: 66, speed: 90,  body: '#f0a01e' },
  },
  // gap:谷の幅 rightY:向こう岸の高さ（上が−） left/right:岸のピンの深さ pillars:途中の足場 stars:[★3の本数, ★2の本数]
  STAGES: [
    { name: 'はじめの一本', gap: 130, left: [0, 70], right: [0, 70], car: 'mini', stars: [1, 2], note: 'ピンから引っぱって、パスタを置こう' },
    { name: 'ちょっと遠い', gap: 240, left: [0, 70, 140], right: [0, 70, 140], car: 'mini', stars: [3, 4], note: '継ぎ目はたわむ。三角形にすると強い' },
    { name: 'もっと遠い', gap: 380, left: [0, 70, 140], right: [0, 70, 140], car: 'mini', stars: [5, 7], note: '長いパスタは、押されると折れやすい' },
    { name: '向こう岸が高い', gap: 300, rightY: -80, left: [0, 70, 140], right: [0, 80, 160], car: 'mini', stars: [3, 5], note: '道になるのは30°までのゆるい坂だけ' },
    { name: 'トラックが来た', gap: 300, left: [0, 70, 140], right: [0, 70, 140], car: 'truck', stars: [5, 7], note: '同じ所にもう1本引くと、束になって強くなる' },
    { name: 'ペッパーミル', gap: 560, left: [0, 80], right: [0, 80], pillars: [{ x: 280, w: 44, top: 40 }], car: 'mini', stars: [6, 8], note: 'ペッパーミルの上にもピンがある' },
    { name: '下にピンがない', gap: 420, left: [0], right: [0], car: 'truck', stars: [9, 12], note: '下から支えられないなら…' },
    { name: 'ダンプの大鍋', gap: 520, left: [0, 70, 140], right: [0, 70, 140], car: 'dump', stars: [12, 15], note: 'いちばん重い車。束ねて強く' },
  ],
  VOL: 0.7,             // 全体の音量
  SAVE_KEY: 'pasta-bridge.v1',
  URL: 'https://nkworks-games.com/pasta-bridge/',
};

// ===== [SEC:UTIL] =====
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const INK = '#3a2a1e';
function isRoad(ax, ay, bx, by) { return Math.atan2(Math.abs(by - ay), Math.abs(bx - ax)) * 180 / Math.PI <= CONFIG.ROAD_DEG + 0.01; }
function segT(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1; return clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1); }
function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  return `rgb(${Math.round(lerp(a >> 16, b >> 16, t))},${Math.round(lerp(a >> 8 & 255, b >> 8 & 255, t))},${Math.round(lerp(a & 255, b & 255, t))})`;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ===== [SEC:SAVE] =====
const SV = { best: {}, stars: {}, designs: {}, mute: false };
function loadSave() { try { Object.assign(SV, JSON.parse(localStorage.getItem(CONFIG.SAVE_KEY) || '{}')); } catch (e) {} }
function writeSave() { try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(SV)); } catch (e) {} }
function unlocked(i) { return i === 0 || SV.best[i - 1] != null; }
function starsFor(i, c) { const s = CONFIG.STAGES[i].stars; return c <= s[0] ? 3 : c <= s[1] ? 2 : 1; }

// ===== [SEC:AUDIO] =====
let AC = null, MG = null, NOISE = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = SV.mute ? 0 : CONFIG.VOL; MG.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, slide, delay) {
  if (!AC || SV.mute) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, q, type, delay) {
  if (!AC || SV.mute) return;
  if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const SFX = {
  place() { tone(760, 0.07, 'triangle', 0.25, 0.6); noise(0.03, 0.2, 3000, 2, 'bandpass'); },
  bundle() { tone(560, 0.08, 'triangle', 0.25, 0.7); tone(840, 0.08, 'triangle', 0.2, 0.7, 0.05); },
  remove() { tone(320, 0.08, 'triangle', 0.22, 0.6); },
  bad() { tone(170, 0.12, 'square', 0.1); },
  snap() { noise(0.09, 0.6, 2600, 0.8, 'highpass'); tone(1700, 0.05, 'square', 0.14, 0.4); },
  splash() { noise(0.7, 0.55, 900, 0.7, 'lowpass'); noise(0.35, 0.3, 2200, 1, 'bandpass', 0.08); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.25, 1, i * 0.1)); },
  go() { tone(392, 0.09, 'square', 0.1); tone(523, 0.14, 'square', 0.1, 1, 0.09); },
};

// ===== [SEC:STAGE] =====
let ST = null; // いま遊んでいるステージの地形
function makeStage(i) {
  const d = CONFIG.STAGES[i], G = d.gap, RY = d.rightY || 0;
  const solids = [{ x0: -1e4, x1: 0, y0: 0, y1: 1e4 }, { x0: G, x1: 1e4, y0: RY, y1: 1e4 }];
  const anchors = [];
  d.left.forEach(y => anchors.push({ x: 0, y }));
  d.right.forEach(y => anchors.push({ x: G, y: RY + y }));
  (d.pillars || []).forEach(p => { solids.push({ x0: p.x - p.w / 2, x1: p.x + p.w / 2, y0: p.top, y1: 1e4, mill: true }); anchors.push({ x: p.x, y: p.top }); });
  const pot = { x0: -1e4, x1: 1e4, y0: CONFIG.WATER_Y + 140, y1: 1e4 }; // 鍋の底（車が沈みきらないように）
  const view = { x0: -130, x1: G + 130, y0: Math.min(0, RY) - 190, y1: CONFIG.WATER_Y + 40 };
  return { i, d, G, RY, solids, pot, anchors, view, car: Object.assign({ kind: d.car }, CONFIG.CARS[d.car]) };
}
function insideSolid(x, y) { return ST.solids.some(s => x > s.x0 + 0.5 && x < s.x1 - 0.5 && y > s.y0 + 0.5 && y < s.y1 - 0.5); }

// ===== [SEC:DESIGN] =====
// D.nodes：先頭はステージのピン（fix）、後ろが継ぎ目。D.mem：パスタ {a,b,n}（nは束の本数）
let D = null, hist = [];
function newDesign() { return { nodes: ST.anchors.map(a => ({ x: a.x, y: a.y, fix: true })), mem: [] }; }
function pastaCount(d) { return (d || D).mem.reduce((s, m) => s + m.n, 0); }
function packD(d) { const k = ST.anchors.length; return { k, nodes: d.nodes.slice(k).map(n => [Math.round(n.x * 10) / 10, Math.round(n.y * 10) / 10]), mem: d.mem.map(m => [m.a, m.b, m.n]) }; }
function unpackD(p) {
  const d = newDesign();
  if (!p || p.k !== ST.anchors.length) return d;
  p.nodes.forEach(([x, y]) => d.nodes.push({ x, y, fix: false }));
  for (const [a, b, n] of p.mem) { if (a >= d.nodes.length || b >= d.nodes.length) return newDesign(); d.mem.push({ a, b, n }); }
  return d;
}
function saveDesign() { SV.designs[CUR] = packD(D); writeSave(); }
function pushHist() { hist.push(JSON.stringify(D)); if (hist.length > 100) hist.shift(); }
function findMem(a, b) { return D.mem.find(m => (m.a === a && m.b === b) || (m.a === b && m.b === a)); }
function nearNode(x, y, r) { let bi = -1, bd = r; D.nodes.forEach((n, i) => { const d = dist(n.x, n.y, x, y); if (d < bd) { bd = d; bi = i; } }); return bi; }

    if (m.dead) continue;
    const a = P[m.a], b = P[m.b], road = run ? m.road : isRoad(a.x, a.y, b.x, b.y);
    let col = road ? '#e39b2d' : '#f8dd92';
    if (run && m.ratio > 0.4) col = mix(col, '#e2302a', clamp((m.ratio - 0.4) / 0.5, 0, 1));
    const l = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / l, ny = (b.x - a.x) / l, sag = run ? clamp(m.B / m.bl, 0, 1) * 5 : 0;
    for (const pass of [0, 1]) {
      ctx.strokeStyle = pass ? col : '#8a5a17'; ctx.lineWidth = (pass ? 3.6 : 6) * px;
      for (let k = 0; k < m.n; k++) { const o = (k - (m.n - 1) / 2) * 3.4 * px; strand(a.x + nx * o, a.y + ny * o, b.x + nx * o, b.y + ny * o, sag); }
    }
  }
}
function drawNodes(P, M, run, px) {
  const live = new Set(); M.forEach(m => { if (!m.dead) { live.add(m.a); live.add(m.b); } });
  P.forEach((n, i) => {
    if (n.fix) {
      const hot = drag && drag.ai === i;
      ctx.fillStyle = hot ? '#ffd34d' : '#d5dbe0'; ctx.strokeStyle = INK; ctx.lineWidth = 2 * px;
      ctx.beginPath(); ctx.arc(n.x, n.y, 7 * px, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(n.x - 2 * px, n.y - 2 * px, 2 * px, 0, Math.PI * 2); ctx.fill();
    } else if (live.has(i)) {
      ctx.fillStyle = drag && drag.ai === i ? '#ffd34d' : '#fff3d6'; ctx.strokeStyle = INK; ctx.lineWidth = 2 * px;
      ctx.beginPath(); ctx.arc(n.x, n.y, 4.5 * px, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  });
}
function drawDebris(px) {
  ctx.lineCap = 'round';
  for (const d of SIM.debris) {
    const c = Math.cos(d.ang) * d.len / 2, s = Math.sin(d.ang) * d.len / 2;
    ctx.strokeStyle = '#8a5a17'; ctx.lineWidth = (6 + (d.n - 1) * 3) * px; strand(d.x - c, d.y - s, d.x + c, d.y + s, 0);
    ctx.strokeStyle = '#f2cf72'; ctx.lineWidth = (3.6 + (d.n - 1) * 3) * px; strand(d.x - c, d.y - s, d.x + c, d.y + s, 0);
  }
}
function drawCar(rx, ry, fx, fy, spin, px) {
  const c = ST.car, b = c.base, r = c.r;
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(Math.atan2(fy - ry, fx - rx));
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5 * px; ctx.lineJoin = 'round';
  const win = '#bfe3f2';
  if (c.kind === 'mini') {
    ctx.fillStyle = c.body; ctx.beginPath(); ctx.moveTo(b * 0.12, -r * 1.7); ctx.quadraticCurveTo(b * 0.2, -r * 3.1, b * 0.5, -r * 3.1); ctx.quadraticCurveTo(b * 0.85, -r * 3.1, b * 0.92, -r * 1.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = win; ctx.beginPath(); ctx.moveTo(b * 0.52, -r * 1.85); ctx.lineTo(b * 0.52, -r * 2.85); ctx.quadraticCurveTo(b * 0.78, -r * 2.85, b * 0.84, -r * 1.85); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.body; rr(-r * 1.2, -r * 1.9, b + r * 2.4, r * 1.35, r * 0.6); ctx.fill(); ctx.stroke();
  } else if (c.kind === 'truck') {
    ctx.fillStyle = '#fff'; rr(-r * 1.1, -r * 3.6, b * 0.62 + r * 1.1, r * 2.7, 3 * px); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.body; ctx.fillRect(-r * 1.1, -r * 2.2, b * 0.62 + r * 1.1, r * 0.5); ctx.strokeRect(-r * 1.1, -r * 2.2, b * 0.62 + r * 1.1, r * 0.5);
    ctx.fillStyle = c.body; rr(b * 0.64, -r * 3.0, b * 0.36 + r * 1.2, r * 2.1, r * 0.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = win; rr(b * 0.8, -r * 2.75, b * 0.2 + r * 0.7, r * 0.8, r * 0.25); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#555'; ctx.fillRect(-r * 1.1, -r * 0.95, b + r * 2.2, r * 0.4);
  } else {
    ctx.fillStyle = '#d97f16'; ctx.beginPath(); ctx.moveTo(-r * 1.3, -r * 3.6); ctx.lineTo(b * 0.62, -r * 3.6); ctx.lineTo(b * 0.58, -r * 1.0); ctx.lineTo(-r * 0.6, -r * 1.0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8b6b4a'; ctx.beginPath(); ctx.moveTo(-r * 1.1, -r * 3.6); ctx.quadraticCurveTo(b * 0.25, -r * 4.6, b * 0.6, -r * 3.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.body; rr(b * 0.66, -r * 2.9, b * 0.34 + r * 1.2, r * 2.0, r * 0.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = win; rr(b * 0.8, -r * 2.65, b * 0.2 + r * 0.7, r * 0.75, r * 0.25); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#555'; ctx.fillRect(-r * 1.0, -r * 1.0, b + r * 2.1, r * 0.4);
  }
  for (const x of [0, b]) {
    ctx.fillStyle = '#2b2622'; ctx.beginPath(); ctx.arc(x, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d9d9d9'; ctx.beginPath(); ctx.arc(x, 0, r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2b2622'; ctx.lineWidth = 2 * px; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + Math.cos(spin) * r * 0.45, Math.sin(spin) * r * 0.45); ctx.stroke(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5 * px;
  }
  ctx.restore();
}
function drawPreview(px) {
  const p = drag.p, a = D.nodes[drag.ai];
  ctx.setLineDash([6 * px, 6 * px]); ctx.strokeStyle = 'rgba(58,42,30,.28)'; ctx.lineWidth = 2 * px;
  ctx.beginPath(); ctx.arc(a.x, a.y, CONFIG.PASTA_LEN, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.lineCap = 'round';
  ctx.strokeStyle = p.ok ? '#8a5a17' : 'rgba(200,40,30,.6)'; ctx.lineWidth = 6 * px; strand(a.x, a.y, p.ex, p.ey, 0);
  ctx.strokeStyle = p.ok ? (p.road ? '#e39b2d' : '#f8dd92') : 'rgba(255,170,160,.8)'; ctx.lineWidth = 3.6 * px; strand(a.x, a.y, p.ex, p.ey, 0);
  ctx.fillStyle = p.ok ? '#ffd34d' : '#e2302a'; ctx.strokeStyle = INK; ctx.lineWidth = 2 * px;
  ctx.beginPath(); ctx.arc(p.ex, p.ey, 6 * px, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
function updFx(dt) {
  SHAKE = Math.max(0, SHAKE - dt * 30);
  if (ST && Math.random() < dt * 5) FX.push({ k: 'steam', x: Math.random() * ST.G, y: CONFIG.WATER_Y - 10, vx: (Math.random() - 0.5) * 10, vy: -25 - Math.random() * 20, life: 3, max: 3, r: 10 + Math.random() * 10 });
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i]; f.life -= dt;
    if (f.life <= 0) { FX.splice(i, 1); continue; }
    if (f.k !== 'steam' && f.k !== 'conf') f.vy += CONFIG.GRAVITY * dt;
    if (f.k === 'conf') { f.a += dt * 6; f.vx = Math.sin(f.a) * 60; }
    f.x += f.vx * dt; f.y += f.vy * dt;
  }
}
function drawFx(px) {
  for (const f of FX) {
    const t = f.life / f.max;
    if (f.k === 'steam') { ctx.fillStyle = `rgba(255,255,255,${0.35 * Math.sin(t * Math.PI)})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (2 - t), 0, Math.PI * 2); ctx.fill(); }
    else if (f.k === 'drop') { ctx.fillStyle = `rgba(150,200,220,${t})`; ctx.beginPath(); ctx.arc(f.x, f.y, 4 * px + 2, 0, Math.PI * 2); ctx.fill(); }
    else if (f.k === 'crumb') { ctx.fillStyle = '#f2cf72'; ctx.fillRect(f.x - 2, f.y - 2, 4, 4); }
    else if (f.k === 'conf') { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a); ctx.fillStyle = f.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
  }
}

// ===== [SEC:INPUT] =====
let drag = null, tap = null;
function toWorld(e) { return { x: (e.clientX - VIEW.ox) / VIEW.sc, y: (e.clientY - VIEW.oy) / VIEW.sc }; }
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (mode !== 'build' || drag) return;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  const w = toWorld(e), ni = nearNode(w.x, w.y, CONFIG.SNAP_PX / VIEW.sc);
  if (ni >= 0) drag = { id: e.pointerId, ai: ni, sx: e.clientX, sy: e.clientY, moved: false, p: null };
  else tap = { id: e.pointerId, mi: nearMem(w.x, w.y, CONFIG.TAP_PX / VIEW.sc), sx: e.clientX, sy: e.clientY };
});
cv.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) {
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
    if (drag.moved) { const w = toWorld(e); drag.p = plan(drag.ai, w.x, w.y); }
  } else if (tap && e.pointerId === tap.id && Math.hypot(e.clientX - tap.sx, e.clientY - tap.sy) > 10) tap.moved = true;
});
function pointerEnd(e) {
  if (drag && e.pointerId === drag.id) {
    const p = drag.p, moved = drag.moved; drag = null;
    if (!moved && e.type === 'pointerup') { // 継ぎ目の近くでも、パスタのまん中をタップしたら1本へらす
      const w = toWorld(e), mi = nearMem(w.x, w.y, CONFIG.TAP_PX / VIEW.sc), r = 8 / VIEW.sc;
      if (mi >= 0) { const m = D.mem[mi], a = D.nodes[m.a], b = D.nodes[m.b]; if (dist(a.x, a.y, w.x, w.y) > r && dist(b.x, b.y, w.x, w.y) > r) removePasta(mi); }
    }
    if (p && p.ok) { hideHint(); addPasta(p); }
    else if (p) { SFX.bad(); showHint({ short: 'もっと長く引っぱろう', solid: 'まな板の中には置けません', water: '鍋の中には置けません', same: '同じ岸のピンどうしはつなげません', bundle: `束ねられるのは${CONFIG.MAX_BUNDLE}本までです`, max: `置けるのは${CONFIG.MAX_PASTA}本までです` }[p.why]); }
  } else if (tap && e.pointerId === tap.id) {
    if (tap.moved) showHint('ピン（丸い点）から引っぱろう');
    else if (tap.mi >= 0 && e.type === 'pointerup') removePasta(tap.mi);
    tap = null;
  }
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ===== [SEC:UI] =====
let mode = 'title', CUR = 0, hintTimer = 0;
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function showHint(t, sec) { const h = $('hint'); h.textContent = t; h.style.opacity = 1; show('hint', true); clearTimeout(hintTimer); if (sec !== 0) hintTimer = setTimeout(hideHint, (sec || 2.6) * 1000); }
function hideHint() { $('hint').style.opacity = 0; }
function muteLabel() { $('muteBtn').classList.toggle('off', SV.mute); }
function updHud() {
  const st = CONFIG.STAGES[CUR], best = SV.best[CUR];
  $('stName').textContent = `${CUR + 1}. ${st.name}`;
  $('stGoal').textContent = `★3：${st.stars[0]}本以下　ベスト：${best != null ? best + '本' : 'まだ'}`;
  $('cntN').textContent = pastaCount();
  const run = mode !== 'build';
  show('undoBtn', !run); show('clearBtn', !run); show('testBtn', !run); show('stopBtn', mode === 'run');
  $('undoBtn').disabled = !hist.length; $('clearBtn').disabled = !D.mem.length;
}
function goTitle() {
  mode = 'title'; SIM = null; ST = makeStage(1); D = unpackD(DEMO);
  show('title', true); show('select', false); show('hud', false); show('result', false);
  fitView();
}
function goSelect() {
  mode = 'select'; SIM = null;
  show('title', false); show('select', true); show('hud', false); show('result', false);
  const ul = $('stList'); ul.innerHTML = '';
  let total = 0;
  CONFIG.STAGES.forEach((st, i) => {
    const li = document.createElement('li'), b = document.createElement('button'), open = unlocked(i), best = SV.best[i], s = SV.stars[i] || 0;
    total += s;
    b.className = 'stg' + (open ? '' : ' lock');
    b.innerHTML = `<span class="no">STAGE ${i + 1}</span><span class="nm">${open ? st.name : '？？？'}</span><span class="cr">${open ? CONFIG.CARS[st.car].name : ''}</span>` +
      `<span class="rec">${!open ? '🔒' : best != null ? `${best}本 <span class="st">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</span>` : 'まだ'}</span>`;
    if (open) b.onclick = () => { audioInit(); startStage(i); };
    li.appendChild(b); ul.appendChild(li);
  });
  $('selStars').textContent = `★ ${total} / ${CONFIG.STAGES.length * 3}`;
  show('rotTip', SH > SW && SW < 600);
}
function startStage(i) {
  CUR = i; ST = makeStage(i); D = unpackD(SV.designs[i]); hist = []; SIM = null; drag = null; tap = null; mode = 'build';
  show('title', false); show('select', false); show('result', false); show('hud', true);
  fitView(); updHud();
  const st = CONFIG.STAGES[i];
  showHint(st.note || '濃い色のパスタが、車の走れる道', 4.5);
}
function test() {
  if (!D.mem.length) { SFX.bad(); showHint('まずパスタを置こう'); return; }
  drag = null; SIM = buildSim(D); mode = 'run'; acc = 0; updHud(); SFX.go();
  showHint('赤くなったパスタは、折れそう', 2.5);
}
function stopTest() { SIM = null; mode = 'build'; updHud(); hideHint(); }
function onSimEnd() {
  mode = 'result'; updHud(); hideHint();
  const ok = SIM.result === 'goal', c = pastaCount(), st = CONFIG.STAGES[CUR], prev = SV.best[CUR];
  const row1 = $('rRow1'), row2 = $('rRow2'); row1.innerHTML = ''; row2.innerHTML = '';
  const btn = (row, cls, txt, fn) => { const b = document.createElement('button'); b.className = cls; b.textContent = txt; b.onclick = fn; row.appendChild(b); };
  $('rHead').className = ok ? '' : 'ng';
  if (ok) {
    const s = starsFor(CUR, c), isBest = prev == null || c < prev;
    if (isBest) SV.best[CUR] = c;
    SV.stars[CUR] = Math.max(SV.stars[CUR] || 0, s); writeSave(); updHud();
    $('rHead').textContent = 'わたれた！';
    $('rBig').innerHTML = `パスタ <b>${c}</b> 本`;
    $('rStars').innerHTML = '★'.repeat(s) + `<i>${'★'.repeat(3 - s)}</i>`;
    $('rSub').innerHTML = (isBest && prev != null ? `<b>自己ベスト更新！</b>（前は${prev}本）<br>` : `ベスト：${SV.best[CUR]}本<br>`) +
      (s < 3 ? `★3は<b>${st.stars[0]}本以下</b>。まだ減らせる？` : 'パスタの使い方の達人です。');
    btn(row1, 'sml', 'もっと減らす', backToBuild);
    if (CUR + 1 < CONFIG.STAGES.length) btn(row1, 'go', 'つぎへ ›', () => startStage(CUR + 1));
    btn(row2, 'sml', 'Xでシェア', () => share(c, s));
  } else {
    const wet = SIM.result === 'water';
    $('rHead').textContent = wet ? 'ゆでられた…' : '立ち往生…';
    $('rBig').textContent = ''; $('rStars').textContent = '';
    $('rSub').innerHTML = wet ? (SIM.broken ? `パスタが${SIM.broken}か所折れて、鍋にドボン。<br>車はアルデンテにゆで上がりました。` : '道がとぎれていました。<br>車は濃い色のパスタの上だけを走れます。')
      : '坂が急すぎるか、道がとぎれているかも。<br>道になるのは30°までの坂だけ。';
    btn(row1, 'go', 'なおす', backToBuild);
  }
  btn(row2, 'sml', 'ステージ選択', goSelect);
  show('result', true); $('result').scrollTop = 0;
  ads('ad1');
}
function backToBuild() { show('result', false); stopTest(); }
function share(c, s) {
  const st = CONFIG.STAGES[CUR];
  const txt = `パスタブリッジ ステージ${CUR + 1}「${st.name}」を、パスタ${c}本でわたった！ ${'★'.repeat(s)}${'☆'.repeat(3 - s)}\n#パスタブリッジ`;
  open('https://x.com/intent/post?text=' + encodeURIComponent(txt) + '&url=' + encodeURIComponent(CONFIG.URL), '_blank', 'noopener');
}
function ads(id) { const z = $(id); if (!z || z.firstChild || !/(^|\.)nkworks-games\.com$/.test(location.hostname)) return; z.innerHTML = '<ins class="adsbygoogle" data-ad-client="ca-pub-2073267239630350" data-ad-slot="6261635446"></ins>'; try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {} }
$('startBtn').onclick = () => { audioInit(); goSelect(); };
$('selBack').onclick = goTitle;
$('backBtn').onclick = () => { stopTest(); goSelect(); };
$('undoBtn').onclick = undo;
$('clearBtn').onclick = clearAll;
$('testBtn').onclick = () => { audioInit(); test(); };
$('stopBtn').onclick = stopTest;
$('muteBtn').onclick = () => { SV.mute = !SV.mute; writeSave(); muteLabel(); audioInit(); if (MG) MG.gain.value = SV.mute ? 0 : CONFIG.VOL; };

// ===== [SEC:LOOP] =====
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; TIME += dt;
  if (mode === 'title') { // タイトルの飾り：車がくり返しわたる
    if (!SIM || SIM.done) { SIM = buildSim(D); SIM.quiet = true; }
    stepSim(SIM, Math.min(dt, 1 / 30));
  } else if (mode === 'run' && SIM) {
    acc += dt;
    while (acc >= 1 / 60 && !SIM.done) { stepSim(SIM, 1 / 60); acc -= 1 / 60; }
    if (SIM.done) onSimEnd();
  }
  updFx(dt); draw();
}

// ===== [SEC:TEST] =====
// 開発用：window.__PB.sim(ステージ番号, {nodes:[[x,y],...], mem:[[a,b,n],...]}) で画面なしに走らせる（a,bはピンが先の通し番号）
const DEMO = { k: 6, nodes: [[120, 0]], mem: [[0, 6, 1], [6, 3, 1], [1, 6, 1]] }; // タイトル画面の飾りの橋（ステージ2）
window.__PB = {
  sim(i, p) {
    const keep = { ST, D, CUR }; CUR = i; ST = makeStage(i); D = unpackD(Object.assign({ k: ST.anchors.length }, p));
    const S = buildSim(D); S.quiet = true;
    while (!S.result) stepSim(S, 1 / 60);
    const out = { result: S.result, t: +S.t.toFixed(2), count: pastaCount(D), broken: S.broken, peak: S.M.map(m => +m.peak.toFixed(2)) };
    ST = keep.ST; D = keep.D; CUR = keep.CUR;
    return out;
  },
};

// ===== [SEC:BOOT] =====
loadSave(); muteLabel();
if (document.fonts) document.fonts.ready.then(() => { if (ST) fitView(); });
addEventListener('resize', resize);
resize(); goTitle();
requestAnimationFrame(frame);
</script>
