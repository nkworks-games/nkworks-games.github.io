function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function reader(u) { let p = 0; return () => { let n = 0, m = 1, b; do { b = u[p++]; n += (b & 127) * m; m *= 128; } while (b & 128); return n; }; }
// 表示用：県のかたち（3D空間の形。シェイプの点は (x, -y)。km×U）と、日本の範囲（km）
const PREF = []; let LX0 = 1e9, LY0 = 1e9, LX1 = -1e9, LY1 = -1e9;
{
  const vu = reader(b64(DATA.poly)), vs = () => { const n = vu(); return n & 1 ? -(n + 1) / 2 : n / 2; };
  for (let i = 0; i < 47; i++) {
    const shapes = [], rings = [], np = vu();
    for (let j = 0; j < np; j++) {
      const nr = vu(); let sh = null;
      for (let k = 0; k < nr; k++) {
        const nv = vu(); let x = 0, y = 0; const pts = [];
        for (let v = 0; v < nv; v++) {
          x += vs(); y += vs(); const X = x / 2, Y = y / 2;
          pts.push(new THREE.Vector2(X * CONFIG.U, -Y * CONFIG.U));
          if (k === 0) { LX0 = Math.min(LX0, X); LX1 = Math.max(LX1, X); LY0 = Math.min(LY0, Y); LY1 = Math.max(LY1, Y); }
        }
        rings.push(pts);
        if (k === 0) { sh = new THREE.Shape(pts); shapes.push(sh); } else sh.holes.push(new THREE.Path(pts));
      }
    }
    PREF.push({ shapes, rings });
  }
}
// 計算用：3km四方のマス（正積図法なので、どのマスも同じ広さ）
const GD = DATA.grid, CS = GD.cs;
let CX, CY, CM, CP, NC;
const prefCells = new Int32Array(47), muniCells = new Int32Array(DATA.mpref.length);
{
  const vu = reader(b64(GD.rle)), xs = [], ys = [], ms = [];
  for (let r = 0; r < GD.h; r++) {
    const k = vu(); let last = 0;
    for (let j = 0; j < k; j++) {
      const s = last + vu(), l = vu(), m = vu(); last = s + l;
      for (let c = s; c < s + l; c++) { xs.push(GD.x0 + (c + 0.5) * CS); ys.push(GD.y0 + (r + 0.5) * CS); ms.push(m); }
    }
  }
  NC = xs.length; CX = Float32Array.from(xs); CY = Float32Array.from(ys); CM = Uint16Array.from(ms); CP = new Uint8Array(NC);
  for (let i = 0; i < NC; i++) { CP[i] = DATA.mpref[CM[i]]; prefCells[CP[i]]++; muniCells[CM[i]]++; }
}
// 「人のいる所に多いもの」（お店・学校など d:1 のお題）用。県ごとの人口（地図にマスがある市区町村の合計）
const prefPop = new Float64Array(47); for (let m = 0; m < muniCells.length; m++) if (muniCells[m]) prefPop[DATA.mpref[m]] += DATA.mpop[m];
const POPW = new Set(THEMES.filter(t => t.d).map(t => t.k));
const WC = {};
function weights(k) { // お題ごとの「マスの重さ」（全部足すと1）。人口は市区町村ごと、ほかは県の中で均等（d:1 のお題は県の中を人口の分布で配る）
  if (WC[k]) return WC[k];
  const w = new Float64Array(NC); let tot = 0;
  const v = DATA.themes[k];
  if (k === 'pop') for (let i = 0; i < NC; i++) w[i] = DATA.mpop[CM[i]] / muniCells[CM[i]];
  else if (k.startsWith('c_')) for (let i = 0; i < NC; i++) w[i] = DATA.mpop[CM[i]] / muniCells[CM[i]] * v[CP[i]]; // 消費量＝人の分布 × 1世帯あたりの量
  else if (POPW.has(k)) for (let i = 0; i < NC; i++) w[i] = DATA.mpop[CM[i]] / muniCells[CM[i]] * v[CP[i]] / prefPop[CP[i]];   // 県の合計を、県の中の人口の分布で配る
  else for (let i = 0; i < NC; i++) w[i] = v[CP[i]] / prefCells[CP[i]];
  for (let i = 0; i < NC; i++) tot += w[i];
  const idx = [], dens = new Float64Array(47); let dm = 0; // dens：県ごとの濃さ（答え合わせの色の濃さ）
  for (let i = 0; i < NC; i++) { w[i] /= tot; if (w[i] > 0) idx.push(i); dens[CP[i]] += w[i]; }
  for (let p = 0; p < 47; p++) { dens[p] /= Math.max(1, prefCells[p]); dm = Math.max(dm, dens[p]); }
  for (let p = 0; p < 47; p++) dens[p] = dm ? dens[p] / dm : 0;
  return (WC[k] = { w, idx: Int32Array.from(idx), dens });
}
// 重心（km）。w は全部足すと1
const COMC = {};
function com(k) {
  if (COMC[k]) return COMC[k];
  const { w } = weights(k); let x = 0, y = 0;
  for (let i = 0; i < NC; i++) { x += w[i] * CX[i]; y += w[i] * CY[i]; }
  return (COMC[k] = { x, y });

    if (G.cam.pos.y < 0.5) v.push('カメラが床の下');
    if (stick.visible && G.mk && Math.hypot(G.cam.pos.x - G.mk.x * U, G.cam.pos.z - G.mk.y * U) < RK[Math.min(G.stage, RK.length - 1)] * U && G.cam.pos.y < PH) v.push('カメラが棒の中');
    if (G.total < 0 || G.total > CONFIG.Q_COUNT * 100 || G.total !== G.res.reduce((s, r) => s + r.p, 0)) v.push('点数がおかしい');
    if (G.tl > CONFIG.Q_TIME || G.tl < 0) v.push('残り時間がおかしい');
    if (G.th < -1e-6 || G.th > 1.4) v.push('傾きがおかしい ' + G.th);
    return v;
  },
  ready: true,
};
