<style>
/* ===== [SEC:STYLE] ===== */
:root { --red:#e8384f; --yellow:#ffd23f; --panel:rgba(8,16,34,.78); --line:rgba(255,255,255,.14); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:#050b18; color:#fff;

#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.hidden { display:none !important; }
#labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
.lbl { position:absolute; left:0; top:0; white-space:nowrap; font-size:12px; font-weight:800; color:#fff;
  text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8); display:flex; align-items:center; gap:4px; transition:opacity .2s; }
.lbl::before { content:''; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.6); }
.lbl.truth { font-size:14px; color:#2a1d00; background:var(--yellow); padding:3px 10px; border-radius:999px; text-shadow:none; box-shadow:0 2px 8px rgba(0,0,0,.5); }
.lbl.truth::before { display:none; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:18px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 6px 24px rgba(0,0,0,.35); }

#hud { position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 10px);
  width:min(620px, calc(100% - 20px)); display:flex; align-items:center; gap:12px; padding:8px 14px; }
.q-no { font-weight:800; font-size:26px; line-height:1; min-width:46px; }
.q-no small { font-size:13px; opacity:.6; margin-left:2px; }
.q-main { flex:1; min-width:0; }
#qPlace { font-weight:800; font-size:20px; line-height:1.2; }
.q-msg { font-size:12px; opacity:.88; }
.q-msg b { color:#ff7a87; }
.q-score { text-align:right; font-weight:800; font-size:20px; line-height:1.05; }
.q-score small { display:block; font-size:10px; opacity:.6; letter-spacing:.08em; }

#legend { position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 84px);
  display:flex; gap:14px; font-size:12px; font-weight:800; padding:6px 14px; border-radius:999px; background:rgba(8,16,34,.6); width:max-content; white-space:nowrap; }
#legend i { display:inline-block; width:14px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }

.bottom { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:min(560px, calc(100% - 20px)); padding:12px 16px 12px; }
.slider-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.s-ico { font-weight:800; font-size:13px; opacity:.85; width:18px; text-align:center; }
.s-ico.big { font-size:19px; }
input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:30px; background:transparent; margin:0; touch-action:none; }
input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:99px; background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,122,135,.85)); }
input[type=range]::-moz-range-track { height:8px; border-radius:99px; background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,122,135,.85)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:30px; margin-top:-11px; border-radius:50%;
  background:radial-gradient(circle,var(--red) 0 38%,#fff 40%); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer; }
input[type=range]::-moz-range-thumb { width:30px; height:30px; border:none; border-radius:50%;
  background:radial-gradient(circle,var(--red) 0 38%,#fff 40%); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer; }
.hint { text-align:center; font-size:11px; opacity:.6; margin-top:7px; }

.btn { display:block; width:100%; border:none; border-radius:999px; padding:13px 0; font:inherit; font-weight:800; font-size:18px;

<script type="module">
// ===== [SEC:IMPORTS] =====
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { geoEquirectangular, geoAzimuthalEquidistant, geoPath, geoArea, geoBounds, geoCentroid, geoDistance, geoGraticule10 } from 'd3-geo';
import { feature, mesh } from 'topojson-client';

const C = window.CONFIG;
const R_KM = 6371, DEG = Math.PI / 180;
const V3 = THREE.Vector3;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);

// ===== [SEC:GEO] =====
// 緯度経度 → 地球儀上の位置（半径1が地球）
function llToVec(lat, lon, r = 1, out = new V3()) {
  const phi = (90 - lat) * DEG, th = (lon + 180) * DEG;
  return out.set(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}
const _Y = new V3(0, 1, 0);
// 地点Aでの「北向き」「東向き」
function frameAt(A, N, E) {
  N.copy(_Y).addScaledVector(A, -A.dot(_Y));
  if (N.lengthSq() < 1e-10) N.set(1, 0, 0);
  N.normalize();
  E.crossVectors(N, A).normalize();
}
// 地点Aから、東にx km・北にy km（s倍）の点を地球の上に置く（向き＝北が上、面積は本物どおり）
function placeLocal(A, N, E, x, y, s, r, out) {
  const dx = x * s, dy = y * s, d = Math.hypot(dx, dy);
  if (d < 1e-9) return out.copy(A).multiplyScalar(r);
  const del = d / R_KM, sd = Math.sin(del) / d, cd = Math.cos(del);
  return out.set(
    (A.x * cd + (N.x * dy + E.x * dx) * sd) * r,
    (A.y * cd + (N.y * dy + E.y * dx) * sd) * r,
    (A.z * cd + (N.z * dy + E.z * dx) * sd) * r);
}
function slerpDir(a, b, t, out) {
  const q = new THREE.Quaternion().setFromUnitVectors(a, b);
  const qt = new THREE.Quaternion().slerp(q, t);
  return out.copy(a).applyQuaternion(qt);
}

// ===== [SEC:SCENE] =====
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.colors.space);
const camera = new THREE.PerspectiveCamera(C.fov, 1, 0.05, 300);
scene.add(camera);
const liftables = [], lineMats = []; // 近づいた時に浮かせ具合を変える物 / 線の太さを画面に合わせる物
scene.add(new THREE.AmbientLight(0xffffff, C.light.ambient));
const sun = new THREE.DirectionalLight(0xffffff, C.light.sun);
sun.position.set(-1.2, 1.4, 2.0);
camera.add(sun);

const globeMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 6, specular: 0x111111 });
const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), globeMat);
scene.add(globe);

const atmo = new THREE.Mesh(new THREE.SphereGeometry(C.atmo.radius, 96, 64), new THREE.ShaderMaterial({
  uniforms: { col: { value: new THREE.Color(C.colors.atmo) }, strength: { value: C.atmo.strength } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 col; uniform float strength; varying vec3 vN; varying vec3 vV;
    void main(){ float x = clamp(-dot(normalize(vN), normalize(vV)), 0.0, 1.0);
      float a = pow(smoothstep(0.0, 0.38, x), 3.0) * strength; gl_FragColor = vec4(col, a); }`,
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(atmo);

{ // 星
  const n = 1800, p = new Float32Array(n * 3), v = new V3();
  for (let i = 0; i < n; i++) { v.randomDirection().multiplyScalar(90 + Math.random() * 80); p[i * 3] = v.x; p[i * 3 + 1] = v.y; p[i * 3 + 2] = v.z; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0.7 })));
}

// ===== [SEC:MAPDATA] =====
const isCoarse = matchMedia('(pointer:coarse)').matches;
const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);

function buildGlobeTexture(countries) {
  const want = (isCoarse || isSafari) ? C.texSizeMobile : C.texSize;
  const W = Math.min(want, renderer.capabilities.maxTextureSize), H = W / 2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = C.colors.ocean; ctx.fillRect(0, 0, W, H);
  const proj = geoEquirectangular().scale(W / (2 * Math.PI)).translate([W / 2, H / 2]).precision(0.1);
  const path = geoPath(proj, ctx);
  ctx.beginPath(); path(geoGraticule10()); ctx.strokeStyle = C.colors.graticule; ctx.lineWidth = W / 4096; ctx.stroke();
  ctx.beginPath(); path(countries); ctx.fillStyle = C.colors.land; ctx.fill();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function addMeshLines(ml, color, opacity, r, order) {
  const arr = [], a = new V3(), b = new V3();
  for (const line of ml.coordinates) {
    for (let i = 0; i < line.length - 1; i++) {
      const [lon1, lat1] = line[i], [lon2, lat2] = line[i + 1];
      if (Math.abs(lon1) > 179.9 && Math.abs(lon2) > 179.9) continue; // 日付変更線の切れ目
      if (lat1 < -89.9 || lat2 < -89.9) continue;
      llToVec(lat1, lon1, r, a); llToVec(lat2, lon2, r, b);
      arr.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  l.renderOrder = order;
  scene.add(l);
  liftables.push({ obj: l, r0: r });
}

// 三角形を地球の丸みに沿うよう細かく分ける（共有する辺は同じように分けるので隙間ができない）
function subdivide(vx, idx, maxE) {
  const cache = new Map();
  const mid = (a, b) => {
    const k = a < b ? a * 1e6 + b : b * 1e6 + a;
    let m = cache.get(k);
    if (m === undefined) { m = vx.length / 2; vx.push((vx[2 * a] + vx[2 * b]) / 2, (vx[2 * a + 1] + vx[2 * b + 1]) / 2); cache.set(k, m); }
    return m;
  };
  const long = (a, b) => Math.hypot(vx[2 * a] - vx[2 * b], vx[2 * a + 1] - vx[2 * b + 1]) > maxE;
  let tris = idx;
  for (let guard = 0; guard < 16; guard++) {
    let changed = false; const out = [];
    for (let i = 0; i < tris.length; i += 3) {
      const a = tris[i], b = tris[i + 1], c = tris[i + 2];
      const lab = long(a, b), lbc = long(b, c), lca = long(c, a), n = lab + lbc + lca;
      if (!n) { out.push(a, b, c); continue; }
      changed = true;
      if (n === 3) {
        const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
        out.push(a, ab, ca, ab, b, bc, ca, bc, c, ab, bc, ca);
      } else if (n === 1) {
        const [p, q, r] = lab ? [a, b, c] : lbc ? [b, c, a] : [c, a, b];
        const m = mid(p, q); out.push(p, m, r, m, q, r);
      } else {
        const [p, q, r] = !lca ? [a, b, c] : !lab ? [b, c, a] : [c, a, b];
        const m1 = mid(p, q), m2 = mid(q, r);
        out.push(m1, q, m2, p, m1, m2, p, m2, r);
      }
    }
    tris = out;
    if (!changed) break;
  }
  return tris;
}

// ===== [SEC:DATASET] =====
// 地図データ（50m=日本モード・地球全体用 / 10m=北海道モード用）を島ごとに分け、場所の範囲で絞りこめるようにする
const datasets = {};
function makeItem(key, geo) {
  const c = geoCentroid(geo); let r = 0;
  const visit = (p) => { const d = geoDistance(c, p); if (d > r) r = d; };
  if (geo.type === 'LineString') geo.coordinates.forEach(visit); else geo.coordinates.forEach((ring) => ring.forEach(visit));
  return { key, geo, c, r };
}
function prepDataset(world) {
  const countries = feature(world, world.objects.countries), items = [];
  for (const f of countries.features) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    polys.forEach((p, i) => {
      const geo = { type: 'Polygon', coordinates: p };
      if (geoArea(geo) <= 2 * Math.PI) items.push(makeItem(f.id + ':' + i, geo)); // 向きが壊れた小島（地球全体を塗ってしまう）を除く
    });
  }
  const borders = mesh(world, world.objects.countries, (a, b) => a !== b).coordinates
    .map((line) => makeItem(null, { type: 'LineString', coordinates: line }));
  return { world, countries, items, borders };
}
function loadDataset(name) {
  return datasets[name] || (datasets[name] = fetch(name === '10m' ? C.mapDataUrlHi : C.mapDataUrl)
    .then((res) => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(prepDataset)
    .catch((err) => { delete datasets[name]; throw err; }));
}
function inBoxGeo(geo, b) { const bb = geoBounds(geo); return bb[0][0] >= b[0] && bb[1][0] <= b[2] && bb[0][1] >= b[1] && bb[1][1] <= b[3]; }
// 日本（北海道）にあたる島を選ぶ
function subjectItems(ds, md) {
  const inBox = (geo, b) => { const bb = geoBounds(geo); return bb[0][0] >= b[0] && bb[1][0] <= b[2] && bb[0][1] >= b[1] && bb[1][1] <= b[3]; };
  return ds.items.filter((it) => {
    if (it.key.startsWith('392:')) return !md.box || inBox(it.geo, md.box);
    if (C.includeNorthernTerritories && it.key.startsWith('643:')) return inBox(it.geo, C.northernTerritoriesBox);
    return false;
  });
}

// 日本・北海道・琵琶湖の形を「真ん中から東へ何km・北へ何km」の形にしておく
function buildSubjectModel(polys, k = 1) {
  const [anchorLon, anchorLat] = geoCentroid({ type: 'MultiPolygon', coordinates: polys });
  const A = llToVec(anchorLat, anchorLon), N = new V3(), E = new V3(); frameAt(A, N, E);
  const P = new V3(), T = new V3();
  const toLocal = ([lon, lat]) => {
    llToVec(lat, lon, 1, P);
    const cd = clamp(A.dot(P), -1, 1), del = Math.acos(cd);
    T.copy(P).addScaledVector(A, -cd);
    const tl = T.length(); if (tl < 1e-12) return [0, 0];
    T.divideScalar(tl);
    return [T.dot(E) * del * R_KM * k, T.dot(N) * del * R_KM * k];
  };
  return modelFromLocal(polys.map((poly) => poly.map((ring) => ring.map(toLocal))), anchorLat, anchorLon);
}
// 「東へx km・北へy km」の形から、塗り（三角形）と線を作る
function modelFromLocal(localPolys, anchorLat, anchorLon) {
  const seg = [], vx = [], idx = [];
  for (const poly of localPolys) {
    const rings = poly.map((r0) => {
      const r = r0.slice(), f = r[0], l = r[r.length - 1];
      if (r.length > 1 && Math.abs(f[0] - l[0]) < 1e-9 && Math.abs(f[1] - l[1]) < 1e-9) r.pop();
      return r;
    });
    for (const r of rings) for (let i = 0; i < r.length; i++) { const p = r[i], q = r[(i + 1) % r.length]; seg.push(p[0], p[1], q[0], q[1]); }
    const contour = rings[0].map((p) => new THREE.Vector2(p[0], p[1]));
    const holes = rings.slice(1).map((r) => r.map((p) => new THREE.Vector2(p[0], p[1])));
    const faces = THREE.ShapeUtils.triangulateShape(contour, holes);
    const base = vx.length / 2;
    for (const v of contour) vx.push(v.x, v.y);
    for (const h of holes) for (const v of h) vx.push(v.x, v.y);
    for (const f of faces) idx.push(base + f[0], base + f[1], base + f[2]);
  }
  const tris = subdivide(vx, idx, C.fillMaxEdgeKm);
  let maxY = 0; for (let i = 1; i < seg.length; i += 2) maxY = Math.max(maxY, seg[i]);
  return { anchorLat, anchorLon, maxY, seg: new Float32Array(seg), vx: new Float32Array(vx), idx: tris };
}

// ===== [SEC:JAPAN_OVERLAY] =====
class JapanOverlay {
  constructor(model, o) {
    this.model = model;
    this.pos = new Float32Array((model.vx.length / 2) * 3);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setIndex(model.idx);
    this.fillBase = o.fillOpacity; this.lineBase = o.lineOpacity ?? 1; this.op = 1;
    const fp = { color: o.fillColor, transparent: true, opacity: o.fillOpacity, side: THREE.DoubleSide, depthWrite: false };
    if (o.map) { // 月の模様など
      fp.map = o.map;
      const uv = new Float32Array(model.vx.length);
      for (let i = 0; i < model.vx.length; i += 2) { uv[i] = 0.5 + model.vx[i] / (2 * o.uvRadius); uv[i + 1] = 0.5 + model.vx[i + 1] / (2 * o.uvRadius); }
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    }
    this.fillMat = o.lit ? new THREE.MeshPhongMaterial({ ...fp, shininess: 6, specular: 0x111111 }) : new THREE.MeshBasicMaterial(fp);
    this.fill = new THREE.Mesh(g, this.fillMat);
    this.fill.frustumCulled = false; this.fill.renderOrder = o.order;
    this.segPos = new Float32Array((model.seg.length / 4) * 6);
    const lg = new LineSegmentsGeometry(); lg.setPositions(this.segPos);
    this.lineMat = new LineMaterial({ color: o.lineColor, linewidth: o.lineWidth, transparent: true, depthWrite: false });
    this.line = new LineSegments2(lg, this.lineMat);
    this.line.frustumCulled = false; this.line.renderOrder = o.order + 1;
    lineMats.push(this.lineMat); liftables.push({ obj: this.fill, r0: o.rFill }, { obj: this.line, r0: o.rLine });
    this.group = new THREE.Group(); this.group.add(this.fill, this.line);
    this.rFill = o.rFill; this.rLine = o.rLine;
    this.A = new V3(1, 0, 0); this.N = new V3(); this.E = new V3(); this.t = new V3();
    frameAt(this.A, this.N, this.E);
    this.scale = 1;
  }
  setAnchor(A) { this.A.copy(A).normalize(); frameAt(this.A, this.N, this.E); }
  update(s = this.scale) {
    this.scale = s;
    const { vx, seg } = this.model, t = this.t, A = this.A, N = this.N, E = this.E;
    for (let i = 0, j = 0; i < vx.length; i += 2, j += 3) {
      placeLocal(A, N, E, vx[i], vx[i + 1], s, this.rFill, t);
      this.pos[j] = t.x; this.pos[j + 1] = t.y; this.pos[j + 2] = t.z;
    }
    this.fill.geometry.attributes.position.needsUpdate = true;
    const arr = this.line.geometry.attributes.instanceStart.data.array;
    for (let i = 0, j = 0; i < seg.length; i += 2, j += 3) {
      placeLocal(A, N, E, seg[i], seg[i + 1], s, this.rLine, t);
      arr[j] = t.x; arr[j + 1] = t.y; arr[j + 2] = t.z;
    }
    this.line.geometry.attributes.instanceStart.data.needsUpdate = true;
  }
  setOpacity(a) {
    this.op = a; this.fillMat.opacity = this.fillBase * a; this.lineMat.opacity = this.lineBase * a;
    this.group.visible = a > 0.001;
  }
  setResolution(w, h) { this.lineMat.resolution.set(w, h); }
}

// ===== [SEC:CAMERA] =====
const cam = { dir: llToVec(28, 128).normalize(), dist: 2.9 };
const view = { shift: 0, targetShift: 0, padTop: 0, padBottom: 0, pT: 0, pB: 0, lift: 1 }; // pT/pBは画面の上下の余白（なめらかに変える）
function applyCamera() {
  camera.position.copy(cam.dir).multiplyScalar(cam.dist);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);
}
// 中心からviewKmの範囲が画面に収まるカメラの距離
function distForView(viewKm) {
  const w = innerWidth, h = innerHeight, availH = Math.max(200, h - view.padTop - view.padBottom);
  const tanF = Math.tan((C.fov * DEG) / 2) * Math.min(w, availH) / h;
  const g = viewKm / R_KM;
  return Math.cos(g) + Math.sin(g) / tanF;

    const shuffled = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

      }

  const T = llToVec(q.lat, q.lon), J = llToVec(S.model.anchorLat, S.model.anchorLon);
  const sepKm = Math.acos(clamp(J.dot(T), -1, 1)) * R_KM;
  const far = Math.min(R.farDist, distForView(Math.max(q.viewKm * 1.4, sepKm * 0.55)));
  S.truth.setAnchor(J); S.truth.update(1); S.truth.setOpacity(0);
  showTruthLabel('本物の' + S.name, { follow: S.truth });
  await moveCamTo(J, far, R.toJapan);
  await tween(0.35, (t) => { S.truth.setOpacity(t); if (S.real) S.real.setOpacity(Math.max(S.real.op, t)); });
  await wait(R.pause);
  const A = new V3();
  await tween(R.fly, (t) => {
    const e = easeInOut(t);
    slerpDir(J, T, e, A);
    S.truth.setAnchor(A); S.truth.update(1);
    cam.dir.copy(A); cam.dist = 1 + (far - 1) * (1 + R.flyBump * Math.sin(Math.PI * e));
  });
  await moveCamTo(T, distForView(q.viewKm), R.zoomIn);
}
// 本物が上から落ちてくる（月）
async function revealDrop(q) {
  const S = G.S;
  S.truth.setAnchor(llToVec(q.lat, q.lon)); S.truth.update(2.2); S.truth.setOpacity(0);
  showTruthLabel('本物の' + S.name, { follow: S.truth });
  await wait(0.3);
  await tween(1.0, (t) => { const e = easeOut(t); S.truth.update(2.2 - 1.2 * e); S.truth.setOpacity(e); });
}

async function showResult(q, s) {
  const pts = scoreFor(s, q), name = subjectName(q), wd = DIM_WORDS[q.dim] || DIM_WORDS['大きさ'];
  G.results.push({ label: G.run.key === 'journey' ? name : q.name, s, pts, stage: q.stage });
  G.total += pts;
  const perfect = Math.abs(Math.log(s)) <= Math.log(1 + C.perfectTol);
  $('rcRatio').textContent = fmtRatio(s);
  $('rcComment').textContent = perfect ? 'ほぼピッタリ！' : s < 1 ? `${wd[0]}！本物の${name}はもっと${wd[1]}` : `${wd[2]}！本物はもっと${wd[3]}`;
  $('rcComment').style.color = perfect ? '#7dffb0' : s < 1 ? '#ff9aa5' : '#9ad0ff';
  $('rcTrivia').textContent = q.trivia || '';
  show('rcTrivia', !!q.trivia);
  $('btnNext').textContent = G.qi < G.qs.length - 1 ? '次の問題へ' : G.run.key === 'journey' ? 'さらに宇宙へ ▶' : '結果を見る';
  $('rcPoints').textContent = '0';
  show('legend', true); show('resultCard', true);
  setPads(true); // 結果カードの高さに合わせて、見える範囲を上へずらす
  G.state = 'result';
  const before = G.total - pts;
  await tween(C.reveal.countUp, (t) => {
    $('rcPoints').textContent = Math.round(pts * easeOut(t));
    $('scoreNow').textContent = before + Math.round(pts * easeOut(t));
  });
}

function next() {
  if (G.state !== 'result') return;
  if (G.qi < G.qs.length - 1) showQuestion(G.qi + 1);
  else if (G.run.key === 'journey') epilogue();
  else showFinal();
}

function titleFor(total, avg) {
  const pct = (100 * total) / (G.qs.length * 100);
  for (const t of G.run.titles) if (pct >= t.min) return t.name || (avg < 1 ? t.nameSmall : t.nameBig);
  return '';
}
function avgText(avg) {
  const pct = Math.round(Math.abs(1 - avg) * 100), sj = G.run.avgSubject;
  if (pct <= 3) return `${sj}を、ほぼ正しく見ていました`;
  return avg < 1 ? `${sj}を平均 ${pct}% 小さく見ていました` : `${sj}を平均 ${pct}% 大きく見ていました`;
}

function showFinal() {
  G.state = 'final';
  ['hud', 'controls', 'resultCard', 'legend', 'btnSkip', 'epiText'].forEach((id) => show(id, false));
  clearLabels();
  setPads(false);
  const avg = Math.exp(G.results.reduce((a, r) => a + Math.log(r.s), 0) / G.results.length);
  G.avg = avg; G.title = titleFor(G.total, avg);
  $('fTotal').textContent = G.total;
  $('fMax').textContent = `/${G.qs.length * 100}点`;
  $('fTitle').textContent = G.title;
  $('fAvg').textContent = avgText(avg);
  $('fList').innerHTML = G.run.key === 'journey'
    ? C.journey.stages.map((stg, k) => { // ステージごとの合計
      const rs = G.results.filter((r) => r.stage === k);
      return `<li><span>${k + 1}. ${stg.title}</span><span>${rs.length}問</span><b>${rs.reduce((a, r) => a + r.pts, 0)}/${rs.length * 100}</b></li>`;
    }).join('')
    : G.results.map((r, i) => `<li><span>${i + 1}. ${r.label}</span><span>${fmtRatio(r.s)}倍</span><b>${r.pts}点</b></li>`).join('');
  show('screenFinal', true);
  if (sceneMode === 'globe') {
    fadeOut(allOverlays().filter((o) => o.op > 0), 0.8).then(() => { if (G.state === 'final') patch.mesh.visible = false; });
    moveCamTo(cam.dir, 3.2, 1.2);
  }
}

function share() {
  const text = `「${C.title}」${G.run.label}で ${G.total}点！\n称号：${G.title}\n${avgText(G.avg)}。\n${G.run.shareLine}\n#${C.hashtag}\n${C.shareUrl}`;
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

// ===== [SEC:EPILOGUE] =====
// 最後の演出：太陽より大きい星へ、カメラがどんどん引いていく
function lerpView(a, b, t) {
  const e = easeInOut(t), la = Math.log(a.half), lb = Math.log(b.half), lh = la + (lb - la) * e;
  const u = Math.abs(lb - la) < 1e-6 ? e : (lh - la) / (lb - la);
  space.view.half = Math.exp(lh); space.view.cx = a.cx + (b.cx - a.cx) * u; space.view.cy = a.cy + (b.cy - a.cy) * u;
}
async function epilogue() {
  G.state = 'epilogue'; G.skip = false;
  ['hud', 'controls', 'resultCard', 'legend'].forEach((id) => show(id, false));
  clearLabels(); setPads(false); show('btnSkip', true);
  const L = C.journey.epilogue, pos = [];
  L.forEach(([, r], i) => {
    if (i === 0) pos.push([-1.3, -1 + r]);
    else if (i === 1) pos.push([0, 0]);
    else { const px = pos[i - 1][0], pr = L[i - 1][1]; pos.push([px + pr + r * 1.25, -1 + r]); }
  });
  // 地球を本物の大きさにして太陽の左に置く
  space.epiMode = true;
  for (const [k, g] of Object.entries(space.refs)) g.visible = k === 'sun';
  const E = space.subs.earth; space.subs.moon.g.visible = false;
  E.g.visible = true; E.g.position.set(pos[0][0], pos[0][1], 300); E.g.scale.setScalar(L[0][1]);
  E.m.material.uniforms.opacity.value = 1; E.ring.visible = false; space.dot.visible = false; space.ring.visible = false;
  for (let i = 2; i < L.length; i++) { space.epi[i].position.set(pos[i][0], pos[i][1], 0); space.epi[i].visible = true; }
  L.forEach(([name, r], i) => addLabel(name, 'star', new V3(pos[i][0], pos[i][1] + r, 900), { flat: true, center: true, opacity: () => (r / space.wpp > 2 ? 1 : 0) }));
  const views = [{ cx: -0.25, cy: 0, half: 1.35 }];
  for (let i = 2; i < L.length; i++) views.push({ cx: pos[i][0] - L[i][1] * 0.3, cy: pos[i][1], half: L[i][1] * 1.35 });
  const go = async (to, dur) => { const from = { ...space.view }; await tween(dur, (t) => lerpView(from, to, t)); };
  await go(views[0], 0.8);
  await wait(0.7);
  for (let k = 1; k < views.length && !G.skip; k++) { await go(views[k], C.journey.epilogueStep); if (!G.skip) await wait(0.5); }
  if (!G.skip) {
    const el = $('epiText'); el.style.opacity = 0; show('epiText', true);
    await tween(0.8, (t) => { el.style.opacity = t; });
    await wait(1.6);
  }
  if (G.state === 'epilogue') showFinal();
}

// ===== [SEC:INPUT] =====
$('followBtn').href = 'https://x.com/intent/follow?screen_name=' + C.followX; $('followBtn').textContent = `𝕏 @${C.followX}`;
$('btnJourney').addEventListener('click', () => startRun('journey'));
$('btnJapan').addEventListener('click', () => startRun('japan'));
$('btnHokkaido').addEventListener('click', () => startRun('hokkaido'));
$('btnDecide').addEventListener('click', decide);
$('btnNext').addEventListener('click', next);
$('btnShare').addEventListener('click', share);
$('btnRetry').addEventListener('click', () => { if (G.state === 'final') startRun(G.run.key); });
$('btnModes').addEventListener('click', () => { if (G.state === 'final') toTitle(); });
$('btnLoadBack').addEventListener('click', () => toTitle());
$('btnSkip').addEventListener('click', () => { if (G.state === 'epilogue') { G.skip = true; showFinal(); } });
$('slider').addEventListener('input', (e) => {
  if (G.state !== 'guess') return;
  const q = G.qs[G.qi];
  G.s = sliderToScale(+e.target.value, q); applyScale(q, G.s);
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (G.state === 'guess') setScale(G.s * Math.exp(-e.deltaY * C.wheelSpeed));
}, { passive: false });
const pointers = new Map(); let pinch = null;
const pDist = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinch = { d0: Math.max(10, pDist()), s0: G.s };
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2 && G.state === 'guess') setScale(pinch.s0 * pDist() / pinch.d0);
});
const pEnd = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; };
['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => canvas.addEventListener(n, pEnd));
addEventListener('keydown', (e) => {
  if (G.state === 'guess') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { setScale(G.s * C.keyStep); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { setScale(G.s / C.keyStep); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { decide(); e.preventDefault(); }
  } else if (G.state === 'result' && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

// ===== [SEC:RESIZE] =====
let patchTimer = 0;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  lineMats.forEach((m) => m.resolution.set(w, h));
  if (G.state === 'guess' || G.state === 'result') {
    setPads(true);
    const q = G.qs[G.qi];
    if (q.type === 'map') {
      cam.dist = distForView(q.viewKm);
      clearTimeout(patchTimer);
      patchTimer = setTimeout(() => { if ((G.state === 'guess' || G.state === 'result') && G.qs[G.qi].type === 'map') buildPatch(G.qs[G.qi]); }, 250);
    }
  }
}
addEventListener('resize', resize);

// ===== [SEC:LOOP] =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  runTweens(now);
  const w = innerWidth, h = innerHeight, k = Math.min(1, dt * 6);
  view.pT += (view.padTop - view.pT) * k; view.pB += (view.padBottom - view.pB) * k;
  if (sceneMode === 'globe') {
    if (G.state === 'title' || G.state === 'final') cam.dir.applyAxisAngle(_Y, C.titleSpin * dt);
    view.shift += (view.targetShift - view.shift) * Math.min(1, dt * C.viewShiftSmooth);
    view.lift = clamp((cam.dist - 1) / C.liftRef, C.liftMin, 1);
    for (const it of liftables) it.obj.scale.setScalar((1 + (it.r0 - 1) * view.lift) / it.r0);
    camera.near = clamp((cam.dist - 1) * 0.2, 0.0002, 0.05);
    camera.setViewOffset(w, h, 0, view.shift, w, h);
    applyCamera();
    renderer.render(scene, camera);
  } else if (sceneMode === 'side') {
    frameSide();
    renderer.render(side.scene, side.cam);
  } else {
    frameSpace();
    for (const m of space.starMats) m.uniforms.t.value = now / 1000;
    renderer.render(space.bg, space.bgCam);
    renderer.autoClear = false; renderer.clearDepth();
    renderer.render(space.scene, space.cam);
    renderer.autoClear = true;
  }
  updateLabels();
  requestAnimationFrame(loop);
}

// ===== [SEC:BOOT] =====
async function boot() {
  resize();
  requestAnimationFrame(loop);
  try {
    const ds = await loadDataset('50m');
    globeMat.map = buildGlobeTexture(ds.countries); globeMat.needsUpdate = true;
    addMeshLines(mesh(ds.world, ds.world.objects.countries, (a, b) => a === b), C.colors.coast, C.colors.coastOpacity, C.radius.coast, 1);
    addMeshLines(mesh(ds.world, ds.world.objects.countries, (a, b) => a !== b), C.colors.border, C.colors.borderOpacity, C.radius.border, 1);
    initPatch();
    await prepareSubject('japan');
    resize();
    toTitle();
  } catch (err) {
    console.error(err);
    $('loadingMsg').textContent = '地図の読み込みに失敗しました。ページを再読み込みしてください。';
  }
}
window.__game = { G, C, subj, setScale, decide, next, startRun, toTitle, get S() { return G.S; }, get playerJp() { return G.S ? G.S.player : subj.japan.player; } };
boot();
</script>
