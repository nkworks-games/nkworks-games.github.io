<body>

    <div id="vFree"><button class="big" id="vSave">画像を保存</button><div class="row"><button class="sml" id="vBack">← 描きにもどる</button></div></div>
  </div>
</div>

<button class="ico" id="muteBtn" aria-label="音">♪</button>

<script type="module">
// ===== [SEC:CONFIG] =====
const CONFIG = {
  TEX: 2048,                    // コマの絵の細かさ（ピクセル）。ズームしてもにじまないように大きめ
  ZOOM: { MAX: 4, CANCEL_MS: 250, MIN3: 0.7, MAX3: 3, WHEEL: 0.0015 }, // ズーム：描く画面の最大倍率・2本目の指がこの時間(ミリ秒)内に来たら1本目の線を取り消す・3Dの最小/最大倍率・マウスホイールの効き
  SPEEDS: [0, 0.3, 0.7, 1.3],   // 回転の速さ（1秒に何回転）止める・ゆっくり・ふつう・はやい
  SPEED_DEF: 2,                 // 最初の速さ（SPEEDSの番号）
  SPIN_ACC: 3.5,                // 速さを変えた時の追いつきやすさ（大きいほどすぐ変わる）
  PEN_W: [0.025, 0.06, 0.12],   // ペンの太さ（コマの半径に対する割合）細・中・太
  PEN_DEF_W: 1,                 // 最初の太さ
  STEP_ANG: 0.03,               // 線を刻む角度（ラジアン）。小さいほど輪がなめらか
  DISK: { MAXR: 210, SIDE: 14, RIM: 0.065 }, // 描く画面のコマの最大半径(px)・左右の余白(px)・ふちの太さ（半径比）
  V3: { VMAX: 70, V_DEF: 30, ACC: 3, BLUR0: 2.6, EXPO: 0.07, TILT: [0.03, 0.15], TILT_W: 30, PREC: 2.4, WANDER: 0.1, FOV: 34, ELEV: 0.98, FIT: 1.3, DPR: 2, SHADOW: 1024 }, // 3D：いちばん速い回転(rad/秒)・最初のスライダー位置(0〜100)・速さの追いつきやすさ・ブレ始める速さ・ブレの強さ・傾き(速い時/遅い時)・傾きが最小になる速さ・首振り・ふらつき・画角・見下ろす角度・写す大きさ・画質・影
  VOL: 0.7,                     // 全体の音量
  SAVE_KEY: 'kurukoma.v1',
  FOLLOW_X: 'vyaPudzd1E54661',  // タイトル画面の「作者をフォロー」のXアカウント
};

// ===== [SEC:UTIL] =====
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const BG = '#f6eddc';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mkCv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const show = (id, on) => $(id).classList.toggle('hidden', !on);

// ===== [SEC:DATA] =====
const COLORS = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#262626', '#ffffff'];
const CNAME = ['あか', 'オレンジ', 'きいろ', 'みどり', 'あお', 'むらさき', 'くろ', 'しろ（けす）'];
const SPEED_NAME = ['止める', 'ゆっくり', 'ふつう', 'はやい'];

// ===== [SEC:SAVE] =====
const SV = { mute: false };
function loadSave() { try { Object.assign(SV, JSON.parse(localStorage.getItem(CONFIG.SAVE_KEY) || '{}')); } catch (e) {} }
function writeSave() { try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(SV)); } catch (e) {} }

// ===== [SEC:AUDIO] =====
let AC = null, master = null, penG = null, NB = null;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = SV.mute ? 0 : CONFIG.VOL; master.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(), f = AC.createBiquadFilter(); src.buffer = NB; src.loop = true; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.7;
      penG = AC.createGain(); penG.gain.value = 0; src.connect(f).connect(penG).connect(master); src.start();
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = 0.15, at = 0, f2 = 0) {
  if (!AC) return; const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function whoosh(dur, f0, f1, vol) {
  if (!AC) return; const t = AC.currentTime, s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; s.loop = true; bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  tap: () => tone(760, 0.07, 'triangle', 0.12),
  pick: () => tone(1040, 0.06, 'sine', 0.1),
  spin: () => whoosh(1.1, 3600, 500, 0.25),
};
const sfx = n => { if (AC && !SV.mute) SFX[n](); };
function penSound(v) { if (penG) penG.gain.setTargetAtTime(v, AC.currentTime, 0.03); }

// ===== [SEC:DISK] =====
// コマの面の絵。線は「半径1の座標の点の列」で覚えておき、戻す時は全部描き直す
function paintStrokes(g, strokes) {
  g.lineCap = g.lineJoin = 'round';
  for (const st of strokes) {
    const W = CONFIG.PEN_W[st.w]; g.strokeStyle = g.fillStyle = COLORS[st.c]; g.lineWidth = W;
    for (const s of st.segs) {
      g.beginPath(); g.arc(s[0], s[1], W / 2, 0, TAU); g.fill();
      if (s.length > 2) { g.beginPath(); g.moveTo(s[0], s[1]); for (let i = 2; i < s.length; i += 2) g.lineTo(s[i], s[i + 1]); g.stroke(); }
    }
  }
}
class Disk {
  constructor(n) { this.n = n; this.cv = mkCv(n, n); this.g = this.cv.getContext('2d'); this.clear(); }
  wipe() { const g = this.g, h = this.n / 2; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#fff'; g.fillRect(0, 0, this.n, this.n); g.setTransform(h, 0, 0, h, h, h); g.lineCap = g.lineJoin = 'round'; }
  clear() { this.strokes = []; this.cleared = null; this.cur = null; this.seg = null; this.wipe(); }
  cancel() { if (!this.cur) return; this.cur = null; this.seg = null; this.redraw(); } // 描きかけの線をなかったことに
  begin(c, w) { this.cur = { c, w, segs: [] }; this.seg = null; }
  add(x, y) {
    const st = this.cur; if (!st) return;
    const g = this.g, W = CONFIG.PEN_W[st.w]; g.strokeStyle = g.fillStyle = COLORS[st.c]; g.lineWidth = W;
    if (!this.seg) { this.seg = [x, y]; st.segs.push(this.seg); g.beginPath(); g.arc(x, y, W / 2, 0, TAU); g.fill(); return; }
    const s = this.seg, lx = s[s.length - 2], ly = s[s.length - 1];
    if (Math.hypot(x - lx, y - ly) < 0.0025) return;
    g.beginPath(); g.moveTo(lx, ly); g.lineTo(x, y); g.stroke(); s.push(x, y);
  }
  brk() { this.seg = null; }
  end() { if (this.cur && this.cur.segs.length) { this.strokes.push(this.cur); this.cleared = null; } this.cur = null; this.seg = null; }
  canUndo() { return this.strokes.length > 0 || !!this.cleared; }
  undo() { if (this.strokes.length) this.strokes.pop(); else if (this.cleared) { this.strokes = this.cleared; this.cleared = null; } else return; this.redraw(); }
  clearAll() { if (this.strokes.length) this.cleared = this.strokes; this.strokes = []; this.redraw(); }
  redraw() { this.wipe(); paintStrokes(this.g, this.strokes); }
}

// ===== [SEC:DRAW2D] =====
// 真上から見たコマ（影・木のふち・回る面）
function drawTop2D(g, cx, cy, R, th, src) {
  const rim = R * (1 + CONFIG.DISK.RIM);
  const sx = cx + R * 0.05, sy = cy + R * 0.1, sg = g.createRadialGradient(sx, sy, R * 0.8, sx, sy, R * 1.25);
  sg.addColorStop(0, 'rgba(80,50,20,.28)'); sg.addColorStop(1, 'rgba(80,50,20,0)'); g.fillStyle = sg; g.beginPath(); g.arc(sx, sy, R * 1.25, 0, TAU); g.fill();
  const rg = g.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.2, cx, cy, rim);
  rg.addColorStop(0, '#f0c28c'); rg.addColorStop(1, '#b8763f'); g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, rim, 0, TAU); g.fill();
  g.save(); g.translate(cx, cy); g.rotate(th);
  g.strokeStyle = 'rgba(90,45,15,.5)'; g.lineWidth = Math.max(1.2, R * 0.012); g.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU, c = Math.cos(a), s = Math.sin(a); g.beginPath(); g.moveTo(c * R * 1.015, s * R * 1.015); g.lineTo(c * (rim - R * 0.012), s * (rim - R * 0.012)); g.stroke(); }
  g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip(); g.drawImage(src, -R, -R, R * 2, R * 2);
  g.restore();
  const fg = g.createRadialGradient(cx, cy, R * 0.82, cx, cy, R);
  fg.addColorStop(0, 'rgba(90,60,30,0)'); fg.addColorStop(1, 'rgba(90,60,30,.16)'); g.fillStyle = fg; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(60,35,15,.55)'; g.lineWidth = Math.max(1, R * 0.008);
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke(); g.beginPath(); g.arc(cx, cy, rim, 0, TAU); g.stroke();

}
// ペン（先が x,y。右下に向かって持ち手）
function drawPen(g, x, y, ci, wpx, down) {
  const col = COLORS[ci], tipL = 18, bodyL = 74, bw = 13;
  g.save(); g.globalAlpha = down ? 1 : 0.55;
  g.strokeStyle = 'rgba(43,33,24,.6)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, Math.max(2.5, wpx / 2) + 1.5, 0, TAU); g.stroke();
  g.translate(x, y); g.rotate(0.9); g.lineJoin = 'round'; g.lineWidth = 2; g.strokeStyle = '#2b2118';
  g.fillStyle = '#f0d3a8'; g.beginPath(); g.moveTo(4, 0); g.lineTo(tipL, -bw / 2); g.lineTo(tipL, bw / 2); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = col; g.beginPath(); g.moveTo(1, 0); g.lineTo(8, -bw * 0.18); g.lineTo(8, bw * 0.18); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = ci === 7 ? '#e8e8e8' : col; g.beginPath(); g.rect(tipL, -bw / 2, bodyL, bw); g.fill(); g.stroke();

  if (G.scene !== 'draw') return;
  const hb = $('head').getBoundingClientRect().bottom, tt = $('tools').getBoundingClientRect().top, k = 1 + CONFIG.DISK.RIM, avail = tt - hb;
  L.R = Math.max(60, Math.min(CONFIG.DISK.MAXR, (L.W - CONFIG.DISK.SIDE * 2) / 2 / k, (avail - 12) / 2 / k));
  L.cx = L.W / 2; L.cy = hb + avail / 2; setZoom(Z.s, Z.ox, Z.oy);
}
function render2D() {
  const g = ctx; g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); g.fillStyle = BG; g.fillRect(0, 0, L.W, L.H);
  drawTop2D(g, L.cx + Z.ox, L.cy + Z.oy, L.R * Z.s, SP.th, D.cv);
  if (G.scene !== 'draw') return;
  const wpx = CONFIG.PEN_W[G.width] * L.R * Z.s;
  if (P.down) drawPen(g, P.x, P.y, G.color, wpx, true); else if (P.mouse && P.hover && canDraw()) drawPen(g, P.hx, P.hy, G.color, wpx, false);
}
function renderTitle() {
  const g = ctx, r = $('tDisk').getBoundingClientRect(), R = Math.min(r.width * 0.42, r.height / 2 / (1 + CONFIG.DISK.RIM) - 8, 170);
  g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); g.fillStyle = BG; g.fillRect(0, 0, L.W, L.H);
  if (R < 30) return;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  drawTop2D(g, cx, cy, R, TD.th, TD.disk.cv);
  if (TD.on) drawPen(g, cx + Math.cos(0.35) * TD.r * R, cy + Math.sin(0.35) * TD.r * R, TD.k, CONFIG.PEN_W[2] * R, true);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (G.scene === 'title') { demoStep(dt); renderTitle(); }
  else if (G.scene === 'draw') { spinStep(dt); render2D(); }
  else if (G.scene === 'view') viewStep(dt);
  requestAnimationFrame(frame);
}

// ===== [SEC:TEST] =====
// 確認用：?test で window.KK から中の値や関数をさわれる
const Q = new URLSearchParams(location.search);
if (Q.has('test')) window.KK = { G, SP, P, L, V, Z, Z3, E3, D, Disk, drawTop2D, drawPen, COLORS, enterDraw, showView, setSpeed, setColor, setWidth, CONFIG };

// ===== [SEC:BOOT] =====
loadSave(); buildTools(); setColor(0); setWidth(CONFIG.PEN_DEF_W); setSpeed(CONFIG.SPEED_DEF); SP.w = CONFIG.SPEEDS[G.speed] * TAU;
$('muteBtn').classList.toggle('off', SV.mute);
resize(); addEventListener('resize', resize); goTitle();
requestAnimationFrame(frame);
setTimeout(load3D, 400);
</script>
