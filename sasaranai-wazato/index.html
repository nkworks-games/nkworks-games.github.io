let actx = null, master = null, muted = false, noiseB = null, slideGain = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
    noiseB = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = noiseB; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.7;
    slideGain = actx.createGain(); slideGain.gain.value = 0; src.connect(f); f.connect(slideGain); slideGain.connect(master); src.start();
  } catch (e) { actx = null; }
}
function env(node, t, a, peak, d) { node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function noiseHit(t, freq, q, peak, d, type = 'bandpass') {
  const s = actx.createBufferSource(); s.buffer = noiseB; const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain(); s.connect(f); f.connect(g); g.connect(master); env(g, t, 0.004, peak, d); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
}
function tone(t, freq, peak, d, type = 'sine', to = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  const g = actx.createGain(); o.connect(g); g.connect(master); env(g, t, 0.004, peak, d); o.start(t); o.stop(t + d + 0.05);
}
function sfx(name) {
  if (!actx || muted || manual) return; const t = actx.currentTime + 0.005;
  switch (name) {
    case 'rustle': for (let i = 0; i < 5; i++) noiseHit(t + i * 0.09 + Math.random() * 0.04, 1400 + Math.random() * 900, 0.9, 0.18, 0.07); break;
    case 'click': tone(t, 2400, 0.12, 0.02, 'square'); noiseHit(t, 4000, 2, 0.2, 0.03); break;
    case 'tok': tone(t, 190, 0.35, 0.07, 'sine', 120); noiseHit(t, 2600, 1.5, 0.25, 0.04); break;
    case 'scrape': noiseHit(t, 3200, 3, 0.07, 0.16); break;
    case 'pat': noiseHit(t, 700, 0.8, 0.35, 0.08); tone(t, 120, 0.2, 0.06); break;
    case 'heart': tone(t, 62, 0.45, 0.12, 'sine', 45); break;
    case 'found': tone(t, 660, 0.16, 0.08, 'triangle'); tone(t + 0.08, 990, 0.16, 0.12, 'triangle'); break;
    case 'insert': noiseHit(t, 2200, 2, 0.4, 0.03); tone(t, 300, 0.4, 0.05, 'square', 140); noiseHit(t + 0.07, 1800, 2, 0.5, 0.05); break;
    case 'tv': tone(t, 1950, 0.12, 0.14); noiseHit(t + 0.15, 5000, 0.5, 0.05, 0.6, 'highpass'); break;
    case 'dun': tone(t, 110, 0.4, 0.5, 'sawtooth', 55); break;
    case 'charge': tone(t, 160, 0.18, 0.9, 'sawtooth', 900); noiseHit(t + 0.6, 1200, 0.6, 0.3, 0.4); break;
  }
}

// ===== [SEC:COLLIDE] =====

// ===== [SEC:OUTLET] =====

function updateOutlet(dt) {

// ===== [SEC:PERSON] =====

  const slot = lv(CONFIG.SLOT_AIM), sy = slot > 0 ? (rnd() < 0.5 ? 1 : -1) : 0, [lx, ly] = leadVec(dl(CONFIG.HAND_SPEED), lv(CONFIG.POKE_IN));

}

function spawnPuff(x, y) { if (G.puffs.length >= 10) G.puffs.shift(); G.puffs.push({ x, y, age: 0 }); }

const frozen = () => state === 'play' && G.phase === 'gap';

// ===== [SEC:HAND1] =====
const clampHandX = x => clamp(x, CONFIG.HAND_X[0], CONFIG.HAND_X[1]);
const clampHandY = y => clamp(y, CONFIG.HAND_Y[0], CONFIG.AREA.maxY + 0.12);
function reachTo(x, y, kind) {
  if (H1.mode === 'hidden' || H1.mode === 'move' || H1.mode === 'rest') { H1.goal.set(x, y); H1.kind = kind; H1.mode = 'move'; H1.pending = null; }
  else if (H1.mode === 'poke' || H1.mode === 'press') { H1.mode = 'retract'; H1.t = 0; H1.pending = { x, y, kind }; }
  else if (H1.mode === 'retract') H1.pending = { x, y, kind };
}
function nextSearchTarget() {
  const hunch = dl(CONFIG.HUNCH), R = dl(CONFIG.SEARCH_R), a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
  const cx = lerp(G.lastSeen.x, G.outlet.x, hunch), cy = lerp(G.lastSeen.y, G.outlet.y, hunch), [bx, by] = aimBias();
  return [clampHandX(cx + bx + Math.cos(a) * r), clampHandY(cy + by + Math.sin(a) * r)];
}
function h1Speed() { return H1.kind === 'lunge' ? Math.max(CONFIG.LUNGE_SPEED, dl(CONFIG.REACH_SPEED)) : H1.kind === 'reach' ? dl(CONFIG.REACH_SPEED) : H1.kind === 'creep' ? (H1.creepFast ? 0.25 : dl(CONFIG.PEEK_CREEP)) : dl(CONFIG.HAND_SPEED); }
function updateHand1(dt) {
  if (frozen()) { H1.vel = 0; return; }
  H1.prev.copy(H1.tip);
  if (state === 'play' && G.phase === 'peek' && H1.mode !== 'hidden') {
    // 見ながらなので、いちばん近い差しこみ口へじわじわ近づく（ただし CREEP_STOP より近くには来ないし、突かない）
    const gx = G.outlet.x, gy = G.outlet.y, stop = CONFIG.CREEP_STOP + 0.02; // コンセントの中心から stop だけはなれた所まで
    const dx = H1.tip.x - gx, dy = H1.tip.y - gy, d = Math.hypot(dx, dy);
    const ux = d > 1e-6 ? dx / d : 0, uy = d > 1e-6 ? dy / d : 1;
    H1.mode = 'move'; H1.kind = 'creep'; H1.pending = null; H1.lungeDelay = 0; H1.creepFast = d < stop; // 近すぎる時は少し下がる

  if (H1.lungeDelay > 0) { H1.lungeDelay -= dt; if (H1.lungeDelay <= 0) reachTo(clampHandX(H1.lungeGoal.x), clampHandY(H1.lungeGoal.y), 'lunge'); }

      tip.z = approach(tip.z, RZ, CONFIG.Z_SPEED * dt);
      if (arrived && Math.abs(tip.z - RZ) < 1e-6 && H1.kind !== 'creep') { H1.mode = 'poke'; H1.t = 0; }
      break;
    }
    case 'poke': {
      tip.z -= RZ / dl(CONFIG.POKE_IN) * dt;
      const s = surfaceZ(tip.x, tip.y);
      if (tip.z <= s) {
        tip.z = s; sfx('tok'); spawnPuff(tip.x, tip.y); H1.base.set(tip.x, tip.y); H1.mode = 'press'; H1.t = 0; H1.dur = dl(CONFIG.PRESS); H1.scrapeT = 0;

}

// ===== [SEC:HAND2] =====
function startRetreat() { H2.mode = 'retreat'; H2.cool = 1.1; }
function h2Target() {
  const hunch = dl(CONFIG.HUNCH) * 0.5, a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * CONFIG.PAT_SEARCH_R;
  const maxX = Math.min(H1.tip.x, H1.mode === 'move' ? H1.goal.x : H1.tip.x) - CONFIG.HAND_SEP;
  if (maxX < CONFIG.HAND_X[0]) return null; // 右手が左はしにいる時は入れない
  const x = clamp(lerp(G.lastSeen.x, G.outlet.x, hunch) + Math.cos(a) * r, CONFIG.HAND_X[0], maxX);
  const y = clamp(lerp(G.lastSeen.y, G.outlet.y, hunch) + Math.sin(a) * r, CONFIG.AREA.minY, CONFIG.AREA.maxY + 0.05);
  return [x, y];
}
function found() {
  say('あった！', 1.2); sfx('found');
  H1.lungeDelay = lv(CONFIG.LUNGE_DELAY); H1.lungeGoal.set(G.outlet.x, G.outlet.y + O.recepDY * (rnd() < 0.5 ? 1 : -1));
  startRetreat();
}
function updateHand2(dt) {
  if (!H2.active) { H2.vel = 0; return; }
  const p = H2.pos, RZ = CONFIG.RETRACT_Z, sp = CONFIG.PAT_SPEED * (1 + diff() * 0.6 + over() * 1.0);
  H2.prev.copy(p);
  const hold = frozen() || (state === 'play' && G.phase === 'peek'); // 見ている間は左手は止まる
  if (!hold) H2.cool -= dt;
  if (!hold) switch (H2.mode) {
    case 'move': {
      const arrived = moveXY(p, H2.goal, sp * dt); p.z = approach(p.z, RZ, CONFIG.Z_SPEED * dt);
      if (arrived && Math.abs(p.z - RZ) < 1e-6) H2.mode = 'pat';
      break;
    }
    case 'pat': {
      p.z -= RZ / 0.12 * dt; const s = h2Surface(p.x, p.y);
      if (p.z <= s) { p.z = s; sfx('pat'); H2.mode = 'hold'; H2.t = 0; if (s > 0 && state === 'play') { found(); return; } }
      break;
    }
    case 'hold': { H2.t += dt; if (H2.t >= CONFIG.PAT_TIME) H2.mode = 'lift'; break; }
    case 'lift': {
      p.z += RZ / 0.1 * dt;
      if (p.z >= RZ) { p.z = RZ; const tg = h2Target(); if (!tg) startRetreat(); else { H2.goal.set(tg[0], tg[1]); H2.mode = 'move'; } }
      break;
    }
    case 'retreat': {
      moveXY(p, { x: CONFIG.HAND_X[0], y: CONFIG.HIDE_Y }, CONFIG.RETREAT_SPEED * dt); p.z = approach(p.z, RZ, CONFIG.Z_SPEED * 2 * dt);
      const back = p.y >= CONFIG.HIDE_Y - 1e-6 && H2.cool <= 0 && state === 'play' && !isRush() && H1.tip.x - CONFIG.HAND_SEP > CONFIG.HAND_X[0] + 0.04;
      if (back) { const tg = h2Target(); if (tg) { H2.goal.set(tg[0], tg[1]); H2.mode = 'move'; } }

    const maxX = H1.tip.x - CONFIG.HAND_SEP;

  }

}

// ===== [SEC:END] =====
function updateEnd(dt) {
  G.endT += dt;
  if (G.tvT >= 0) {
    const before = G.tvT; G.tvT += dt;
    if (before < 0.25 && G.tvT >= 0.25) { sfx('tv'); say('（テレビがついた）', 1.4); }
    if (G.tvT >= 1.5) showResult();
  }
  if (G.endT > 7) showResult(); // 念のため
}

// ===== [SEC:LOOP] =====
function tick(dt) {
  G.anim += dt;
  if (G.voiceT > 0) G.voiceT -= dt;
  if (G.cueT > 0) G.cueT -= dt;
  if (state === 'play') { G.lastT = G.t; G.t += dt; updateOutlet(dt); updatePerson(dt); }
  else G.speed = 0;
  if (state === 'play' || state === 'end') { updateHand1(dt); updateHand2(dt); }
  if (state === 'end') updateEnd(dt);
  for (const pf of G.puffs) pf.age += dt;
  if (state === 'play' && G.phase === 'rush') { G.trailT -= dt; if (G.trailT <= 0) { G.trailT = 0.025; G.trail.push({ x: H1.tip.x, y: H1.tip.y, z: H1.tip.z }); if (G.trail.length > 10) G.trail.shift(); } }
  // のぞき演出（顔の高さとライト）
  const lit = (state === 'play' && G.phase === 'peek') || (state === 'end' && G.endReason === 'seen' && G.tvT < 0);
  let faceGoal = 1.08, flashGoal = 0;
  if (state === 'play' && G.phase === 'warn') { faceGoal = lerp(1.0, 0.885, smooth(clamp(G.phaseT / G.phaseDur, 0, 1))); flashGoal = G.phaseT / G.phaseDur > 0.7 ? (Math.sin(G.anim * 60) > 0 ? 0.12 : 0.02) : 0; }
  if (lit || (state === 'play' && G.phase === 'gap')) faceGoal = 0.875;
  if (state === 'title') { faceGoal = 0.875; flashGoal = 0.8; }
  if (lit) flashGoal = 1;
  G.faceY = approach(G.faceY, faceGoal, 0.9 * dt);
  G.flash = lit ? 1 : approach(G.flash, flashGoal, 8 * dt);
  const aimGoal = lit ? new THREE.Vector3(G.outlet.x, G.outlet.y, 0) : new THREE.Vector3(G.peekX * 0.5, 0.35, 0);
  G.aim.lerp(aimGoal, 1 - Math.exp(-4 * dt));
}
let acc = 0, last = performance.now();
function update(frameDt) {
  acc += Math.min(frameDt, CONFIG.MAX_FRAME);
  while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; }
}
function frame(now) {
  if (!paused && !manual) update((now - last) / 1000);
  last = now; if (!manual) render(); requestAnimationFrame(frame); // テスト中の描画は step の中だけ
}
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

// ===== [SEC:DRAW] =====
const tmpV = new THREE.Vector3(), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();
function placeCyl(m, a, b, r0) {
  tmpV.subVectors(b, a); const L = tmpV.length(); if (L < 1e-6) { m.visible = false; return; }
  m.visible = true; m.position.copy(a).addScaledVector(tmpV, 0.5); m.scale.set(r0, L, r0); m.quaternion.setFromUnitVectors(UP, tmpV.divideScalar(L));
}
function poseHand(group, pos, anchor, arm, rTilt) {
  group.position.copy(pos);
  group.rotation.z = -Math.atan2(anchor.x - pos.x, anchor.y - pos.y) * 0.85 + rTilt;
  group.updateMatrixWorld(true);
  const w = group.localToWorld(tmpA.copy(group.userData.wrist));
  tmpB.subVectors(anchor, w); const L = tmpB.length(); tmpB.normalize();
  const mid = tmpV.copy(w).addScaledVector(tmpB, Math.min(0.15, L * 0.5)).clone();
  placeCyl(arm.skin, w, mid, 0.027);
  placeCyl(arm.sleeve, mid, anchor, 0.046);
  if (group.userData.cordEnd) { // プラグのコードを腕に沿って上まで（とちゅうで切れないように）
    const c0 = group.localToWorld(tmpA.copy(group.userData.cordEnd));
    const c1 = tmpC.set(Math.min(anchor.x + 0.065, CONFIG.PANEL_X - 0.03), anchor.y + 0.05, anchor.z + 0.005);
    placeCyl(cordUp, c0, c1, 0.0036);
  }
}
const anchorR = new THREE.Vector3(), anchorL = new THREE.Vector3(), tmpP = new THREE.Vector3(), tmpG = new THREE.Vector3();
function anchorFor(pos, side, out) { return out.set(clamp(pos.x * 0.85 + side * 0.05, -0.26, 0.26), 1.32, 0.085); }
function poseAll() {
  outletG.position.set(G.outlet.x, G.outlet.y, 0);
  // 右手（プラグ）
  const wob = H1.mode === 'press' ? Math.sin(G.anim * 23) * 0.04 : 0;
  const hp = tmpP.copy(H1.tip);
  if (H1.mode === 'charge') { hp.x += Math.sin(G.anim * 90) * 0.004; hp.y += Math.cos(G.anim * 77) * 0.003; } // ためでぶるぶる
  poseHand(handR, hp, anchorFor(hp, 1, anchorR), armR, wob);
  // 左手
  const showL = H2.active;
  handL.visible = armL.skin.visible = armL.sleeve.visible = showL;
  if (showL) poseHand(handL, H2.pos, anchorFor(H2.pos, -1, anchorL), armL, 0);
  armL.skin.visible = armL.sleeve.visible = showL;
}
function render() {
  poseAll();
  // 顔とライト
  faceG.position.set(G.peekX, G.faceY, 0.085);
  const lx = clamp((G.aim.x - G.peekX) * 0.06, -0.004, 0.004);
  for (let i = 0; i < 2; i++) pupils[i].position.x = (i ? 1 : -1) * 0.03 + lx;
  faceG.updateMatrixWorld(true);
  flashDot.getWorldPosition(flashWorld);
  flash.position.copy(flashWorld); flash.target.position.copy(G.aim);
  flash.intensity = FLASH_MAX * G.flash;
  M.flash.color.setScalar(0.45 + 0.55 * G.flash);
  M.face.emissiveIntensity = 0.25 + 0.75 * G.flash; // スマホの画面の明かりで顔が見える
  // テレビ
  const tvOn = G.tvT >= 0.25 ? Math.min(1, (G.tvT - 0.25) / 0.2) : 0;
  M.tvScreen.emissiveIntensity = tvOn * (0.9 + 0.1 * Math.sin(G.anim * 40));
  tvLight.intensity = tvOn * 1.6;
  // 乱舞の残像とほこり
  const showGhost = (state === 'play' || state === 'end') && G.phase === 'rush';
  for (let i = 0; i < ghosts.length; i++) {
    const h = G.trail[G.trail.length - 1 - (i + 1) * 2], gh = ghosts[i];
    gh.visible = !!(showGhost && h);
    if (gh.visible) { gh.position.set(h.x, h.y, h.z); gh.rotation.z = -Math.atan2(anchorFor(h, 1, tmpG).x - h.x, tmpG.y - h.y) * 0.85; }
  }
  for (let i = 0; i < puffSprites.length; i++) {
    const pf = G.puffs[i], sp = puffSprites[i];
    sp.visible = !!pf && pf.age < 0.35;
    if (sp.visible) { const k = pf.age / 0.35; sp.position.set(pf.x, pf.y, 0.012); sp.scale.setScalar(0.012 + k * 0.035); sp.material.opacity = 0.65 * (1 - k); }
  }
  renderer.render(scene, camera);
  drawHud();
}

// ===== [SEC:HUD] =====
const $ = id => document.getElementById(id);
const hud = { time: $('time'), best: $('best'), eye: $('eyeWrap'), eyeLabel: $('eyeLabel'), voice: $('voice'), cue: $('cue') };
const shown = {};
function setText(el, key, v) { if (shown[key] !== v) { shown[key] = v; el.innerHTML = v; } }
function setClass(el, key, v) { if (shown[key] !== v) { shown[key] = v; el.className = v; } }
function drawHud() {
  const playing = state === 'play' || state === 'end';
  setClass($('hud'), 'hudc', playing ? '' : 'hidden');
  if (playing) {
    setText(hud.time, 'time', (state === 'end' ? G.finalTime : G.t).toFixed(1) + '<small>秒</small>');
    setText(hud.best, 'best', best > 0 ? 'ベスト ' + best.toFixed(1) + '秒' : '');
    let ec = '', el = '見てない';
    if (state === 'play' && G.phase === 'warn') { ec = 'warn'; el = '来るぞ…'; }
    if ((state === 'play' && (G.phase === 'peek' || G.phase === 'gap')) || (state === 'end' && G.endReason === 'seen')) { ec = 'peek'; el = '見られてる！'; }
    if (state === 'play' && (G.phase === 'rush_warn' || G.phase === 'rush')) { ec = 'rush'; el = '乱舞！逃げろ！'; }
    if (state === 'play' && G.phase === 'rest') el = 'ぜぇぜぇ…';
    setClass(hud.eye, 'eye', ec);
    setText(hud.eyeLabel, 'eyel', el);
  } else setClass(hud.eye, 'eye', 'hidden');
  setClass($('rushfx'), 'rushfx', playing && (G.phase === 'rush_warn' || G.phase === 'rush') ? 'on' : '');
  setText(hud.voice, 'voice', G.voice);
  setClass(hud.voice, 'voicec', G.voiceT > 0 && (playing) ? 'show' : '');
  setText(hud.cue, 'cue', G.cue);
  setClass(hud.cue, 'cuec', G.cueT > 0 && G.cue && playing ? 'show ' + G.cueCls : G.cueCls);
}

// ===== [SEC:CAMERA] =====
function fitCamera() {
  const area = document.getElementById('app'), w = Math.max(1, area.clientWidth), h = Math.max(1, area.clientHeight); // 広告の帯をのぞいた、ゲームの場所の大きさ
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = 42; camera.updateProjectionMatrix();
  const target = new THREE.Vector3(0, 0.42, 0), dir = new THREE.Vector3(0.17, -0.09, 1).normalize();
  const corners = [[-0.33, -0.01], [0.33, -0.01], [-0.33, 0.84], [0.33, 0.84]].map(([x, y]) => new THREE.Vector3(x, y, 0));
  const topLim = w / h < 1 ? 0.74 : 0.8;
  let lo = 0.4, hi = 8;
  for (let i = 0; i < 32; i++) {
    const d = (lo + hi) / 2; camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(true);
    const ok = corners.every(c => { const p = c.clone().project(camera); return Math.abs(p.x) <= 0.97 && p.y <= topLim && p.y >= -0.96; });
    if (ok) hi = d; else lo = d;
  }
  camera.position.copy(target).addScaledVector(dir, hi); camera.lookAt(target); camera.updateMatrixWorld(true);
}
window.addEventListener('resize', fitCamera);
if (window.ResizeObserver) new ResizeObserver(fitCamera).observe(document.getElementById('app')); // 回転・広告の帯の高さが変わった時も
fitCamera();

// ===== [SEC:AD] =====
const AD_PAUSE = true; // AdSenseのサイト審査中は広告を読み込まない（帯と余白はそのまま）。審査が通ったら false にし、<head> の return; も消す
function showAd() {
  const z = document.getElementById('ad-banner');
  if (AD_PAUSE || !z || z.firstChild || !/(^|\.)nkworks-games\.com$/.test(location.hostname)) return;
  z.innerHTML = '<ins class="adsbygoogle" data-ad-client="ca-pub-2073267239630350" data-ad-slot="6261635446"></ins>';
  try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) { /* 広告が出ない時も帯は残す */ }
}
showAd();

// ===== [SEC:INPUT] =====
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), wallPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const lastW = new THREE.Vector3(), curW = new THREE.Vector3();
let dragId = null;
function screenToWall(cx, cy, out) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(wallPlane, out);
}
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || dragId !== null) return;
  if (!screenToWall(e.clientX, e.clientY, lastW)) return;
  dragId = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  if (screenToWall(e.clientX, e.clientY, curW)) { applyDrag(curW.x - lastW.x, curW.y - lastW.y); lastW.copy(curW); }
  e.preventDefault();
});
const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag); canvas.addEventListener('lostpointercapture', endDrag);
document.addEventListener('touchmove', e => { if (state === 'play') e.preventDefault(); }, { passive: false });

// ===== [SEC:UI] =====
function titleFor(t) { for (const [lim, name] of CONFIG.TITLES) if (t < lim) return name; return CONFIG.TITLES[CONFIG.TITLES.length - 1][1]; }
function showResult() {
  if (state === 'result') return;
  state = 'result'; if (slideGain) slideGain.gain.value = 0;
  const t = Math.floor(G.finalTime * 10) / 10;
  G.newBest = t > best; if (G.newBest) { best = t; try { localStorage.setItem('sasaranai_best', String(best)); } catch (e) {} }
  const name = titleFor(t);
  $('rReason').textContent = G.endReason === 'seen' ? '動いたのを見られた…' : 'プラグを刺された…';
  $('rTime').textContent = t.toFixed(1);
  $('rTitle').innerHTML = '称号 <span>「' + name + '」</span>';
  $('rBest').innerHTML = '自己ベスト ' + best.toFixed(1) + '秒' + (G.newBest ? '<span class="newbest">更新！</span>' : '');
  const url = location.href.split('#')[0].split('?')[0];
  const text = '家具の裏で、プラグから' + t.toFixed(1) + '秒逃げきった。\n称号「' + name + '」\n#刺さらないのはわざとです\n';
  $('shareBtn').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
  $('result').classList.remove('hidden');
}
function startGame() {
  initAudio();
  $('title').classList.add('hidden'); $('result').classList.add('hidden');
  reset((Math.random() * 1e9) | 0);
}
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; if (slideGain) slideGain.gain.value = 0; });
$('titleBest').textContent = best > 0 ? '自己ベスト ' + best.toFixed(1) + '秒' : '';
setInterval(() => { // すべる音（ゲームの進行には使わない）
  if (!slideGain || !actx) return;
  const v = state === 'play' && !muted ? clamp(G.speed / 1.2, 0, 1) * 0.16 : 0;
  slideGain.gain.setTargetAtTime(v, actx.currentTime, 0.04);
}, 50);
// タイトル画面の見た目（ライトで照らされている場面）
G.outlet.set(-0.04, 0.27); G.peekX = 0.03; G.faceY = 0.875; G.flash = 0.8; G.aim.set(-0.04, 0.27, 0);
H1.tip.set(0.08, 0.36, 0.035); H2.pos.set(-0.17, CONFIG.HIDE_Y + 0.3, CONFIG.RETRACT_Z);
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
let testRng = 7;
window.__TEST__ = {
  keys: [],
  randomInput(r) {
    testRng = (testRng * 16807 + Math.floor(r * 1e6)) % 2147483647;
    const r2 = (testRng % 10000) / 10000;
    if (r < 0.3) return; // 止まる
    const a = r2 * Math.PI * 2, m = (r - 0.3) * 0.12;
    applyDrag(Math.cos(a) * m, Math.sin(a) * m);
  },
  drag(dx, dy) { applyDrag(dx, dy); },
  reset(seed) { manual = true; $('title').classList.add('hidden'); $('result').classList.add('hidden'); reset(seed); acc = 0; },
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); render(); },
  advance(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); }, // 描画なし（難しさの確認用）
  raw() { return { G, H1, H2, CONFIG }; },
  state() {
    return { t: +G.t.toFixed(2), state, phase: G.phase, outlet: [+G.outlet.x.toFixed(3), +G.outlet.y.toFixed(3)], plug: [+H1.tip.x.toFixed(3), +H1.tip.y.toFixed(3), +H1.tip.z.toFixed(3)], h1: H1.mode, h2: H2.active ? H2.mode : 'off', h2pos: [+H2.pos.x.toFixed(3), +H2.pos.y.toFixed(3)], reason: G.endReason, final: G.finalTime, over: state === 'result' };
  },
  check() {
    poseAll();
    const v = [], A = CONFIG.AREA, e = 1e-6;
    const nums = [G.outlet.x, G.outlet.y, H1.tip.x, H1.tip.y, H1.tip.z, H2.pos.x, H2.pos.y, H2.pos.z, G.t];
    if (!nums.every(Number.isFinite)) v.push('NaN/Infinity がある');
    if (G.outlet.x < A.minX - e || G.outlet.x > A.maxX + e || G.outlet.y < A.minY - e || G.outlet.y > A.maxY + e) v.push('コンセントが範囲外');
    if (H1.mode !== 'hidden' && (H1.tip.x < CONFIG.HAND_X[0] - e || H1.tip.x > CONFIG.HAND_X[1] + e || H1.tip.y < CONFIG.HAND_Y[0] - e || H1.tip.y > CONFIG.HAND_Y[1] + e)) v.push('右手が範囲外');
    if (H1.mode !== 'insert' && H1.mode !== 'inserted' && H1.tip.z < surfaceZ(H1.tip.x, H1.tip.y) - 1e-5) v.push('プラグが壁かプレートにめり込み');
    if (H1.tip.z < O.faceZ - 0.02) v.push('プラグが深く入りすぎ');
    if (H2.active && H2.pos.z < h2Surface(H2.pos.x, H2.pos.y) - 1e-5) v.push('左手が壁かプレートにめり込み');
    if (H2.active && H2.mode !== 'retreat' && H2.pos.x > H1.tip.x - CONFIG.HAND_SEP * 0.8) v.push('両手が重なった');
    if (H2.active && (H2.pos.x < CONFIG.HAND_X[0] - e || H2.pos.x > CONFIG.HAND_X[1] + e || H2.pos.y < CONFIG.HAND_Y[0] - e || H2.pos.y > CONFIG.HAND_Y[1] + e)) v.push('左手が範囲外');
    if (G.speed > CONFIG.OUTLET_MAX_SPEED * 1.5) v.push('コンセントが速すぎ ' + G.speed.toFixed(2));
    if (H1.vel > CONFIG.LUNGE_SPEED * 1.5) v.push('右手が速すぎ ' + H1.vel.toFixed(2));
    if (H2.vel > CONFIG.LUNGE_SPEED * 1.5) v.push('左手が速すぎ ' + H2.vel.toFixed(2));
    if (state === 'play' && G.t < G.lastT) v.push('時間が戻った');
    if (G.t < 0) v.push('時間がマイナス');
    const pb = new THREE.Box3().setFromObject(plate), ps = pb.getSize(new THREE.Vector3());
    if (Math.abs(ps.x - O.w) / O.w > 0.1 || Math.abs(ps.y - O.h) / O.h > 0.1) v.push('プレートの見た目と当たり判定の大きさがちがう');
    // 手の見た目が家具の側板・壁・プレートにめり込んでいないか
    for (const [grp, on] of [[handR, true], [handL, H2.active]]) {
      if (!on) continue;
      grp.updateMatrixWorld(true);
      const b = new THREE.Box3().setFromObject(grp === handR ? handR.userData.body : handL, true);
      if (b.min.x < -CONFIG.PANEL_X - 0.002 || b.max.x > CONFIG.PANEL_X + 0.002) v.push((grp === handR ? '右手' : '左手') + 'が家具の側板にめり込み ' + b.min.x.toFixed(3) + '..' + b.max.x.toFixed(3) + ' pos=' + (grp === handR ? H1.tip.x : H2.pos.x).toFixed(3) + ',' + (grp === handR ? H1.tip.y : H2.pos.y).toFixed(3));
      if (b.min.z < -0.001) v.push((grp === handR ? '右手' : '左手') + 'が壁にめり込み');
      if (grp === handR && b.min.z < O.faceZ - 0.0005 && H1.mode !== 'insert' && H1.mode !== 'inserted') {
        const o = G.outlet; if (b.max.x > o.x - O.w / 2 && b.min.x < o.x + O.w / 2 && b.max.y > o.y - O.h / 2 && b.min.y < o.y + O.h / 2) v.push('右手がプレートにめり込み');
      }
    }
    for (const arm of [armR, armL]) if (arm.sleeve.visible) { const b = new THREE.Box3().setFromObject(arm.sleeve, true); if (b.max.z > CONFIG.BOARD.z0 && b.max.y > CONFIG.BOARD.y - 0.01 && b.min.y < CONFIG.BOARD.y + 0.03) v.push('腕が天板にめり込み'); }
    if (state === 'play' && G.phase === 'peek' && (H1.mode === 'poke' || H1.mode === 'press' || H1.mode === 'insert')) v.push('ライト中に突いている');
    if (state === 'play' && G.phase === 'peek' && H1.mode !== 'hidden' && H1.kind === 'creep' && Math.hypot(H1.tip.x - G.outlet.x, H1.tip.y - G.outlet.y) < CONFIG.CREEP_STOP * 0.8 && G.phaseT > 0.4) v.push('ライト中に近づきすぎ');
    if (cordUp.visible) { const cb = new THREE.Box3().setFromObject(cordUp, true); if (cb.max.x > CONFIG.PANEL_X + 0.002 || cb.min.x < -CONFIG.PANEL_X - 0.002) v.push('コードが側板にめり込み'); if (cb.min.z < -0.001) v.push('コードが壁にめり込み'); }
    if (state === 'play' && G.phase === 'peek' && G.phaseT > CONFIG.PEEK_GRACE && G.outlet.distanceTo(G.peekPos) > CONFIG.PEEK_MOVE_TOL + 1e-6) v.push('ライト中に動いたのに見のがした');
    return v;
  },
  ready: true,
};
