<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>惑星ストラックアウト</title>
<meta name="description" content="重力のちがう6つの星で、9枚のパネルをボールで抜く3Dストラックアウト。地球の投げ方は、次の星では通用しない。">
<meta property="og:title" content="惑星ストラックアウト">
<meta property="og:description" content="重力のちがう6つの星で、9枚のパネルを抜け。地球の投げ方は、次の星では通用しない。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nkworks-games.com/planet-strikeout/">
<meta property="og:image" content="https://nkworks-games.com/planet-strikeout/card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05070f">
<meta name="google-adsense-account" content="ca-pub-2073267239630350">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2073267239630350" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ad:50px; --gap:75px; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
  --gameH:calc(100vh - var(--ad) - var(--gap) - var(--safeB));
  --gold:#ffcc4d; --cyan:#6fd8ff; --ink:#0a0f22; --glass:rgba(9,13,30,.62); --line:rgba(255,255,255,.14);
}
@supports (height:100dvh){ :root{ --gameH:calc(100dvh - var(--ad) - var(--gap) - var(--safeB)); } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;overscroll-behavior:none}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
#game{position:fixed;top:0;left:50%;transform:translateX(-50%);height:var(--gameH);width:min(100vw,calc(var(--gameH) * .7));overflow:hidden;background:#000;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#touch{position:absolute;inset:0;touch-action:none;cursor:grab}
#swipe{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#adGap{position:fixed;left:0;right:0;bottom:calc(var(--ad) + var(--safeB));height:var(--gap);background:#05070f}
#adArea{position:fixed;left:0;right:0;bottom:0;height:calc(var(--ad) + var(--safeB));padding-bottom:var(--safeB);display:flex;justify-content:center;align-items:center;background:#05070f}
#adArea .slot{width:320px;height:50px;overflow:hidden}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
#hud.on{opacity:1}
.topbar{position:absolute;left:10px;right:10px;top:calc(var(--safeT) + 10px);display:flex;gap:8px;align-items:stretch}
.chip{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
.pinfo{padding:6px 11px;min-width:0;flex:1}
.pinfo .nm{font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap}
.pinfo .gv{font-size:11.5px;color:#cfe3ff;opacity:.9;white-space:nowrap;margin-top:1px}
.pinfo .gv b{color:var(--gold);font-weight:800}
.score{padding:6px 11px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.score .hits{font-weight:800;font-size:19px;line-height:1.1}
.score .hits small{font-size:12px;opacity:.75;margin-left:2px}
.score .hits.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35);color:var(--gold)}}
.balls{display:flex;gap:3px;margin-top:4px}
.balls i{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.6)}
.balls i.used{background:rgba(255,255,255,.18);box-shadow:none}
.ibtns{display:flex;flex-direction:column;gap:6px}
.ibtn{pointer-events:auto;width:38px;flex:1;min-height:32px;display:grid;place-items:center;color:#fff;cursor:pointer;padding:0}
.ibtn svg{width:18px;height:18px}
#caption{position:absolute;left:14px;right:14px;top:calc(var(--safeT) + 82px);text-align:center;font-weight:700;font-size:15px;line-height:1.5;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px #000;opacity:0;transition:opacity .35s}
#caption.on{opacity:1}
#caption small{display:block;font-size:12px;font-weight:500;opacity:.85}
#pop{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:800;font-size:30px;opacity:0;text-shadow:0 3px 14px rgba(0,0,0,.7),0 0 2px #000}
#pop.go{animation:pop 1.05s ease-out}
#pop.good{color:var(--gold)}
#pop.miss{color:#dfe7ff;font-size:22px}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.speed{display:flex;align-items:baseline;gap:5px;padding:5px 16px;font-weight:800}
.speed .l{font-size:13px;opacity:.85}
.speed b{font-size:30px;letter-spacing:.5px;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.speed .u{font-size:14px;opacity:.85}
.speed.flash b{animation:sflash .5s}
@keyframes sflash{0%{color:var(--gold);transform:scale(1.25)}100%{color:#fff;transform:scale(1)}}
#prev{font-size:12px;opacity:.85;text-shadow:0 1px 4px #000;min-height:16px}
#gauge{position:absolute;left:14px;top:23%;bottom:31%;width:60px;opacity:0;transition:opacity .25s;pointer-events:none}
#gauge.on{opacity:.5}#gauge.drag{opacity:1}
.gTrack{position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:8px;background:rgba(8,12,28,.6);border:1px solid rgba(255,255,255,.25)}
.gFill{position:absolute;left:1px;right:1px;bottom:1px;height:0;border-radius:7px;background:linear-gradient(0deg,#6fd8ff,#ffe07a 60%,#ff7a4a)}
.gPrev{position:absolute;left:-5px;width:22px;height:4px;border-radius:2px;background:#fff;transform:translateY(50%);display:none;box-shadow:0 0 6px rgba(0,0,0,.6)}
.gPrev span{position:absolute;left:26px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;font-weight:800;text-shadow:0 1px 4px #000,0 0 2px #000}
.gTick{position:absolute;left:16px;font-size:9.5px;opacity:.75;transform:translateY(50%);text-shadow:0 1px 3px #000}
.gTick::before{content:"";position:absolute;left:-6px;top:50%;width:4px;height:1px;background:#fff}
#hint{position:absolute;left:0;right:0;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transition:opacity .4s;text-align:center;font-weight:700;font-size:14px;line-height:1.5;text-shadow:0 2px 8px #000}
#hint.on{opacity:1}
#hint .finger{width:46px;height:46px;animation:flick 1.5s ease-in infinite}
@keyframes flick{0%{transform:translateY(34px);opacity:0}15%{opacity:1}55%{transform:translateY(-34px);opacity:1}70%,100%{transform:translateY(-44px);opacity:0}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.screen.on{display:flex}
.panel{width:100%;max-width:380px;background:rgba(8,12,28,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .35s ease-out;max-height:100%;overflow:auto}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 10px;font-size:17px;font-weight:800;color:#1a1300;background:linear-gradient(180deg,#ffe07a,#ffb931);box-shadow:0 4px 0 #b97a12,0 8px 20px rgba(255,190,60,.25);cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b97a12}
.btn.sub{color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font-size:15px;padding:11px 10px}
.btn.sub:active{transform:translateY(1px)}
.btn.x{background:#111;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.kicker{font-size:12px;letter-spacing:2px;color:var(--cyan);font-weight:700}
h2{margin:4px 0 10px;font-size:34px;font-weight:800;letter-spacing:1px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;background:rgba(255,255,255,.05);border-radius:14px;padding:10px 14px;margin:6px 0 10px}
.stats span{font-size:13px;opacity:.75;align-self:center}
.stats b{font-size:17px;font-weight:800}
.stats b em{font-style:normal;color:var(--gold)}
.stats b small{font-size:12px;opacity:.7;font-weight:500;margin-left:4px}
.fact{font-size:13.5px;line-height:1.65;text-align:left;background:rgba(111,216,255,.08);border:1px solid rgba(111,216,255,.2);border-radius:12px;padding:9px 12px;margin:4px 0 4px}
.fact b{color:var(--cyan);display:block;font-size:12px;margin-bottom:2px}
.goal{font-size:13px;opacity:.85;margin-top:8px}
.bigscore{font-size:54px;font-weight:800;line-height:1;margin:6px 0 2px}
.bigscore small{font-size:20px;opacity:.75;margin-left:4px}
.muted{font-size:13px;opacity:.75}
.crown{display:inline-block;width:30px;height:22px;vertical-align:-2px;margin-right:4px}

/* title */
#title{align-items:flex-end;padding-bottom:14px}
#title .panel{background:rgba(6,9,22,.62)}
.logo{font-weight:800;line-height:1.05;margin:2px 0 8px}
.logo .a{display:block;font-size:20px;letter-spacing:6px;color:var(--cyan)}
.logo .b{display:block;font-size:min(33px,7.6vw);letter-spacing:0;white-space:nowrap;background:linear-gradient(180deg,#fff,#ffd96a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
.lead{font-size:13.5px;line-height:1.7;opacity:.92;margin:6px 0 10px}
.planetsRow{display:flex;justify-content:center;gap:7px;margin:10px 0 6px}
.pi{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset -4px -4px 8px rgba(0,0,0,.45),0 0 10px rgba(255,255,255,.12)}
.pi.earth{background:radial-gradient(circle at 35% 35%,#8fd0ff,#2a6fd0 55%,#123a7a);position:relative;overflow:hidden}
.pi.earth::after{content:"";position:absolute;left:18%;top:30%;width:45%;height:35%;background:#4fae5a;border-radius:50% 40% 60% 40%;opacity:.9}
.pi.moon{background:radial-gradient(circle at 35% 35%,#f1f1f1,#a9a9a9 60%,#5d5d5d)}
.pi.mars{background:radial-gradient(circle at 35% 35%,#ffb07a,#d0582c 60%,#7a2a12)}
.pi.venus{background:radial-gradient(circle at 35% 35%,#fff0c4,#e3aa55 60%,#9a6022)}
.pi.jupiter{background:linear-gradient(170deg,#f6ead0 0 18%,#c8925e 18% 30%,#f2e2c2 30% 46%,#b9764a 46% 56%,#efdcb9 56% 74%,#c99566 74% 86%,#e9d4ae 86%);box-shadow:inset -5px -5px 9px rgba(0,0,0,.45)}
.pi.pluto{background:radial-gradient(circle at 35% 35%,#fbf1e3,#d2b292 55%,#7e5a45)}
.best{font-size:13px;margin-top:10px;opacity:.9}
.best b{color:var(--gold)}
.settings{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95}
.seg button{border:0;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);cursor:pointer}
.seg button.on{background:var(--cyan);color:#062033}
.credit{font-size:11px;opacity:.5;margin-top:12px;letter-spacing:1px}

/* practice pick */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.pgrid button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:14px;padding:12px 4px 9px;color:#fff;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pgrid button:disabled{opacity:.3;cursor:default}
.pgrid .pi{width:34px;height:34px}

/* result */
.rlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rcell{background:rgba(255,255,255,.06);border-radius:13px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.rcell .n{font-size:12px;opacity:.85}
.rcell .v{font-weight:800;font-size:18px}
.rcell .v small{font-size:11px;opacity:.65}
.rcell .cr{position:absolute;top:-9px;right:6px;width:26px;height:19px}
.titleBadge{display:inline-block;margin:6px 0 2px;padding:6px 16px;border-radius:999px;font-weight:800;font-size:18px;color:#1a1300;background:linear-gradient(180deg,#ffe07a,#ffb931)}
.newbest{color:var(--gold);font-weight:800;font-size:13px;margin-top:6px}

#shareImg{width:100%;border-radius:12px;display:block;margin:6px 0 4px;border:1px solid var(--line)}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
#fade.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 3px 16px rgba(0,0,0,.8)}
#banner.on{opacity:1}
#banner .k{font-size:13px;letter-spacing:4px;color:var(--cyan);font-weight:700}
#banner .t{font-size:46px;font-weight:800;letter-spacing:3px}
#rotate{position:fixed;left:0;right:0;top:0;bottom:calc(var(--ad) + var(--gap) + var(--safeB));display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#05070f;z-index:20;font-weight:800;font-size:17px;text-align:center}
#rotate svg{width:54px;height:54px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;opacity:.8;z-index:9;background:#05070f}
</style>

<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="touch"></div>
  <canvas id="swipe"></canvas>
  <div id="banner"><div class="k" id="bannerK"></div><div class="t" id="bannerT"></div></div>

  <div id="hud">
    <div class="topbar">
      <div class="chip pinfo"><div class="nm" id="hName">地球</div><div class="gv" id="hGrav"></div><div class="gv">パネルまで <b>16m</b></div></div>
      <div class="chip score"><div class="hits" id="hHits">0<small>/9枚</small></div><div class="balls" id="hBalls"></div></div>
      <div class="ibtns">
        <button class="chip ibtn" id="muteBtn" aria-label="音のオン・オフ"></button>
        <button class="chip ibtn" id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      </div>
    </div>
    <div id="caption"></div>
    <div id="pop"></div>
    <div id="gauge"><div class="gTrack"><div class="gFill" id="gFill"></div><div class="gPrev" id="gPrev"><span id="gPrevT"></span></div></div><div id="gTicks"></div></div>
    <div id="hint">
      <svg class="finger" viewBox="0 0 48 48"><circle cx="24" cy="16" r="9" fill="rgba(255,255,255,.25)"/><path d="M20 40V17a4 4 0 0 1 8 0v10l7 2a4 4 0 0 1 3 4.6L36.5 42H22z" fill="#fff"/></svg>
      <div id="hintText"></div>
    </div>
    <div class="bottom">
      <div class="chip speed" id="speedBox"><span class="l">時速</span><b id="speedNum">--</b><span class="u">km</span></div>
      <div id="prev"></div>
    </div>
  </div>

  <!-- title -->
  <div class="screen" id="title"><div class="panel">
    <div class="logo"><span class="a">PLANET</span><span class="b">惑星ストラックアウト</span></div>
    <div class="planetsRow"><i class="pi earth"></i><i class="pi moon"></i><i class="pi mars"></i><i class="pi venus"></i><i class="pi jupiter"></i><i class="pi pluto"></i></div>
    <p class="lead">重力のちがう6つの星で、9枚のパネルを抜こう。<br>画面を上へ<b>なぞって</b>、指をはなすと投げる。<br>長くなぞるほど強く、高く飛ぶ。</p>
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn sub" id="practiceBtn">練習する</button>
    <div class="best" id="bestLine"></div>
    <div class="settings">
      <div class="seg">なぞる感度 <button data-sens="0.8">低い</button><button data-sens="1">ふつう</button><button data-sens="1.25">高い</button></div>
    </div>
    <div class="credit">N.K. Works</div>
  </div></div>

  <!-- card (arrival / stage end) -->
  <div class="screen" id="card"><div class="panel" id="cardBody"></div></div>

  <!-- practice pick -->
  <div class="screen" id="ppick"><div class="panel">
    <div class="kicker">PRACTICE</div>
    <h2 style="font-size:26px">練習する星をえらぶ</h2>
    <div class="muted">一度行けた星だけ選べます。練習の記録は合計に入りません。</div>
    <div class="pgrid" id="pgrid"></div>
    <button class="btn sub" id="ppBack">もどる</button>
  </div></div>

  <!-- result -->
  <div class="screen" id="result"><div class="panel" id="resultBody"></div></div>

  <!-- menu -->
  <div class="screen" id="menu"><div class="panel">
    <div class="kicker">PAUSE</div>
    <h2 style="font-size:26px">一時停止</h2>
    <button class="btn" id="mResume">つづける</button>
    <button class="btn sub" id="mRetry">この星を最初から</button>
    <button class="btn sub" id="mTitle">タイトルへ</button>
    <div class="settings">
      <div class="seg">なぞる感度 <button data-sens="0.8">低い</button><button data-sens="1">ふつう</button><button data-sens="1.25">高い</button></div>
    </div>
    <div class="muted" id="mNote" style="margin-top:10px"></div>
  </div></div>

  <!-- share -->
  <div class="screen" id="share"><div class="panel">
    <div class="kicker">SHARE</div>
    <img id="shareImg" alt="結果の画像">
    <div id="shareBtns"></div>
    <button class="btn sub" id="shareClose">とじる</button>
  </div></div>

  <div id="fade"></div>
  <div id="loading">よみこみ中…</div>
</div>

<div id="rotate">
  <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><rect x="15" y="6" width="18" height="34" rx="3"/><path d="M6 30a18 18 0 0 0 9 12M42 18a18 18 0 0 0-9-12"/></svg>
  スマホを縦にして遊んでください
</div>

<div id="adGap"></div>
<div id="adArea"><div class="slot">
  <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-2073267239630350" data-ad-slot="6261635446"></ins>
</div></div>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   基本の数字
   ========================================================= */
const DEG = Math.PI/180;
const THETA = 8*DEG;                  // 投げ上げる角度（いつも同じ）
const REL = {x:0.32, y:1.8, z:-0.35};  // ボールをはなす位置
const BOARD_Z = REL.z - 16;            // パネルまで16m
const BOARD_Y = 1.6;                   // パネルのまん中の高さ
const PITCH = 0.7, PANEL = 0.62, PANEL_T = 0.05, FRAME_W = 0.15;
const BALL_R = 0.085;                  // 見た目の大きさ（遠くでも見えるよう少し大きめ）
const KE = 0.0062;                     // 地球の空気の強さ
const PHYS_DT = 1/240;
const MAX_KMH = 200;
const DRAG_POW = 1.6;                  // なぞった長さ → 時速（短い所ほど細かく調整できる）
const DRAG_DEAD = 10;                  // これより短いなぞりは数えない（px）
const YAW_PX = 55;                     // 横に55pxずらすと、パネル1列ぶん横へ
const BALLS = 12, CLEAR = 5;
const DEMO_KMH = 85;
const YAW0 = Math.atan2(-REL.x, 16);   // まっすぐ投げた時、パネルのまん中へ向く角度
const DEBUG = /[?&]debug/.test(location.search);

const PL = [

function makeNoise(seed){
  const R=rng(seed);const perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(R()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]];}
  const P=new Uint8Array(512);for(let i=0;i<512;i++)P[i]=perm[i&255];
  const V=new Float32Array(256);for(let i=0;i<256;i++)V[i]=R();
  const h=(x,y)=>V[P[P[x&255]+(y&255)]];
  const n=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};

  const n=makeNoise(seed);

    for(let j=0;j<h;j++)for(let i=0;i<w;i++){

    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    if(curP) setPlanet(curP);
  }
  function setPlanet(P){ curP=P; if(!ctx) return; const t=ctx.currentTime;

  function setMute(m){ if(!ctx) return; master.gain.setTargetAtTime(m?0:.9,ctx.currentTime,.03); }

    const t=ctx.currentTime+delay; const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter(); f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    s.connect(f);f.connect(g);g.connect(dest); s.start(t); s.stop(t+dur+.05);
  }
  function tone(dest,{f=440,f1=null,dur=.3,vol=.3,type='sine',delay=0,attack=.005}){
    const t=ctx.currentTime+delay; const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);

    throw(kmh){ if(!ctx) return; const s=clamp(kmh/100,.2,1.4);

      tone(world,{f:900,f1:500,dur:.12,vol:.25,type:'triangle'});

    frame(){ if(!ctx) return;

    land(){ if(!ctx) return; tone(world,{f:80,f1:35,dur:.6,vol:.8}); noise(world,{dur:.7,f0:600,f1:120,q:.6,vol:.5}); },
    whoosh(){ if(!ctx) return; noise(world,{dur:1.6,f0:300,f1:1800,q:.6,vol:.25,attack:.9}); },
    tick(){ if(!ctx) return; tone(ui,{f:880,dur:.07,vol:.18,type:'triangle'}); },
    five(){ if(!ctx) return; [659,880].forEach((f,i)=>tone(ui,{f,dur:.25,vol:.22,type:'triangle',delay:i*.09})); },
    clear(){ if(!ctx) return; [523,659,784,1047].forEach((f,i)=>tone(ui,{f,dur:.45,vol:.25,type:'triangle',delay:i*.1})); },
    perfect(){ if(!ctx) return; [523,659,784,1047,1319,1568].forEach((f,i)=>{tone(ui,{f,dur:.6,vol:.24,type:'triangle',delay:i*.08});tone(ui,{f:f*2,dur:.4,vol:.06,type:'sine',delay:i*.08});});

  };

function makeSky({top,horizon,bottom,sunDir=null,sunColor='#fff',sunSize=0,glow=0,glowPow=8,curve=.55}){
  const mat=new THREE.ShaderMaterial({
    uniforms:{top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(horizon)},bot:{value:new THREE.Color(bottom)},
      sd:{value:new THREE.Vector3(...(sunDir||[0,-1,0])).normalize()},sc:{value:new THREE.Color(sunColor)},ss:{value:sunSize},gl:{value:glow},gp:{value:glowPow},cv:{value:curve}},
    vertexShader:`varying vec3 vD;void main(){vD=normalize(position);vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;gl_Position.z=gl_Position.w*.99999;}`,
    fragmentShader:`uniform vec3 top,hor,bot,sc,sd;uniform float ss,gl,gp,cv;varying vec3 vD;
      void main(){vec3 d=normalize(vD);float h=d.y;vec3 c;
        if(h>=0.){c=mix(hor,top,pow(clamp(h/.9,0.,1.),cv));}else{c=mix(hor,bot,clamp(-h*6.,0.,1.));}
        float s=max(dot(d,sd),0.);
        c+=sc*gl*pow(s,gp);
        if(ss>0.)c+=sc*smoothstep(1.-ss,1.-ss*.55,s)*2.5;
        gl_FragColor=vec4(c,1.);}`,
    side:THREE.BackSide,depthWrite:false,fog:false,toneMapped:false});
  const m=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),mat); m.renderOrder=-10; m.frustumCulled=false; return m;
}
function makeStars(count,seed,{minY=-.02,size=1.6,bright=1}={}){
  const R=rng(seed);const pos=[],col=[];
  for(let i=0;i<count;i++){let x,y,z,l;do{x=R()*2-1;y=R()*2-1;z=R()*2-1;l=Math.hypot(x,y,z);}while(l>1||l<.1);
    x/=l;y/=l;z/=l; if(y<minY) continue; pos.push(x*1400,y*1400,z*1400);
    const b=(.35+.65*Math.pow(R(),2.2))*bright; const tint=R(); col.push(b*(tint<.15?.8:1),b*(tint>.85?.85:1),b*(tint<.15?1:tint>.85?.7:1));}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size,sizeAttenuation:false,vertexColors:true,fog:false,depthWrite:false,transparent:true,map:DOT_TEX,toneMapped:false});
  const p=new THREE.Points(g,m);p.renderOrder=-9;p.frustumCulled=false;return p;
}

function playMask(x,z){ // 遊ぶ場所は平らに
  const dx=Math.max(Math.abs(x)-7,0), dz=Math.max(z-9,0,-27-z);
  return smooth(clamp(Math.hypot(dx,dz)/28,0,1));
}
function buildTerrain({size=560,seg=160,height,color,flat=true,rough=1,detail}){
  const geo=new THREE.PlaneGeometry(size,size,seg,seg); geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position; const cols=new Float32Array(pos.count*3); const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i), z=pos.getZ(i)-8; const y=height(x,z); pos.setY(i,y); pos.setZ(i,z); color(x,z,y,c); cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
  let g2=geo; if(flat){ g2=geo.toNonIndexed(); }
  g2.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:rough,metalness:0,flatShading:flat,map:detail||null});
  const m=new THREE.Mesh(g2,mat); m.receiveShadow=true; return m;
}
function scatterRocks(group,{n,seed,color,minD=12,maxD=160,size=[.2,1.4],flatY=false,heightFn,avoid=true}){
  const R=rng(seed); const geo=new THREE.DodecahedronGeometry(1,0);
  const mat=new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true});
  const mesh=new THREE.InstancedMesh(geo,mat,n); const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),s=new THREE.Vector3(),p=new THREE.Vector3();
  let k=0; let tries=0;
  while(k<n && tries<n*20){ tries++;
    const a=R()*Math.PI*2, d=minD+Math.pow(R(),1.6)*(maxD-minD); const x=Math.cos(a)*d, z=Math.sin(a)*d-8;
    if(avoid && Math.abs(x)<4.5 && z>-24 && z<9) continue;
    const sz=lerp(size[0],size[1],Math.pow(R(),2.2)); const y=heightFn(x,z);
    e.set(R()*3,R()*3,R()*3); q.setFromEuler(e); s.set(sz*(.8+R()*.6),sz*(.5+R()*.4),sz*(.8+R()*.6)); p.set(x,y+sz*.15,z);
    m4.compose(p,q,s); mesh.setMatrixAt(k++,m4);
  }
  mesh.count=k; mesh.castShadow=true; mesh.receiveShadow=true; group.add(mesh); return mesh;
}

function planetTex(kind,seed){
  const n=makeNoise(seed);
  return canvasTex(512,256,(x,w,h)=>{const im=x.createImageData(w,h);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=i/w,v=j/h; const lat=Math.abs(v-.5)*2;
      const nx=Math.cos(u*Math.PI*2)*2, nz=Math.sin(u*Math.PI*2)*2; // 横につながるように
      const f=n.fbm(nx+3+v*2.5,nz+v*5,5); const f2=n.fbm(nx*2+9,nz*2+v*9,4);
      let r,g,b;
      if(kind==='earth'){
        const land=f>.53&&lat<.85; if(land){r=60+f2*90;g=110+f2*60;b=55;} else {r=20;g=70+f2*30;b=150+f2*60;}
        if(lat>.82){r=g=b=235;}
        const cl=n.fbm(nx*1.6+20,nz*1.6+v*7,5); if(cl>.56){const a=clamp((cl-.56)*6,0,.92);r=lerp(r,250,a);g=lerp(g,252,a);b=lerp(b,255,a);}
      }else if(kind==='charon'){
        const base=150+f2*50; r=g=b=base; if(v<.22){const a=(.22-v)/.22;r=lerp(r,120,a);g=lerp(g,75,a);b=lerp(b,60,a);} }
      else if(kind==='io'){ r=225+f2*25;g=195+f*40;b=80+f2*30; if(f2>.62){r=140;g=60;b=30;} if(f2<.3){r=250;g=245;b=200;} }
      else if(kind==='europa'){ r=225;g=215;b=200; const l=Math.abs(Math.sin((u*30+f*8))); if(l<.06){r=150;g=105;b=80;} }
      else if(kind==='phobos'){ r=g=b=80+f2*50; r+=8; }
      else if(kind==='moonday'){ r=g=b=200+f2*40; if(f>.55){r=g=b=150;} }
      const k=(j*w+i)*4; im.data[k]=r;im.data[k+1]=g;im.data[k+2]=b;im.data[k+3]=255;}
    x.putImageData(im,0,0);});
}

function disposeEnv(){
  if(!env) return; scene.remove(env);
  env.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ for(const k in m){ const v=m[k]; if(v&&v.isTexture&&v!==DOT_TEX) v.dispose(); } m.dispose(); }); } });
  env=null; envUpdate=null;
}

    const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#fffdf6'); g.addColorStop(1,'#ece6d6'); x.fillStyle=g; x.fillRect(0,0,w,h);

const panelSide=new THREE.MeshStandardMaterial({color:'#dcd6c6',roughness:.7});
const panelBack=new THREE.MeshStandardMaterial({color:'#c9c2b0',roughness:.8});
const panels=[];
for(let r=0;r<3;r++)for(let c=0;c<3;c++){
  const idx=r*3+c; const tex=numberTex(idx+1);
  const front=new THREE.MeshStandardMaterial({map:tex,roughness:.55,emissive:'#ffffff',emissiveMap:tex,emissiveIntensity:0});
  const m=new THREE.Mesh(new THREE.BoxGeometry(PANEL,PANEL,PANEL_T),[panelSide,panelSide,panelSide,panelSide,front,panelBack]);
  m.castShadow=true; m.receiveShadow=true;
  const home=new THREE.Vector3((c-1)*PITCH,BOARD_Y+(1-r)*PITCH,0);
  m.position.copy(home); board.add(m);
  panels.push({mesh:m,home,on:true,flying:false,v:new THREE.Vector3(),w:new THREE.Vector3(),rest:false,front});

function resetPanels(){ for(const p of panels){ p.on=true; p.flying=false; p.rest=false; p.mesh.visible=true; p.mesh.position.copy(p.home); p.mesh.rotation.set(0,0,0); if(p.mesh.parent!==board){ scene.remove(p.mesh); board.add(p.mesh);} } }

  const MAX=420; const geo=new THREE.SphereGeometry(.032,8,6);
  const mat=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.85,depthWrite:false,fog:false});
  const mesh=new THREE.InstancedMesh(geo,mat,MAX); mesh.count=0; mesh.frustumCulled=false; scene.add(mesh);
  const ringMat=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.9,depthWrite:false,side:THREE.DoubleSide,fog:false});
  const ring=new THREE.Mesh(new THREE.RingGeometry(.09,.14,28),ringMat); ring.visible=false; scene.add(ring);
  const m4=new THREE.Matrix4(); let last=null; let target=.85;
  return {
    reset(color){ mesh.count=0; last=null; mat.color.set(color); ringMat.color.set(color); ring.visible=false; target=.85; mat.opacity=.85; ringMat.opacity=.9; },
    add(x,y,z){ if(mesh.count>=MAX) return; if(last){ const d=Math.hypot(x-last[0],y-last[1],z-last[2]); if(d<.22) return; } last=[x,y,z]; m4.makeTranslation(x,y,z); mesh.setMatrixAt(mesh.count++,m4); mesh.instanceMatrix.needsUpdate=true; },
    mark(x,y,z,flat){ ring.visible=true; ring.position.set(x,y,z); ring.rotation.set(flat?-Math.PI/2:0,0,0); },
    dim(){ target=.42; },
    clear(){ mesh.count=0; ring.visible=false; last=null; },

/* ---------- かけら・ほこり ---------- */
const fx=(()=>{
  const MAX=260; const geo=new THREE.BoxGeometry(1,1,1);
  const mat=new THREE.MeshStandardMaterial({roughness:.7});
  const mesh=new THREE.InstancedMesh(geo,mat,MAX); mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAX*3),3); mesh.count=MAX; mesh.frustumCulled=false; mesh.castShadow=true; scene.add(mesh);
  const P=[]; for(let i=0;i<MAX;i++) P.push({life:0});
  const dust=[]; const DMAX=70;
  for(let i=0;i<DMAX;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT_TEX,transparent:true,depthWrite:false,opacity:0})); s.visible=false; scene.add(s); dust.push({s,life:0});}
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), sv=new THREE.Vector3(), pv=new THREE.Vector3(), col=new THREE.Color();
  let pi=0, di=0;
  function shard(x,y,z,vx,vy,vz,color,size,life){ const idx=pi; const p=P[pi]; pi=(pi+1)%MAX; Object.assign(p,{x,y,z,vx,vy,vz,size,life,max:life,rx:Math.random()*6,ry:Math.random()*6,wx:(Math.random()-.5)*20,wy:(Math.random()-.5)*20}); mesh.setColorAt(idx,col.set(color)); mesh.instanceColor.needsUpdate=true; }
  function puff(x,y,z,vx,vy,vz,color,size,life,grow){ const d=dust[di]; di=(di+1)%DMAX; Object.assign(d,{x,y,z,vx,vy,vz,size,life,max:life,grow}); d.s.material.color.set(color); d.s.visible=true; }
  function update(dt,Pl){
    const air=Pl.k/KE>.1?Pl.k/KE:0; const drag=air>0?Math.min(air,12)*2.2:0;
    for(let i=0;i<MAX;i++){const p=P[i]; if(p.life<=0){ m4.makeScale(0,0,0); mesh.setMatrixAt(i,m4); continue; }
      p.life-=dt; p.vy-=Pl.g*dt; const f=Math.exp(-drag*dt*.6); p.vx*=f;p.vy*=f;p.vz*=f; p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
      const gy=groundAt(p.x,p.z); if(gy!==null && p.y<gy+p.size*.5){p.y=gy+p.size*.5; p.vy*=-.25; p.vx*=.6;p.vz*=.6; p.wx*=.5;p.wy*=.5;}
      p.rx+=p.wx*dt;p.ry+=p.wy*dt; const sc=p.size*Math.min(1,p.life/.4);
      e.set(p.rx,p.ry,0); q.setFromEuler(e); sv.set(sc,sc*.35,sc); pv.set(p.x,p.y,p.z); m4.compose(pv,q,sv); mesh.setMatrixAt(i,m4);}
    mesh.instanceMatrix.needsUpdate=true;
    for(const d of dust){ if(d.life<=0){ if(d.s.visible) d.s.visible=false; continue; }
      d.life-=dt; const t=1-d.life/d.max;
      if(air>0){ const f=Math.exp(-dt*(2+drag)); d.vx*=f;d.vy*=f;d.vz*=f; d.vy+=dt*.15; }
      else { d.vy-=Pl.g*dt; }
      d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;
      const gy=groundAt(d.x,d.z); if(air===0&&gy!==null&&d.y<gy){d.life=0;}
      const s=d.size*(air>0?(1+t*d.grow):1); d.s.scale.set(s,s,1); d.s.position.set(d.x,d.y,d.z);
      d.s.material.opacity=(air>0?.55:.8)*Math.min(1,d.life/d.max*2)*(t<.1?t*10:1); }
  }
  function clear(){ for(const p of P) p.life=0; for(const d of dust){d.life=0;d.s.visible=false;} }
  return {shard,puff,update,clear};
})();
function dustBurst(x,y,z,Pl,count,strength,color){
  const air=Pl.k/KE>.1;
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2; const sp=strength*(.4+Math.random()*.8);
    fx.puff(x,y+.05,z,Math.cos(a)*sp,(air?.3:1)*sp*(.4+Math.random()),Math.sin(a)*sp,color,air?.35:.12,air?1.4+Math.random():2.5,air?2.5:0);}
}

/* =========================================================
   ボールの計算（重力と空気だけ）
   ========================================================= */
function launchVel(kmh,yaw){ const v=kmh/3.6, a=YAW0+yaw; return {vx:v*Math.cos(THETA)*Math.sin(a), vy:v*Math.sin(THETA), vz:-v*Math.cos(THETA)*Math.cos(a)}; }
function integrate(b,P,dt){ const s=Math.hypot(b.vx,b.vy,b.vz), k=P.k;
  b.vx-=k*s*b.vx*dt; b.vy-=(P.g+k*s*b.vy)*dt; b.vz-=k*s*b.vz*dt;
  b.px+=b.vx*dt; b.py+=b.vy*dt; b.pz+=b.vz*dt; }
// パネル面のどこを通ったか
function boardTest(hx,hy,onList){
  const dx=hx, dy=hy-BOARD_Y;
  const col=Math.round(dx/PITCH), row=Math.round(-dy/PITCH);
  const lim=PANEL/2+BALL_R*.6;
  if(Math.abs(col)<=1&&Math.abs(row)<=1&&Math.abs(dx-col*PITCH)<=lim&&Math.abs(dy+row*PITCH)<=lim){
    const idx=(row+1)*3+(col+1); return onList[idx]?{type:'panel',idx}:{type:'hole',idx}; }
  if(Math.abs(dx)<=OUT+BALL_R*.5&&Math.abs(dy)<=OUT+BALL_R*.5) return {type:'frame'};
  if(dy>OUT) return {type:'over',dist:dy};
  if(dy<-OUT) return {type:'under'};
  return {type:dx>0?'right':'left'};
}
// 結果だけを先に計算する（お手本の説明・確認用）
function simulate(P,kmh,yaw,onList=[1,1,1,1,1,1,1,1,1]){
  const b={px:REL.x,py:REL.y,pz:REL.z,...launchVel(kmh,yaw)};
  for(let t=0;t<20;t+=PHYS_DT){ const pz=b.pz, py=b.py, px=b.px; integrate(b,P,PHYS_DT);
    if(pz>BOARD_Z&&b.pz<=BOARD_Z){const f=(pz-BOARD_Z)/(pz-b.pz); const r=boardTest(lerp(px,b.px,f),lerp(py,b.py,f),onList); r.hy=lerp(py,b.py,f); return r;}
    const gy=groundAt(b.px,b.pz); if(gy!==null&&b.py-BALL_R<gy&&py-BALL_R>=gy-.05) return {type:'short',landZ:b.pz,dist:b.pz-BOARD_Z};
    if(gy===null&&py>=0&&b.py<0) b.zAt0=b.pz;
    if(gy===null&&b.py<0) return {type:'short',landZ:b.zAt0??b.pz,dist:(b.zAt0??b.pz)-BOARD_Z};
  }
  return {type:'lost'};
}

function dragKmh(dy){ const L=Math.max(0,dy-DRAG_DEAD); const r=Math.min(1,L/dragLmax()); return {kmh:MAX_KMH*Math.pow(r,DRAG_POW), r}; }
const kmhToR=k=>Math.pow(clamp(k/MAX_KMH,0,1),1/DRAG_POW);

function drawSwipe(){
  const gEl=$('game'); const w=gEl.clientWidth,h=gEl.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(!w||!h) return;
  if(swipeCv.width!==Math.round(w*dpr)||swipeCv.height!==Math.round(h*dpr)){swipeCv.width=Math.round(w*dpr);swipeCv.height=Math.round(h*dpr);}

function setArm(state){ const A=G.arm; A.state=state; A.t=0; if(state==='throw'){ A.a0=A.a; A.b0=A.b; } else handBall.visible=(state==='ready'); }
function updateArm(dt){
  const A=G.arm; A.t+=dt; const R=astro.R, L=astro.L, body=astro.body;
  if(A.state==='throw'){
    const t=clamp(A.t/.3,0,1); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

    body.rotation.x=lerp(.04,-.3,Math.sin(t*Math.PI*.9)); body.rotation.y=lerp(.18,-.22,e);
    if(t>=1){ A.state='follow'; A.t=0; A.a+=Math.PI*2; }
  } else if(A.state==='follow'){
    const t=clamp(A.t/.35,0,1); A.a=lerp(A.a,.25,1-Math.exp(-dt*8)); A.b=lerp(A.b,.35,1-Math.exp(-dt*8));
    body.rotation.x=lerp(body.rotation.x,-.08,1-Math.exp(-dt*6)); body.rotation.y=lerp(body.rotation.y,0,1-Math.exp(-dt*6));
  } else if(A.state==='rest'){
    A.a=lerp(A.a,.15,1-Math.exp(-dt*6)); A.b=lerp(A.b,.25,1-Math.exp(-dt*6)); body.rotation.x=lerp(body.rotation.x,0,1-Math.exp(-dt*6)); body.rotation.y=lerp(body.rotation.y,0,1-Math.exp(-dt*6));
  } else { // ready
    const br=Math.sin(gameTime*2.2)*.04;
    const wind=DRAG.on?DRAG.r:0;
    A.a=lerp(A.a,-2.35+br-wind*.55,1-Math.exp(-dt*7)); A.b=lerp(A.b,.75+wind*.35,1-Math.exp(-dt*7));
    body.rotation.x=lerp(body.rotation.x,.05,1-Math.exp(-dt*5)); body.rotation.y=lerp(body.rotation.y,.18,1-Math.exp(-dt*5));
  }
  R.sh.rotation.set(A.a,0,.28); R.el.rotation.set(A.b,0,0);
  A.la=lerp(A.la??1.3,A.state==='throw'||A.state==='follow'?.45:A.state==='rest'?.15:1.3,1-Math.exp(-dt*10));
  L.sh.rotation.set(A.la,0,-.3); L.el.rotation.set(A.state==='rest'?.2:.6,0,0);
  body.position.y=.95+Math.sin(gameTime*2.2)*.006;
}

/* =========================================================
   毎フレームの計算
   ========================================================= */
const onList=()=>panels.map(p=>p.on);
function physStep(dt){
  for(const b of balls){
    if(b.dead) continue;
    b.age+=dt;
    if(b.rest){ continue; }
    const px=b.px,py=b.py,pz=b.pz;
    integrate(b,P,dt);
    // パネル面を通りぬけた時
    if(!b.crossed&&pz>BOARD_Z&&b.pz<=BOARD_Z){
      b.crossed=true; const f=(pz-BOARD_Z)/(pz-b.pz); const hx=lerp(px,b.px,f), hy=lerp(py,b.py,f);
      const live=onList(); const r=b.demo?boardTest(hx,hy,live.map(()=>0)):boardTest(hx,hy,live);
      r.hy=hy;
      if(b.touched){ // 地面に落ちた後のボールは、パネルを抜けない
        if(r.type==='panel'||r.type==='hole'||r.type==='frame'){ b.vz=-b.vz*.25; b.pz=BOARD_Z+.01; b.crossed=false; }
      } else if(b.demo){
        if(r.type==='frame'){ b.vz=-b.vz*.3; b.vx*=.5; b.pz=BOARD_Z+.01; }
        trail.mark(hx,hy,BOARD_Z+.06,false); resolveBall(b,r);
      } else {
        if(r.type==='panel'){ breakPanel(r.idx,b,hx,hy); b.vx*=.35; b.vy*=.35; b.vz*=.32; }
        else if(r.type==='frame'){ b.vz=-b.vz*.3; b.vx*=.5; b.pz=BOARD_Z+.01; Sfx.frame(); sparks(hx,hy); }
        trail.mark(hx,hy,BOARD_Z+.06,false); resolveBall(b,r);
      }
    }
    // 地面
    const gy=groundAt(b.px,b.pz);
    if(gy===null&&py>=0&&b.py<0&&!b.crossed) b.zAt0=b.pz;
    if(gy!==null&&b.py-BALL_R<gy&&(py-BALL_R>=gy-.05||b.vy===0)){ // 上から落ちた時だけ着地（台の横はすりぬけて下へ）
      b.py=gy+BALL_R;
      if(b.vy<0){
        const imp=-b.vy;
        if(!b.touched){ b.touched=true;
          if(!b.resolved&&!b.crossed){ trail.mark(b.px,gy+.02,b.pz,true); resolveBall(b,{type:'short',landZ:b.pz,dist:b.pz-BOARD_Z}); } }
        if(imp>.8){ Sfx.thud(imp); dustBurst(b.px,gy,b.pz,P,Math.min(8,2+imp*.6|0),Math.min(2.5,.4+imp*.12),P.id==='moon'||P.id==='pluto'?'#cfd2d8':P.id==='mars'?'#c47a52':P.id==='venus'?'#a87a4a':P.id==='earth'?'#b6a079':'#ddd'); }
        b.vy=imp*.3<.5?0:imp*.3; b.vx*=.6; b.vz*=.6;
      }
      if(b.vy===0){ const sp=Math.hypot(b.vx,b.vz); const dec=.35*P.g*dt; if(sp<=dec||sp<.05){ b.vx=b.vz=0; b.rest=1; } else { b.vx*=1-dec/sp; b.vz*=1-dec/sp; } }
    }
    if(gy===null&&b.py<0&&!b.resolved&&!b.crossed){ const z=b.zAt0??b.pz; b.touched=true; resolveBall(b,{type:'short',landZ:z,dist:z-BOARD_Z}); } // 台の高さより下へ落ちたら手前
    if(!b.resolved&&b.age>12) resolveBall(b,{type:'lost'});
    if(b.record) trail.add(b.px,b.py,b.pz);
  }
  // 抜けたパネル
  for(const p of panels){ if(!p.flying||p.rest) continue;
    const m=p.mesh; const s=Math.hypot(p.v.x,p.v.y,p.v.z); const k=P.k*3;
    p.v.x-=k*s*p.v.x*dt; p.v.y-=(P.g+k*s*p.v.y)*dt; p.v.z-=k*s*p.v.z*dt;
    m.position.x+=p.v.x*dt; m.position.y+=p.v.y*dt; m.position.z+=p.v.z*dt;
    m.rotation.x+=p.w.x*dt; m.rotation.y+=p.w.y*dt; m.rotation.z+=p.w.z*dt;
    const gy=groundAt(m.position.x,m.position.z+BOARD_Z);
    if(gy!==null&&m.position.y<gy+.06){ m.position.y=gy+.06; if(p.v.y<0){ const imp=-p.v.y; p.v.y=imp*.25; p.v.x*=.5; p.v.z*=.5; p.w.multiplyScalar(.4); if(imp<.8){ p.rest=true; p.restT=0; } } }
    if(m.position.y<-50) { p.rest=true; m.visible=false; }
  }
}
function breakPanel(idx,b,hx,hy){
  const p=panels[idx]; p.on=false; p.flying=true; p.rest=false;
  const sp=Math.hypot(b.vx,b.vy,b.vz);
  p.v.set(b.vx*.28+(hx-p.home.x)*1.5, Math.max(.6,sp*.12)+b.vy*.15, b.vz*.32);
  p.w.set(-(3+Math.random()*4)*Math.sign(-b.vz||1), (Math.random()-.5)*3, (Math.random()-.5)*5);
  Sfx.hit(); G.shake=Math.max(G.shake,.06);
  const cols=['#f7f4ea','#2350d8','#e8392b','#f7f4ea'];
  for(let i=0;i<12;i++){ const a=Math.random()*Math.PI*2, s=1+Math.random()*2.5;
    fx.shard(hx,hy,BOARD_Z+.05,Math.cos(a)*s*.8+b.vx*.1,Math.sin(a)*s+.8,(Math.random()-.2)*s*.6+b.vz*.06,cols[i%4],.06+Math.random()*.05,2.5+Math.random()*2); }
  const air=P.k/KE>.1; for(let i=0;i<(air?6:10);i++){ const a=Math.random()*Math.PI*2; fx.puff(hx,hy,BOARD_Z+.05,Math.cos(a)*(air?1:2),Math.sin(a)*(air?1:2),air?.5:1.2,'#ffffff',air?.3:.08,air?.9:1.6,air?2:0); }
}
function sparks(hx,hy){ for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2,s=2+Math.random()*3; fx.shard(hx,hy,BOARD_Z+.1,Math.cos(a)*s,Math.sin(a)*s+1,Math.random()*2,i%2?'#ffd34d':'#ffffff',.035,.6+Math.random()*.4); } G.shake=Math.max(G.shake,.04); }

function updateBalls(dt){
  for(let i=balls.length-1;i>=0;i--){ const b=balls[i];
    b.mesh.position.set(b.px,b.py,b.pz);
    const sp=Math.hypot(b.vx,b.vy,b.vz); b.mesh.rotation.x-=sp*dt*4; b.mesh.rotation.y+=sp*dt*1.5;
    // しばらくしたら消す
    let fadeOut=false;
    if(b.resolved && b.age-b.resolveAge>(b.rest?1.4:3.5)) fadeOut=true;
    if(b.py<-30||Math.abs(b.px)>200||b.pz<-400) fadeOut=true;
    if(fadeOut){ b.fade-=dt*2.5; b.mesh.material.opacity=Math.max(0,b.fade); b.mesh.children[0].material.opacity=Math.max(0,b.fade)*.5; if(b.fade<=0){ scene.remove(b.mesh); b.mesh.material.dispose(); b.mesh.children[0].material.dispose(); balls.splice(i,1); } }
  }
  for(const p of panels){ if(p.rest&&p.flying&&p.mesh.visible){ p.restT=(p.restT||0)+dt; const m=p.mesh; // ねかせる
      const tx=Math.round((m.rotation.x-Math.PI/2)/Math.PI)*Math.PI+Math.PI/2, ty=Math.round(m.rotation.y/Math.PI)*Math.PI;
      const k=1-Math.exp(-dt*8); m.rotation.x=lerp(m.rotation.x,tx,k); m.rotation.y=lerp(m.rotation.y,ty,k);
      const gy=groundAt(m.position.x,m.position.z+BOARD_Z); if(gy!==null) m.position.y=lerp(m.position.y,gy+PANEL_T/2+.005,k); } }
}

/* ---------- カメラ ---------- */
const tmpV=new THREE.Vector3(), tmpL=new THREE.Vector3(); let baseFov=30;
function updateCamera(dt){
  const A=G.camAnim;
  const wantFov=(A&&A.orbit)?55:baseFov; if(Math.abs(camera.fov-wantFov)>.01){ camera.fov=A&&A.orbit?wantFov:lerp(camera.fov,wantFov,A?Math.min(1,dt*3):1); camera.updateProjectionMatrix(); }
  if(A&&A.orbit){ A.t+=dt;
    camera.position.set(2.2+Math.sin(A.t*.15)*2.2,5.2+Math.sin(A.t*.23)*.25,7.6); camera.lookAt(0,-2.2,-6); }
  else if(A){ A.t+=dt; const t=ease(clamp(A.t/A.dur,0,1));
    tmpV.copy(A.from).lerp(CAM_POS,t); tmpL.copy(A.fromLook).lerp(CAM_LOOK,t); camera.position.copy(tmpV); camera.lookAt(tmpL); if(A.t>=A.dur) G.camAnim=null; }
  else { camera.position.copy(CAM_POS); camera.lookAt(CAM_LOOK); }
  if(G.shake>0){ camera.position.x+=(Math.random()-.5)*G.shake; camera.position.y+=(Math.random()-.5)*G.shake; G.shake=Math.max(0,G.shake-dt*.6); }
}
function resize(){
  const el=$('game'); const w=el.clientWidth, h=el.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  // パネルが画面の横はばの半分くらいに見えるように
  const hf=14.5*DEG; let vf=2*Math.atan(Math.tan(hf/2)/camera.aspect)/DEG; baseFov=clamp(vf,26,40);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('game'));
window.addEventListener('resize',()=>{resize();checkRotate();});

/* ---------- 横向きの時は止める ---------- */
const coarse=matchMedia('(pointer:coarse)');
function checkRotate(){ const land=coarse.matches&&window.innerWidth>window.innerHeight&&window.innerHeight<540; $('rotate').style.display=land?'flex':'none'; G.blocked=land; }
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();checkRotate();},250));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&['aim','demo'].includes(G.mode)&&!G.paused){ G.paused=true; screen('menu'); } });

/* ---------- ループ ---------- */
let last=performance.now(), acc=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-last)/1000,DEBUG?.25:.05); last=now;
  const frozen=G.paused||G.blocked;
  if(frozen) dt=0;
  gameTime+=dt; runTimers();
  acc+=dt; let n=0; while(acc>=PHYS_DT&&n<(DEBUG?80:40)){ physStep(PHYS_DT); acc-=PHYS_DT; n++; }
  updateBalls(dt); fx.update(dt,P); trail.update(dt); updateArm(dt); updateCamera(dt);
  if(envUpdate) envUpdate(gameTime,dt);
  drawSwipe(); updateGauge();
  if(!(DEBUG&&window.__noRender)) renderer.render(scene,camera);
}

/* ---------- はじまり ---------- */
refreshMute(); refreshSens(); hudScore();
resize(); checkRotate();
P=PL[0]; buildPlanet(P);
$('loading').remove();
showTitle();
requestAnimationFrame(loop);

/* ---------- 確認用（?debug の時だけ） ---------- */
if(DEBUG){
  window.PS={G,PL,simulate,groundAt:(x,z)=>groundAt(x,z),enterPlanet,startRun,showResult,onThrow:(k,y)=>onThrow(k,y*DEG),dragKmh,
    throwAt:(k,yawDeg=0)=>onThrow(k,yawDeg*DEG),buildPlanet:(i)=>{P=G.P=PL[i];buildPlanet(P);},balls:()=>balls,panels,
    setResults:(arr)=>{G.results=arr;}, BOARD_Z, BOARD_Y, YAW0};
}
</script>
