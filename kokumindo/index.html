function skipEnding() {

  G.et = Math.max(G.et, CONFIG.END_SEC[G.endN]); G.sfxI = ENDINGS[G.endN].sfx.length; cutSfx(); hide('skipBtn');
}
function finishEnding() { if (G.endFrom === 'zukan') openZukan(G.zkFrom); else showResult(); }

// ===== [SEC:UI] =====
function refreshTitle() {
  $('zkCount').textContent = `${Object.keys(SV.ends).length}/4`;
  $('bestTxt').textContent = SV.best >= 0 ? `ベスト国民度 ${SV.best}%` : '';
}
function showResult() {
  G.state = 'result'; cutSfx(); hideAll(); show('result'); $('result').scrollTop = 0;
  const r = G.res, e = ENDS[r.n];
  $('rNum').textContent = r.pct; $('rEnd').textContent = `END ${r.n}「${e.name}」`; $('rCom').textContent = e.com;
  $('rNew').classList.toggle('hidden', !r.newEnd);
  $('rTags').innerHTML = advice(r.s).map(s => `<span>${s}</span>`).join('');
  $('rBest').textContent = r.newBest && SV.plays > 1 ? `ベスト更新！ 最高 ${SV.best}%` : `これまでの最高 ${SV.best}%`;
  $('rZukanBtn').textContent = `エンディング図鑑 ${Object.keys(SV.ends).length}/4`;
  const cv = $('rFlag'), w = cv.clientWidth || 300, h = w / 1.5, d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  paintShape(x, G.pts, h, 0, 0, 1); trueCircle(x, 0, 0, h, 1);
  ads('ad2');
}
function openZukan(from) {
  G.state = 'zukan'; G.zkFrom = from; cutSfx(); hideAll(); show('zukan'); $('zukan').scrollTop = 0;
  const got = Object.keys(SV.ends).length; $('zkSub').textContent = `${got}/4 見ました`;
  const ul = $('zkList'); ul.innerHTML = '';
  for (let n = 1; n <= 4; n++) {
    const sv = SV.ends[n], li = document.createElement('li'); li.className = 'zk' + (sv ? '' : ' lock');
    const cv = document.createElement('canvas'); cv.width = 270; cv.height = 360; const x = cv.getContext('2d');
    if (sv) { x.setTransform(0.75, 0, 0, 0.75, 0, -75); ENDINGS[n].draw(x, ENDINGS[n].thumb, { pct: sv.pct, img: makeFlagImg(sv.pts) }); }
    else { x.fillStyle = '#2a3140'; x.fillRect(0, 0, 270, 360); x.fillStyle = 'rgba(255,255,255,.5)'; x.font = `800 90px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('？', 135, 180); }
    li.appendChild(cv);
    li.insertAdjacentHTML('beforeend', `<span class="no">END ${n}</span><span class="nm">${sv ? ENDS[n].name : '？？？'}</span><span class="cd">${condText(n)}${sv ? `（記録 ${sv.pct}%）` : ''}</span>`);
    if (sv) { const b = document.createElement('button'); b.className = 'sml'; b.textContent = '見る'; b.onclick = () => playEnding(n, sv.pts, sv.pct, 'zukan'); li.appendChild(b); }
    ul.appendChild(li);
  }
}
function share() {
  const r = G.res; if (!r) return;
  const txt = `日の丸を一筆で描いたら、国民度 ${r.pct}% でした。\nEND${r.n}「${ENDS[r.n].name}」\n#国民度チェック`;
  open('https://x.com/intent/post?text=' + encodeURIComponent(txt) + '&url=' + encodeURIComponent(CONFIG.URL), '_blank', 'noopener');
}
function ads(id) { const z = $(id); if (!z || z.firstChild || !/(^|\.)nkworks-games\.com$/.test(location.hostname)) return; z.innerHTML = '<ins class="adsbygoogle" data-ad-client="ca-pub-2073267239630350" data-ad-slot="6261635446"></ins>'; try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {} }
function muteLabel() { $('muteBtn').classList.toggle('off', SV.mute); }
$('startBtn').onclick = () => { ac(); startDraw(); };
$('zukanBtn').onclick = () => openZukan('title');
$('toEndBtn').onclick = () => playEnding(G.res.n, G.pts, G.res.pct, 'result');
$('againBtn').onclick = startDraw;
$('shareBtn').onclick = share;
$('rZukanBtn').onclick = () => openZukan('result');
$('rTitleBtn').onclick = goTitle;
$('zkBack').onclick = () => (G.zkFrom === 'result' && G.res ? showResult() : goTitle());
$('skipBtn').onclick = skipEnding;
$('muteBtn').onclick = () => { SV.mute = !SV.mute; writeSave(); muteLabel(); if (SV.mute) { cutSfx(); penStop(); } else ac(); };

// ===== [SEC:INPUT] =====
const CV = $('c'), CTX = CV.getContext('2d');
const toFlag = e => [(e.clientX - F.x) / F.h, (e.clientY - F.y) / F.h];
CV.addEventListener('pointerdown', e => {
  ac();
  if (G.state === 'draw' && !G.down) {
    e.preventDefault(); G.down = true; G.pid = e.pointerId; try { CV.setPointerCapture(e.pointerId); } catch (er) {}
    G.pts = [toFlag(e)]; G.len = 0; $('drawWarn').textContent = ''; penStart(); return;
  }
  if (G.state === 'ending' && G.et >= CONFIG.END_SEC[G.endN]) finishEnding();
});
CV.addEventListener('pointermove', e => {
  if (!G.down || e.pointerId !== G.pid) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) {
    const p = toFlag(ev), q = G.pts[G.pts.length - 1], d = Math.hypot(p[0] - q[0], p[1] - q[1]);
    if (d > 0.006) { G.pts.push(p); G.len += d; penMove(d); }
  }
});
function pointerEnd(e) {
  if (!G.down || e.pointerId !== G.pid) return;
  G.down = false; penStop();
  if (G.len < CONFIG.MIN_LEN) { G.pts = []; $('drawWarn').textContent = 'もっと大きく、ぐるっと描いてね'; return; } // 小さすぎる線は描きミスとして無視
  submit();
}
CV.addEventListener('pointerup', pointerEnd);
CV.addEventListener('pointercancel', pointerEnd);
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

// ===== [SEC:LOOP] =====
function stage(c) { const S = CONFIG.STAGE, k = Math.min(VW / S.W, VH / S.H); c.setTransform(DPR * k, 0, 0, DPR * k, DPR * (VW - S.W * k) / 2, DPR * (VH - S.H * k) / 2); }
function drawBackdrop(c, t, withFlag) { // タイトル・結果・図鑑の背景
  stage(c); band(c, -900, 1540, PAPER);
  c.save(); c.translate(180, 280); c.rotate(t * 0.05); c.fillStyle = 'rgba(188,0,45,.07)';
  for (let i = 0; i < 16; i++) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 1400, i * TAU / 16, i * TAU / 16 + TAU / 32); c.closePath(); c.fill(); }
  c.restore();
  if (withFlag) { c.fillStyle = 'rgba(0,0,0,.08)'; c.beginPath(); c.ellipse(96, 500, 30, 6, 0, 0, TAU); c.fill(); flagOnPole(c, WHITE, 96, 204, 500, 170, t, 0.05); }
}
function drawDesk(c) { // 描く画面
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = PAPER; c.fillRect(0, 0, VW, VH);
  c.save(); c.shadowColor = 'rgba(0,0,0,.2)'; c.shadowBlur = 18; c.shadowOffsetY = 6; c.fillStyle = '#fff'; c.fillRect(F.x, F.y, F.w, F.h); c.restore();
  c.strokeStyle = 'rgba(29,42,58,.25)'; c.lineWidth = 1; c.strokeRect(F.x + 0.5, F.y + 0.5, F.w - 1, F.h - 1);
  const pts = G.pts; if (!pts.length) return;
  const clipFlag = () => { c.save(); c.beginPath(); c.rect(F.x, F.y, F.w, F.h); c.clip(); };
  const openLine = a => { c.save(); c.globalAlpha = a; shapePath(c, pts, F.h, F.x, F.y, false); c.lineJoin = c.lineCap = 'round'; c.lineWidth = CONFIG.BRUSH * F.h; c.strokeStyle = RED; c.stroke(); c.restore(); };
  if (G.state === 'draw') { openLine(0.3); clipFlag(); openLine(1); c.restore(); return; }
  const J = CONFIG.JUDGE, fa = easeOut(seg(G.jt, 0, J.FILL));
  openLine(0.3 * (1 - fa)); clipFlag(); paintShape(c, pts, F.h, F.x, F.y, fa, CONFIG.BRUSH + (CONFIG.LINE_FINAL - CONFIG.BRUSH) * fa); c.restore();
  trueCircle(c, F.x, F.y, F.h, seg(G.jt, J.FILL, J.FILL + J.REVEAL));
}
let last = 0, T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; T += dt;
  const c = CTX;
  if (G.state === 'title') drawBackdrop(c, T, true);
  else if (G.state === 'draw' || G.state === 'judge') { if (G.state === 'judge') updateJudge(dt); drawDesk(c); }
  else if (G.state === 'ending') { updateEnding(dt); stage(c); const D = ENDINGS[G.endN]; D.draw(c, G.et, G.E); captions(c, G.et, D.caps(G.E.pct)); endCard(c, G.et, G.endN, G.endFrom); }
  else drawBackdrop(c, T, false);
  requestAnimationFrame(frame);
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); VW = window.innerWidth; VH = window.innerHeight;
  CV.width = Math.round(VW * DPR); CV.height = Math.round(VH * DPR); layoutFlag();
}

// ===== [SEC:TEST] =====
// 確認用：?end=1〜4 でそのエンディングから（&t=秒 で途中から）
function testShape(n) {
  const [cx, cy, r, w] = [null, [0.45, 0.3, 0.16, 0.1], [0.82, 0.55, 0.38, 0.05], [0.76, 0.52, 0.33, 0.03], [0.75, 0.5, 0.3, 0.01]][n], pts = [];
  for (let i = 0; i <= 60; i++) { const a = i / 60 * TAU, rr = r * (1 + w * Math.sin(a * 3)); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return pts;
}
function runTest(q) {
  const n = clamp(Math.round(+q.get('end')) || 4, 1, 4), pts = testShape(n), s = scoreShape(pts), pct = Math.floor(s.pct);
  G.pts = pts; G.res = { s, pct, n, newBest: false, newEnd: false };
  playEnding(n, pts, pct, 'result');
  if (q.has('t')) { G.et = +q.get('t') || 0; const L = ENDINGS[n].sfx; while (G.sfxI < L.length && L[G.sfxI][0] <= G.et) G.sfxI++; }
}

// ===== [SEC:BOOT] =====
loadSave(); resize(); window.addEventListener('resize', resize); muteLabel(); refreshTitle();
const Q = new URLSearchParams(location.search);
if (Q.has('end')) runTest(Q);
requestAnimationFrame(frame);
</script>
