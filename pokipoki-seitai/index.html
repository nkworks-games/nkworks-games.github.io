function computeRating(c, rec) {

  for (const [id, s] of Object.entries(c.stiff)) if (id !== 'neck' && s >= CONFIG.STIFF_MIN) stiffSum += s;
  for (const [id, q] of Object.entries(rec.cracked)) {
    if (id === 'neck') continue; const s = c.stiff[id] || 0;
    if (s >= CONFIG.MINOR_MIN) { got += s * (0.4 + 0.6 * q); if (s * q > bestV) { bestV = s * q; best = id; } } else extras++;

  let score = CONFIG.SCORE_BASE + CONFIG.SCORE_CRACK * Math.min(1.15, got / Math.max(0.5, stiffSum));
  score -= Math.max(0, extras - CONFIG.FREE_EXTRA) * CONFIG.PEN_EXTRA;
  score -= rec.pains * CONFIG.PEN_PAIN + rec.discomforts * CONFIG.PEN_DISCOMFORT + Math.max(0, rec.fails - CONFIG.FREE_FAIL) * CONFIG.PEN_FAIL;
  if (rec.neck) score -= CONFIG.PEN_NECK; else if (c.wantsNeck) score += CONFIG.BONUS_REFUSE_NECK;
  if (rec.hospital) score = 0;
  score = Math.max(0, score);
  const stars = 1 + CONFIG.STAR_TH.filter(t => score >= t).length;
  const left = Object.entries(c.stiff).filter(([id, s]) => id !== 'neck' && s >= CONFIG.LEFT_MIN && rec.cracked[id] === undefined).sort((a, b) => b[1] - a[1]).map(([id]) => JMAP[id].nm2);
  return { score, stars, best: best ? JMAP[best].nm2 : null, left, extras };
}

  { t: '1. 悩みを聞いて、場所を選ぶ', p: 'お客さんの話がヒントです。こっている場所を、全身19か所の中から自分で選んで鳴らします。', svg: `<svg viewBox="0 0 300 150"><rect x="20" y="20" width="160" height="60" rx="14" fill="#fff" stroke="#2b2622" stroke-width="3"/><text x="100" y="47" font-size="14" text-anchor="middle" font-weight="700">右の腰が重くて…</text><text x="100" y="67" font-size="12" text-anchor="middle" fill="#6d655b">（問診）</text><g transform="translate(215,18)"><circle cx="30" cy="12" r="10" fill="#efe6d6"/><rect x="16" y="24" width="28" height="50" rx="8" fill="#efe6d6"/><rect x="18" y="72" width="10" height="45" rx="5" fill="#efe6d6"/><rect x="32" y="72" width="10" height="45" rx="5" fill="#efe6d6"/><circle cx="38" cy="62" r="6" fill="#e76f51" stroke="#b8533a" stroke-width="2"/></g><text x="150" y="135" font-size="13" text-anchor="middle" fill="#6d655b">●をタップ →「施術する」</text></svg>` },
  { t: '2. ゆっくり押して、ゆるみを取る', p: '画面を指で押したまま、矢印の向きにゆっくり動かします。手ごたえが重くなって緑の輪になった所が「壁」。プロも、まずここまでゆるみを取ってから突きます。', svg: `<svg viewBox="0 0 300 150"><circle cx="90" cy="75" r="34" fill="none" stroke="#2a9d8f" stroke-width="7"/><path d="M90 75 L200 75" stroke="#2b2622" stroke-width="5" stroke-linecap="round"/><path d="M200 75 l-14 -10 v20 z" fill="#2b2622"/><text x="150" y="125" font-size="14" text-anchor="middle" font-weight="700">ゆっくり → 重くなったら止める</text></svg>` },
  { t: '3. 息を吐く時に、短くはじく', p: '上の「はー（吐く）」の間は体の力が抜けています。そこで指を矢印の向きに、短く・素早くはじくとポキッ！ 吸っている時や、深く突きすぎると「痛っ！」になります。', svg: `<svg viewBox="0 0 300 150"><rect x="60" y="18" width="180" height="30" rx="15" fill="#fff" stroke="#4a90d9" stroke-width="3"/><text x="150" y="39" font-size="15" text-anchor="middle" font-weight="900" fill="#2f6db0">はー（吐く）</text><path d="M110 95 L165 95" stroke="#e76f51" stroke-width="7" stroke-linecap="round"/><path d="M178 95 l-16 -11 v22 z" fill="#e76f51"/><text x="210" y="102" font-size="22" font-weight="900">ポキッ</text><text x="150" y="138" font-size="13" text-anchor="middle" fill="#6d655b">短く・速く（長く押しこまない）</text></svg>` },
  { t: '4. 首はやってはいけない', p: '首を急にひねる施術は、首の血管を傷つけるなどの危険があるとされています（厚生労働省も注意しています）。鳴らすとお客さんの具合が悪くなり、救急車で運ばれて「病院送り」に。たのまれても、やらないのがプロです。', svg: `<svg viewBox="0 0 300 150"><circle cx="150" cy="60" r="32" fill="#efe6d6" stroke="#d03c2c" stroke-width="4"/><path d="M128 38 L172 82 M172 38 L128 82" stroke="#d03c2c" stroke-width="6" stroke-linecap="round"/><text x="150" y="125" font-size="14" text-anchor="middle" font-weight="800" fill="#d03c2c">首を鳴らすと病院送り</text></svg>` },
  { t: '5. お会計で口コミがつく', p: 'こっている場所を上手に鳴らすほど★が増えます。関係ない場所ばかり鳴らすと、逆に減ることも。「痛っ！」を3回出しても病院送りです。5人の口コミで、エンドが決まります（全員★5なら…？）。', svg: `<svg viewBox="0 0 300 150"><rect x="40" y="20" width="220" height="110" rx="14" fill="#fff" stroke="#e3dccf" stroke-width="2"/><text x="60" y="55" font-size="24" fill="#f4a52a">★★★★★</text><text x="60" y="85" font-size="13">右の腰が鳴った瞬間、</text><text x="60" y="105" font-size="13">10年分のコリが抜けました。</text></svg>` },
];
let howI = 0;
function openHow() { howI = 0; renderHow(); $('howto').classList.remove('hide'); G.paused = true; }
function renderHow() { const h = HOW[howI]; $('howPage').innerHTML = `<h3>${h.t}</h3>${h.svg}<p>${h.p}</p>`; $('howPg').textContent = `${howI + 1} / ${HOW.length}`; $('howPrev').textContent = howI === 0 ? 'とじる' : 'もどる'; $('howNext').textContent = howI === HOW.length - 1 ? 'はじめる' : 'つぎへ'; }
function closeHow() { $('howto').classList.add('hide'); G.paused = false; try { localStorage.setItem('pokipoki_howto', '1'); } catch (e) { } }
$('howPrev').onclick = () => { sndTap(); if (howI === 0) closeHow(); else { howI--; renderHow(); } };
$('howNext').onclick = () => { sndTap(); if (howI === HOW.length - 1) closeHow(); else { howI++; renderHow(); } };
$('btnHow').onclick = () => { initAudio(); sndTap(); openHow(); };
$('btnHelp').onclick = () => { sndTap(); openHow(); };
$('btnHome').onclick = () => { sndTap(); confirmBox('タイトルにもどりますか？<br><span style="font-size:13px;font-weight:600">今日の営業はリセットされます。</span>', goTitle); };
$('btnStart').onclick = () => { initAudio(); sndTap(); let seen = false; try { seen = !!localStorage.getItem('pokipoki_howto'); } catch (e) { } startDay(Date.now() % 1e9); if (!seen) openHow(); };
$('btnSound').onclick = () => { SND.on = !SND.on; $('btnSound').textContent = '音：' + (SND.on ? 'ON' : 'OFF'); initAudio(); if (SND.master) SND.master.gain.value = SND.on ? 0.9 : 0; sndTap(); };
$('btnDo').onclick = () => { if (G.sel) { sndTap(); beginTech(G.sel); } };
$('btnPay').onclick = () => {
  sndTap();
  const n = Object.keys(G.rec.cracked).length;
  confirmBox(n ? `お会計にしますか？<br><span style="font-size:13px;font-weight:600">鳴らした場所：${n}か所</span>` : 'まだどこも鳴らしていません。<br>このままお会計にしますか？', checkout);
};
$('btnQuit').onclick = () => { sndTap(); setState('select'); };

// ===== [SEC:LAYOUT] =====
let VIEW = { x: 0, y: 0, w: 1, h: 1 };
function layout() {
  const W = innerWidth, H = innerHeight; const port = H > W * 1.05;
  renderer.setSize(W, H, false); camera.aspect = W / H;
  const panel = $('panel'); panel.classList.toggle('port', port); panel.classList.toggle('land', !port);
  const top = 54;
  if (G.state === 'select') VIEW = port ? { x: 0, y: top, w: W, h: H * 0.53 - top } : { x: 0, y: top, w: W - 290, h: H - top };
  else if (G.state === 'tech') VIEW = { x: 0, y: top, w: W, h: H - top - 70 };
  else VIEW = { x: 0, y: 0, w: W, h: H };
  const cx = VIEW.x + VIEW.w / 2, cy = VIEW.y + VIEW.h / 2;
  camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H); camera.updateProjectionMatrix();
}
addEventListener('resize', layout);

// ===== [SEC:CAMERA] =====
function fitDist(radius) {
  const H = innerHeight, t = Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV / 2));
  const half = Math.min(Math.atan(t * VIEW.h / H), Math.atan(t * VIEW.w / H));
  return radius / Math.sin(Math.max(0.05, half));
}
function updateCamera(dt) {
  const port = innerHeight > innerWidth * 1.05;
  const W = G.cam.wantPos, T = G.cam.wantTgt;
  if (G.state === 'tech' && tech.joint && P) {
    contactWorld(T); T.y += 0.02;
    const dir = port ? new THREE.Vector3(0.55, 1.0, 0.75) : new THREE.Vector3(0.12, 0.95, 1.0);
    W.copy(T).addScaledVector(dir.normalize(), fitDist(CONFIG.TECH_R));
  } else if (G.state === 'title') {
    T.set(-0.05, 0.86, 0); const a = Math.sin(G.time * 0.15) * 0.35;
    const dir = port ? new THREE.Vector3(1.0, 0.95, 0.35 + a) : new THREE.Vector3(0.35 + a, 0.8, 1.0);
    W.copy(T).addScaledVector(dir.normalize(), fitDist(CONFIG.OVERVIEW_R) * 1.05);
  } else {
    T.set(-0.02, CONFIG.TABLE_TOP + 0.1, 0);
    const dir = port ? new THREE.Vector3(1.0, 1.15, 0.25) : new THREE.Vector3(0.05, 0.95, 1.0);
    W.copy(T).addScaledVector(dir.normalize(), fitDist(CONFIG.OVERVIEW_R));
  }
  // 壁より外に出さない（部屋の中におさめる）
  const R = CONFIG.ROOM; W.x = clamp(W.x, R.x0 + 0.2, R.x1 - 0.2); W.z = clamp(W.z, R.z0 + 0.2, R.z1 - 0.2); W.y = clamp(W.y, 0.3, R.h - 0.1);
  const k = 1 - Math.exp(-CONFIG.CAM_LERP * dt);
  G.cam.pos.lerp(W, k); G.cam.tgt.lerp(T, k);
}

// ===== [SEC:INPUT] =====
canvas.addEventListener('pointerdown', e => { if (G.paused) return; if (G.state === 'tech') { canvas.setPointerCapture(e.pointerId); tech.pid = e.pointerId; techDown(e.clientX, e.clientY, e.timeStamp / 1000); } });
canvas.addEventListener('pointermove', e => { if (G.paused || e.pointerId !== tech.pid) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; for (const ev of (evs.length ? evs : [e])) techMove(ev.clientX, ev.clientY, ev.timeStamp / 1000); });
const upH = e => { if (e.pointerId !== tech.pid) return; tech.pid = null; if (!G.paused) techUp(e.clientX, e.clientY, e.timeStamp / 1000); };
canvas.addEventListener('pointerup', upH); canvas.addEventListener('pointercancel', upH);
document.addEventListener('visibilitychange', () => { if (document.hidden) { paused = true; if (tech.phase === 'press' || tech.phase === 'thrust') { tech.phase = 'ready'; tech.pid = null; } } else { paused = false; last = performance.now(); } });

// ===== [SEC:OVERLAY] =====
function updateOverlay() {
  const ov = $('overlay'); let h = '';
  if (G.state === 'tech' && tech.joint && P && tech.phase !== 'posing') {
    const c = contactWorld(new THREE.Vector3()); const a = screenOf(c);
    const d = tech.phase === 'press' || tech.phase === 'thrust' ? tech.dir : screenDir();
    const r = tech.r, R = 40 - Math.min(r, 1.2) * 12;
    const col = r > 1.12 ? '#e5483a' : r >= 0.85 ? '#2a9d8f' : '#ffffff';
    const w = r >= 0.85 ? 6 : 3;
    h += `<circle cx="${a.x}" cy="${a.y}" r="${R}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="${w + 3}"/><circle cx="${a.x}" cy="${a.y}" r="${R}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
    if (tech.phase === 'ready' || tech.phase === 'press') {
      const L = 92, x2 = a.x + d.x * L, y2 = a.y + d.y * L, pulse = 0.55 + 0.45 * Math.sin(G.time * 6);
      const nx = -d.y, ny = d.x;
      h += `<g opacity="${tech.phase === 'press' ? 0.55 : pulse}"><line x1="${a.x + d.x * (R + 6)}" y1="${a.y + d.y * (R + 6)}" x2="${x2}" y2="${y2}" stroke="#2b2622" stroke-width="7" stroke-linecap="round"/><line x1="${a.x + d.x * (R + 6)}" y1="${a.y + d.y * (R + 6)}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M${x2 + d.x * 16} ${y2 + d.y * 16} L${x2 + nx * 11} ${y2 + ny * 11} L${x2 - nx * 11} ${y2 - ny * 11} Z" fill="#fff" stroke="#2b2622" stroke-width="3" stroke-linejoin="round"/></g>`;
      const hint = $('hint'); if (!hint.classList.contains('hide')) { hint.style.left = clamp(a.x, 130, innerWidth - 130) + 'px'; hint.style.top = clamp(a.y - R - 46, 60, innerHeight - 110) + 'px'; }
    }
  }
  ov.innerHTML = h;
  // 吹き出し
  const b = $('bubble');
  if (!b.classList.contains('hide') && P) {
    const p = screenOf(headWorld(new THREE.Vector3()));
    b.style.left = clamp(p.x, 120, innerWidth - 120) + 'px'; b.style.top = clamp(p.y - 30, 110, innerHeight - 40) + 'px';
  }
  // 呼吸
  if (G.state === 'tech' || G.state === 'select') {
    const br = $('breath'); br.className = G.inhale ? 'in' : 'out';
    $('breathTxt').textContent = G.inhale ? 'すー（吸う）' : 'はー（吐く）';
    $('breathBar').style.width = (G.breathP * 100).toFixed(0) + '%';
  }
}

// ===== [SEC:LOOP] =====
let acc = 0, last = performance.now(), manual = false, paused = false;
function tick(dt) {
  if (G.paused) return;
  G.time += dt;
  updateBreath(dt);
  if (G.fx.snap > 0) G.fx.snap = Math.max(0, G.fx.snap - dt * 5);
  if (G.fx.shake > 0) G.fx.shake = Math.max(0, G.fx.shake - dt * 3);
  if (G.fx.bubbleT > 0) { G.fx.bubbleT -= dt; if (G.fx.bubbleT <= 0) $('bubble').classList.add('hide'); }
  updateTech(dt);
  updateEnding(dt);
  updateBody(dt);
  updateCamera(dt);
}
function update(frameDt) {
  acc += Math.min(frameDt, CONFIG.MAX_FRAME);
  while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; }
}
function render() {
  camera.position.copy(G.cam.pos);
  if (G.fx.shake > 0) camera.position.add(tv1.set((Math.random() - 0.5), (Math.random() - 0.5), 0).multiplyScalar(0.006 * G.fx.shake));
  camera.lookAt(G.cam.tgt);
  if (P) { P.group.updateMatrixWorld(true); placeTechHands(); }
  updateOverlay();
  renderer.render(scene, camera);
}
function frame(now) { if (!paused && !manual) update((now - last) / 1000); last = now; render(); requestAnimationFrame(frame); }

// ===== [SEC:INIT] =====
buildRoom(); buildTable(); layout();
$('btnStart').disabled = true; $('btnStart').textContent = '読み込み中…';
const BOOT = Promise.all([loadHands(), loadRoomAssets(), loadPerson(CUSTOMERS[0].glb)]).then(() => { $('btnStart').disabled = false; $('btnStart').textContent = '営業スタート（5人）'; showTitlePatient(); })
  .catch(() => { $('btnStart').textContent = '読み込みに失敗しました（再読み込みしてください）'; });
G.cam.pos.set(0.6, 2.0, 2.6);
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
let synthT = 1000;
function simulateAttempt(r) {
  const md = minDim(); const target = 0.45 + ((r * 7.31) % 1) * 0.85, amp = 0.008 + ((r * 13.7) % 1) * 0.14, perpBad = ((r * 3.3) % 1) < 0.1;
  let x = innerWidth / 2, y = innerHeight / 2; synthT += 1;
  techDown(x, y, synthT); const d = tech.dir;
  for (let i = 0; i < 400 && tech.phase === 'press' && tech.r < target; i++) { x += d.x * 1.5; y += d.y * 1.5; synthT += 0.016; techMove(x, y, synthT); }
  if (tech.phase !== 'press') return;
  const steps = 4, px = amp * md / steps;
  for (let i = 0; i < steps && (tech.phase === 'press' || tech.phase === 'thrust'); i++) { x += d.x * px + (perpBad ? -d.y * px * 1.5 : 0); y += d.y * px + (perpBad ? d.x * px * 1.5 : 0); synthT += 0.006; techMove(x, y, synthT); }
  synthT += 0.01; techUp(x, y, synthT);
}
window.__TEST__ = {
  keys: [],
  randomInput(r) {
    if (G.paused) { $('howto').classList.add('hide'); $('confirm').classList.add('hide'); G.paused = false; }
    if (G.state === 'intake') { startTreatment(); return; }
    if (G.state === 'review') { nextCustomer(); return; }
    if (G.state === 'select') { if (r < 0.1) { checkout(); return; } const j = JOINTS[Math.floor(r * 1999) % JOINTS.length]; G.sel = j.id; if (G.rec.cracked[j.id] === undefined) beginTech(j.id); return; }
    if (G.state === 'tech') { if (tech.phase === 'ready') { if (r < 0.06) setState('select'); else simulateAttempt(r); } }
  },
  reset(seed) { manual = true; G.paused = false; $('howto').classList.add('hide'); startDay(seed); },
  fast: false,
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); if (!this.fast) render(); },
  state() { return { s: G.state, cust: G.day ? G.day.idx : -1, phase: tech.phase, joint: tech.joint && tech.joint.id, r: +tech.r.toFixed(3), cracked: G.rec ? Object.keys(G.rec.cracked).length : 0, pains: G.rec ? G.rec.pains : 0, over: G.state === 'result' }; },
  check() {
    const v = [];
    if (!P) { if (G.state !== 'loading' && G.state !== 'title') v.push('お客さんの体がない'); return v; }
    P.group.updateMatrixWorld(true);
    for (const n of P.info.names) { const p = P.info.byName[n].getWorldPosition(tv1); if (!okNum(p.x) || !okNum(p.y) || !okNum(p.z)) { v.push('体の位置がNaN: ' + n); break; } }
    for (const k of ['x', 'y', 'z']) if (!okNum(camera.position[k])) v.push('カメラがNaN');
    const R = CONFIG.ROOM; if (camera.position.x < R.x0 || camera.position.x > R.x1 || camera.position.z < R.z0 || camera.position.z > R.z1 || camera.position.y < 0) v.push('カメラが部屋の外');
    // 施術台へのめり込み（台の上にある部分だけ）
    const { lo, who } = lowestSkinned(5);
    if (lo < CONFIG.TABLE_TOP - 0.025) v.push(`施術台にめり込み ${((CONFIG.TABLE_TOP - lo) * 100).toFixed(1)}cm（${who}・姿勢${P.to.posture}・切替${P.blend.toFixed(2)}）`);
    if (HANDS.root.visible) for (const s of ['L', 'R']) { const h = HANDS.side[s].root.position; if (!okNum(h.x) || !okNum(h.y) || !okNum(h.z)) v.push('手がNaN'); }
    if (!okNum(tech.r) || tech.r < 0) v.push('ゆるみの値がおかしい');
    if (G.day) { for (const r of G.day.reviews) if (r.stars < 1 || r.stars > 5) v.push('★が範囲外'); if (G.day.idx > G.day.list.length) v.push('お客さんの数がおかしい'); }
    if (G.state === 'tech' && !tech.joint) v.push('施術中なのに場所がない');
    return v;
  },
  dbg: { get P() { return P; }, setFace, CUSTOMERS, computeRating, G, tech, beginTech, techDown, techMove, techUp, setState, checkout, showEnding, finishDay, startHospital, startTreatment, selectJoint, nextCustomer, JOINTS },
  ready: false,
};
BOOT.then(() => { window.__TEST__.ready = true; });
</script>
