<style>
/* ===== [SEC:CSS] ===== */
:root{--ac:#ff6b2c;--ac2:#ffd23f;--ink:#10151d;--glass:rgba(14,18,26,.74)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#20262f;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}
#c,#ov{position:fixed;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
.hide{display:none!important}
.btn{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:999px;padding:15px 28px;font-size:18px;color:#fff;background:var(--ac);box-shadow:0 6px 0 #c2461a,0 12px 26px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;min-width:220px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2461a,0 4px 12px rgba(0,0,0,.35)}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 6px 0 #c3c9d2,0 12px 26px rgba(0,0,0,.3)}
.btn.sub:active{box-shadow:0 2px 0 #c3c9d2}
.rbtn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);color:#fff;font:inherit;font-size:20px;font-weight:800;pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center}
#back{left:10px}#snd{right:10px;font-size:15px}#snd.off{opacity:.45}
#chg{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 92px);border:0;border-radius:999px;padding:7px 12px;background:var(--glass);color:#fff;font:inherit;font-size:12px;font-weight:800;pointer-events:auto;cursor:pointer}
/* スコアボード */
#hud{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top) + 10px);display:flex;justify-content:center;pointer-events:none}
#sb{display:flex;align-items:stretch;background:var(--glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:800}
#sb .teams{display:flex;flex-direction:column;justify-content:center;padding:6px 10px;gap:1px;min-width:98px}
#sb .tm{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;line-height:1.3}
#sb .tm span{display:flex;align-items:center;gap:6px;font-style:normal}
#sb .tm i{width:8px;height:8px;border-radius:50%;display:inline-block}
#sb .tm em{font-style:normal}
#sb .tm b{font-size:16px;min-width:14px;text-align:right}
#sb .inn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;background:rgba(255,255,255,.07);font-size:18px;line-height:1}
#sb .inn small{font-size:10px;opacity:.85;margin-top:3px}
#sb .cnt{display:grid;grid-template-columns:auto auto;align-items:center;gap:1px 6px;padding:6px 8px 6px 10px;font-size:10px}
#sb .cnt i{display:inline-block;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);margin-right:3px;vertical-align:-1px}
#sb .cnt i.b.on{background:#3ddc84}#sb .cnt i.s.on{background:#ffd23f}#sb .cnt i.o.on{background:#ff5a4e}
#bases{position:relative;width:40px;align-self:center;height:32px;margin:0 9px 0 0}
#bases i{position:absolute;width:11px;height:11px;transform:rotate(45deg);background:rgba(255,255,255,.2);border-radius:2px}
#bases i.on{background:var(--ac2);box-shadow:0 0 8px rgba(255,210,63,.7)}#bases i.pop{animation:bpop .8s ease-out}
@keyframes bpop{0%{transform:rotate(45deg) scale(2.4);box-shadow:0 0 18px rgba(255,210,63,1)}100%{transform:rotate(45deg) scale(1)}}
#bases i:nth-child(1){right:3px;top:12px}#bases i:nth-child(2){left:14px;top:2px}#bases i:nth-child(3){left:3px;top:12px}
#who{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);font-size:12px;font-weight:700;background:rgba(14,18,26,.55);padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
#call{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:44px;font-weight:800;letter-spacing:.02em;pointer-events:none;opacity:0;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 24px rgba(0,0,0,.35)}
#call.show{animation:pop 1.25s ease-out forwards}
#call small{display:block;font-size:16px;margin-top:6px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.6)}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#info{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 50px);font-weight:800;font-size:15px;background:var(--glass);padding:7px 12px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .25s}
#info.show{opacity:1}#info b{font-size:22px;color:var(--ac2);margin-right:2px}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6);transition:opacity .3s}
#vbtns{position:fixed;left:50%;transform:translateX(-50%);bottom:180px;display:flex;gap:6px;pointer-events:auto}
#vbtns button{white-space:nowrap;border:0;border-radius:999px;padding:9px 11px;font:inherit;font-size:13px;font-weight:800;background:rgba(14,18,26,.62);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#vbtns button.on{background:var(--ac2);color:var(--ink)}
#vbtns.pulse button{animation:pl .8s ease-in-out infinite alternate}
#vbtns button.kime{padding:4px 12px;box-shadow:inset 0 0 0 2px var(--ac2),0 3px 0 rgba(0,0,0,.25)}#vbtns button small{display:block;font-size:10px;opacity:.9}
#bFree{min-width:0;width:min(310px,88vw);padding:11px 0;background:var(--ac2);color:var(--ink);box-shadow:0 6px 0 #c9a21f,0 12px 26px rgba(0,0,0,.3)}
#freeTeams{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;text-align:left}
#freeTeams li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.06);cursor:pointer}
#freeTeams li.on{background:rgba(255,107,44,.16);box-shadow:inset 0 0 0 2px var(--ac)}#freeTeams i{width:12px;height:12px;border-radius:50%;flex:none}
#freeTeams div{flex:1;min-width:0}#freeTeams b{display:block;font-size:15px}#freeTeams small{display:block;font-size:11px;opacity:.8;margin-top:2px}
#freeTeams em{font-style:normal;font-size:12px;font-weight:800;color:var(--ac2);flex:none}
#freeLvT{margin-top:14px}#freeLv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
#freeLv button{border:0;border-radius:12px;padding:8px 0 5px;font:inherit;font-weight:800;font-size:17px;line-height:1.1;color:#fff;background:rgba(255,255,255,.08);cursor:pointer}
#freeLv button small{display:block;font-size:11px;min-height:12px;color:var(--ac2)}#freeLv button.on{background:var(--ac)}#freeLv button.on small{color:#fff}
@keyframes pl{to{transform:scale(1.12)}}
#help{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 134px);width:34px;height:34px;border-radius:50%;border:0;background:var(--glass);color:#fff;font:inherit;font-size:16px;font-weight:800;pointer-events:auto;cursor:pointer}
#demo{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 100px);text-align:center;font-size:17px;font-weight:800;line-height:1.5;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.75);padding:0 52px;white-space:pre-line}
/* タイトル */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 9vh) 20px calc(env(safe-area-inset-bottom) + 6vh);background:linear-gradient(180deg,rgba(16,20,28,.55),rgba(16,20,28,.05) 45%,rgba(16,20,28,.65));pointer-events:auto}
#title .logo{text-align:center}
#title h1{font-size:clamp(46px,13vw,72px);line-height:1.02;font-weight:800;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.35)}
#title h1 span{display:block;color:var(--ac2)}
#title p{margin-top:12px;font-size:14px;font-weight:700;opacity:.95;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#title .capmark{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0 42%,#e9eef5 43% 58%,transparent 59%),repeating-conic-gradient(#ffffff 0 5deg,#cfd6df 5deg 10deg);box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.08)}
#title .menu{display:flex;flex-direction:column;gap:16px;align-items:center}
#title .menu .row{display:flex;gap:10px}#title .menu .row .btn{min-width:0;width:min(150px,42vw);padding:11px 0}
#band{position:fixed;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;padding:12px 16px 14px;background:linear-gradient(90deg,transparent,rgba(14,18,26,.84) 16%,rgba(14,18,26,.84) 84%,transparent);pointer-events:none;opacity:0;z-index:12}
#band.show{animation:band 2.3s ease-out forwards}#band b{display:block;font-size:34px;font-weight:800;letter-spacing:.04em}#band b.gold{color:var(--ac2)}#band small{display:block;font-size:14px;font-weight:700;margin-top:4px;line-height:1.5}
@keyframes band{0%{opacity:0;transform:translateY(-50%) scaleY(.5)}9%{opacity:1;transform:translateY(-50%) scaleY(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-50%)}}
.btn.big{padding:17px 46px;font-size:21px}.btn.sm{padding:11px 18px;font-size:15px}
#title .note{margin-top:0;font-size:12px;min-height:16px}
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);background:rgba(10,13,18,.45);pointer-events:auto}
.panel{width:min(420px,100%);max-height:100%;overflow:auto;background:rgba(18,23,32,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:22px;padding:22px 18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center}
.panel h2{font-size:28px;font-weight:800;letter-spacing:.02em}.panel .sub{margin-top:6px;font-size:13px;font-weight:700;opacity:.85;line-height:1.5}
.panel .btns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px}.panel .rdl{font-size:13px;font-weight:800;opacity:.8}
#cupList{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
#cupList li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);opacity:.55}
#cupList li.next{opacity:1;background:rgba(255,107,44,.16);box-shadow:inset 0 0 0 2px var(--ac)}#cupList li.done{opacity:.9}
#cupList .rd{font-size:11px;font-weight:800;width:44px;flex:none;opacity:.85}#cupList i{width:12px;height:12px;border-radius:50%;flex:none}
#cupList div{flex:1;min-width:0}#cupList b{display:block;font-size:15px}#cupList small{display:block;font-size:11px;opacity:.8;margin-top:2px}
#cupList em{font-style:normal;font-size:12px;font-weight:800;color:var(--ac2);flex:none}#cupList li.done em{color:#3ddc84}
#resT{font-size:46px;margin-top:2px}#resT.win{color:var(--ac2)}#resT.lose{color:#9fb0c6}
#line{margin:16px auto 0;border-collapse:collapse;font-weight:800;font-size:14px}#line th,#line td{padding:6px 7px;text-align:center;min-width:22px}
#line th{font-size:11px;opacity:.7}#line td:first-child{text-align:left;min-width:52px;font-size:13px}
#line td.r{color:var(--ac2);font-size:17px;border-left:1px solid rgba(255,255,255,.15)}#line tr+tr td{border-top:1px solid rgba(255,255,255,.1)}
.lnk{pointer-events:auto;background:none;border:0;color:#fff;font:inherit;font-weight:800;font-size:14px;padding:6px 14px;cursor:pointer;opacity:.92;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.opt{margin-top:16px;text-align:left}.opt p{font-size:14px;font-weight:800;margin-bottom:8px}.opt small{display:block;font-size:11px;opacity:.75;margin-top:6px;line-height:1.5}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px;gap:4px}.seg button{flex:1;border:0;border-radius:999px;padding:10px 0;font:inherit;font-weight:800;font-size:14px;color:#fff;background:transparent;cursor:pointer}.seg button.on{background:var(--ac)}
#fade{position:fixed;inset:0;z-index:15;background:#0b0e13;opacity:0;pointer-events:none;transition:opacity .28s}#fade.on{opacity:1}
#title .foot{font-size:11px;opacity:.7;font-weight:700}#title .foot a{color:#fff;text-decoration:none;margin-right:10px}
/* 広告：タイトルと試合結果の画面だけ。パネルから75pxあけ、出ない時も枠ぶんの高さを残す */
.adwrap{margin:75px auto 0;min-height:50px;display:flex;justify-content:center;max-width:440px;pointer-events:auto;flex:none}
.adwrap ins{display:inline-block;width:320px;height:50px}
#res{flex-direction:column}#res .panel{max-height:calc(100% - 125px)}
@media (max-height:720px){#title .capmark{display:none}#title h1{font-size:44px}}
@media (max-height:700px){#title .menu{gap:11px}#title .btn.big{padding:14px 40px}}
#title .menu .row2 .btn{font-size:13px}#title .menu .row .btn.wide{width:min(310px,88vw)}
#bOn{background:#2f8cff;color:#fff;box-shadow:0 6px 0 #1d5fb8,0 12px 26px rgba(0,0,0,.3)}
.onJoin{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px}
.onJoin input{width:132px;font:inherit;font-weight:800;font-size:20px;text-align:center;letter-spacing:.2em;padding:10px 8px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;-webkit-user-select:text;user-select:text}
.onJoin .btn{min-width:0;padding:11px 16px}#onMenu .btns{margin-top:16px}.onJoin input::placeholder{letter-spacing:0;font-size:14px;color:rgba(255,255,255,.55)}
#onWait{margin-top:18px}.onCode{font-size:54px;font-weight:800;letter-spacing:.18em;color:var(--ac2);line-height:1.1}
#onWait .spin{width:30px;height:30px;margin:14px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--ac2);animation:sp .9s linear infinite}
.onErr{margin-top:10px;font-size:13px;font-weight:700;color:#ff8a7a;min-height:16px;line-height:1.5}
#load{position:fixed;inset:0;background:#1c222b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:14px;z-index:5}
#load .spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--ac2);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

// ===== [SEC:AUDIO] =====
// 音はすべてその場で合成（ファイルなし）。体育館の残響をかける
const AU = (() => {
  let ctx = null, out = null, rev = null, nb = null, on = store.get('snd', true);
  function init() {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    out = ctx.createGain(); out.gain.value = on ? 0.9 : 0; out.connect(ctx.destination);
    rev = ctx.createConvolver(); const L = (ctx.sampleRate * 1.9) | 0, ir = ctx.createBuffer(2, L, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < L; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 3.4); }
    rev.buffer = ir; const rg = ctx.createGain(); rg.gain.value = 0.3; rev.connect(rg); rg.connect(out);
    nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  const now = () => ctx.currentTime;
  function bus(g, wet) { const d = ctx.createGain(); d.gain.value = 1; d.connect(out); const w = ctx.createGain(); w.gain.value = wet; w.connect(rev); g.connect(d); g.connect(w); }
  function noise(t0, dur, freq, q, gain, type = 'bandpass', wet = 0.5) {
    const s = ctx.createBufferSource(); s.buffer = nb; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); bus(g, wet); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05); return f;
  }
  function tone(t0, dur, freq, gain, type = 'sine', wet = 0.4, f2) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); bus(g, wet); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const ok = () => ctx && on;
  return {
    get on() { return on; },
    toggle() { on = !on; store.set('snd', on); if (out) out.gain.value = on ? 0.9 : 0; return on; },
    resume() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
    flick() { if (!ok()) return; const t = now(); noise(t, 0.045, 3400, 2.5, 0.55, 'bandpass', 0.3); tone(t, 0.035, 2000, 0.14, 'triangle', 0.2, 1000); },
    whoosh(sp) { if (!ok()) return; const t = now(); const f = noise(t, 0.32, 800, 1.1, 0.06 + 0.08 * sp, 'bandpass', 0.15); f.frequency.exponentialRampToValueAtTime(2600, t + 0.3); },
    hit(q) { if (!ok()) return; const t = now(); // プラスチックバットの「コン」
      noise(t, 0.06, 1300 + 700 * q, 3, 0.8, 'bandpass', 0.8); tone(t, 0.13, 560 + 300 * q, 0.35 + 0.35 * q, 'triangle', 0.9, 380); tone(t, 0.05, 2300, 0.16, 'sine', 0.5, 1600); },
    tip() { if (!ok()) return; const t = now(); noise(t, 0.035, 2600, 4, 0.4, 'bandpass', 0.4); },
    bounce(v) { if (!ok() || v < 0.35) return; const t = now(), a = clamp(v / 9, 0.04, 0.5); noise(t, 0.022, 4300, 5, a, 'bandpass', 0.6); tone(t, 0.02, 2600 + Math.random() * 1200, a * 0.35, 'sine', 0.5); },
    fence() { if (!ok()) return; const t = now(); noise(t, 0.16, 380, 1.1, 0.55, 'lowpass', 0.6); tone(t, 0.15, 150, 0.4, 'sine', 0.6, 95); },
    mitt() { if (!ok()) return; const t = now(); noise(t, 0.05, 1000, 1.4, 0.5, 'bandpass', 0.45); tone(t, 0.05, 260, 0.25, 'sine', 0.35, 160); },
    swish() { if (!ok()) return; const t = now(); const f = noise(t, 0.17, 600, 0.9, 0.3, 'bandpass', 0.2); f.frequency.exponentialRampToValueAtTime(2800, t + 0.15); },
    claps(n = 12, spread = 1.4, lv = 1) { if (!ok()) return; const t = now(); for (let i = 0; i < n; i++) noise(t + Math.random() * spread, 0.03, 1500 + Math.random() * 900, 1.2, 0.12 * lv * (0.5 + Math.random()), 'bandpass', 0.8); },
    ui() { if (!ok()) return; const t = now(); tone(t, 0.07, 880, 0.12, 'sine', 0.2, 1320); },
  };
})();

function buildFloor() {
  const S = 1024, N = 40, sw = S / N, TILE = 2.4;
  const col = cTex(S, S, (g) => {

      for (let k = 0; k < n; k++) {

        const h = 30 + Math.random() * 9, s = 42 + Math.random() * 14, l = 66 + Math.random() * 11;

        g.fillRect(x, y0, sw, Math.min(y1, S) - y0); if (y1 > S) g.fillRect(x, 0, sw, y1 - S);

        const gx = x + 2 + Math.random() * (sw - 4), a = Math.random() * 2.2, kk = 1 + (Math.random() * 3 | 0), ph = Math.random() * 6.28;
        g.strokeStyle = `rgba(150,100,55,${0.08 + Math.random() * 0.14})`; g.lineWidth = 0.5 + Math.random() * 1.3; g.beginPath();
        for (let y = 0; y <= S; y += 16) { const xx = gx + a * Math.sin(y / S * 6.2832 * kk + ph); y ? g.lineTo(xx, y) : g.moveTo(xx, y); } g.stroke();
      }
      g.fillStyle = 'rgba(85,55,28,0.42)'; g.fillRect(x, 0, 1.1, S);
    }
  }, { rep: [36 / TILE, 32 / TILE] });
  const rough = cTex(256, 256, (g) => {
    g.fillStyle = 'rgb(70,70,70)'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 140; i++) { const v = 80 + Math.random() * 70; g.fillStyle = `rgba(${v},${v},${v},${0.25 + Math.random() * 0.3})`; g.beginPath(); g.ellipse(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 14, 1 + Math.random() * 5, Math.random() * 3, 0, 7); g.fill(); }
