html,body{margin:0;height:100%;background:#070b1c;overflow:hidden;overscroll-behavior:none}

#hud.on{opacity:1}
.top{position:absolute;left:10px;right:10px;top:calc(var(--safeT) + 10px);display:flex;gap:8px;align-items:stretch}

<script type="module">
import * as THREE from 'three';
const DEBUG=/[?&]debug/.test(location.search);

// こっそりスライド — ルール（ゲーム本体と解答プログラムで共通）
// 方向: 0=北(奥) 1=東(右) 2=南(手前) 3=西(左)
var KS = (function(){
  const DX=[0,1,0,-1], DY=[-1,0,1,0];
  const opp=d=>(d+2)&3;

  function initState(L){
    const cells=L.cells.slice();
    const pos=new Array(L.tiles.length).fill(-1);
    cells.forEach((t,c)=>{ if(t>=0) pos[t]=c; });
    return {cells,pos,pT:L.player,g:L.guards.map(g=>({t:g.t,d:g.d,k:0})),got:0};
  }
  function cloneS(S){ return {cells:S.cells.slice(),pos:S.pos.slice(),pT:S.pT,g:S.g.map(x=>({t:x.t,d:x.d,k:x.k})),got:S.got}; }
  function nb(L,c,d){ const x=c%L.w+DX[d], y=Math.floor(c/L.w)+DY[d]; if(x<0||y<0||x>=L.w||y>=L.h) return -1; return y*L.w+x; }
  function door(L,t,d){ return (L.tiles[t].doors>>d)&1; }
  // ドアどうしがつながっていれば、となりのマスを返す
  function link(L,S,c,d){
    const t=S.cells[c]; if(t<0||!door(L,t,d)) return -1;
    const n=nb(L,c,d); if(n<0) return -1; const u=S.cells[n]; if(u<0||!door(L,u,opp(d))) return -1; return n;
  }
  // 見張りに見られているマス（-1=見られていない、それ以外=見ている見張りの番号）
  function vision(L,S){
    const seen=new Array(L.w*L.h).fill(-1);
    S.g.forEach((g,i)=>{ let cur=S.pos[g.t]; if(seen[cur]<0) seen[cur]=i;
      for(let n=0;n<20;n++){ const nx=link(L,S,cur,g.d); if(nx<0) break; if(seen[nx]<0) seen[nx]=i; cur=nx; } });
    return seen;
  }
  function actions(L,S){
    const out=[]; const W=L.w*L.h;
    for(let e=0;e<W;e++){ if(S.cells[e]>=0) continue;
      for(let d=0;d<4;d++){ const c=nb(L,e,d); if(c<0) continue; const t=S.cells[c]; if(t<0||L.tiles[t].fixed) continue; out.push({k:'slide',from:c,to:e}); } }
    const pc=S.pos[S.pT];
    for(let d=0;d<4;d++){ const n=link(L,S,pc,d); if(n>=0) out.push({k:'step',d,from:pc,to:n}); }
    return out;
  }
  // 見張り1人の次の動き（盤面がこのままなら）
  function guardNext(L,S,i){
    const g=S.g[i], G=L.guards[i];
    if(G.kind==='turn'){ const k=(g.k+1)%G.pat.length; return {t:g.t,d:G.pat[k],k,turn:true}; }
    if(G.kind==='patrol'||G.kind==='patrolR'){
      const c=S.pos[g.t]; const n=link(L,S,c,g.d); const nt=n>=0?S.cells[n]:-1;
      if(n>=0 && !S.g.some((o,j)=>j!==i&&o.t===nt)) return {t:nt,d:g.d,k:g.k,move:true};
      return {t:g.t,d:G.kind==='patrol'?opp(g.d):(g.d+1)&3,k:g.k,turn:true};
    }
    return {t:g.t,d:g.d,k:g.k,stay:true};
  }
  // 1手すすめる
  function apply(L,S0,a){
    const S=cloneS(S0); const ev=[];
    if(a.k==='slide'){ const t=S.cells[a.from]; S.cells[a.to]=t; S.cells[a.from]=-1; S.pos[t]=a.to; ev.push({k:'slide',t,from:a.from,to:a.to}); }
    else {
      const nt=S.cells[a.to]; ev.push({k:'step',fromT:S.pT,toT:nt,d:a.d}); S.pT=nt;
      const gi=S.g.findIndex(g=>g.t===nt); if(gi>=0){ ev.push({k:'caught',gi,why:'bump'}); return {S,ev,res:'caught',gi}; }
    }
    L.items.forEach((it,i)=>{ if(!((S.got>>i)&1) && it.t===S.pT){ S.got|=1<<i; ev.push({k:'pick',i}); } });
    let seen=vision(L,S);
    if(seen[S.pos[S.pT]]>=0){ const gi=seen[S.pos[S.pT]]; ev.push({k:'caught',gi,why:'see'}); return {S,ev,res:'caught',gi}; }
    if(S.pT===L.exit && S.got===(1<<L.items.length)-1){ ev.push({k:'win'}); return {S,ev,res:'win'}; }
    for(let i=0;i<S.g.length;i++){
      const nx=guardNext(L,S,i), g=S.g[i];
      if(nx.move){ ev.push({k:'gmove',gi:i,fromT:g.t,toT:nx.t,d:g.d}); g.t=nx.t;
        if(nx.t===S.pT){ ev.push({k:'caught',gi:i,why:'walk'}); return {S,ev,res:'caught',gi:i}; } }
      else if(nx.turn){ ev.push({k:'gturn',gi:i,d0:g.d,d1:nx.d}); g.d=nx.d; g.k=nx.k; }
    }
    seen=vision(L,S);
    if(seen[S.pos[S.pT]]>=0){ const gi=seen[S.pos[S.pT]]; ev.push({k:'caught',gi,why:'see'}); return {S,ev,res:'caught',gi}; }
    return {S,ev,res:'ok'};
  }
  function prepare(L){
    L.sig=L.tiles.map((t,i)=>{ let s=t.doors+(t.fixed?16:0); if(i===L.exit) s+=32; const it=L.items.findIndex(x=>x.t===i); if(it>=0) s+=64*(it+1); return String.fromCharCode(48+s); });
    return L;
  }
  // 同じ形の部屋は入れかえても同じとみなす
  function key(L,S){
    let s=''; for(let c=0;c<S.cells.length;c++){ const t=S.cells[c]; s+= t<0?'.':L.sig[t]; }
    s+='|'+S.pos[S.pT]; for(const g of S.g) s+=','+S.pos[g.t]+':'+g.d+':'+g.k; return s+'|'+S.got;
  }

const HintSolver=(()=>{
  class Heap{ constructor(){this.a=[];} push(x){const a=this.a;a.push(x);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p].f<=x.f)break;a[i]=a[p];i=p;}a[i]=x;}
    pop(){const a=this.a;const top=a[0];const x=a.pop();if(a.length){let i=0;for(;;){let l=2*i+1,r=l+1,m=i;let mv=x;if(l<a.length&&a[l].f<mv.f){m=l;mv=a[l];}if(r<a.length&&a[r].f<mv.f){m=r;}if(m===i)break;a[i]=a[m];i=m;}a[i]=x;}return top;} get size(){return this.a.length;} }
  const cxy=(L,c)=>[c%L.w,Math.floor(c/L.w)];
  function heur(L,S){ const p=cxy(L,S.pos[S.pT]), e=cxy(L,S.pos[L.exit]); let h=Math.abs(p[0]-e[0])+Math.abs(p[1]-e[1]);
    L.items.forEach((it,i)=>{ if((S.got>>i)&1) return; const q=cxy(L,S.pos[it.t]); const xs=[p[0],q[0],e[0]], ys=[p[1],q[1],e[1]]; h=Math.max(h,Math.max(...xs)-Math.min(...xs)+Math.max(...ys)-Math.min(...ys)); }); return h; }
  function solveFrom(L,S0,cap=150000){
    const k0=KS.key(L,S0); const seen=new Map([[k0,{g:0,prev:null,a:null}]]); const open=new Heap(); open.push({f:heur(L,S0),g:0,S:S0,k:k0}); let ex=0;
    while(open.size){ const n=open.pop(); const rec=seen.get(n.k); if(rec.g<n.g) continue; if(++ex>cap) return {ok:false,why:'cap'};
      for(const a of KS.actions(L,n.S)){ const r=KS.apply(L,n.S,a); if(r.res==='caught') continue; const g=n.g+1; const A={k:a.k,from:a.from,to:a.to,d:a.d};
        if(r.res==='win'){ const path=[A]; let cur=n.k; for(;;){ const rr=seen.get(cur); if(!rr.prev) break; path.push(rr.a); cur=rr.prev; } path.reverse(); return {ok:true,path}; }
        const k=KS.key(L,r.S); const old=seen.get(k); if(old&&old.g<=g) continue; seen.set(k,{g,prev:n.k,a:A}); open.push({f:g+heur(L,r.S),g,S:r.S,k}); } }
    return {ok:false,why:'nosol'};
  }
  return {solveFrom};
})();

const Sfx=(()=>{
  let ctx=null,master,nb;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; } const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:.8; master.connect(ctx.destination);
    nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  function tone(f,dur,vol,type='sine',delay=0,f1=null){ if(!ctx) return; const t=ctx.currentTime+delay; const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05); }
  function noise(dur,vol,f0,f1,q=1,type='bandpass',delay=0,attack=.005){ if(!ctx) return; const t=ctx.currentTime+delay; const s=ctx.createBufferSource(); s.buffer=nb; const f=ctx.createBiquadFilter(); f.type=type; f.Q.value=q;
    f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur); const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05); }
  return { init, setMute(m){ if(ctx) master.gain.setTargetAtTime(m?0:.8,ctx.currentTime,.03); },
    slide(){ noise(.28,.35,220,90,.8,'lowpass',0,.03); tone(70,.22,.25,'sine',0,50); tone(420,.05,.12,'triangle',.24); },
    step(){ tone(520,.05,.12,'triangle'); tone(390,.05,.1,'triangle',.17); },
    gstep(){ tone(160,.07,.18,'sine'); tone(140,.07,.15,'sine',.17); },
    gturn(){ noise(.12,.08,1800,900,2,'bandpass'); },
    pick(){ [784,988,1319].forEach((f,i)=>tone(f,.22,.18,'triangle',i*.07)); tone(2637,.3,.05,'sine',.2); },
    caught(){ tone(880,.16,.28,'square',0); tone(660,.2,.28,'square',.17); noise(.4,.3,900,200,.7,'lowpass'); tone(110,.4,.35,'sine',0,60); },
    clear(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.42,.2,'triangle',i*.09)); },
    star(i){ tone(988+i*220,.25,.16,'triangle'); tone(1976+i*440,.25,.05,'sine'); },
    tick(){ tone(880,.05,.12,'triangle'); },
    nope(){ tone(220,.09,.14,'triangle'); tone(180,.12,.12,'triangle',.07); },
    undo(){ tone(600,.06,.12,'triangle',0,420); },
  };
})();

const FLOORS={};
function floorTex(kind){
  if(FLOORS[kind]) return FLOORS[kind];
  const R=rng(kind.length*977+kind.charCodeAt(0));
  const t=tex(256,256,(x,w,h)=>{
    const noise=(a)=>{ for(let i=0;i<900;i++){ x.fillStyle=`rgba(0,0,0,${R()*a})`; x.fillRect(R()*w,R()*h,1+R()*2,1+R()*2); } };
    if(kind==='wood'||kind==='wood2'){ const base=kind==='wood'?[196,140,86]:[170,112,66];
      for(let i=0;i<8;i++){ const v=(R()-.5)*26; x.fillStyle=`rgb(${base[0]+v},${base[1]+v*.8},${base[2]+v*.6})`; x.fillRect(0,i*32,w,32); x.fillStyle='rgba(60,30,10,.35)'; x.fillRect(0,i*32,w,2); const o=R()*w; x.fillRect(o,i*32,2,32); }
      noise(.08); }
    else if(kind==='tatami'){ x.fillStyle='#b8c07a'; x.fillRect(0,0,w,h); for(let i=0;i<h;i+=3){ x.fillStyle=`rgba(90,100,40,${.12+R()*.08})`; x.fillRect(0,i,w,1);} x.fillStyle='#4b5a2c'; x.fillRect(0,0,w,10); x.fillRect(0,h-10,w,10); x.fillRect(w/2-5,0,10,h); }
    else if(kind==='tile'){ x.fillStyle='#e8eef0'; x.fillRect(0,0,w,h); x.strokeStyle='#b9c6cc'; x.lineWidth=3; for(let i=0;i<=w;i+=32){ x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke(); x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke(); } noise(.04); }
    else if(kind==='checker'){ for(let j=0;j<8;j++)for(let i=0;i<8;i++){ x.fillStyle=(i+j)%2?'#f2e4c4':'#c9a978'; x.fillRect(i*32,j*32,32,32);} noise(.05); }
    else if(kind==='carpet'||kind==='carpet2'||kind==='green'){ x.fillStyle=kind==='carpet'?'#6f8fb8':kind==='green'?'#2e6a5c':'#8a6fa8'; x.fillRect(0,0,w,h); for(let i=0;i<4000;i++){ x.fillStyle=`rgba(${R()<.5?255:0},${R()<.5?255:0},${R()<.5?255:0},.05)`; x.fillRect(R()*w,R()*h,2,2);} x.strokeStyle='rgba(255,255,255,.18)'; x.lineWidth=6; x.strokeRect(14,14,w-28,h-28); }
    else if(kind==='lino'){ x.fillStyle='#a9cdb0'; x.fillRect(0,0,w,h); for(let i=0;i<1600;i++){ x.fillStyle=`rgba(${R()<.5?255:40},${R()<.5?255:80},60,.14)`; x.fillRect(R()*w,R()*h,2,2);} x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,h/2-1,w,2); }
    else if(kind==='hosp'){ x.fillStyle='#dfe9ec'; x.fillRect(0,0,w,h); for(let i=0;i<1400;i++){ x.fillStyle=`rgba(80,120,140,${R()*.12})`; x.fillRect(R()*w,R()*h,2,2);} x.fillStyle='#8fd0c8'; x.fillRect(0,h-26,w,8); }
    else if(kind==='marble'){ x.fillStyle='#ebe5da'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(120,110,100,.25)'; for(let i=0;i<14;i++){ x.lineWidth=1+R()*2; x.beginPath(); let px=R()*w,py=R()*h; x.moveTo(px,py); for(let k=0;k<6;k++){ px+=(R()-.5)*90; py+=(R()-.5)*90; x.lineTo(px,py);} x.stroke(); } x.strokeStyle='rgba(0,0,0,.12)'; x.lineWidth=2; x.strokeRect(1,1,w/2,h/2); x.strokeRect(w/2,h/2,w/2,h/2); }
    else if(kind==='concrete'){ x.fillStyle='#a9adb3'; x.fillRect(0,0,w,h); noise(.12); }
    else { x.fillStyle='#ccc'; x.fillRect(0,0,w,h); }
  });
  FLOORS[kind]=t; return t;
}

  if(i===2) r.push('<span class="r">赤い点線</span>は見張りの視線。<span class="r">赤い床</span>は見えている所で、入るとアウト','ドアがつながっていると、何部屋先まででも見える。<b>壁でふさげば見えない</b>','<b>見張りのいる部屋ごとすべらせて</b>、視線をそらすこともできる');
  if(i===3) r.push('<span class="o">オレンジの矢印</span>は、見張りが<b>次に見る向き</b>','1手動かすごとに、見張りも1回動く');
  if(i===4) r.push('<span class="o">オレンジの足あと</span>は、見張りが<b>次に歩いていく部屋</b>','見張りが歩いてきて同じ部屋になってもアウト');
  if(i===5) r.push('<b>🔒 の部屋</b>は動かせない（階段など）');
  if(i===6) r.push('回収するものが<b>2つ</b>。全部そろえてから出口へ');
  if(i===10) r.push('<b>空きマスが2つ</b>。すべらせ方がふえる','右を向く看護師さんは、進めないと<b>右</b>を向く');
  if(i===15) r.push('<b>監視カメラ</b>は時計回りにぐるっと向きを変える');
  return r;
}
function guardRows(i){
  const L0=LEVELS[i].L; const seen=new Set(); const rows=[];
  for(const G of L0.guards){ const kind=G.who==='camera'?'cam':G.kind; const k=G.who+kind; if(seen.has(k)) continue; seen.add(k);
    rows.push(`<div class="gRow"><span class="gi">${GK[G.who].e}</span><div><b>${GK[G.who].name}</b>${KIND_TEXT[kind]}</div></div>`); }
  return rows.join('');
}
function showIntro(i){
  mode='intro'; const m=LEVELS[i]; const r=rulesHTML(i);
  const bFirst=i%5===0;
  $('cardBody').innerHTML=`<div class="kicker">${stageLabel(i)}</div><h2>${m.title}</h2>
    <p class="story">${bFirst?BUILD[m.b].intro+'<br>':''}${m.story}</p>
    <div class="goalBox">${m.items.map(it=>`<div class="itemChip"><i style="filter:none">${ITEMK[it.kind].e}</i><span>${it.name||ITEMK[it.kind].name}</span></div>`).join('')}<div class="itemChip"><i style="filter:none">🚪</i><span>${BUILD[m.b].exitName}へ</span></div></div>
    ${m.L.guards.length?`<div class="gList">${guardRows(i)}</div>`:''}
    ${r.length?`<div class="rule">${r.map(x=>'・'+x).join('<br>')}</div>`:''}
    <button class="btn" id="goBtn">スタート</button>`;
  screen('card'); $('hud').classList.remove('on');
  $('goBtn').onclick=()=>{ Sfx.init(); Sfx.tick(); startPlay(); };
}
function startPlay(){
  mode='play'; screen(null); $('hud').classList.add('on'); fitCamera(); refreshMarks(); hud();
  const m=LEVELS[LI];
  if(LI===0) hint('光る輪の部屋をタップすると歩く。白い矢印の部屋はすべらせられる');
  else if(LI===1) hint('自分がいる部屋も、すべらせられる');
  else if(LI===2) hint('赤い点線はお母さんの視線。ドアがつながっていると、となりの部屋まで見える',6);
  else hint('',0);
}
function playLevel(i){ loadLevel(i); showIntro(i); }

/* =========================================================
   1手すすめる
   ========================================================= */
async function doAction(a){
  if(busy||mode!=='play') return;
  Sfx.init(); busy=true; if(LI>2) hint('',0);
  const prev=S; const r=KS.apply(L,S,a);
  hist.push(prev);
  overlays.forEach(o=>o.userData.on=false); clearMarks();
  await playEvents(r);
  S=r.S; hud(); if(LI<2&&hist.length>=3) hint('',0);
  if(r.res==='caught'){ await caughtAnim(r); showCaught(r); }
  else if(r.res==='win'){ await winAnim(); showClear(); }
  else { syncAll(); }
  busy=false;
}
async function playEvents(r){
  const ev=r.ev; let i=0;
  while(i<ev.length){
    const e=ev[i];
    if(e.k==='slide'){ const g=tiles[e.t]; const a=cellXZ(e.from), b=cellXZ(e.to); Sfx.slide();
      await tween(.26,t=>{ const k=easeOutBack(t); g.position.x=lerp(a.x,b.x,k); g.position.z=lerp(a.z,b.z,k); }); i++; }
    else if(e.k==='step'){ await walk(pMesh,e.fromT,e.toT,e.d,.34,true); view.pT=e.toT; i++; }
    else if(e.k==='pick'){ flyItem(e.i); view.got|=1<<e.i; i++; }
    else if(e.k==='caught'||e.k==='win'){ i++; }
    else { // 見張りはいっしょに動く
      const group=[]; while(i<ev.length&&(ev[i].k==='gmove'||ev[i].k==='gturn')) group.push(ev[i++]);
      const ps=group.map(g=> g.k==='gmove'? walk(gMesh[g.gi],g.fromT,g.toT,g.d,.34,false).then(()=>{view.g[g.gi].t=g.toT;}) : turn(gMesh[g.gi],g.d0,g.d1,.28).then(()=>{view.g[g.gi].d=g.d1;}));
      if(group.some(g=>g.k==='gmove')) Sfx.gstep(); else if(group.length) Sfx.gturn();
      await Promise.all(ps);
    }
  }
}
function walk(m,fromT,toT,d,dur,isKid){
  const a=tilePos(fromT).clone(), b=tilePos(toT).clone(); m.rotation.y=dirRot(d); if(isKid) Sfx.step();
  const v=new THREE.Vector3(); m.userData.ov=v;
  return tween(dur,t=>{ const k=ease(t); v.set(lerp(a.x,b.x,k),FLOOR+Math.abs(Math.sin(t*Math.PI*2))*.06,lerp(a.z,b.z,k)); }).then(()=>{ m.userData.ov=null; });
}
function turn(m,d0,d1,dur){ const r0=dirRot(d0); let r1=dirRot(d1); let dr=r1-r0; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; return tween(dur,t=>{ m.rotation.y=r0+dr*ease(t); }); }
function flyItem(i){ const m=iMesh[i]; m.userData.fly=true; Sfx.pick(); const p0=m.position.clone();
  tween(.55,t=>{ m.position.set(p0.x,p0.y+t*1.2,p0.z); m.rotation.y+=.3; m.scale.setScalar(1+t*.6*(1-t)*4-(t>.7?(t-.7)*3:0)); }).then(()=>{ m.visible=false; m.userData.fly=false; });
  toast(`${ITEMK[L.items[i].kind].e} ${L.items[i].name||ITEMK[L.items[i].kind].name} を回収！`+(KS && (view.got|(1<<i))===(1<<L.items.length)-1?`<br><small>あとは${B.exitName}へ！</small>`:''));
}
async function caughtAnim(r){
  const gi=r.gi; const m=gMesh[gi]; const G=L.guards[gi];
  Sfx.caught(); $('flash').classList.add('on'); shake=.25;
  m.userData.bang.visible=true; m.userData.bang.scale.set(.01,.01,1);
  const seen=KS.vision(L,r.S); overlays.forEach((o,c)=>{ o.userData.on=seen[c]>=0&&r.S.cells[c]>=0; });
  // 見張りが子どもの方を向く
  if(G.who!=='camera'){ const pp=pMesh.position, gp=m.position; if(pp.distanceTo(gp)>.3){ const want=Math.atan2(pp.x-gp.x,pp.z-gp.z); const r0=m.rotation.y; let dr=want-r0; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; tween(.25,t=>{ m.rotation.y=r0+dr*ease(t); }); } }
  pMesh.userData.ov=pMesh.position.clone(); const y0=pMesh.userData.ov.y;
  await tween(.7,t=>{ const s=Math.min(1,t*4); m.userData.bang.scale.set(.5*easeOutBack(s),.5*easeOutBack(s),1); pMesh.userData.ov.y=y0+Math.sin(Math.min(1,t*3)*Math.PI)*.25; });
  pMesh.userData.ov=null;
  await tween(.35,()=>{});
  $('flash').classList.remove('on');
}
async function winAnim(){
  Sfx.clear(); hint('',0);
  const p=tilePos(L.exit); const a=new THREE.Vector3(p.x,FLOOR,p.z), b=new THREE.Vector3(p.x,FLOOR,p.z+TS*.95);
  pMesh.rotation.y=0; const v=new THREE.Vector3(); pMesh.userData.ov=v;
  await tween(.55,t=>{ v.set(a.x,FLOOR+Math.abs(Math.sin(t*Math.PI*3))*.06,lerp(a.z,b.z,t)); });
  confetti(b);
  await tween(.6,t=>{ v.y=FLOOR+Math.sin(t*Math.PI)*.4; pMesh.rotation.y=t*Math.PI*2; });
}
function confetti(p){
  const cols=[0xffcc4d,0x62e3c4,0xff6b8a,0x7fb6ff,0xffffff]; const parts=[];
  for(let i=0;i<46;i++){ const m=new THREE.Mesh(new THREE.PlaneGeometry(.08,.05),new THREE.MeshBasicMaterial({color:cols[i%5],side:THREE.DoubleSide})); m.position.copy(p).add(new THREE.Vector3(0,.4,0)); board.add(m);
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*2.5; parts.push({m,v:new THREE.Vector3(Math.cos(a)*s*.6,3+Math.random()*3,Math.sin(a)*s*.6),w:new THREE.Vector3(Math.random()*9,Math.random()*9,0)}); }
  tween(2.2,(t,dt)=>{ for(const q of parts){ q.v.y-=9*dt; q.v.multiplyScalar(1-dt*1.2); q.m.position.addScaledVector(q.v,dt); q.m.rotation.x+=q.w.x*dt; q.m.rotation.y+=q.w.y*dt; } }).then(()=>{ for(const q of parts){ board&&board.remove(q.m); q.m.geometry.dispose(); q.m.material.dispose(); } });
}

/* ---------- 見つかった・クリア ---------- */
function showCaught(r){
  mode='caught'; const G=L.guards[r.gi];
  $('cardBody').innerHTML=`<div class="kicker" style="color:#ff8a8a">CAUGHT</div><h2>見つかった！</h2>
    <div style="font-size:40px;line-height:1.1">${GK[G.who].e}</div>
    <div class="line">「${GK[G.who].line}」</div>
    <div class="muted">${r.ev.some(e=>e.why==='walk')?'見張りが歩いてきて、同じ部屋になってしまった。':r.ev.some(e=>e.why==='bump')?'見張りがいる部屋に入ってしまった。':'赤い床（見張りに見える所）に入ってしまった。'}</div>
    <button class="btn mint" id="cUndo">1手もどす</button>
    <button class="btn sub" id="cReset">最初から</button>`;
  screen('card');
  $('cUndo').onclick=()=>{ Sfx.undo(); undo(); };
  $('cReset').onclick=()=>{ Sfx.tick(); reset(); };
}
function showClear(){
  mode='clear'; const moves=hist.length; const raw=starsFor(LI,moves); const st=usedHint?Math.min(2,raw):raw;
  const prev=prog.stars[LI]||0; if(st>prev){ prog.stars[LI]=st; store.set('prog',prog); }
  const last=LI===LEVELS.length-1; const endB=LI%5===4;
  $('cardBody').innerHTML=`<div class="kicker">CLEAR</div><h2>${last?'ぜんぶ脱出成功！':'脱出成功！'}</h2>
    <div class="stars">${[0,1,2].map(i=>STAR(i<st,i)).join('')}</div>
    <div class="big">${moves}<small>手</small></div>
    <div class="muted">${usedHint?'ヒントを使ったので★2つまで。ヒントなしで★3つ（'+star3(LI)+'手以内）をねらおう':st<3?`★3つは ${star3(LI)}手以内`:'★3つ！ 見事な手さばき'}</div>
    ${endB&&!last?`<div class="rule">次の舞台は <b>${BUILD[LEVELS[LI+1].b].name}</b>！</div>`:''}
    ${last?`<div class="rule">家・学校・病院・美術館、全20ステージ脱出！<br>合計 <b>★${totalStars()}</b> / 60</div>`:''}
    ${last?'':'<button class="btn" id="nBtn">次のステージへ</button>'}
    <div class="row"><button class="btn sub" id="rBtn">もう一回</button><button class="btn sub" id="sBtn">ステージ選択</button></div>`;
  screen('card');
  setTimeout(()=>{ for(let i=0;i<st;i++) setTimeout(()=>Sfx.star(i),150+i*220); },0);
  if(!last) $('nBtn').onclick=()=>{ Sfx.tick(); playLevel(LI+1); };
  $('rBtn').onclick=()=>{ Sfx.tick(); reset(); };
  $('sBtn').onclick=()=>{ Sfx.tick(); openSelect(); };
}
function totalStars(){ return Object.values(prog.stars).reduce((a,b)=>a+b,0); }
function undo(){ if(!hist.length||busy) return; S=hist.pop(); mode='play'; screen(null); syncAll(); placeActors(); hud(); $('flash').classList.remove('on'); }
function reset(){ if(busy) return; S=KS.initState(L); hist=[]; usedHint=false; setPlan(S,LEVELS[LI].path); mode='play'; screen(null); $('hud').classList.add('on'); syncAll(); placeActors(); hud(); $('flash').classList.remove('on'); }
$('hintBtn').onclick=()=>giveHint();
$('undoBtn').onclick=()=>{ if(mode==='play'&&!busy&&hist.length){ Sfx.undo(); undo(); } };
$('resetBtn').onclick=()=>{ if(mode==='play'&&!busy){ Sfx.tick(); reset(); } };

/* ---------- タイトル・選択・メニュー ---------- */
function unlocked(i){ return i===0||!!prog.stars[i-1]||DEBUG; }
function nextStage(){ for(let i=0;i<LEVELS.length;i++) if(!prog.stars[i]) return i; return 0; }
function showTitle(){
  mode='title'; $('hud').classList.remove('on'); hint('',0);
  loadLevel(Math.min(nextStage(),LEVELS.length-1)); refreshMarks();
  const ts=totalStars(); $('bestLine').innerHTML=ts?`集めた星 <b>★${ts}</b> / 60`:'';
  screen('title'); fitCamera();
}
function openSelect(){
  mode='select'; $('hud').classList.remove('on');
  $('selList').innerHTML=BUILD.map((b,bi)=>`<div class="bsec"><h3>${['🏠','🏫','🏥','🏛️'][bi]} ${b.name} <small>${b.sub}</small></h3><div class="sgrid">${[0,1,2,3,4].map(k=>{ const i=bi*5+k; const st=prog.stars[i]||0;
    return `<button data-i="${i}" ${unlocked(i)?'':'disabled'} class="${i===LI?'cur':''}">${k+1}<span class="ss">${st?'★'.repeat(st):''}</span></button>`; }).join('')}</div></div>`).join('');
  $('selList').querySelectorAll('button').forEach(b=>b.onclick=()=>{ Sfx.init(); Sfx.tick(); playLevel(+b.dataset.i); });
  screen('select');
}
$('playBtn').onclick=()=>{ Sfx.init(); Sfx.tick(); playLevel(nextStage()); };
$('selectBtn').onclick=()=>{ Sfx.init(); Sfx.tick(); openSelect(); };
$('selBack').onclick=()=>{ Sfx.tick(); showTitle(); };
$('menuBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('menuBtn').onclick=()=>{ if(mode!=='play'||busy) return; Sfx.tick(); mode='menu'; screen('menu'); };
$('mResume').onclick=()=>{ Sfx.tick(); mode='play'; screen(null); };
$('mRule').onclick=()=>{ Sfx.tick(); const keep=hist.slice(), keepS=S; showIntro(LI); $('goBtn').textContent='つづける'; $('goBtn').onclick=()=>{ Sfx.tick(); mode='play'; screen(null); $('hud').classList.add('on'); S=keepS; hist=keep; hud(); }; };
$('mSelect').onclick=()=>{ Sfx.tick(); openSelect(); };
$('mTitle').onclick=()=>{ Sfx.tick(); showTitle(); };
$('muteBtn').onclick=()=>{ muted=!muted; store.set('mute',muted); Sfx.init(); Sfx.setMute(muted); $('muteBtn').innerHTML=muted?SPK_OFF:SPK_ON; };
$('muteBtn').innerHTML=muted?SPK_OFF:SPK_ON;

/* =========================================================
   タップ・スワイプ
   ========================================================= */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),-FLOOR), hitP=new THREE.Vector3();
function cellAt(clientX,clientY){
  const r=canvas.getBoundingClientRect(); ndc.set(((clientX-r.left)/r.width)*2-1,-((clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); if(!ray.ray.intersectPlane(plane,hitP)) return -1;
  const x=Math.round(hitP.x/TS+(L.w-1)/2), y=Math.round(hitP.z/TS+(L.h-1)/2); if(x<0||y<0||x>=L.w||y>=L.h) return -1;
  const lx=hitP.x/TS+(L.w-1)/2-x, ly=hitP.z/TS+(L.h-1)/2-y; if(Math.abs(lx)>.5||Math.abs(ly)>.5) return -1; return y*L.w+x;
}
let down=null;
canvas.addEventListener('pointerdown',e=>{ Sfx.init(); if(mode!=='play') return; down={x:e.clientX,y:e.clientY,c:cellAt(e.clientX,e.clientY),id:e.pointerId}; try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
canvas.addEventListener('pointerup',e=>{ if(!down||e.pointerId!==down.id) return; const d=down; down=null; if(mode!=='play'||busy) return;
  const dx=e.clientX-d.x, dy=e.clientY-d.y; const dist=Math.hypot(dx,dy);
  if(dist>24 && d.c>=0){ // スワイプ：その方向の空きマスへ
    const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0); const to=KS.nb(L,d.c,dir); const t=S.cells[d.c];
    if(to>=0&&S.cells[to]<0&&t>=0&&!L.tiles[t].fixed){ doAction({k:'slide',from:d.c,to}); return; }
    if(t>=0&&L.tiles[t].fixed){ Sfx.nope(); hint('🔒 この部屋は動かせない',2); return; }
    Sfx.nope(); hint('すべらせる先が空いていない',2); return; }
  onTap(cellAt(e.clientX,e.clientY));
});
canvas.addEventListener('pointercancel',()=>{ down=null; });
function onTap(c){
  if(c<0) return; const t=S.cells[c];
  const pc=S.pos[S.pT];
  if(t<0){ Sfx.nope(); hint('空きマスのとなりの部屋をタップすると、ここへすべる',2.5); return; }
  for(let d=0;d<4;d++){ if(KS.link(L,S,pc,d)===c){ doAction({k:'step',d,from:pc,to:c}); return; } }
  const empt=[]; for(let d=0;d<4;d++){ const n=KS.nb(L,c,d); if(n>=0&&S.cells[n]<0) empt.push(n); }
  if(empt.length&&!L.tiles[t].fixed){ if(empt.length>1){ hint('空きマスが2つとなりにある時は、すべらせたい方へスワイプ',3); Sfx.nope(); return; } doAction({k:'slide',from:c,to:empt[0]}); return; }
  if(c===pc){ hint('光る輪の部屋をタップすると、そこへ歩く',2.2); return; }
  if(L.tiles[t].fixed){ Sfx.nope(); hint('🔒 この部屋は動かせない',2); return; }
  Sfx.nope();
  const adj=[0,1,2,3].some(d=>KS.nb(L,pc,d)===c);
  hint(adj?'ドアがつながっていないので進めない':'となりの部屋にしか歩けない。すべらせられるのは空きマスのとなりの部屋だけ',2.6);
}

/* =========================================================
   ループ
   ========================================================= */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(DEBUG?.25:.05,(now-last)/1000); last=now; clock+=dt;
  for(let i=anims.length-1;i>=0;i--){ const a=anims[i]; const t=clamp((clock-a.t0)/a.dur,0,1); a.fn(t,dt); if(t>=1){ anims.splice(i,1); a.res(); } }
  if(L&&board){
    placeActors();
    const pulse=.72+.18*Math.sin(clock*5);
    for(const o of overlays){ const want=o.userData.on?pulse:0; o.material.opacity=lerp(o.material.opacity,want,1-Math.exp(-dt*12)); o.visible=o.material.opacity>.01; }
    for(const mk of markers){ if(mk.kind==='beam'){ mk.m.material.map.offset.x-=dt*1.4; continue; } if(mk.kind==='hint'||mk.kind==='hintring'){ const k=1+.08*Math.sin(clock*7); mk.m.scale.set(k,k,1); mk.m.material.opacity=.8+.2*Math.sin(clock*7); continue; } if(mk.kind==='walk'){ mk.m.rotation.z=clock*.6; mk.m.material.opacity=.65+.3*Math.sin(clock*4); } else if(mk.kind==='slide'){ mk.m.material.opacity=.45+.35*Math.sin(clock*4); } else mk.m.material.opacity=.7+.25*Math.sin(clock*5); }
    if(mode==='title'||mode==='select'){ const a=Math.sin(clock*.15)*.25; camera.position.set(camBase.x*Math.cos(a)+camBase.z*Math.sin(a),camBase.y,-camBase.x*Math.sin(a)+camBase.z*Math.cos(a)); camera.lookAt(0,0,.25*TS); }
    else { camera.position.copy(camBase); camera.lookAt(0,0,.25*TS); }
    if(shake>0){ camera.position.x+=(Math.random()-.5)*shake; camera.position.y+=(Math.random()-.5)*shake; shake=Math.max(0,shake-dt*.8); }
  }
  if(!(DEBUG&&window.__noRender)) renderer.render(scene,camera);
}
new ResizeObserver(()=>{ if(L) fitCamera(); }).observe($('game'));
const coarse=matchMedia('(pointer:coarse)');
function checkRotate(){ const land=coarse.matches&&innerWidth>innerHeight&&innerHeight<540; $('rotate').style.display=land?'flex':'none'; }
addEventListener('resize',checkRotate); addEventListener('orientationchange',()=>setTimeout(()=>{checkRotate(); if(L) fitCamera();},250));

/* ---------- はじまり ---------- */
(async()=>{
  try{ await Promise.race([document.fonts.load(`800 20px "M PLUS Rounded 1c"`),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  checkRotate(); showTitle(); $('loading').remove(); requestAnimationFrame(loop);
})();

if(DEBUG){
  window.KSD={ get L(){return L;}, get S(){return S;}, get mode(){return mode;}, get busy(){return busy;}, get hist(){return hist;}, LEVELS, KS, playLevel, loadLevel, startPlay, doAction, undo, reset, onTap, giveHint, get plan(){return plan;}, get usedHint(){return usedHint;},
    cellToScreen(c){ const p=cellXZ(c); const v=new THREE.Vector3(p.x,FLOOR,p.z).project(camera); const r=canvas.getBoundingClientRect(); return {x:r.left+(v.x+1)/2*r.width,y:r.top+(1-v.y)/2*r.height}; } };
}
