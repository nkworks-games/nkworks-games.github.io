<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===== [SEC:CONFIG] =====
const CONFIG = {
  FIXED: 1 / 120, MAX_FRAME: 0.1,
  SPREAD_TIME: 20,        // 1枚の塗り時間（秒）
  START_DELAY: 0.9,       // 「よーい、スタート」の長さ（秒）
  TRANSFER_TIME: 1.4,     // トースターからお皿へ運ぶ時間（秒）
  GRID: 112,              // 塗りのマス目の数（1辺）
  AREA: 12,               // マス目がおおう広さ（1辺）
  THICK_H: 0.045,         // 厚さ1あたりの見た目の高さ
  PLATE_R: 5.6, PLATE_TOP: 0.25,
  BLADE_LEN: 1.9, BLADE_W: 0.5,   // ナイフの刃（当たる部分）の長さ・幅
  KNIFE_FOLLOW: 28,       // ナイフが指に追いつく速さ
  KNIFE_TURN: 9,          // ナイフの向きが変わる速さ
  HOVER: 0.7,             // 塗っていない時にナイフが浮く高さ
  CRUST_W: 0.42,          // 耳の幅（ここに塗るとはみ出し）
  BEVEL_T: 0.16, BEVEL_S: 0.18,
  CAP_RATIO: 0.38,        // ナイフ1杯でパンの何割を塗れるか
  STOCK_RATIO: 1.9,       // ビン・バターの中身（注文どおりに塗るのに要る量の何倍か）。すくうと減る
  PRESS_DEFAULT: 0.5,     // 押す強さの初期値（0〜1）
  PRESS_WHEEL: 0.0012,    // マウスホイール1目盛りで変わる強さ
  SCOOP_RATE: 2.6,        // 1秒ですくえる量（満タン＝1）
  JAR_R: 1.3,
  DIFF_MAX: 24,           // 流れる速さの上限（計算が壊れないため）
  COOL_TIME: 14,          // トーストが冷める速さ（秒）
  TOAST: { IDEAL_MIN: 0.5, IDEAL_MAX: 0.75, BURN: 0.95, MAX: 1.25 },
  SCORE: { COVER: 40, EVEN: 40, SPILL: 20, COVER_TH: 0.35, COVER_MIN: 0.4, COVER_FULL: 0.97, CV_OK: 0.12, CV_RANGE: 0.6, SPILL_ZERO: 0.2, THICK_RED: 2.4 },
  BREADS: {
    shokupan: { name: '食パン', shape: 'yama', w: 7, h: 7, depth: 1.0, toastRate: 0.24, crumb: '#f6e8c8', crust: 0xc07a3c, pores: 900, poreR: [1.5, 4] },
    muffin:   { name: 'イングリッシュマフィン', shape: 'circle', r: 3.5, depth: 0.9, toastRate: 0.26, crumb: '#efe0bd', crust: 0xd8b888, pores: 420, poreR: [3, 9] },
    baguette: { name: 'バゲット', shape: 'ellipse', rx: 4.4, ry: 2.2, depth: 0.8, toastRate: 0.3, crumb: '#f2e0b4', crust: 0xc8853a, pores: 260, poreR: [3, 13] },
    atsugiri: { name: '厚切り食パン', shape: 'yama', w: 7, h: 7, depth: 2.0, toastRate: 0.17, crumb: '#f6e8c8', crust: 0xc07a3c, pores: 900, poreR: [1.5, 4] },
    bagel:    { name: 'ベーグル', shape: 'ring', r: 4.1, hole: 1.0, depth: 1.0, toastRate: 0.24, crumb: '#efdbb0', crust: 0xb46a2c, pores: 700, poreR: [1.2, 3] },
  },
  // give: 1マス進むごとにナイフの量の何割を置くか / pick: 塗ってある分を何割すくい直すか
  // melt: 温かいと溶けて広がる / flow: 冷めても勝手に流れる
  // stiff: ちょうどいい押す強さ（これより弱いとムラ・厚く、強いと薄く削れて広がる）
  SPREADS: {
    butter: { name: 'バター', color: 0xffd45c, rough: 0.28, alpha: 0.85, give: 0.035, pick: 0.06, melt: 0.6, flow: 0, ideal: 1, container: 'dish', drag: 1.0, stiff: 0.7, tip: 'かため。強めに押して伸ばそう' },
    jam:    { name: 'いちごジャム', color: 0xc8102e, rough: 0.15, alpha: 0.88, give: 0.06, pick: 0.11, melt: 0, flow: 0.12, ideal: 1, container: 'jar', seeds: true, drag: 0.45, stiff: 0.35, tip: 'やわらかい。軽めでOK' },
    peanut: { name: 'ピーナッツバター', color: 0xc08848, rough: 0.6, alpha: 1, give: 0.03, pick: 0.05, melt: 0.08, flow: 0, ideal: 1, container: 'jar', drag: 0.95, stiff: 0.8, tip: '重い。しっかり押そう' },
    choco:  { name: 'チョコ', color: 0x4a2614, rough: 0.35, alpha: 1, give: 0.04, pick: 0.08, melt: 0.25, flow: 0, ideal: 1, container: 'jar', drag: 0.75, stiff: 0.55, tip: 'ふつうの強さでOK' },
    honey:  { name: 'はちみつ', color: 0xf0a01e, rough: 0.08, alpha: 0.75, give: 0.08, pick: 0.14, melt: 0, flow: 0.8, ideal: 1, container: 'jar', drag: 0.35, stiff: 0.3, tip: '流れやすい。そっと塗ろう' },
  },
  ROUNDS: [['shokupan', 'butter'], ['muffin', 'jam'], ['baguette', 'peanut'], ['atsugiri', 'choco'], ['bagel', 'honey']],
  RANKS: [[470, 'バター職人'], [420, '朝食の達人'], [350, 'トースト好き'], [250, 'まだ眠い朝'], [0, '寝ぼけて塗った']],
  TOASTER_POS: [-1.5, 0, -19],
  BEST_KEY: 'butter-hashi-best',
  DAY_KEY: 'butter-hashi-day',    // 今日の5枚のベスト
  // お客さんの注文（1ゲームで5つ全部が1回ずつ出る）。ideal: ちょうどいい厚さの倍率
  ORDERS: [
    { text: 'ふつうに塗って', ideal: 1 },
    { text: '薄めでお願い', ideal: 0.55 },
    { text: 'たっぷり塗って', ideal: 1.8 },
    { text: '耳まで塗って', ideal: 1, crust: true },
    { text: '左半分だけ塗って', ideal: 1, half: true },
  ],
  // 押しすぎると破れる：焼きが浅いほど弱い（TOUGH_MIN）。drag は塗る物ごとの引っかかり
  TEAR: { TH: 0.85, RATE: 0.45, TOUGH_MIN: 0.45, PEN_PER_PCT: 2, PEN_MAX: 20 },
};

// ===== [SEC:UTIL] =====
const $ = id => document.getElementById(id);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(1);
function makeNoise(cells) {
  const S = cells + 1, g = new Float32Array(S * S);
  for (let i = 0; i < g.length; i++) g[i] = rng();
  return (u, v) => {
    const x = u * cells, y = v * cells, i = Math.min(cells - 1, Math.floor(x)), j = Math.min(cells - 1, Math.floor(y));
    const fx = smooth(0, 1, x - i), fy = smooth(0, 1, y - j);
    const a = g[j * S + i], b = g[j * S + i + 1], c = g[(j + 1) * S + i], d = g[(j + 1) * S + i + 1];
    return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
  };
}
const TOAST_STOPS = [[0, [1, 1, 1]], [0.3, [0.97, 0.9, 0.76]], [0.62, [0.92, 0.68, 0.4]], [0.85, [0.68, 0.42, 0.22]], [1.05, [0.32, 0.2, 0.12]], [1.25, [0.13, 0.09, 0.07]]];
function toastTint(L, out) {
  let i = 0; while (i < TOAST_STOPS.length - 2 && L > TOAST_STOPS[i + 1][0]) i++;
  const [l0, c0] = TOAST_STOPS[i], [l1, c1] = TOAST_STOPS[i + 1], t = clamp01((L - l0) / (l1 - l0));
  return out.setRGB(lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t), THREE.SRGBColorSpace);
}

// ===== [SEC:SCENE] =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;   // くっきりした影（軽い）
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1e3cb);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

const N = CONFIG.GRID, CS = CONFIG.AREA / (N - 1), HALF = CONFIG.AREA / 2;
const T = new Float64Array(N * N);      // 塗った厚さ
const TGT = new Uint8Array(N * N);      // 注文で塗る所（1）
const TEARD = new Float32Array(N * N);  // 破れのたまり具合（1で穴）

const BASE = new Float32Array(N * N);   // その場所の高さ
const GRIP = new Float32Array(N * N);   // 塗りやすさ（焼き加減で変わる）

const cellOf = (x, z) => { const i = Math.round((x + HALF) / CS), j = Math.round((z + HALF) / CS); return (i < 0 || j < 0 || i >= N || j >= N) ? -1 : j * N + i; };
const maskAt = (x, z) => { const k = cellOf(x, z); return k < 0 ? 0 : MASK[k]; };
const surfAt = (x, z) => { const k = cellOf(x, z); if (k < 0) return 0; return BASE[k] + (T[k] > 0.003 ? 0.012 + T[k] * CONFIG.THICK_H : 0); };

let breadMesh = null, breadMats = null, breadTex = null, breadTopY = 1, maskInfo = null, lidBounds = null;
function shapeFor(b) {
  const s = new THREE.Shape();
  if (b.shape === 'yama') {
    const w = b.w / 2, h = b.h / 2, r = 0.5;
    s.moveTo(-w + r, -h); s.lineTo(w - r, -h); s.quadraticCurveTo(w, -h, w, -h + r); s.lineTo(w, h * 0.45);
    s.bezierCurveTo(w + 0.55, h * 1.25, -w - 0.55, h * 1.25, -w, h * 0.45);
    s.lineTo(-w, -h + r); s.quadraticCurveTo(-w, -h, -w + r, -h);
  } else if (b.shape === 'circle') s.absarc(0, 0, b.r, 0, Math.PI * 2, false);
  else if (b.shape === 'ellipse') s.absellipse(0, 0, b.rx, b.ry, 0, Math.PI * 2, false, 0);
  else { s.absarc(0, 0, b.r, 0, Math.PI * 2, false); const hp = new THREE.Path(); hp.absarc(0, 0, b.hole, 0, Math.PI * 2, true); s.holes.push(hp); }
  return s;
}
function tracePath(ctx, shape, tf) {
  ctx.beginPath();
  const draw = pts => { pts.forEach((p, i) => { const [x, y] = tf(p.x, p.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); };
  draw(shape.getPoints(64)); shape.holes.forEach(h => draw(h.getPoints(64)));
}
function makeBreadTexture(shape, bd, b) {
  const S = 512, sx = S / (bd.maxX - bd.minX), sy = S / (bd.maxY - bd.minY);
  const tf = (px, py) => [(px - bd.minX) * sx, (bd.maxY - py) * sy];
  return canvasTex(S, S, (x) => {
    x.fillStyle = '#c4874a'; x.fillRect(0, 0, S, S);
    x.save(); tracePath(x, shape, tf); x.clip('evenodd');
    x.fillStyle = b.crumb; x.fillRect(0, 0, S, S);
    for (let i = 0; i < b.pores; i++) {
      const r = lerp(b.poreR[0], b.poreR[1], Math.pow(rng(), 2));
      x.fillStyle = `rgba(${150 + rng() * 30},${105 + rng() * 25},${60 + rng() * 20},${0.18 + rng() * 0.3})`;
      x.beginPath(); x.ellipse(rng() * S, rng() * S, r, r * (0.5 + rng() * 0.6), rng() * 3, 0, Math.PI * 2); x.fill();
    }
    x.fillStyle = 'rgba(255,255,255,.18)'; for (let i = 0; i < 300; i++) { x.beginPath(); x.arc(rng() * S, rng() * S, 1 + rng() * 2, 0, 6.3); x.fill(); }
    const lw = CONFIG.CRUST_W * (sx + sy) / 2;
    tracePath(x, shape, tf); x.lineJoin = 'round';
    x.strokeStyle = 'rgba(214,160,95,.7)'; x.lineWidth = lw * 2.8; x.stroke();
    x.strokeStyle = '#c4874a'; x.lineWidth = lw * 2; x.stroke();
    x.restore();
  });
}
function rasterMasks(shape) {
  const c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d', { willReadFrequently: true });
  const tf = (sx, sy) => [(sx + HALF) / CS + 0.5, (-sy + HALF) / CS + 0.5];
  const pass = (strokeW, strokeCol) => {
    x.fillStyle = '#000'; x.fillRect(0, 0, N, N); tracePath(x, shape, tf); x.fillStyle = '#fff'; x.fill('evenodd');
    if (strokeW) { x.lineWidth = strokeW / CS; x.strokeStyle = strokeCol; x.lineJoin = 'round'; x.stroke(); }
    return x.getImageData(0, 0, N, N).data;
  };
  const lid = pass(0), outer = pass(2 * CONFIG.BEVEL_S, '#fff'), inner = pass(2 * CONFIG.CRUST_W, '#000');
  let minI = N, maxI = -1, minJ = N, maxJ = -1, nIn = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const k = j * N + i, x0 = -HALF + i * CS, z0 = -HALF + j * CS, isLid = lid[k * 4] > 127;
    if (isLid) { minI = Math.min(minI, i); maxI = Math.max(maxI, i); minJ = Math.min(minJ, j); maxJ = Math.max(maxJ, j); }
    if (isLid && inner[k * 4] > 127) { MASK[k] = 3; BASE[k] = breadTopY; nIn++; }
    else if (isLid) { MASK[k] = 2; BASE[k] = breadTopY; }
    else if (outer[k * 4] > 127) { MASK[k] = 2; BASE[k] = breadTopY - 0.14; }
    else if (Math.hypot(x0, z0) < CONFIG.PLATE_R - 0.05) { MASK[k] = 1; BASE[k] = CONFIG.PLATE_TOP; }
    else { MASK[k] = 0; BASE[k] = 0; }
    SEED[k] = rng() < 0.05 ? 1 : 0;
  }
  maskInfo = { w: (maxI - minI + 1) * CS, d: (maxJ - minJ + 1) * CS, cx: -HALF + (minI + maxI) / 2 * CS, cz: -HALF + (minJ + maxJ) / 2 * CS, inner: nIn };
}
function buildBread(b) {

  const geo = new THREE.ExtrudeGeometry(shape, { depth: b.depth, bevelEnabled: true, bevelThickness: BT, bevelSize: CONFIG.BEVEL_S, bevelSegments: 3, curveSegments: 40 });
  const pts = shape.getPoints(64);
  const bd = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  pts.forEach(p => { bd.minX = Math.min(bd.minX, p.x); bd.maxX = Math.max(bd.maxX, p.x); bd.minY = Math.min(bd.minY, p.y); bd.maxY = Math.max(bd.maxY, p.y); });
  lidBounds = bd;

  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) - bd.minX) / (bd.maxX - bd.minX), (p.getY(i) - bd.minY) / (bd.maxY - bd.minY));
  geo.rotateX(-Math.PI / 2); geo.translate(0, BT, 0);
  breadTex = makeBreadTexture(shape, bd, b);
  breadMats = [new THREE.MeshLambertMaterial({ map: breadTex }), new THREE.MeshLambertMaterial({ color: b.crust })];

}

  keys: [],
  randomInput(r) {
    if (state === 'toast') { if (!holding) pressToast(); else if (r < 0.35) releaseToast(); return; }
    if (state === 'spread') {
      input.jarHit = false; input.has = true;
      if (r < 0.12) { input.x = jarPos.x; input.z = jarPos.z; }
      else { input.x = ((r * 7.31) % 1 - 0.5) * 10; input.z = ((r * 13.73) % 1 - 0.5) * 10; }
      const wasDown = input.down; input.down = r < 0.93; if (input.down && !wasDown) input.just = true;
      pressure = (r * 3.71) % 1;
      return;
    }
    if (state === 'score' && r < 0.6) nextRound();
  },
  reset(seed) { manual = true; startGame(seed); },
  pointer(x, z, down) { input.jarHit = false; input.has = true; input.x = x; input.z = z; if (down && !input.down) input.just = true; input.down = down; },
  toast(on) { if (on) pressToast(); else releaseToast(); },
  press(v) { pressure = clamp01(v); },
  next() { nextRound(); },
  segs(z0, z1) { // z0〜z1 の帯で、どこも塗る所（耳でない）になっている x の区間
    const j0 = Math.max(0, Math.round((z0 + HALF) / CS)), j1 = Math.min(N - 1, Math.round((z1 + HALF) / CS)), out = []; let st = -1;
    for (let i = 0; i <= N; i++) { let ok = i < N; for (let j = j0; ok && j <= j1; j++) ok = TGT[j * N + i] === 1; if (ok && st < 0) st = i; if (!ok && st >= 0) { out.push([-HALF + st * CS, -HALF + (i - 1) * CS]); st = -1; } }
    return out;
  },
  info() { return { jar: { x: jarPos.x, z: jarPos.z }, b: lidBounds, order: curOrder.text, tornCount, tearP: tearPressure(), cap, load, stock, stockMax, stiff: curSpread.stiff, pressure, state, toastL, spreadT, score: lastScore, total }; },
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); render(); },
  advance(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); }, // 描画なしで進める（ロボット操作の確認用）
  state() { return { state, round, toastL: +toastL.toFixed(3), spreadT: +spreadT.toFixed(2), load: +load.toFixed(2), cap: +cap.toFixed(1), total, over: state === 'result' }; },
  check() {
    const v = [];
    if (![knife.x, knife.y, knife.z, load, toastL, spreadT, total].every(Number.isFinite)) v.push('ナイフ・量・時間のどれかがNaN');
    let sum = 0, nan = false, neg = false;
    for (let k = 0; k < N * N; k++) { const t = T[k]; if (!Number.isFinite(t)) nan = true; if (t < -1e-6) neg = true; sum += t; }
    if (nan) v.push('塗りの厚さがNaN'); if (neg) v.push('塗りの厚さがマイナス');
    if (state === 'spread' || state === 'score') {
      if (Math.abs(sum + load - scooped) > 0.01 * Math.max(1, scooped)) v.push(`量が合わない（パン${sum.toFixed(2)}+ナイフ${load.toFixed(2)}≠すくった${scooped.toFixed(2)}）`);
      if (load > cap * 1.001 + 1e-6) v.push('ナイフの量が上限を超えた');
      const bb = new THREE.Box3().setFromObject(breadMesh);
      if (bb.min.y < CONFIG.PLATE_TOP - 0.02) v.push('パンがお皿にめり込んだ');
      if (bb.min.y > CONFIG.PLATE_TOP + 0.05) v.push('パンがお皿から浮いた');
      if (Math.abs(bb.max.y - breadTopY) > 0.03) v.push('パンの上面と塗る面の高さがずれた');
    }
    if (state === 'spread' && knife.active && knife.y < bladeSurfaceMax() - 0.01) v.push('ナイフがパンにめり込んだ');
    if (state === 'spread' && spreadT > CONFIG.SPREAD_TIME + 1e-6) v.push('塗り時間が超えた');
    if (toastL > CONFIG.TOAST.MAX + 1e-6 || toastL < 0) v.push('焼き加減が範囲外');
    if (scores.some(s => s.total < 0 || s.total > 100) || total > 500 || total < 0) v.push('点数が範囲外');
    if (state === 'spread' || state === 'score') {
      if (stock < -1e-6) v.push('ビンの中身がマイナス');
      if (Math.abs(stock + scooped - stockMax) > 1e-6 * Math.max(1, stockMax)) v.push('ビンの減り方とすくった量が合わない');
      if (contFill && stockMax > 0 && Math.abs((contKind === 'jar' ? contFill.scale.y : contFill.scale.x) - Math.max(contKind === 'jar' ? 0.02 : 0.04, stock / stockMax)) > 0.01) v.push('ビンの見た目の量が実際とちがう');
    }
    if (pressure < 0 || pressure > 1 || !Number.isFinite(pressure)) v.push('押す強さが範囲外');
    if (!Number.isFinite(tearPressure()) || tough <= 0 || tough > 1) v.push('破れる強さの計算がおかしい');
    { let nt = 0, tc = 0, bad = false; const cx = (lidBounds.minX + lidBounds.maxX) / 2;
      for (let k = 0; k < N * N; k++) { nt += TGT[k]; tc += TORN[k]; if (TGT[k] && MASK[k] < 2) bad = true; if (TGT[k] && curOrder.half && -HALF + (k % N) * CS > cx + 1e-6) bad = true; if (TORN[k] && GRIP[k] !== 0) bad = true; }
      if (Math.max(1, nt) !== nTarget || bad) v.push('塗る所（注文）の範囲がおかしい');
      if (tc !== tornCount) v.push('破れた数が合わない'); }
    if (scores.some(s => s.tear < 0 || s.tear > CONFIG.TEAR.PEN_MAX)) v.push('破れの減点が範囲外');
    if (state === 'spread' && knife.active && knife.activeT > 0.3 && load > cap * 0.01 && !(knifeObj.blob.position.y < 0)) v.push('塗っている時に、乗っている面が下を向いていない');
    const bl = knifeObj.bladeGeo.boundingBox; if (Math.abs((bl.max.x - bl.min.x) - CONFIG.BLADE_LEN) > CONFIG.BLADE_LEN * 0.1) v.push('ナイフの見た目と当たる長さがちがう');
    if (maskInfo && lidBounds) {
      const gw = lidBounds.maxX - lidBounds.minX, gd = lidBounds.maxY - lidBounds.minY;
      if (Math.abs(maskInfo.w - gw) > gw * 0.1 || Math.abs(maskInfo.d - gd) > gd * 0.1) v.push('パンの見た目と塗る範囲の大きさがちがう');
      if (Math.abs(maskInfo.cx - (lidBounds.minX + lidBounds.maxX) / 2) > CS * 2 || Math.abs(maskInfo.cz + (lidBounds.minY + lidBounds.maxY) / 2) > CS * 2) v.push('パンの見た目と塗る範囲の位置がずれた');
    }
    return v;
  },
  ready: true,
};
</script>
