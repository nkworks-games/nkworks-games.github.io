<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===== [SEC:CONFIG] =====
const CONFIG = {
  FIXED: 1 / 120,        // 動きの計算の刻み(秒)
  MAX_FRAME: 0.1,        // 1フレームで進める最大の時間(秒)
  ROT_TIME: 0.34,        // 部屋が90°転がる時間(秒)
  FALL_ACC: 34,          // 家具が落ちる加速度(マス/秒²)
  UNDO_TIME: 0.22,       // 1手戻す時の動きの時間(秒)
  RESET_TIME: 0.36,      // やり直しの動きの時間(秒)
  BREAK_DIST: 3,         // 割れ物がこのマス数以上落ちると割れる
  STAR2_EXTRA: 2,        // 最少手数＋この手数までなら★2
  HINT_STAR_MAX: 2,      // ヒントを使ったステージの★の上限
  HINT_CAP: 200000,      // ヒントの答えを探す時に調べる形の数の上限
  CLEAR_TIME: 1.0,       // クリアのお祝いの時間(秒)
  BREAK_SHOW: 0.7,       // 割れてから案内を出すまで(秒)
  CAM_FOV: 36,           // カメラの画角
  CAM_AZIM: 28,          // カメラを右へ回りこませる角度(度)
  CAM_ELEV: 40,          // カメラの見下ろす角度(度)
  CAM_FIT: 0.88,         // 部屋の大きさ×この数 が画面に入るように引く（部屋の辺1マスあたり）
  HUD_H: 74,             // 上の表示の高さ(px)
  PAD_H: 196,            // 下の操作パッドの高さ(px)
  WALL_HIDE_START: 0.04, // 壁がカメラにこれ以上向くと透け始める
  WALL_HIDE_END: 0.2,    // ここで完全に消える
  SWIPE_MIN: 26,         // スワイプと判定する指の移動(px)
  SHAKE: 0.035,          // 着地のゆれの強さ
  SHARDS: 16,            // 割れた時のかけらの数
  TITLE_SPIN: 0.35,      // タイトル画面で部屋が回る速さ(ラジアン/秒)
  RESULT_GUARD: 0.6,     // クリア画面が出てすぐの押しまちがいを防ぐ時間(秒)
  URL: 'https://nkworks-games.com/hakobeya/',
  FOLLOW_URL: 'https://x.com/intent/follow?screen_name=vyaPudzd1E54661', OFUSE_URL: 'https://ofuse.me/nkworks_games', // 作者をフォロー（X）／作者を応援する（OFUSE）
};

// ===== [SEC:LOGIC] =====
// 部屋の向き R（部屋→世界の3x3整数行列）と家具の位置だけで動きを決める。見た目とは別。
const SHAPES = { '1': [[0,0,0]], x2: [[0,0,0],[1,0,0]], z2: [[0,0,0],[0,0,1]], y2: [[0,0,0],[0,1,0]] };
const TYPES = {
  chair:   { name: 'イス',     color: '#f08a3c' },
  plant:   { name: '観葉植物', color: '#3fae5a' },
  table:   { name: 'テーブル', color: '#a8714a' },
  bed:     { name: 'ベッド',   color: '#4f86e0' },
  sofa:    { name: 'ソファ',   color: '#e0545b' },
  shelf:   { name: '本棚',     color: '#8a5cc8' },
  vase:    { name: '花びん',   color: '#e86fa8', fragile: true },
  bowl:    { name: '金魚鉢',   color: '#2fb8c8', fragile: true },
  counter: { name: 'キッチン台', color: '#8a8f99', fixed: true },
  cabinet: { name: '吊り戸棚', color: '#8a8f99', fixed: true },
};
const MOVES = { // 世界での回転（カメラは手前 +z・上 +y）
  right: [0,1,0, -1,0,0, 0,0,1],   // 上が右へ倒れる
  left:  [0,-1,0, 1,0,0, 0,0,1],
  up:    [1,0,0, 0,0,1, 0,-1,0],   // 上が奥へ倒れる
  down:  [1,0,0, 0,0,-1, 0,1,0],
};
const MOVE_KEYS = ['right', 'left', 'up', 'down'];
const IDENT = [1,0,0, 0,1,0, 0,0,1];
function matMul(a, b) { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { let s = 0; for (let k = 0; k < 3; k++) s += a[i*3+k] * b[k*3+j]; r[i*3+j] = s; } return r; }
function gravityOf(R) { return [-R[3] || 0, -R[4] || 0, -R[5] || 0]; } // 部屋から見た重力の向き
function groupOf(p) { return p.t + ':' + p.s; }

function buildLevel(def) { // def: {N, pieces:[[t,s,[x,y,z]]...], targets:[[t,s,[x,y,z]]...]}
  const pieces = def.pieces.map(([t, s, p]) => ({ t, s, cells: SHAPES[s], fixed: !!TYPES[t].fixed, fragile: !!TYPES[t].fragile, start: p }));
  const targets = {};
  for (const [t, s, p] of def.targets) (targets[t + ':' + s] = targets[t + ':' + s] || []).push(p);
  for (const k in targets) targets[k] = targets[k].map(p => p.join(',')).sort();
  return { N: def.N, pieces, targets };
}
function initState(L) { return { R: IDENT.slice(), pos: L.pieces.map(p => p.start.slice()), broken: -1 }; }

function settle(L, pos, g) { // 重力 g の向きへ、止まるまで1マスずつ全員を落とす。戻り値は落ちたマス数
  const N = L.N, grid = new Int16Array(N * N * N).fill(-1);
  const id = (x, y, z) => (x * N + y) * N + z;
  L.pieces.forEach((pc, i) => { for (const c of pc.cells) grid[id(pos[i][0]+c[0], pos[i][1]+c[1], pos[i][2]+c[2])] = i; });
  const dist = pos.map(() => 0);
  const mov = []; L.pieces.forEach((pc, i) => { if (!pc.fixed) mov.push(i); });
  const lead = i => { let m = -1e9; for (const c of L.pieces[i].cells) m = Math.max(m, (pos[i][0]+c[0])*g[0] + (pos[i][1]+c[1])*g[1] + (pos[i][2]+c[2])*g[2]); return m; };
  let moved = true;
  while (moved) {
    moved = false;
    const order = mov.slice().sort((a, b) => lead(b) - lead(a));
    for (const i of order) {
      const cells = L.pieces[i].cells; let ok = true;
      for (const c of cells) {
        const x = pos[i][0]+c[0]+g[0], y = pos[i][1]+c[1]+g[1], z = pos[i][2]+c[2]+g[2];
        if (x < 0 || y < 0 || z < 0 || x >= N || y >= N || z >= N) { ok = false; break; }
        const o = grid[id(x, y, z)]; if (o !== -1 && o !== i) { ok = false; break; }
      }
      if (!ok) continue;
      for (const c of cells) grid[id(pos[i][0]+c[0], pos[i][1]+c[1], pos[i][2]+c[2])] = -1;
      pos[i] = [pos[i][0]+g[0], pos[i][1]+g[1], pos[i][2]+g[2]];
      for (const c of cells) grid[id(pos[i][0]+c[0], pos[i][1]+c[1], pos[i][2]+c[2])] = i;
      dist[i]++; moved = true;
    }
  }
  return dist;
}
function applyMove(L, s, mv, breakDist) { // 1手すすめた新しい状態（元の状態は変えない）
  const R = matMul(MOVES[mv], s.R), g = gravityOf(R);
  const pos = s.pos.map(p => p.slice());
  const dist = settle(L, pos, g);
  let broken = -1;
  L.pieces.forEach((pc, i) => { if (broken < 0 && pc.fragile && dist[i] >= breakDist) broken = i; });
  return { R, pos, dist, broken };
}
function posKey(L, s) { const gr = {}; L.pieces.forEach((pc, i) => { if (!pc.fixed) (gr[groupOf(pc)] = gr[groupOf(pc)] || []).push(s.pos[i].join(',')); }); return Object.keys(gr).sort().map(k => k + '=' + gr[k].sort().join('|')).join(';'); }
function stateKey(L, s) { return s.R.join('') + '#' + posKey(L, s); }
function onTarget(L, s, i) { const pc = L.pieces[i]; const t = L.targets[groupOf(pc)]; return !!t && t.includes(s.pos[i].join(',')); }
function isGoal(L, s) {
  if (s.broken >= 0) return false;
  const g = gravityOf(s.R); if (g[1] !== -1) return false;
  const gr = {}; L.pieces.forEach((pc, i) => { if (!pc.fixed) (gr[groupOf(pc)] = gr[groupOf(pc)] || []).push(s.pos[i].join(',')); });
  for (const k in L.targets) { const a = (gr[k] || []).sort(); const b = L.targets[k]; if (a.length !== b.length || a.some((v, j) => v !== b[j])) return false; }
  return true;
}
function solve(L, start, breakDist, cap) { // 最短手順（幅優先探索）。見つからなければ null
  const k0 = stateKey(L, start); const prev = new Map([[k0, null]]); let q = [start];
  if (isGoal(L, start)) return [];
  while (q.length && prev.size < (cap || 500000)) {
    const nq = [];
    for (const s of q) for (const mv of MOVE_KEYS) {

});
let sw = null;
canvas.addEventListener('pointerdown', e => { sfx.unlock(); sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
window.addEventListener('pointerup', e => {
  if (!sw || e.pointerId !== sw.id) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < CONFIG.SWIPE_MIN) return;
  request(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
window.addEventListener('pointercancel', () => { sw = null; });
const on = (id, fn) => document.getElementById(id).addEventListener('click', e => { sfx.unlock(); sfx.tap(); fn(e); });
for (const [id, act] of [['arU', 'up'], ['arD', 'down'], ['arL', 'left'], ['arR', 'right'], ['btnUndo', 'undo'], ['btnReset', 'reset']]) {
  const el = document.getElementById(id); el.addEventListener('pointerdown', e => { e.preventDefault(); sfx.unlock(); request(act); });
}

// ===== [SEC:UI] =====
const $ = id => document.getElementById(id);
function show(id, v) { $(id).classList.toggle('hide', !v); }
function hideOverlays() { for (const id of ['intro', 'clear', 'broken', 'hintAsk']) show(id, false); G.overlay = null; }
function updateHUD() {
  const st = STAGES[G.stage]; $('hudStage').textContent = `ステージ ${G.stage + 1}「${st.name}」`;
  $('hudMoves').innerHTML = `手数 <b>${G.moves}</b> ／ 最少 ${st.par}` + (G.hintUsed ? ' <span class="small">💡使用</span>' : '');
  $('btnSound').textContent = save.mute ? '🔈' : '🔊';
}
function openIntro() {
  const i = G.stage, st = STAGES[i], tip = TIPS[i + 1] && !(save.stars[i] > 0) ? `<p class="tip">${TIPS[i + 1]}</p>` : '';
  $('introCard').innerHTML = `<p class="small">ステージ ${i + 1} ／ ${st.N}×${st.N}×${st.N}</p><h2>${st.name}</h2><p>最少 <b>${st.par}</b> 手でそろえよう</p>${tip}<p class="small">タップしてスタート</p>`;
  show('intro', true); G.overlay = 'intro';
}
function closeIntro() { show('intro', false); G.overlay = null; }
$('intro').addEventListener('pointerdown', e => { e.preventDefault(); sfx.unlock(); closeIntro(); });
function openClear(st) {
  const last = G.stage === STAGES.length - 1;
  $('clearTitle').textContent = last ? '全部の部屋が片づいた！' : '片づいた！';
  $('clearStars').innerHTML = [0, 1, 2].map(k => `<span class="${k < st ? 'on' : ''}">★</span>`).join('');
  const par = STAGES[G.stage].par;
  $('clearInfo').innerHTML = `手数 <b>${G.moves}</b> ／ 最少 ${par}` + (st < 3 ? `<br><span class="small">${G.hintUsed ? 'ヒントなし・' : ''}${par}手でできると★3つ</span>` : '');
  $('btnNext').classList.toggle('hide', last); show('clear', true); G.overlay = 'clear'; clearShownAt = performance.now();
  G.share = `「ハコベヤ」ステージ${G.stage + 1}「${STAGES[G.stage].name}」を${G.moves}手で片づけた！ ${'★'.repeat(st)}${'☆'.repeat(3 - st)}\n#ハコベヤ`;
}
function openBroken() {
  const pc = G.L.pieces[G.s.broken]; $('brokenInfo').textContent = `${TYPES[pc.t].name}が${CONFIG.BREAK_DIST}マス以上落ちて割れました。`;
  show('broken', true); G.overlay = 'broken';
}
function brokenAct(act) { show('broken', false); G.overlay = null; act === 'undo' ? undo() : resetStage(); }
on('btnBrUndo', () => brokenAct('undo')); on('btnBrReset', () => brokenAct('reset'));
let clearShownAt = 0; const resultReady = () => G.overlay !== 'clear' || performance.now() - clearShownAt > CONFIG.RESULT_GUARD * 1000;
on('btnNext', () => { if (resultReady()) loadStage(Math.min(STAGES.length - 1, G.stage + 1)); });
on('btnRetry', () => { if (resultReady()) loadStage(G.stage, false); });
on('btnToSelect', () => { if (resultReady()) openSelect(); });
on('btnShare', () => { if (resultReady()) window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(G.share || '') + '&url=' + encodeURIComponent(CONFIG.URL), '_blank', 'noopener'); });
document.querySelectorAll('a.sup').forEach(a => { a.href = a.dataset.k === 'follow' ? CONFIG.FOLLOW_URL : CONFIG.OFUSE_URL; a.addEventListener('click', e => { if (!resultReady()) e.preventDefault(); }); }); on('btnMenu', openSelect); on('btnSelect', openSelect);
on('btnStart', () => { let i = STAGES.findIndex((s, k) => !(save.stars[k] > 0)); if (i < 0) i = 0; loadStage(i); });
on('btnSelBack', () => { show('select', false); if (G.state !== 'play') show('title', true); else G.overlay = null; });
on('btnSound', () => { save.mute = !save.mute; writeSave(); updateHUD(); });
// ----- ヒント -----
const ARROW = { up: 'arU', down: 'arD', left: 'arL', right: 'arR' };
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('on'); void t.offsetWidth; t.classList.add('on'); }
function clearGlow() { G.hintDir = null; for (const id of Object.values(ARROW)) $(id).classList.remove('glow'); }
function askHint() {
  if (G.state !== 'play' || G.overlay || G.cleared || G.anim) return;
  if (G.s.broken >= 0) return toast('割れちゃったので、1手戻してね');
  if (!G.hintUsed) { show('hintAsk', true); G.overlay = 'hintAsk'; return; }
  showHint();
}
function showHint() {
  const path = solve(G.L, G.s, CONFIG.BREAK_DIST, CONFIG.HINT_CAP);
  clearGlow();
  if (!path) return toast('この形からはそろえられません。1手戻すかやり直してね');
  if (!path.length) return;
  G.hintDir = path[0]; $(ARROW[G.hintDir]).classList.add('glow');
  toast(`光っているボタンを押そう（あと${path.length}手）`);
}
$('btnHint').addEventListener('pointerdown', e => { e.preventDefault(); sfx.unlock(); sfx.tap(); askHint(); });
on('btnHintYes', () => { show('hintAsk', false); G.overlay = null; G.hintUsed = true; updateHUD(); showHint(); });
on('btnHintNo', () => { show('hintAsk', false); G.overlay = null; });
function openSelect() {
  hideOverlays(); let total = 0;
  for (const [gid, a, b] of [['grid1', 0, 10], ['grid2', 10, 20]]) {
    $(gid).innerHTML = '';
    for (let i = a; i < b && i < STAGES.length; i++) {
      const s = save.stars[i] || 0, lock = !isUnlocked(i); total += s;
      const el = document.createElement('button'); el.className = 'tile' + (lock ? ' lock' : '');
      el.innerHTML = lock ? '🔒' : `${i + 1}<div class="st">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</div>`;
      if (!lock) el.addEventListener('click', () => { sfx.unlock(); sfx.tap(); loadStage(i); });
      $(gid).appendChild(el);
    }
  }
  $('selTotal').textContent = `★ ${total} / ${STAGES.length * 3}`;
  show('select', true); show('title', false); if (G.state === 'play') G.overlay = 'select';
}

// ===== [SEC:LOOP] =====
let acc = 0, last = performance.now(), manual = false, paused = false;
function update(frameDt) { acc += Math.min(frameDt, CONFIG.MAX_FRAME); while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; } }
function frame(now) { if (!paused && !manual) update((now - last) / 1000); last = now; render(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });
window.addEventListener('resize', layout);
// タイトル画面：散らかった部屋を回して見せる
G.L = buildLevel(STAGES[STAGES.length - 1]); G.s = initState(G.L); buildRoom(G.L); syncViews(); updateMatch(); layout();
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
window.__TEST__ = {
  keys: ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'],
  randomInput(r) { if (G.overlay === 'intro') closeIntro(); if (G.overlay === 'hintAsk') $('btnHintYes').click(); if (r > 0.92) askHint(); if (r < 0.05) request('undo'); else if (r < 0.065) request('reset'); else if (G.overlay === 'broken' && r < 0.3) brokenAct('undo'); },
  reset(seed) { manual = true; loadStage(((seed * 7) + 12) % STAGES.length, false); },
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); render(); },
  state() { return { stage: G.stage + 1, moves: G.moves, anim: G.anim && G.anim.type, g: G.s && gravityOf(G.s.R), cleared: G.cleared, broken: G.s && G.s.broken, overlay: G.overlay, over: G.overlay === 'clear' }; },
  check() {
    const v = [], L = G.L, N = roomN, h = N / 2, tol = 0.02;
    if (!L) return v;
    const q = roomQuat; if (![q.x, q.y, q.z, q.w].every(Number.isFinite) || Math.abs(q.length() - 1) > 1e-3) v.push('部屋の向きがおかしい');
    if (G.moves !== G.hist.length || G.moves < 0) v.push('手数がおかしい');
    const occ = new Set();
    L.pieces.forEach((pc, i) => { for (const c of pc.cells) { const p = [0, 1, 2].map(a => G.s.pos[i][a] + c[a]); if (p.some(x => x < 0 || x >= N)) v.push(`家具${i}が部屋の外（計算）`); const k = p.join(','); if (occ.has(k)) v.push(`家具${i}が重なっている（計算）`); occ.add(k); } });
    const box = i => { const pc = L.pieces[i], p = views[i].g.position, mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9]; for (const c of pc.cells) [p.x + c[0], p.y + c[1], p.z + c[2]].forEach((x, a) => { mn[a] = Math.min(mn[a], x - .5); mx[a] = Math.max(mx[a], x + .5); }); return { mn, mx }; };
    const boxes = L.pieces.map((pc, i) => box(i));
    boxes.forEach((b, i) => { if ([...b.mn, ...b.mx].some(x => !Number.isFinite(x))) v.push(`家具${i}の位置がNaN`); if (b.mn.some(x => x < -h - tol) || b.mx.some(x => x > h + tol)) v.push(`家具${i}が壁を抜けた（見た目）`); });
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      if (G.s.broken === i || G.s.broken === j) continue; const a = boxes[i], b = boxes[j]; let pen = 1e9;
      for (let ax = 0; ax < 3; ax++) pen = Math.min(pen, Math.min(a.mx[ax], b.mx[ax]) - Math.max(a.mn[ax], b.mn[ax]));
      if (pen > tol) v.push(`家具${i}と${j}がめり込み（${pen.toFixed(2)}）`);
    }
    if (!G.anim) L.pieces.forEach((pc, i) => { if (views[i].g.position.distanceTo(cellPos(G.s.pos[i])) > 1e-4) v.push(`家具${i}の見た目と計算がずれている`); });
    for (const s of shards) if (!['x', 'y', 'z'].every(a => Math.abs(s.m.position[a]) <= h + 1e-3)) v.push('かけらが部屋の外');
    return v;
  },
  // 追加：全ステージの確認用
  load(i) { manual = true; loadStage(i, false); },
  solve() { return solve(G.L, G.s, CONFIG.BREAK_DIST); },
  press(act) { request(act); },
  hint() { askHint(); if (G.overlay === 'hintAsk') $('btnHintYes').click(); return { dir: G.hintDir, glow: [...document.querySelectorAll('.ar.glow')].map(e => e.id), toast: $('toast').textContent, used: G.hintUsed }; },
  settle() { let n = 0; while ((G.anim || G.brokenT >= 0) && n++ < 2000) update(1 / 60); render(); },
  nStages: STAGES.length,
  ready: true,
};
</script>
</body>
</html>
