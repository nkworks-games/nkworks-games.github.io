<style>
:root{
  color-scheme:dark;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --cream:#fff4e2; --ink:#2b1a12; --red:#e2483c; --gold:#ffc94d; --night:#141228;
  --ad-h:50px;    /* 広告バナーの高さ */
  --ad-gap:75px;  /* バナーとゲームの間（まちがって広告を押さないように、いつも75pxあける） */
}
html,body{margin:0;height:100%;background:#0b0918;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--maru)}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center}
body.ad-on #app{bottom:calc(var(--ad-h) + var(--ad-gap) + env(safe-area-inset-bottom,0px))}
#stage{position:relative;overflow:hidden;width:100%;height:100%;background:#141228;touch-action:none}
#stage.dimmed:after{content:"";position:absolute;inset:0;background:rgba(10,8,24,.72);z-index:1}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;pointer-events:none;z-index:2}
#ui button,#ui input,#ui a,#ui .pe{pointer-events:auto}
.hide{display:none!important}
button{font-family:var(--maru);font-weight:800;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* 広告の帯：結果の画面の時だけ出す。帯の上ではゲームの操作は反応しない */
#ad-zone{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;height:var(--ad-h);padding-bottom:env(safe-area-inset-bottom,0px);background:#0a0816;box-shadow:0 -1px 0 rgba(255,255,255,.08);align-items:center;justify-content:center;touch-action:manipulation;-webkit-user-select:auto;user-select:auto}
body.ad-on #ad-zone{display:flex}
#ad-banner{width:320px;height:50px;max-height:50px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#ad-banner ins{display:inline-block;width:320px;height:50px}

/* ---- HUD ---- */
#hud{position:absolute;inset:0}
.ib{position:absolute;left:8px;top:8px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:36px;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#chip{position:absolute;left:52px;top:9px;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,244,226,.94);color:var(--ink);font-size:14px;font-weight:800;line-height:30px;white-space:nowrap}
#gauge{position:absolute;left:52px;top:46px;width:200px;font-size:11px;color:#ffe9c9;text-shadow:0 1px 2px #000}
#gauge .bar{height:10px;border-radius:5px;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden;margin-top:3px}
#gFill{display:block;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#8fb7ff,#ffb24a 60%,#ff6a3d)}
#gTemp{position:absolute;right:0;top:0;font-weight:800}
#gauge.warn #gFill{animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
#mihon{position:absolute;right:8px;top:8px;width:92px;height:112px;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(255,214,150,.75);font-size:11px;text-align:center;color:#ffe2b3}
.pv{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;display:block}
#mihon span{position:absolute;left:0;right:0;top:3px;font-weight:800}
#mihon b{position:absolute;left:0;right:0;bottom:4px;font-size:12px;color:#fff}
#hint{position:absolute;left:10px;right:10px;bottom:132px;text-align:center;font-size:12px;line-height:1.5;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
#hint small{display:block;font-size:10.5px;color:#d9cbe9}
#pal{position:absolute;left:8px;right:8px;bottom:84px;display:flex;justify-content:center;gap:5px}
.sw{width:32px;height:32px;border-radius:50%;padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.35);position:relative;font-size:10px;color:#333}
.sw.on{transform:translateY(-4px);box-shadow:0 0 0 3px #fff,0 4px 0 rgba(0,0,0,.4)}
.bar{display:flex}
#bar1,#bar2{position:absolute;left:8px;right:8px;bottom:12px;height:64px;display:flex;gap:6px;align-items:stretch}
.tb{flex:0 0 64px;border-radius:14px;background:rgba(255,244,226,.92);color:var(--ink);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tb svg{width:28px;height:28px}
.tb.on{background:#ffcf5a;box-shadow:0 0 0 3px #fff,0 4px 0 #9a5d10;transform:translateY(-2px)}
.go{flex:1 1 auto;border-radius:32px;background:linear-gradient(#ff7a5a,#e2483c);color:#fff;font-size:17px;box-shadow:0 5px 0 #8f2717;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.go small{display:block;font-size:10.5px;font-weight:700;opacity:.92}
#toast{position:absolute;left:0;right:0;top:170px;text-align:center;font-family:var(--pop);font-size:26px;color:#fff;text-shadow:0 3px 0 #b8362a,0 0 14px rgba(0,0,0,.6);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8)}
#toast.on{opacity:1;transform:scale(1)}
#toast small{display:block;font-family:var(--maru);font-size:13px;text-shadow:0 1px 3px #000}
#snip{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;opacity:0;pointer-events:none}
#snip.on{animation:snip .45s ease-out}
@keyframes snip{0%{opacity:1;transform:scale(1.2) rotate(-20deg)}40%{opacity:1;transform:scale(1) rotate(10deg)}100%{opacity:0;transform:scale(.9) rotate(0)}}

/* ---- 画面（タイトル・注文・結果など） ---- */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;pointer-events:auto;box-sizing:border-box}
.scr.on{display:flex}
.card{width:332px;margin-top:auto;margin-bottom:auto;background:linear-gradient(#fff8ec,#f6e6cc);color:var(--ink);border-radius:20px;padding:14px 14px 16px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 3px #e9c98f;text-align:center}
.card h2{margin:0 0 6px;font-family:var(--pop);font-size:21px;font-weight:400;color:#b8362a}
.btn{height:50px;padding:0 22px;border-radius:25px;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.b1{background:linear-gradient(#ff7a5a,#e2483c);color:#fff;box-shadow:0 5px 0 #8f2717}
.b2{background:linear-gradient(#fffdf8,#efe2cc);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.b3{background:#111;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.sm{height:40px;font-size:14px;padding:0 16px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* タイトル */
#stage.tbg:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(10,8,30,.75),rgba(10,8,30,0) 26%,rgba(10,8,30,0) 56%,rgba(10,8,30,.88) 70%)}
#sTitle h1{margin:30px 0 0;font-family:var(--pop);font-weight:400;font-size:46px;line-height:1.1;color:var(--cream);text-shadow:0 4px 0 #b8362a,0 8px 20px rgba(0,0,0,.6);letter-spacing:1px}
#sTitle .sub{margin:8px 0 0;font-size:13.5px;line-height:1.5;text-align:center;color:#ffe2b3;text-shadow:0 1px 3px #000}
#sTitle .how{margin-top:auto;display:flex;gap:6px}
#sTitle .how div{width:104px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 4px;font-size:11px;line-height:1.4;text-align:center}
#sTitle .how b{display:block;font-size:13.5px;color:#ffd66b;white-space:nowrap}
#sTitle .btns{display:flex;flex-direction:column;gap:10px;margin-top:12px;width:280px}
#sTitle .btns .btn{width:100%;flex-direction:column;gap:0;height:56px}
#sTitle .btns .btn small{font-size:11px;font-weight:700;opacity:.9}
#sTitle .foot{display:flex;gap:10px;align-items:center;margin:8px 0 0;font-size:12px}
#best{font-size:12.5px;color:#ffd66b;margin-top:8px;min-height:1em;text-shadow:0 1px 2px #000}
.tlink{color:#d9cbe9;font-size:12px}
/* 注文 */
.kidrow{display:flex;align-items:flex-end;gap:6px;margin-top:4px}
.kid{width:96px;height:120px;flex:0 0 96px}
.kid svg{width:100%;height:100%}
.bub{position:relative;flex:1;background:#fff;border-radius:16px;padding:10px 10px;font-size:17px;font-weight:800;line-height:1.35;box-shadow:0 2px 0 rgba(0,0,0,.15);margin-bottom:46px;text-align:left}
.bub:after{content:"";position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
.bub small{display:block;font-size:11.5px;color:#8a6a55;font-weight:700}
#oPrev{width:200px;height:190px;margin:2px auto 0;border-radius:14px;position:relative;box-shadow:inset 0 0 0 2px #e0b878}
#oPrev span{position:absolute;left:0;right:0;top:6px;font-size:12px;font-weight:800;color:#ffe2b3}
#oTip{font-size:11.5px;line-height:1.55;color:#6b5040;margin:6px 0 8px;text-align:left;background:rgba(255,255,255,.6);border-radius:10px;padding:6px 8px}
/* 結果 */
#rHead{font-size:13px;font-weight:800;color:#8a6a55}
.cmp{display:flex;gap:8px;justify-content:center;margin:6px 0}
.cmp figure{margin:0;width:118px}
.cmp img{width:118px;height:132px;object-fit:contain;border-radius:12px;background:radial-gradient(#3b2c5c,#1b1533)}
.cmp figcaption{font-size:11.5px;font-weight:800;color:#8a6a55}
.bk{margin:4px 8px 0;font-size:13px;text-align:left}
.bk div{display:flex;align-items:center;gap:6px;margin:3px 0}
.bk b{width:22px}
.bk i{flex:1;height:10px;border-radius:5px;background:#e8d6b8;overflow:hidden;display:block}
.bk i em{display:block;height:100%;background:linear-gradient(90deg,#ffb24a,#e2483c);border-radius:5px}
.bk span{width:50px;text-align:right;font-weight:800}
#rTotal{font-family:var(--pop);font-size:40px;color:#b8362a;line-height:1.1;margin:6px 0 2px}
#rTotal small{font-size:16px}
#rKid{display:flex;align-items:center;gap:6px}
#rKid .kid{width:70px;height:88px;flex-basis:70px}
#rKid .bub{margin-bottom:22px;font-size:15px}
/* 最終・写真 */
#fImg,#pImg{width:216px;height:270px;border-radius:12px;display:block;margin:6px auto;background:#1b1533;object-fit:contain}
#fTotal{font-family:var(--pop);font-size:34px;color:#b8362a;line-height:1.15}
#fRank{font-size:16px;font-weight:800;color:#6b3b1a}
#fBest{font-size:12px;color:#8a6a55}
#sName input{width:100%;box-sizing:border-box;height:46px;border-radius:12px;border:2px solid #d9b88a;font-size:17px;padding:0 12px;font-family:var(--maru);font-weight:800;color:var(--ink);background:#fff;margin:8px 0 12px;-webkit-user-select:text;user-select:text}
.note{font-size:11.5px;color:#8a6a55;margin:6px 0 0}
/* 作者をフォロー（タイトルと結果画面だけ。サイトのほかのゲームと同じ形） */
.follow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;margin-top:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 8px 6px 14px;text-align:left;color:#fff}
.follow>div{min-width:0}.follow p{margin:0}
.follow .fl{font-size:13px;font-weight:800;line-height:1.3;white-space:nowrap}
.follow .fs{display:none}
.fbtn{flex-shrink:0;display:inline-block;padding:8px 10px;border-radius:999px;background:#000;color:#fff;border:1px solid #4a4f66;font-size:12.5px;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #333;white-space:nowrap}
.fbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #333}
.card .follow{background:rgba(120,80,40,.07);border-color:#e3c897;color:var(--ink)}
.card .follow .fs{color:#8a6a55}
#sTitle .follow{width:300px;margin:8px 0 12px}
</style>
</head>
<body>
<div id="app"><div id="stage">
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
  <div id="hud" class="hide">
    <button class="ib" id="bQuit" aria-label="やめる">×</button>
    <div id="chip"></div>
    <div id="gauge"><span>飴のやわらかさ</span><span id="gTemp">95℃</span><div class="bar"><i id="gFill"></i></div></div>
    <div id="mihon"><canvas class="pv"></canvas><span>見本</span><b id="mName"></b></div>
    <div id="hint"></div>
    <div id="pal" class="hide"></div>
    <div id="bar1">
      <button class="tb" id="tCut"><svg viewBox="0 0 32 32"><circle cx="9" cy="24" r="4.5" fill="none" stroke="#c0392b" stroke-width="2.6"/><circle cx="23" cy="24" r="4.5" fill="none" stroke="#c0392b" stroke-width="2.6"/><path d="M12 20 L22 3 M20 20 L10 3" stroke="#555" stroke-width="2.6" stroke-linecap="round"/></svg>切る</button>
      <button class="tb" id="tPull"><svg viewBox="0 0 32 32"><circle cx="11" cy="17" r="7" fill="#fff" stroke="#999" stroke-width="2"/><path d="M15 13 L27 5 M27 5 L21 5 M27 5 L26 11" stroke="#c0392b" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M5 27 Q9 22 13 25" stroke="#555" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>のばす</button>
      <button class="go" id="bToPaint">色ぬりへ ▶<small>形はこれでOK</small></button>
    </div>
    <div id="bar2" class="hide">
      <button class="tb" id="tBrush"><svg viewBox="0 0 32 32"><path d="M20 4 L28 12 L14 22 L10 18Z" fill="#c9a06a" stroke="#7a5530" stroke-width="1.6"/><path d="M10 18 L14 22 Q10 30 3 29 Q4 22 10 18Z" fill="#333"/></svg><span id="tBrushL">太い筆</span></button>
      <button class="tb" id="tEye"><svg viewBox="0 0 32 32"><path d="M3 16 Q16 4 29 16 Q16 28 3 16Z" fill="#fff" stroke="#555" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="#222"/><circle cx="18" cy="14" r="1.6" fill="#fff"/></svg>目</button>
      <button class="tb" id="tUndo"><svg viewBox="0 0 32 32"><path d="M9 12 Q20 4 26 14 Q29 22 20 26" stroke="#555" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M4 8 L10 15 L13 6Z" fill="#555"/></svg>もどす</button>
      <button class="go" id="bDone">できた！<small id="bDoneS">お客さんにわたす</small></button>
    </div>
  </div>
  <div id="toast"></div>
  <svg id="snip" viewBox="0 0 32 32"><circle cx="9" cy="24" r="4.5" fill="#fff" stroke="#c0392b" stroke-width="2.6"/><circle cx="23" cy="24" r="4.5" fill="#fff" stroke="#c0392b" stroke-width="2.6"/><path d="M12 20 L22 3 M20 20 L10 3" stroke="#eee" stroke-width="3" stroke-linecap="round"/></svg>

  <section class="scr on" id="sTitle">
    <h1>飴細工やさん</h1>
    <p class="sub">熱い飴が冷えて固まる前に、<br>切って・のばして・色をぬる</p>
    <div class="how">
      <div><b>✂ 切る</b>なぞると<br>出っぱりができる</div>
      <div><b>のばす</b>つまんで<br>引っぱる</div>
      <div><b>ぬる</b>筆で色と<br>目をつける</div>
    </div>
    <div class="btns">
      <button class="btn b1" id="bQuest">屋台をひらく<small>お客さん5人の注文にこたえる</small></button>
      <button class="btn b2" id="bFree">じゆうに作る<small>題名をつけて写真にできる</small></button>
    </div>
    <div id="best"></div>
    <div class="foot"><button class="btn b3 sm" id="bMute">音：あり</button><a class="tlink" data-google-vignette="false" href="/games/ame-zaiku-yasan/">遊び方・ほかのゲーム ›</a></div>
    <div class="follow"><div><p class="fl">作者をフォロー</p><p class="fs">新作のお知らせをしています</p></div><a class="fbtn" target="_blank" rel="noopener" data-google-vignette="false"></a></div>
  </section>

  <section class="scr dim" id="sOrder">
    <div class="card">
      <div id="oNo" style="font-size:13px;font-weight:800;color:#8a6a55"></div>
      <div class="kidrow"><div class="kid" id="oKid"></div><div class="bub"><span id="oLine"></span><small id="oName"></small></div></div>
      <div id="oPrev" class="pe"><canvas class="pv"></canvas><span>見本</span></div>
      <div id="oTip"></div>
      <button class="btn b1" id="bMake">つくる！</button>
    </div>
  </section>

  <section class="scr dim" id="sResult">
    <div class="card">
      <div id="rHead"></div>
      <div id="rKid"><div class="kid" id="rKidF"></div><div class="bub" id="rLine"></div></div>
      <div class="cmp"><figure><img id="rImgT" alt="見本"><figcaption>見本</figcaption></figure><figure><img id="rImgP" alt="あなたの飴細工"><figcaption>あなたの飴細工</figcaption></figure></div>
      <div class="bk" id="rBk"></div>
      <div id="rTotal"></div>
      <button class="btn b1" id="bNext">つぎのお客さんへ ▶</button>
    </div>
  </section>

  <section class="scr dim" id="sFinal">
    <div class="card">
      <h2>今夜の屋台、おしまい！</h2>
      <div id="fTotal"></div>
      <div id="fRank"></div>
      <div id="fBest"></div>
      <img id="fImg" alt="今夜作った飴細工">
      <div class="row"><button class="btn b2 sm" id="fSave">画像を保存</button><button class="btn b3 sm" id="fX">Xでシェア</button></div>
      <div class="row" style="margin-top:10px"><button class="btn b1 sm" id="fAgain">もう一回</button><button class="btn b2 sm" id="fTitle">タイトルへ</button></div>
      <div class="follow"><div><p class="fl">作者をフォロー</p><p class="fs">新作のお知らせをしています</p></div><a class="fbtn" target="_blank" rel="noopener" data-google-vignette="false"></a></div>
    </div>
  </section>

  <section class="scr dim" id="sName">
    <div class="card">
      <h2>題名をつけよう</h2>

  const D = Math.max(sph.radius, 2.0) * 1.08 / th;   // 小さい飴も大きい飴も、だいたい同じ大きさで写す
