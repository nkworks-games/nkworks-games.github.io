<style>
/* ===== [SEC:CSS] ===== */
:root{--pk:#f7869b;--pkd:#c9506a;--y:#ffcd45;--r:#e0412f;--ink:#4a3324;--paper:#fffaf0;--sub:#7d6b5b;--f:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
--ol:2px 0 0 #4a3324,-2px 0 0 #4a3324,0 2px 0 #4a3324,0 -2px 0 #4a3324,1.5px 1.5px 0 #4a3324,-1.5px 1.5px 0 #4a3324,1.5px -1.5px 0 #4a3324,-1.5px -1.5px 0 #4a3324}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f3f0d8;color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0}
.hide{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#paper{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.7;background-size:256px 256px}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(255,248,230,0) 58%,rgba(110,80,40,.26) 100%)}
#speed{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s;background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.6) 5.4deg 6deg);-webkit-mask:radial-gradient(ellipse at 50% 46%,transparent 40%,#000 78%);mask:radial-gradient(ellipse at 50% 46%,transparent 40%,#000 78%)}
/* 画面（タイトル・結果） */
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:5;padding:max(18px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));background:rgba(250,244,225,.25)}
.card{max-width:440px;margin:0 auto;background:var(--paper);border-radius:18px;padding:16px 18px 20px;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(74,51,36,.85),0 14px 40px rgba(60,40,20,.3)}
.btn{display:block;width:100%;border-radius:14px;padding:14px 10px;font-size:19px;font-weight:800;letter-spacing:.06em;background:var(--pk);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(150,40,60,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.b2{background:#fff;color:var(--ink);text-shadow:none}
.btn.bx{background:#222;text-shadow:none}
.btns{display:grid;gap:12px;margin-top:16px}
.adwrap{margin:75px auto 0;min-height:50px;display:flex;justify-content:center;max-width:440px}
.adwrap ins{display:inline-block;width:320px;height:50px}
.logo{text-align:center}
.logo svg{width:116px;height:auto;display:block;margin:0 auto}
.logo h1{font-size:38px;font-weight:800;letter-spacing:.04em;line-height:1.1;margin-top:2px;color:var(--ink);text-shadow:3px 3px 0 #ffc2cc}
.logo p{font-size:14px;color:var(--sub);margin-top:6px;font-weight:700}
.best{margin-top:12px;text-align:center;font-size:14px;color:var(--sub)}
.best b{font-size:22px;color:var(--ink);margin:0 2px}
.howto{font-size:14px;line-height:1.7;margin-top:14px;background:#f4eedb;border-radius:12px;padding:12px 14px;border:2px dashed #d8c9a4}
.howto li{list-style:none;padding-left:1.3em;text-indent:-1.3em}
.howto li:before{content:"●";color:var(--pk);margin-right:.3em;font-size:.8em}
.howto b{color:var(--pkd)}
.fine{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.6;text-align:center}
/* ゲーム中の表示 */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#wash{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,250,240,.93);border:3px solid var(--ink);border-radius:16px;padding:4px 12px 5px;text-align:center;box-shadow:0 3px 0 rgba(74,51,36,.6);min-width:214px}
#wash small{display:block;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.04em}
#cloths{display:flex;justify-content:center;gap:1px;margin-top:2px}
#cloths svg{width:17px;height:17px;transition:transform .35s,opacity .35s}
#cloths svg.done{opacity:.2;transform:scale(.7) translateY(-4px)}
#tmr{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-top:1px}
#tmr i{font-style:normal;font-size:13px;margin-left:2px}
#wash.low #tmr{color:var(--r);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
#prog{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 82px);left:50%;transform:translateX(-50%);width:min(66vw,290px);height:12px;border-radius:8px;background:linear-gradient(90deg,#a9dcee,#4aa7d8);border:2.5px solid var(--ink)}
#prog .fa{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 1.5px var(--ink)}
#pm{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 40% 35%,#ffd0d6,#f7869b 60%,#e0587a);border:2.5px solid var(--ink);left:0}
#pb{position:absolute;right:-16px;top:50%;width:28px;height:28px;margin-top:-15px}
#b-mute{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(255,250,240,.92);border:2.5px solid var(--ink);font-size:19px;pointer-events:auto}
#b-pause{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(255,250,240,.92);border:2.5px solid var(--ink);pointer-events:auto;display:flex;align-items:center;justify-content:center}
#b-pause svg{width:18px;height:18px;fill:var(--ink)}
#s-pause,#s-busy{display:flex;align-items:center;justify-content:center;background:rgba(60,40,20,.35)}
#s-pause .card,#s-busy .card{width:100%;max-width:320px;text-align:center}
#s-pause h2{font-size:26px;font-weight:800}
#s-pause p,#s-busy p{font-size:14px;color:var(--sub);margin-top:6px;font-weight:700;line-height:1.6}
#s-busy{z-index:6;background:rgba(60,40,20,.55)}
#s-busy h2{font-size:26px;font-weight:800;line-height:1.35;color:var(--r)}
#s-busy h2 i{display:block;font-style:normal;font-size:52px;line-height:1.1}
#s-busy p{font-size:16px;color:var(--ink)}
#s-busy p.sm{font-size:13.5px;color:var(--sub)}
.busyBan{margin-top:12px;background:var(--r);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:11px 10px 10px;text-align:center;font-size:19px;font-weight:800;line-height:1.35;box-shadow:0 4px 0 var(--ink);animation:banpulse 1.6s ease-in-out infinite}
.busyBan small{display:block;font-size:13.5px;font-weight:700;margin-top:4px;line-height:1.5}
@keyframes banpulse{50%{transform:scale(1.025)}}
#spd{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 100px);left:50%;transform:translateX(-50%);color:#fff;font-weight:800;text-shadow:var(--ol);white-space:nowrap;font-variant-numeric:tabular-nums}
#spd small{font-size:12px;margin-right:3px}#spd b{font-size:22px}#spd i{font-style:normal;font-size:12px;margin-left:2px}
#spd.hot b{color:#ffd23f}#spd.max b{color:#ff8a5c}
#pops>div{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;font-weight:800}
.pp{font-size:25px;color:#fff;text-shadow:var(--ol),0 4px 0 #4a3324}
.pp.hit{color:#ff6a55}.pp.dg{color:#ffd23f}.pp.bj{color:#7fe0ff}.pp.sp{color:#d9a8ff}
.say{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-size:15px;box-shadow:0 2px 0 rgba(74,51,36,.5)}
#big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:58px;text-align:center;white-space:nowrap;text-shadow:var(--ol),0 5px 0 #4a3324;opacity:0}
#big small{display:block;font-size:20px}
#big.on{animation:bigpop 1s ease-out forwards}
@keyframes bigpop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
#hint{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,420px);background:rgba(255,250,240,.95);color:var(--ink);font-size:15px;font-weight:800;line-height:1.5;padding:9px 13px;border-radius:12px;text-align:center;border:2.5px solid var(--ink);box-shadow:0 3px 0 rgba(74,51,36,.5)}
#flash{position:absolute;inset:0;background:#fffaf0;opacity:0}
#hitv{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(224,65,47,0) 50%,rgba(224,65,47,.5) 100%)}
/* 結果 */
.res h2{text-align:center;font-size:18px;font-weight:800}
.res .pre{text-align:center;font-size:14px;color:var(--sub);margin-top:8px;font-weight:700}
.res .num{text-align:center;font-size:64px;font-weight:800;line-height:1.05}
.res .num i{font-style:normal;font-size:22px;margin-left:4px}
.res .ttl{margin:10px auto 0;text-align:center;font-size:21px;font-weight:800;background:var(--y);border:2.5px solid var(--ink);border-radius:10px;padding:5px 10px}
.res .why{text-align:center;font-size:14px;color:var(--sub);margin-top:10px;line-height:1.6}
.res .st{text-align:center;font-size:13px;margin-top:8px;background:#f4eedb;border-radius:10px;padding:6px 8px;line-height:1.7}
.res .nb{text-align:center;color:var(--r);font-weight:800;margin-top:6px}
.rank{margin-top:12px;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.rank .tabs{display:flex;border-bottom:2.5px solid var(--ink)}
.rank .tabs button{flex:1;padding:7px 4px;font-size:14px;font-weight:800;background:#f4eedb;color:var(--sub)}
.rank .tabs button.on{background:var(--y);color:var(--ink)}
.rank .tabs button+button{border-left:2.5px solid var(--ink)}
.rank ol{list-style:none;padding:4px 10px 6px}
.rank li{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:15px;border-bottom:1px dashed #e2d6b8}
.rank li:last-child{border-bottom:0}
.rank li .m{width:26px;text-align:center;font-size:18px}
.rank li .t{font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
.rank li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank li.me{background:#fff3c4;border-radius:8px}
.rank .note{font-size:12.5px;color:var(--sub);text-align:center;padding:9px 8px;line-height:1.6}
.rank .live{font-size:10.5px;color:#2b9a4a;text-align:right;padding:0 10px 5px;font-weight:800}
.rkin{margin-top:12px;background:#fff3c4;border:2.5px solid var(--ink);border-radius:12px;padding:9px 10px;text-align:center}
.rkin p{font-size:14px;font-weight:800;line-height:1.6}
.rkin a{color:var(--pkd);text-decoration:underline;cursor:pointer;font-size:12.5px;margin-left:4px}
.rkf{display:flex;gap:8px;margin-top:8px}
.rkf input{flex:1;min-width:0;font-family:inherit;font-size:16px;padding:9px 10px;border:2.5px solid var(--ink);border-radius:10px;user-select:text;-webkit-user-select:text}
.rkf .btn{width:auto;padding:9px 16px;font-size:16px}
.rkErr{color:var(--r);font-size:12.5px!important;min-height:0}
#rk1{position:absolute;left:10px;top:calc(max(12px,env(safe-area-inset-top)) + 50px);max-width:96px;background:rgba(255,250,240,.9);border:2.5px solid var(--ink);border-radius:10px;padding:2px 7px 3px;text-align:center;line-height:1.15}
#rk1 b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
#rk1 small{display:block;font-size:10px;font-weight:700;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rkToast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 128px);transform:translate(-50%,-10px);background:var(--ink);color:#fff;font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s}
#rkToast.on{opacity:1;transform:translate(-50%,0)}
@media (max-height:520px){.logo svg{width:64px}.logo h1{font-size:28px}.logo p{margin-top:2px}.howto{font-size:12.5px;line-height:1.5;padding:8px 12px;margin-top:8px}.best{margin-top:6px}.btns{margin-top:10px}.btn{padding:10px}.res .num{font-size:46px}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800;font-size:16px;z-index:9;background:#f3f0d8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="paper"></div><div id="vig"></div><div id="speed"></div>
<div id="hud" class="hide">
  <div id="wash"><small>おばあさんの洗濯が おわるまで</small><div id="cloths"></div><div id="tmr"><span id="tm">120.0</span><i>秒</i></div></div>
  <div id="prog"><span id="pm"></span><svg id="pb" viewBox="0 0 28 28"><circle cx="14" cy="16" r="9" fill="#f7d5b8" stroke="#4a3324" stroke-width="2"/><path d="M5 15 C5 6 23 6 23 15 C20 11 8 11 5 15Z" fill="#f4f4f0" stroke="#4a3324" stroke-width="2"/><circle cx="14" cy="5" r="3.5" fill="#f4f4f0" stroke="#4a3324" stroke-width="2"/><path d="M10 17 q1.5 1.5 3 0 M15 17 q1.5 1.5 3 0" stroke="#4a3324" stroke-width="1.6" fill="none"/></svg></div>
  <button id="b-mute" aria-label="音のオンオフ">🔊</button>
  <button id="b-pause" aria-label="一時停止"><svg viewBox="0 0 20 20"><rect x="3.5" y="3" width="4.5" height="14" rx="1.5"/><rect x="12" y="3" width="4.5" height="14" rx="1.5"/></svg></button>
  <div id="rk1" class="hide"><b id="rk1t"></b><small id="rk1n"></small></div>
  <div id="rkToast"></div>
  <div id="spd"><small>時速</small><b id="kmh">0</b><i>km</i></div>
  <div id="pops"></div>
  <div id="hitv"></div>
  <div id="big"></div>
  <div id="hint" class="hide"></div>
  <div id="flash"></div>
</div>
<div id="s-title" class="scr hide">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 120 112"><path d="M8 100 q13 -9 26 0 t26 0 t26 0 t26 0" fill="none" stroke="#4aa7d8" stroke-width="5" stroke-linecap="round"/><defs><radialGradient id="pg" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#ffd3d9"/><stop offset=".5" stop-color="#ff8fa3"/><stop offset="1" stop-color="#e2506d"/></radialGradient><linearGradient id="pl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe3a0"/><stop offset=".45" stop-color="#ffe3a0" stop-opacity="0"/></linearGradient></defs><path d="M60 24 C22 18 10 58 23 80 C34 98 86 98 97 80 C110 58 98 18 60 24 Z" fill="url(#pg)" stroke="#4a3324" stroke-width="4"/><path d="M60 24 C22 18 10 58 23 80 C34 98 86 98 97 80 C110 58 98 18 60 24 Z" fill="url(#pl)"/><path d="M60 26 C52 46 53 70 61 93" fill="none" stroke="#c9486a" stroke-width="3.5" stroke-linecap="round"/><path d="M60 24 C59 16 61 10 65 6" stroke="#6b4a2a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M63 16 C76 4 95 7 101 15 C91 25 74 25 63 16Z" fill="#6cb85a" stroke="#4a3324" stroke-width="3.5" stroke-linejoin="round"/><path d="M58 18 C47 8 31 11 27 19 C37 27 50 26 58 18Z" fill="#7cc566" stroke="#4a3324" stroke-width="3.5" stroke-linejoin="round"/><circle cx="45" cy="42" r="6" fill="#fff" opacity=".55"/></svg>
      <h1>桃太郎ライド</h1>
      <p>おばあさんの洗濯が終わる前に、どんぶらこ！</p>
    </div>
    <div class="best" id="bestBox"></div>
    <div class="busyBan hide" id="busy1"></div>
    <div class="rank" id="rank1"></div>
    <ul class="howto" id="howto"></ul>
    <div class="btns"><button class="btn" id="b-start">どんぶらこ！</button></div>
    <p class="fine" id="fine"></p>
    <p class="fine"><a data-google-vignette="false" href="/games/momotaro-ride/" style="color:var(--pkd);font-weight:800">遊び方・ほかのゲーム ›</a></p>
  </div>
  <div class="adwrap" id="ad1"></div>
</div>
<div id="s-res" class="scr hide">
  <div class="card res">
    <h2 id="rHead"></h2>

  </div>
  <div class="adwrap" id="ad2"></div>
</div>

    <h2>ひと休み中</h2>

  </div>
</div>

  <div class="card">
    <h2><i>⚠️</i>いま ランキングに<br>登録できません</h2>
    <p>ランキングが混み合っています。<br>流れることはできますが、<br>記録は すぐには のりません</p>
    <p class="sm">このページを開いたままにしておけば、混雑が終わった時に 自動で登録されます</p>
    <div class="btns"><button class="btn" id="b-busyGo">それでも流れる</button><button class="btn b2" id="b-busyNo">やめておく</button></div>
  </div>
</div>
<div id="load">桃を準備中…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

  for (const x of C.sections) x.s *= K; for (const x of C.falls) x.s *= K; for (const x of C.slides) { x.s *= K; x.len *= K; }

// 川の向き θ(s)（0＝まっすぐ奥、＋＝右へ曲がる）。向きを少しずつ足して 川の道すじを作る（カーブでも 川はばが変わらない）
function theta(s) { const [a1, l1, a2, l2] = CONFIG.curve, f = (1 - smooth(CONFIG.goalS - 170, CONFIG.goalS - 50, s) * 0.9) * (0.35 + 0.65 * smooth(-40, 80, s)); return (a1 * Math.sin(s / l1) + a2 * Math.sin(s / l2 + 1.3)) * f; }
const PATH = (() => { const s0 = CONFIG.startS - 500, n = Math.ceil(CONFIG.endS + 500 - s0) + 2, x = new Float64Array(n), z = new Float64Array(n), th = new Float64Array(n);
  for (let i = 0; i < n; i++) { th[i] = theta(s0 + i); if (i) { const m = theta(s0 + i - 0.5); x[i] = x[i - 1] + Math.sin(m); z[i] = z[i - 1] - Math.cos(m); } }

function pathAt(s) { const f = clamp(s - PATH.s0, 0, PATH.n - 1.001), i = Math.floor(f), k = f - i; return [lerp(PATH.x[i], PATH.x[i + 1], k), lerp(PATH.z[i], PATH.z[i + 1], k), lerp(PATH.th[i], PATH.th[i + 1], k)]; }
