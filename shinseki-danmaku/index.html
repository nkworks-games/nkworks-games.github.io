    const ch = new THREE.Mesh(new THREE.SphereGeometry(hr * 0.12, 8, 6), lam(0xf59a8a)); ch.scale.z = 0.4; ch.position.set(s * hr * 0.55, hy - hr * 0.28, hr * 0.8); pivot.add(ch);

// ===== [SEC:BULLETS] =====
function spawnBullet(x, z, ang, speed, q, size = 1, counted = true) {
  const st = q.lv; const b = bubble(q.raw, st);
  let h = (CONFIG.BULLET_LINE * b.lines + 0.1) * size, w = h * b.aspect;
  if (w > CONFIG.BULLET_MAX_W * size) { w = CONFIG.BULLET_MAX_W * size; h = w / b.aspect; }
  const sprite = new THREE.Sprite(b.mat); sprite.scale.set(w, h, 1); sprite.renderOrder = 10; scene.add(sprite);
  const shadow = new THREE.Mesh(planeGeo, shadowRectMat); shadow.scale.set(w * CONFIG.HIT_W * 1.08, 1, CONFIG.HIT_DEPTH * 1.6); shadow.renderOrder = 1; scene.add(shadow);
  const o = { x, z, vx: Math.cos(ang) * speed, vz: Math.sin(ang) * speed, hw: w * CONFIG.HIT_W / 2, hd: CONFIG.HIT_DEPTH / 2, q, sprite, shadow, counted, hit: false };
  bullets.push(o); return o;
}
function removeBullet(b) { scene.remove(b.sprite); scene.remove(b.shadow); }
function clearBullets() { for (const b of bullets) removeBullet(b); bullets = []; }
const ramp = () => clamp(gameT / CONFIG.RAMP_TIME, 0, 1), extra = () => Math.max(0, gameT - CONFIG.RAMP_TIME) * CONFIG.HARD_RATE;

function curInterval() { return Math.max(CONFIG.INTERVAL_MIN, lerp(CONFIG.INTERVAL_START, CONFIG.INTERVAL_END, ramp()) / (1 + extra())); }
function waveInfo() { // おばちゃんの波：lull＝「ところで…」の静かな時間、wave＝波の最中、s＝波が始まってからの秒数
  if (gameT < CONFIG.WAVE_FIRST) return { lull: false, wave: false, s: -1 };
  const s = (gameT - CONFIG.WAVE_FIRST) % CONFIG.WAVE_EVERY;
  return { lull: s < CONFIG.WAVE_LULL, wave: s >= CONFIG.WAVE_LULL && s < CONFIG.WAVE_LULL + CONFIG.WAVE_LEN, s };
}
function chooseQ() {
  const t = gameT; let lv;
  if (waveInfo().wave) lv = rng() < 0.6 ? 2 : 1; else if (t < 15) lv = 0; else if (t < 30) lv = rng() < 0.3 ? 1 : 0; else if (t < CONFIG.WAVE_FIRST) lv = rng() < 0.6 ? 1 : 0; else lv = rng() < 0.15 ? 2 : rng() < 0.6 ? 1 : 0;
  return pick(QUESTIONS.filter(q => q.lv === lv));
}
function relFire(r) {
  const ang = Math.atan2(P.z - r.z, P.x - r.x) + rand(-CONFIG.AIM_SPREAD, CONFIG.AIM_SPREAD), sp = curSpeed();
  if (r.type === 'slow') spawnBullet(r.x, r.z, ang, sp * CONFIG.SLOW_SPEED, chooseQ(), CONFIG.SLOW_SIZE);
  else if (r.type === 'fan') for (const d of [-1, 0, 1]) spawnBullet(r.x, r.z, ang + d * CONFIG.FAN_ANGLE, sp, chooseQ());
  else spawnBullet(r.x, r.z, ang, sp, chooseQ());
  r.anim = 0.3;
}
function bossRing() {
  const r = boss, base = Math.atan2(0 - r.z, 0 - r.x), n = CONFIG.RING_N;
  for (let i = 0; i < n; i++) spawnBullet(r.x, r.z, base + (i / (n - 1) - 0.5) * CONFIG.RING_SPREAD, curSpeed() * 0.9, pick(QUESTIONS.filter(q => q.lv === 2)));
  r.anim = 0.3;
}

const otoGeo = new THREE.BoxGeometry(0.34, 0.04, 0.48), otoBand = new THREE.BoxGeometry(0.36, 0.05, 0.06);
const otoMat = lam(0xd42a2a), otoBandMat = lam(0xf3d27a);
const ringGeo = new THREE.RingGeometry(0.34, 0.42, 32); ringGeo.rotateX(-Math.PI / 2);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd860, transparent: true, opacity: 0.8, depthWrite: false });
function spawnOto() {

function clearOtos() { for (const o of otos) scene.remove(o.g); otos = []; for (const f of floats) { scene.remove(f.s); f.s.material.dispose(); } floats = []; }
function floatText(text, x, z) {

// ===== [SEC:GAME] =====
function startGame(seed) {
  rng = mulberry32(seed >>> 0);
  clearBullets(); clearOtos();
  state = 'play'; gameT = 0; hits = 0; dodged = 0; lives = CONFIG.LIVES; invulnT = 0; otoN = 0; lastQ = null; hitsByQ = {}; replyT = 0; flashT = 0; endT = 0; ringT = 0; lastCheckT = 0;
  P.x = 0; P.z = 3; P.vx = P.vz = 0; target.x = P.x; target.z = P.z; player.rotation.y = Math.PI;
  for (const r of rels) { r.next = r.from + rand(0.3, 1.4); r.anim = 0; r.lean = 0; }
  nextOto = CONFIG.OTO_FIRST;
  snapshot = null; lastResult = null; dragId = null;
  $('title').classList.add('hidden'); $('result').classList.add('hidden'); $('bigmsg').classList.add('hidden'); $('hud').classList.remove('hidden');
}
function onHit(b) {
  b.hit = true; hits++; hitsByQ[b.q.id] = (hitsByQ[b.q.id] || 0) + 1; lastQ = b.q;
  lives = Math.max(0, lives - 1); invulnT = CONFIG.INVULN; flashT = 0.25;
  replySprite.material = bubble(pick(REPLIES), 0, 54).mat; replyT = CONFIG.REPLY_TIME;
  if (lives <= 0) toEnding();
}
function tickPlayer(dt) {
  const kx = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  const kz = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0);
  if (kx || kz) { const l = Math.hypot(kx, kz); dragBy(kx / l * CONFIG.PLAYER_SPEED_KEY * dt, kz / l * CONFIG.PLAYER_SPEED_KEY * dt); }
  const dx = target.x - P.x, dz = target.z - P.z, d = Math.hypot(dx, dz), step = CONFIG.PLAYER_MAX_SPEED * dt;
  if (d > 1e-6) { const s = Math.min(1, step / d); P.vx = dx * s / dt; P.vz = dz * s / dt; P.x += dx * s; P.z += dz * s; } else { P.vx = P.vz = 0; }
  P.x = clamp(P.x, -XL, XL); P.z = clamp(P.z, -ZL, ZL);
}
function tickBullets(dt, collide) {
  const lim = 3.5;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.z += b.vz * dt;
    if (collide && !b.hit && state === 'play') {
      const cx = clamp(P.x, b.x - b.hw, b.x + b.hw) - P.x, cz = clamp(P.z, b.z - b.hd, b.z + b.hd) - P.z;
      if (cx * cx + cz * cz < PLAYER_R * PLAYER_R) {
        if (invulnT <= 0) { onHit(b); removeBullet(b); bullets.splice(i, 1); continue; }
        b.graze = true; // 点滅中にすり抜けた弾は「かわした」に数えない
      }
    }
    if (Math.abs(b.x) > HW + lim || Math.abs(b.z) > HD + lim) {
      if (b.counted && !b.hit && !b.graze && collide && state === 'play') dodged++;
      removeBullet(b); bullets.splice(i, 1);
    }
  }
}
function tick(dt) {
  for (const r of rels) r.anim = Math.max(0, r.anim - dt);
  replyT = Math.max(0, replyT - dt); flashT = Math.max(0, flashT - dt);
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; if (f.t > 0.9) { scene.remove(f.s); f.s.material.dispose(); floats.splice(i, 1); } }
  if (state === 'title' || state === 'result') { // 待ち画面：ゆっくり質問が飛ぶだけ
    demoT -= dt;
    if (demoT <= 0) { const r = pick(rels); spawnBullet(r.x, r.z, Math.atan2(rand(-2, 3) - r.z, rand(-2.5, 2.5) - r.x), 1.6, pick(QUESTIONS.filter(q => q.lv === 0)), 1, false); r.anim = 0.3; demoT = 0.9; }
    tickBullets(dt, false);
    return;
  }
  if (state === 'ending') { endT += dt; if (endT >= CONFIG.ENDING_TIME) toResult(); return; }
  // play
  gameT += dt; invulnT = Math.max(0, invulnT - dt);
  tickPlayer(dt);
  const w = waveInfo();
  boss.lean = clamp(boss.lean + (w.lull || w.wave ? dt : -dt) * 2.5, 0, 1);
  if (!w.lull) {
    for (const r of rels) {
      if (gameT < r.from) continue;
      if (r === boss && w.wave) continue;
      if (gameT >= r.next) { relFire(r); r.next = gameT + curInterval() * (r.type === 'fan' ? CONFIG.FAN_WAIT : r.type === 'slow' ? CONFIG.SLOW_WAIT : 1) * rand(0.8, 1.25); }
    }
    if (w.wave) { ringT -= dt; if (ringT <= 0) { bossRing(); ringT = CONFIG.RING_INTERVAL; } } else ringT = 0;
  }
  tickBullets(dt, true);
  if (state !== 'play') return; // ライフが0になった
  // お年玉（拾うとライフ+1）
  if (gameT >= nextOto) { if (otos.length < CONFIG.OTO_MAX) spawnOto(); nextOto = gameT + CONFIG.OTO_INTERVAL * rand(0.8, 1.2); }
  for (let i = otos.length - 1; i >= 0; i--) {
    const o = otos[i]; o.life -= dt;
    if (Math.hypot(o.x - P.x, o.z - P.z) < CONFIG.OTO_R + PLAYER_R) {
      const was = lives; lives = Math.min(CONFIG.LIVES, lives + 1); otoN++; floatText(lives > was ? '❤ +1' : '満タン！', o.x, o.z);
      scene.remove(o.g); otos.splice(i, 1); continue;
    }
    if (o.life <= 0) { scene.remove(o.g); otos.splice(i, 1); }
  }
}
function toEnding() {
  state = 'ending'; endT = 0; dragId = null; $('hint').classList.add('hidden');
  const m = $('bigmsg'); m.textContent = 'ちょっとトイレに…'; m.classList.remove('hidden');
  render(); try { snapshot = renderer.domElement.toDataURL('image/jpeg', 0.85); } catch (e) { snapshot = null; }
}
function toResult() {
  state = 'result'; $('bigmsg').classList.add('hidden'); $('hud').classList.add('hidden');
  clearOtos(); clearBullets(); demoT = 0.5;
  const sec = Math.floor(gameT * 10) / 10;
  const title = TITLES.find(([max]) => sec < max)[1];
  lastResult = { sec, dodged, hits, otoN, lastQ: lastQ ? lastQ.text : '', lastQid: lastQ ? lastQ.id : null, title };
  $('result').classList.remove('hidden');

  buildResultImage(myResult, snapshot).then(c => { if (lastResult !== myResult) return; resultCanvas = c; $('rimg').src = c.toDataURL('image/png'); });

}

// ===== [SEC:FIREBASE] =====
// 数を数えるだけ。上限で止まった時や設定がない時は、全国の表示を出さない
let fb = null, fbFailed = false, fbCache = null;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function fbGet() {
  if (fb || fbFailed || !CONFIG.FIREBASE) return fb;
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [A, AU, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = A.initializeApp(CONFIG.FIREBASE, 'shinseki-danmaku');
    await AU.signInAnonymously(AU.getAuth(app));
    fb = { F, db: F.getFirestore(app) };
  } catch (e) { fbFailed = true; }
  return fb;
}
async function sendAndRead(res) {
  const f = await withTimeout(fbGet(), CONFIG.FB_TIMEOUT).catch(() => null); if (!f) return null;
  const { F, db } = f, col = CONFIG.FB_COLLECTION;
  const data = { plays: F.increment(1), h: { ['b' + Math.min(Math.floor(res.sec / 5), 40)]: F.increment(1) } }; // 5秒ごとの人数
  if (res.lastQid) data.q = { [res.lastQid]: F.increment(1) };                                                   // とどめの質問
  try { await withTimeout(F.setDoc(F.doc(db, col, 's' + Math.floor(Math.random() * CONFIG.FB_SHARDS)), data, { merge: true }), CONFIG.FB_TIMEOUT); } catch (e) { }
  if (fbCache && Date.now() - fbCache.at < 60000) return fbCache.agg;
  try {
    const snaps = await withTimeout(Promise.all([...Array(CONFIG.FB_SHARDS)].map((_, i) => F.getDoc(F.doc(db, col, 's' + i)))), CONFIG.FB_TIMEOUT);
    const agg = { plays: 0, h: {}, q: {} };
    for (const s of snaps) { if (!s.exists()) continue; const d = s.data(); agg.plays += d.plays || 0; for (const [k, v] of Object.entries(d.h || {})) agg.h[k] = (agg.h[k] || 0) + v; for (const [k, v] of Object.entries(d.q || {})) agg.q[k] = (agg.q[k] || 0) + v; }
    fbCache = { at: Date.now(), agg }; return agg;
  } catch (e) { return null; }
}
async function showNational(res) {
  const el = $('national'); el.classList.add('hidden');
  if (!CONFIG.FIREBASE) return;
  el.textContent = '全国の結果を集計中…'; el.classList.remove('hidden');
  const agg = await sendAndRead(res);
  if (lastResult !== res) return;
  if (!agg || agg.plays < CONFIG.FB_MIN_PLAYS) { el.classList.add('hidden'); return; }
  let topId = null, topN = -1; for (const [k, v] of Object.entries(agg.q)) if (v > topN && QBY[k]) { topN = v; topId = k; }
  const my = Math.min(Math.floor(res.sec / 5), 40); let better = 0, same = 0, total = 0;
  for (const [k, v] of Object.entries(agg.h)) { const n = +k.slice(1); total += v; if (n > my) better += v; else if (n === my) same += v; }
  const rank = total ? Math.max(1, Math.round(100 * (better + same / 2) / total)) : 50;
  const line3 = rank <= 50 ? `耐えた時間：全国で <b>上位${rank}%</b>` : `あなたは全国の <b>${100 - rank}%</b> の人より長く耐えました`;
  el.innerHTML = `これまでに <b>${agg.plays.toLocaleString()}人</b> が帰省しました<br>` + (topId ? `全国でいちばんとどめを刺した質問：<b>『${QBY[topId].text}』</b><br>` : '') + line3;
}

// ===== [SEC:INPUT] =====
const keys = new Set();
const KEYCODES = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'];
addEventListener('keydown', e => { if (KEYCODES.includes(e.code)) { keys.add(e.code); e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const ray = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ndc = new THREE.Vector2();
const lastFP = new THREE.Vector3(), curFP = new THREE.Vector3();
let dragId = null;
function floorPoint(cx, cy, out) { const r = canvas.getBoundingClientRect(); ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(floorPlane, out); }
function dragBy(dx, dz) { if (!Number.isFinite(dx) || !Number.isFinite(dz)) return; target.x = clamp(target.x + dx, -XL, XL); target.z = clamp(target.z + dz, -ZL, ZL); }
canvas.addEventListener('pointerdown', e => { if (state !== 'play') return; if (!floorPoint(e.clientX, e.clientY, lastFP)) return; dragId = e.pointerId; canvas.setPointerCapture(e.pointerId); target.x = P.x; target.z = P.z; });
canvas.addEventListener('pointermove', e => { if (e.pointerId !== dragId || state !== 'play') return; if (!floorPoint(e.clientX, e.clientY, curFP)) return; dragBy((curFP.x - lastFP.x) * CONFIG.DRAG_GAIN, (curFP.z - lastFP.z) * CONFIG.DRAG_GAIN); lastFP.copy(curFP); });
const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());
$('startBtn').addEventListener('click', () => { manual = false; startGame((Date.now() ^ (Math.random() * 1e9)) >>> 0); });
$('againBtn').addEventListener('click', () => { manual = false; startGame((Date.now() ^ (Math.random() * 1e9)) >>> 0); });
$('postBtn').addEventListener('click', () => {
  if (!lastResult) return;
  const u = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText(lastResult)) + '&url=' + encodeURIComponent(CONFIG.URL);
  window.open(u, '_blank', 'noopener');
});
$('saveBtn').addEventListener('click', async () => {
  if (!resultCanvas || !lastResult) return;
  const blob = await new Promise(r => resultCanvas.toBlob(r, 'image/png')); if (!blob) return;
  const file = new File([blob], 'shinseki-danmaku.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text: shareText(lastResult) + ' ' + CONFIG.URL }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'shinseki-danmaku.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

// ===== [SEC:CAMERA] =====
const camTarget = new THREE.Vector3(), camDir = new THREE.Vector3();
const fitPts = [];
for (const s of [-1, 1]) {
  fitPts.push(new THREE.Vector3(s * (HW + 0.15), 0, HD + 0.3), new THREE.Vector3(s * (HW + 0.15), 0, -(HD + 0.2)));       // 座敷の四すみ
  fitPts.push(new THREE.Vector3(s * (HW + OUT), 0.9, -2.4), new THREE.Vector3(s * (HW + OUT), 0.9, 2.4));                   // 横の親戚（縦画面では半分見えればよい）
  fitPts.push(new THREE.Vector3(s * 2.1, 1.35, -(HD + OUT + 0.4)));                                                     // 奥の親戚の頭
}
const tmpV = new THREE.Vector3();
function fitCamera() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  const k = clamp((w / h - 0.6) / 0.6, 0, 1); // 0＝縦長、1＝横長
  const pitch = lerp(CONFIG.CAM_P.pitch, CONFIG.CAM_L.pitch, k) * Math.PI / 180;
  camera.fov = lerp(CONFIG.CAM_P.fov, CONFIG.CAM_L.fov, k); camera.aspect = w / h; camera.updateProjectionMatrix();
  camTarget.set(0, 0, lerp(CONFIG.CAM_P.tz, CONFIG.CAM_L.tz, k)); camDir.set(0, Math.sin(pitch), Math.cos(pitch));
  const topLim = 1 - 2 * Math.min(0.2, 78 / h); // 上のHUDの分あける
  let lo = 2, hi = 80;
  for (let i = 0; i < 30; i++) {
    const mid = (lo + hi) / 2; camera.position.copy(camTarget).addScaledVector(camDir, mid); camera.lookAt(camTarget); camera.updateMatrixWorld();
    const ok = fitPts.every(p => { tmpV.copy(p).project(camera); return tmpV.z < 1 && Math.abs(tmpV.x) < 0.97 && tmpV.y < topLim && tmpV.y > -0.97; });
    if (ok) hi = mid; else lo = mid;
  }
  camera.position.copy(camTarget).addScaledVector(camDir, hi); camera.lookAt(camTarget); camera.updateMatrixWorld();
}
addEventListener('resize', fitCamera); fitCamera();

// ===== [SEC:RENDER] =====
function render() {
  for (const b of bullets) { b.sprite.position.set(b.x, CONFIG.BULLET_Y, b.z); b.shadow.position.set(b.x, 0.012, b.z); }
  player.position.set(P.x, 0, P.z); playerShadow.position.set(P.x, 0.011, P.z);
  const sp = Math.hypot(P.vx, P.vz);
  if (state === 'play' && sp > 0.3) { const want = Math.atan2(P.vx, P.vz); let d = want - player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); player.rotation.y += d * 0.25; }
  player.userData.body.material.emissive.setHex(flashT > 0 ? 0x992222 : 0x000000);
  replySprite.visible = replyT > 0 && state === 'play';
  if (replySprite.visible) { const a = replySprite.material.map.image; replySprite.scale.set(0.32 * a.width / a.height, 0.32, 1); replySprite.position.set(P.x, 1.75, P.z); }
  for (const r of rels) {
    const bob = r.anim > 0 ? Math.sin((0.3 - r.anim) / 0.3 * Math.PI) * 0.08 : 0;
    r.g.userData.pivot.position.y = bob;
    r.g.userData.pivot.rotation.x = (r.lean || 0) * 0.35;
  }
  const lb = boss.lean;
  const wv = waveInfo(); tokorodeSprite.visible = state === 'play' && wv.s >= 0 && wv.s < CONFIG.WAVE_LULL + 0.8;
  player.visible = !(state === 'play' && invulnT > 0 && Math.floor(invulnT * 12) % 2 === 0);
  if (tokorodeSprite.visible) { const a = tokorodeSprite.material.map.image; tokorodeSprite.scale.set(0.62 * a.width / a.height, 0.62, 1); tokorodeSprite.position.set(boss.x + 1.3 * lb, 1.9, boss.z); }
  for (const o of otos) { const t = performance.now() / 1000; o.g.position.y = 0.12 + Math.abs(Math.sin(t * 4 + o.x)) * 0.06; o.g.visible = o.life > 1.5 || Math.floor(o.life * 8) % 2 === 0; o.ring.material.opacity = 0.5 + 0.3 * Math.sin(t * 6); }
  for (const f of floats) { f.s.position.set(f.x, 0.8 + f.t * 0.9, f.z); f.s.material.opacity = 1 - f.t / 0.9; }
  if (state === 'play' || state === 'ending') {
    $('timer').firstChild.nodeValue = gameT.toFixed(1);
    $('hint').classList.toggle('hidden', gameT > 3.5);
    $('dodged').textContent = dodged; $('lives').textContent = '❤'.repeat(lives) + '♡'.repeat(CONFIG.LIVES - lives); $('otoN').textContent = otoN;
  }
  renderer.render(scene, camera);
}

// ===== [SEC:LOOP] =====
let acc = 0, last = performance.now(), manual = false, paused = false;
function update(frameDt) {
  acc += Math.min(frameDt, CONFIG.MAX_FRAME);
  while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; }
}
function frame(now) { if (!paused && !manual) update((now - last) / 1000); last = now; render(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); if (paused) { keys.clear(); dragId = null; } });
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
window.__TEST__ = {
  keys: ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'],
  randomInput(r) { if (state !== 'play') return; const a = r * Math.PI * 2, m = ((r * 13) % 1) * 2.5; dragBy(Math.cos(a) * m, Math.sin(a) * m); },
  reset(seed) { manual = true; startGame(seed); },
  peek() { return { p: { x: P.x, z: P.z, r: PLAYER_R }, b: bullets.map(o => ({ x: o.x, z: o.z, vx: o.vx, vz: o.vz, hw: o.hw, hd: o.hd })), o: otos.map(o => ({ x: o.x, z: o.z })), lim: { x: XL, z: ZL } }; },
  drag(dx, dz) { dragBy(dx, dz); },
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); render(); },
  state() { return { state, t: +gameT.toFixed(2), x: +P.x.toFixed(2), z: +P.z.toFixed(2), bullets: bullets.length, hits, dodged, lives, otoN, over: state === 'result' }; },
  check() {
    const v = [], fin = Number.isFinite;
    if (!fin(P.x) || !fin(P.z)) v.push('プレイヤーの位置がNaN');
    if (Math.abs(P.x) > XL + 1e-6 || Math.abs(P.z) > ZL + 1e-6) v.push('プレイヤーが座敷の外に出た');
    for (const r of rels) if (Math.hypot(P.x - r.g.position.x, P.z - r.g.position.z) < PLAYER_R + 0.48) { v.push('プレイヤーが親戚にめり込んだ'); break; }
    for (const b of bullets) {
      if (!fin(b.x) || !fin(b.z)) { v.push('弾の位置がNaN'); break; }
      const sw = b.sprite.scale.x; if (Math.abs(2 * b.hw - sw) / sw > 0.1) { v.push('弾の当たり判定と見た目の幅がちがう'); break; }
      if (Math.hypot(b.vx, b.vz) > CONFIG.SPEED_MAX * 1.3) { v.push('弾が速すぎる'); break; }
    }
    const measured = (() => { const b = new THREE.Box3().setFromObject(player.userData.body, true); return (b.max.x - b.min.x) / 2; })();
    if (Math.abs(PLAYER_R - measured) / measured > 0.1) v.push('プレイヤーの当たり判定と見た目がちがう');
    for (const o of otos) if (Math.abs(o.x) > HW || Math.abs(o.z) > HD) { v.push('お年玉が座敷の外'); break; }
    if (state === 'play' && gameT + 1e-9 < lastCheckT) v.push('時間が戻った');
    if (state === 'play') lastCheckT = gameT;
    if (lives < 0 || lives > CONFIG.LIVES) v.push('ライフの数がおかしい');
    if (state === 'play' && lives <= 0) v.push('ライフ0なのに続いている');
    if (hits < 0 || dodged < 0 || otoN < 0) v.push('数がマイナス');
    if (bullets.length > 300) v.push('弾が増えすぎ');
    if (!['title', 'play', 'ending', 'result'].includes(state)) v.push('状態がおかしい');
    return v;
  },
  ready: true,
};
</script>
