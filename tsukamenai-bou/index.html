<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===== [SEC:CONFIG] =====
const CONFIG = {
  FOLLOW_X: 'vyaPudzd1E54661',            // 「作者をフォロー」ボタンのXアカウント
  FIXED: 1/240, MAX_FRAME: 0.1,          // 物理の刻みと、1フレームで進められる最大時間
  GRAVITY: 14,
  STICK_HALF: 1.4, STICK_R: 0.13,         // 棒の半分の長さ・太さ
  STICK_MAX_SPEED: 30, STICK_MAX_SPIN: 16,
  AIR_DRAG: 0.05, SPIN_DRAG: 0.15,
  WALL_BOUNCE: 0.75, CEIL_BOUNCE: 0.6, FLOOR_BOUNCE: 0.3, WALL_FRICTION: 0.2, FLOOR_FRICTION: 0.6,
  HAND_REACH: 0.8,                      // 手がこの距離まで近づくと棒をつかめる
  HAND_FOLLOW: 22, HAND_MAX_SPEED: 28,   // 手がポインタに追いつく速さ・手の最高速度
  HAND_MIN_Y: 0.55, HAND_WALL_GAP: 0.4,
  HAND_ACC_SMOOTH: 30, HAND_ACC_MAX: 160,
  TOUCH_OFFSET: 1.6,                     // スマホは指で手が隠れないよう、手を指より上に出す
  GRIP_PULL: 18, GRIP_SWING_DAMP: 1.8, GRIP_CD: 0.12,
  SLIP_BASE: 1.15, SLIP_GAIN: 0.05, SLIP_MAX: 4.2,   // 棒が手の中をすべる速さ（毎秒の距離）
  SLIP_MUL_MIN: 0.75, SLIP_MUL_MAX: 1.25,
  KICK_BASE: 2.5, KICK_GAIN: 0.05, KICK_MAX: 8, KICK_SPIN: 5, // すっぽ抜けた時のはじけ具合
  OVER_SIM: 1.8, RESULT_DELAY: 1.1,
  FOV: 38,
  ROOM_HT: 8, ROOM_WX_MIN: 3.2, ROOM_WX_MAX: 5.5,
  // --- 面白さの工夫 ---
  NICE_RANGE: 0.22, GOOD_RANGE: 0.55, EDGE_RANGE: 0.8,   // つかんだ位置（中心からの割合）：ナイス／グッド／ふち
  NICE_SLIP: 0.55, GOOD_SLIP: 0.8, EDGE_SLIP: 1.25,      // つかみ方によるすべりやすさ（小さいほど長く持てる）
  COMBO_SLIP: 0.05, COMBO_SLIP_MIN: 0.6,                 // コンボ1つごとにすべりにくくなる割合・下限
  SQUIRM_MIN: 0.5, SQUIRM_RANGE: 0.7, SQUIRM_JUMP_MIN: 0.1, SQUIRM_JUMP_RANGE: 0.18, SQUIRM_K: 14, // 握り中の「ぬるっ」発作
  SAVE_HEIGHT: 0.9, SLOWMO_SCALE: 0.35, SLOWMO_TIME: 0.45, // 床ギリギリのスローモーション
  EVENT_FIRST: 12, EVENT_GAP_MIN: 13, EVENT_GAP_RANGE: 6, EVENT_DUR: 6, // ハプニングの間隔と長さ（秒）
  WIND_ACC: 9, OIL_SLIP: 1.5, MOON_GRAVITY: 0.45,
  MILESTONES: [10, 20, 30, 45, 60, 90],
  // --- 手のまん中でつかむ ---
  SWEET_R: 0.35, FLICK_R: 0.7,        // リングの大きさ（手の届く距離に対する割合）：内側=まん中／これより外=はじかれる
  PREC_SLIP_MAX: 2.5,                  // まん中からずれた時の、すべりやすさの最大倍率
  PRESS_WINDOW: 0.15, FLICK_SPEED: 7,  // ふちは「押した瞬間」だけ反応する時間／はじかれる強さ
  // --- 壁での跳ね返り ---
  WALL_REST: 0.4,                      // 壁に当たって跳ね返り始める最小の速さ
  HAND_BOUNCE: 0.55, HAND_BOUNCE_MAX: 6, HAND_BOUNCE_CD: 0.35, HAND_KICK_DECAY: 7, // 棒をにぎったまま壁に当たった時の跳ね
};

// ===== [SEC:STATE] =====
let state = 'title';            // 'title' | 'play' | 'over'
let t = 0, titleT = 0, overT = 0, best = 0, lastT = 0, cooldown = 0, settled = false, resultShown = false, isNew = false;
let manual = false, paused = false;
let grip = false, gripLock = false, gripMouse = false, gripTouch = false, gripKey = false;
let moveId = null;
let combo = 0, bestCombo = 0, catches = 0, saves = 0, squirmT = 0.8, squirmV = 0, slowReal = 0, saveCd = 0, lastWarn = -1, lastBounce = -1;
let pressAge = 9, gripPrev = false, hbCd = 0, catchPrec = 9;
let evt = null, nextEvt = 12, lastEvtType = '', mileIdx = 0, talkT = 0, talkCd = 0, faceT = 0, pulse = 0, shakeAmt = 0, face = 'normal', dangerV = 0;
let rng = mulberry32(1);
const room = { Wx: 6.9, Ht: CONFIG.ROOM_HT };
const stick = { x: 0, y: 5, th: 0, vx: 0, vy: 0, w: 0, held: false, s: 0, sdir: 1, smul: 1, qmul: 1, pmul: 1, offx: 0, offy: 0 };
const hand = { x: 0, y: 2.5, vx: 0, vy: 0, ax: 0, ay: 0, kx: 0, ky: 0, curl: 0, rot: 0 };
const target = { x: 0, y: 2.5 };
try { best = parseFloat(localStorage.getItem('tsukamenai-best')) || 0; } catch (e) {}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, lo, hi) => lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v));
const wrapAngle = a => a - 2 * Math.PI * Math.round(a / (2 * Math.PI));

// ===== [SEC:SCENE] =====
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14122b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(CONFIG.FOV, 1, 0.1, 200);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-5, 14, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
scene.add(new THREE.AmbientLight(0x8a86c8, 0.7));

function gradTex(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), new THREE.MeshStandardMaterial({ map: gradTex('#2a2563', '#4a3a86'), roughness: 1 }));
backWall.position.set(0, 20, -3); backWall.receiveShadow = true; scene.add(backWall);
const floor = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 9), new THREE.MeshStandardMaterial({ color: 0x6b4a3a, roughness: 0.6 }));
floor.position.set(0, -0.3, 1.5); floor.receiveShadow = true; scene.add(floor);

  if (state === 'over') updateHand(dt);
  // 手の見た目（にぎり具合・向き）
  const want = (grip && state !== 'over') ? 1 : 0;
  hand.curl += (want - hand.curl) * (1 - Math.exp(-30 * dt));
  const rotTarget = stick.held ? stick.th + Math.PI * Math.round((hand.rot - stick.th) / Math.PI) : 0;
  hand.rot += (rotTarget - hand.rot) * (1 - Math.exp(-16 * dt));
  fxTick(dt);
}
function update(frameDt) {
  const fd = Math.min(frameDt, CONFIG.MAX_FRAME);
  const ts = slowReal > 0 ? CONFIG.SLOWMO_SCALE : 1; slowReal = Math.max(0, slowReal - fd);
  acc += fd * ts;
  while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; }
}
const proj = new THREE.Vector3();
function render() {
  const jit = Math.min(0.1, squirmV * 0.02), jx = jit * Math.sin(performance.now() * 0.09), jy = jit * Math.cos(performance.now() * 0.11), pz = 1 + pulse * 0.25;
  stickMesh.position.set(stick.x + jx, stick.y + jy, 0); stickMesh.rotation.z = stick.th; stickMesh.scale.set(1, pz, pz);
  handGroup.position.set(hand.x + jx, hand.y + jy, 0); handGroup.rotation.z = hand.rot; poseHand(hand.curl);
  renderFx();
  if (state === 'play' || state === 'over') {
    elTime.firstChild.nodeValue = fmt(t); elBest.textContent = 'ベスト ' + fmt(best);
  }
  if (state === 'play' && stick.held) {
    const f = clamp((CONFIG.STICK_HALF - stick.sdir * stick.s) / (2 * CONFIG.STICK_HALF), 0, 1);
    proj.set(hand.x, hand.y + 1.3, 0).project(camera);
    elSlip.style.display = 'block';
    elSlip.style.left = ((proj.x + 1) / 2 * innerWidth) + 'px'; elSlip.style.top = ((1 - proj.y) / 2 * innerHeight) + 'px';
    elSlipI.style.transform = 'scaleX(' + f.toFixed(3) + ')'; elSlipI.style.background = f < 0.28 ? '#ff4d6d' : '#8cff3b';
  } else elSlip.style.display = 'none';
  const shake = (state === 'over' && overT < 0.35 ? (0.35 - overT) * 0.35 : 0) + shakeAmt;

}
function frame(now) {

  last = now; if (!manual || dirty) { render(); dirty = false; } requestAnimationFrame(frame);
}
resize(); computeRoom(); applyRoom(); fitCamera();
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
const VISUAL_LEN = (() => { stickMesh.updateMatrixWorld(true); stickMesh.rotation.z = 0; stickMesh.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(stickMesh); return b.max.x - b.min.x; })();
window.__TEST__ = {
  keys: [],
  randomInput(r) {
    const q = k => { const x = Math.sin(r * 12345.678 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
    if (q(1) < 0.65) { target.x = stick.x + (q(2) - 0.5) * 3; target.y = stick.y + (q(3) - 0.5) * 3; }
    else { target.x = (q(2) * 2 - 1) * room.Wx; target.y = q(3) * room.Ht; }
    gripMouse = q(4) < 0.65; syncGrip();
  },
  setPointer(x, y) { target.x = x; target.y = y; },
  setGrip(b) { gripMouse = !!b; syncGrip(); },
  forceEvent(ty) { startEvent(ty); },
  setStick(o) { Object.assign(stick, o); },
  setHandPos(x, y) { hand.x = target.x = x; hand.y = target.y = y; hand.vx = hand.vy = 0; },
  hbox() { return { kx: +hand.kx.toFixed(2), ky: +hand.ky.toFixed(2), pmul: +stick.pmul.toFixed(2), combo }; },
  reset(seed) { manual = true; gripMouse = false; syncGrip(); startRound(seed); },
  startTitle() { manual = true; $('toTitleBtn').click(); },
  step(sec, frameDt) { for (let tt = 0; tt < sec - 1e-9; tt += frameDt) update(frameDt); dirty = true; },
  state() {
    return { st: state, over: state === 'over', t: +t.toFixed(3), held: stick.held, s: +stick.s.toFixed(3),
      stick: { x: +stick.x.toFixed(3), y: +stick.y.toFixed(3), th: +stick.th.toFixed(3), vx: +stick.vx.toFixed(2), vy: +stick.vy.toFixed(2), w: +stick.w.toFixed(2) },
      hand: { x: +hand.x.toFixed(3), y: +hand.y.toFixed(3), curl: +hand.curl.toFixed(2) }, grip, combo, bestCombo, catches, saves, evt: evt ? evt.type : null, room: { ...room } };
  },
  check() {
    const v = [], h = CONFIG.STICK_HALF, R = CONFIG.STICK_R;
    const nums = [stick.x, stick.y, stick.th, stick.vx, stick.vy, stick.w, hand.x, hand.y, hand.vx, hand.vy, t, stick.s, stick.offx, stick.offy];
    if (nums.some(n => !Number.isFinite(n))) { v.push('NaN/Infinity が出た'); return v; }
    if (parts.some(p => p.on && !Number.isFinite(p.x + p.y + p.z))) { v.push('パーティクルがNaN'); return v; }
    const ex = h * Math.cos(stick.th), ey = h * Math.sin(stick.th), tol = 0.03;
    for (const sg of [1, -1]) {
      const px = stick.x + sg * ex, py = stick.y + sg * ey;
      if (px - R < -room.Wx - tol || px + R > room.Wx + tol) v.push('棒が左右の壁の外に出た x=' + px.toFixed(2));
      if (py + R > room.Ht + tol) v.push('棒が天井の外に出た y=' + py.toFixed(2));
      if (py - R < -tol) v.push('棒が床にめり込んだ y=' + (py - R).toFixed(3));
    }
    if (Math.hypot(stick.vx, stick.vy) > CONFIG.STICK_MAX_SPEED * 1.5) v.push('棒が速すぎる');
    if (Math.abs(stick.w) > CONFIG.STICK_MAX_SPIN * 1.5) v.push('棒の回転が速すぎる');
    if (hand.x < -room.Wx - tol || hand.x > room.Wx + tol || hand.y < -tol || hand.y > room.Ht + tol) v.push('手が部屋の外に出た');
    if (state === 'play' && t < lastT - 1e-9) v.push('時間が戻った');
    if (state === 'play') lastT = t;
    if (t < 0) v.push('スコアがマイナス');
    if (stick.held) {
      const c = Math.cos(stick.th), sn = Math.sin(stick.th);
      const d = Math.hypot(hand.x - (stick.x + stick.s * c), hand.y - (stick.y + stick.s * sn));
      if (d > CONFIG.HAND_REACH + 0.02) v.push('にぎっているのに手と棒が離れている d=' + d.toFixed(2));
      if (Math.abs(stick.s) > h + 1e-6) v.push('にぎり位置が棒の外');
      if (state !== 'play') v.push('プレイ中でないのに棒を持っている');
    }
    if (Math.abs(VISUAL_LEN - (2 * h + 2 * R)) / (2 * h + 2 * R) > 0.1) v.push('見た目の棒の長さと当たり判定がちがう');
    return v;
  },
  ready: true,
};
