function makePopGeo(seed, burnt) {

    g.scale(0.85 + r() * 0.35, 0.75 + r() * 0.35, 0.85 + r() * 0.35);
    const a = r() * Math.PI * 2, e = (r() - 0.4) * 1.4, d = i === 0 ? 0 : 0.07 + r() * 0.06;

    if (burnt) c = r() < 0.4 ? [0.06, 0.045, 0.035] : [0.17 + r() * 0.05, 0.09 + r() * 0.03, 0.045];
    else { const k = 0.93 + r() * 0.07; c = r() < 0.3 ? [1.0 * k, 0.88 * k, 0.6 * k] : [1.0 * k, 0.95 * k, 0.82 * k]; }
    paint(g, c); parts.push(g);

  const hull = new THREE.IcosahedronGeometry(0.05, 0); hull.scale(1, 0.6, 1); hull.translate(0, -0.08, 0);
  paint(hull, burnt ? [0.12, 0.07, 0.04] : [0.72, 0.42, 0.12]); parts.push(hull);
  const geo = mergeGeometries(parts);
  geo.computeBoundingSphere(); const c = geo.boundingSphere.center; geo.translate(-c.x, -c.y, -c.z); geo.computeBoundingSphere();
  return geo;
}

function spawnPop(kx, kz, burnt, demo, rand) {

  const R = geo.boundingSphere.radius * CONFIG.POP_SIZE, rest = R * 0.6;
  const p = {

    pos: new THREE.Vector3(kx, CONFIG.OIL_Y + rest + 0.02, kz), vel: new THREE.Vector3(), from: new THREE.Vector3(),
    rot: new THREE.Vector3(rand() * 6, rand() * 6, rand() * 6), spin: new THREE.Vector3((rand() - 0.5) * 14, (rand() - 0.5) * 14, (rand() - 0.5) * 14),
  };
  const G = CONFIG.GRAVITY, vy = lerp(CONFIG.VY_MIN, CONFIG.VY_MAX, rand()), ang = rand() * Math.PI * 2;
  const T = (vy + Math.sqrt(vy * vy + 2 * G * p.pos.y)) / G;

  p.vel.set(Math.cos(ang) * vh, vy, Math.sin(ang) * vh);

function clearPops() { for (const p of pops) p.mesh.removeFromParent(); pops = []; clearHands(); }

function tickPop(p, dt) {
  p.age += dt;
  if (p.mode === 'air') {
    const n = Math.max(1, Math.ceil(p.vel.length() * dt / (p.R * 0.5))), h = dt / n;
    for (let k = 0; k < n; k++) {
      p.vel.y -= CONFIG.GRAVITY * h;
      p.vel.multiplyScalar(1 - CONFIG.DRAG * h);
      p.pos.addScaledVector(p.vel, h);
      const g = groundAt(p.pos.x, p.pos.z, p.rest);
      if (p.pos.y - p.rest <= g) {
        p.pos.y = g + p.rest; // 押し戻す
        if (p.vel.y <= 0) { land(p); break; }
      }
    }
    p.rot.addScaledVector(p.spin, dt);
  } else if (p.mode === 'landed') {
    p.lt += dt;
    if (p.lt > CONFIG.LAND_STAY + CONFIG.FADE_TIME) removePop(p);
  } else if (p.mode === 'grab') {
    p.gt += dt; // 手がはさむまではその場で止まり、そのあとカップへ運ばれる
    const k = clamp((p.gt - CONFIG.HAND_REACH - CONFIG.GRIP_TIME) / CONFIG.GRAB_TIME, 0, 1), e = k * k * (3 - 2 * k);
    // 2次ベジェ：つかんだ所 → 少し上 → カップ
    const cx = p.from.x, cy = p.from.y + 1.0, cz = p.from.z;
    p.pos.set(
      (1 - e) * (1 - e) * p.from.x + 2 * (1 - e) * e * cx + e * e * boxTarget.x,
      (1 - e) * (1 - e) * p.from.y + 2 * (1 - e) * e * cy + e * e * boxTarget.y,
      (1 - e) * (1 - e) * p.from.z + 2 * (1 - e) * e * cz + e * e * boxTarget.z);
    p.s = lerp(1, 0.3, e);
    if (k >= 1) { removePop(p); boxCount++; ui.box(); }
  } else if (p.mode === 'crumble') {
    p.gt += dt;
    if (!p.clapped && p.gt >= CONFIG.HAND_REACH + CONFIG.GRIP_TIME) { p.clapped = true; puff(p.pos, 0x2a2420, 6, 0.25, 0.9, 0.8); shakeT = 0.25; }
    const k = clamp((p.gt - CONFIG.HAND_REACH - CONFIG.GRIP_TIME) / CONFIG.CRUMBLE_TIME, 0, 1);
    p.s = k < 0.4 ? lerp(1, 1.35, k / 0.4) : lerp(1.35, 0.01, (k - 0.4) / 0.6);
    if (k >= 1) removePop(p);
  }
}

  _hx.copy(_cb).multiplyScalar(h.side);                                        // 手のひらは奥（ポップコーン）を向き、手の甲がこちらに見える
  _fd.copy(_cu).addScaledVector(_cr, -h.side * 0.25);                          // 指は上へ、少し内側に傾ける
  _fd.addScaledVector(_hx, -_hx.dot(_fd)).normalize(); _hz.crossVectors(_hx, _fd);
  const r = h.hand.root, S = Math.max(0.001, s * CONFIG.HAND_SIZE);
  r.quaternion.setFromRotationMatrix(_bm.makeBasis(_hx, _fd, _hz));
  r.position.copy(h.c)
    .addScaledVector(_cb, h.R * s * 0.85 + 0.1 * S + back)                     // ポップコーンの手前に手のひら
    .addScaledVector(_cu, shake - 0.13 * S - down)
    .addScaledVector(_cr, h.side * out);
  r.scale.setScalar(S);
  h.hand.fingers.forEach((f, i) => f.rotation.set(spread * FINGERS[i][0] / 0.105, 0, -curl));
  h.hand.thumb.rotation.set(lerp(0.35, 1.05, thumbOpen), 0, -curl * 0.7);
}
function tickHands(dt) {
  for (const h of handPairs) {
    if (!h.active) continue;
    h.t += dt;
    const p = h.p, tr = CONFIG.HAND_REACH, tg = tr + CONFIG.GRIP_TIME;
    let s = 1, curl = 1.35, spread = 0.02, thumb = 0, back = 0, down = 0, out = 0, shake = 0;
    if (h.t < tr) { // 手前の下から、指を大きく開いてのびてくる
      const k = easeOut(h.t / tr);
      curl = -0.15; spread = 0.3; thumb = 1; back = (1 - k) * 1.2; down = (1 - k) * 1.0; out = (1 - k) * 0.5; h.c.copy(p.pos);
    } else if (h.t < tg) { // ぎゅっとにぎる
      const k = (h.t - tr) / CONFIG.GRIP_TIME;
      curl = lerp(-0.15, 1.35, k); spread = lerp(0.3, 0.02, k); thumb = 1 - k; h.c.copy(p.pos);
    } else if (!h.burnt && p.mode === 'grab') { // にぎったままカップへ
      h.c.copy(p.pos); s = h.sLast = p.s;
    } else if (!h.burnt) { // カップの上で手を開いて消える
      h.lt += dt; const k = clamp(h.lt / CONFIG.HAND_LEAVE, 0, 1);

      if (k >= 1) { endHands(h); continue; }
    } else { // 焦げ：アチッと開いて引っこめる
      const k = clamp((h.t - tg) / CONFIG.OUCH_TIME, 0, 1), q = Math.min(1, k * 4);
      curl = lerp(1.35, -0.3, q); spread = 0.3 * q; thumb = q;
      shake = Math.sin(h.t * 70) * 0.06 * (1 - k); back = k * 0.8; down = k * 0.8; s = 1 - k * k;
      if (k >= 1) { endHands(h); continue; }
    }
    placeHand(h, s, curl, spread, thumb, back, down, out, shake);
  }
}

const Sound = {
  ctx: null, master: null, noise: null, sz: null, on: store(CONFIG.SOUND_KEY) !== '0',
  init() {

      this.master = c.createGain(); this.master.gain.value = this.on ? 0.9 : 0; this.master.connect(c.destination);
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);

      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
      const g = c.createGain(); g.gain.value = 0; src.connect(hp).connect(g).connect(this.master); src.start(); this.sz = g;
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  setOn(v) { this.on = v; store(CONFIG.SOUND_KEY, v ? 1 : 0); if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.02); },
  sizzle(level) { if (this.sz) this.sz.gain.setTargetAtTime(level, this.ctx.currentTime, 0.15); },
  pop() {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600 + Math.random() * 900; bp.Q.value = 1.2;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    s.connect(bp).connect(g).connect(this.master); s.start(t, Math.random() * 1.5, 0.09);

  },
  tone(type, f0, f1, dur, vol, delay = 0) {

    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);

  },
  clap(delay = 0) {

    const s = c.createBufferSource(); s.buffer = this.noise;
    const hp = c.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 1800; hp.Q.value = 0.8;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

  },
  grab(delay = 0) { this.tone('triangle', 660, 1320, 0.09, 0.25, delay); },
  burnt(delay = 0) { this.tone('sawtooth', 170, 80, 0.22, 0.16, delay); },
  end() { [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f * 1.001, 0.18, 0.2, i * 0.11)); },
};

// ===== [SEC:GAME] =====
let state = 'title';           // 'title' | 'play' | 'result'
let schedule = [], nextIdx = 0, gameTime = 0, endT = 0, heat = 0, sizzleT = 0, demoT = 0;
let score = 0, grabbedN = 0, burntN = 0, missedN = 0, boxCount = 0, normalTotal = 0;
const boxTarget = new THREE.Vector3();

function makeSchedule() {
  // 本物のように「ポツポツ→一気に→まばら」。毎回ほぼ同じ形になるよう、山の形の分布から均等に取り出す
  const N = CONFIG.TOTAL, [A, B] = CONFIG.POP_SHAPE, cdf = [0];
  for (let i = 1; i <= 1000; i++) { const x = (i - 0.5) / 1000; cdf.push(cdf[i - 1] + Math.pow(x, A - 1) * Math.pow(1 - x, B - 1)); }
  const inv = u => { const target = u * cdf[1000]; let lo = 0, hi = 1000; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cdf[m] < target) lo = m; else hi = m; } return (lo + (target - cdf[lo]) / Math.max(1e-9, cdf[hi] - cdf[lo])) / 1000; };
  const times = [];
  for (let i = 0; i < N; i++) times.push(CONFIG.PREHEAT + inv((i + rng()) / N) * CONFIG.POP_SPAN);
  for (let i = 0; i < N; i++) if (rng() < CONFIG.CLUSTER_RATE) { const k = 1 + Math.floor(rng() * 2); for (let j = 1; j <= k && i + j < N; j++) times[i + j] = times[i] + j * 0.06; i += k; }
  times.sort((a, b) => a - b);
  const order = kernelPos.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const nBurnt = Math.round(CONFIG.TOTAL * CONFIG.BURNT_RATE), idx = [];
  for (let i = 3; i < CONFIG.TOTAL; i++) idx.push(i); // 最初の3粒は普通の粒
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const burntSet = new Set(idx.slice(0, nBurnt));
  return times.map((t, i) => ({ t, kernel: order[i], burnt: burntSet.has(i) }));
}

function startGame(seed) {
  clearPops(); clearFx();
  rng = mulberry32(seed);
  schedule = makeSchedule();
  normalTotal = schedule.filter(s => !s.burnt).length;
  nextIdx = 0; gameTime = 0; endT = 0; heat = 0;
  score = 0; grabbedN = 0; burntN = 0; missedN = 0; boxCount = 0;
  resetKernels();
  state = 'play';
  ui.play();
}

function finish() {
  state = 'result';
  Sound.sizzle(0); Sound.end();
  ui.result();
}

function tick(dt) {
  if (state === 'play') {
    gameTime += dt;
    while (nextIdx < schedule.length && schedule[nextIdx].t <= gameTime) {
      const s = schedule[nextIdx++];
      setKernel(s.kernel, false);
      const k = kernelPos[s.kernel];
      spawnPop(k.x, k.z, s.burnt, false, rng);
      heat += 1;
      if (nextIdx === 1) ui.msg('');
      ui.hud(); // のこりの粒の数を、弾けるたびに更新
    }
    // もうすぐ弾ける粒をふるわせる
    for (let i = nextIdx; i < schedule.length && schedule[i].t < gameTime + 0.3; i++) {
      setKernel(schedule[i].kernel, true, (Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03, Math.random() * 0.02);
    }
    if (nextIdx === schedule.length && !pops.some(p => p.mode === 'air' || p.mode === 'grab' || p.mode === 'crumble')) {
      if (endT === 0) ui.msg('全部はじけた！');
      endT += dt;
      if (endT >= CONFIG.END_WAIT) finish();
    }
    heat *= Math.exp(-dt);
    sizzleT -= dt;
    if (sizzleT <= 0) { sizzleT = 0.1; Sound.sizzle(nextIdx < schedule.length ? 0.025 + Math.min(0.07, heat * 0.012) : 0.01); }
  } else if (state === 'title') {
    demoT += dt;
    if (demoT >= CONFIG.DEMO_EVERY) {
      demoT = 0;
      const r = CONFIG.KERNEL_R * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2;
      spawnPop(Math.cos(a) * r, Math.sin(a) * r, Math.random() < CONFIG.BURNT_RATE, true, Math.random);
    }
  }
  if (pops.some(p => p.mode === 'grab')) boxWorldTarget(boxTarget);
  for (const p of pops) tickPop(p, dt);
  tickHands(dt);
  if (pops.some(p => p.mode === 'gone')) pops = pops.filter(p => p.mode !== 'gone');
  tickFx(dt);
}

function syncVisuals() {
  for (const p of pops) {
    let s = 1, yo = 0;
    if (p.mode === 'air') s = Math.min(1, 0.35 + 0.65 * p.age / CONFIG.POPIN_TIME);
    else if (p.mode === 'landed') {
      if (p.lt < 0.22) yo = 0.1 * Math.sin(Math.PI * p.lt / 0.22);
      if (p.lt > CONFIG.LAND_STAY) s = 1 - clamp((p.lt - CONFIG.LAND_STAY) / CONFIG.FADE_TIME, 0, 1);
    } else s = p.s;
    p.mesh.position.set(p.pos.x, p.pos.y + yo, p.pos.z);
    p.mesh.rotation.set(p.rot.x, p.rot.y, p.rot.z);
    p.mesh.scale.setScalar(Math.max(0.001, s * CONFIG.POP_SIZE));
  }
}

// ===== [SEC:INPUT] =====
function toScreen(pos) {
  const r = canvas.getBoundingClientRect(); _v.copy(pos).project(camera);
  return { x: r.left + (_v.x + 1) / 2 * r.width, y: r.top + (1 - _v.y) / 2 * r.height, z: _v.z, h: r.height };
}
function findTarget(cx, cy) {
  let best = null, bestD = Infinity;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  for (const p of pops) {
    if (p.mode !== 'air' || p.demo) continue;
    const s = toScreen(p.pos); if (s.z > 1) continue;
    const pr = p.R / (camera.position.distanceTo(p.pos) * tanH) * s.h / 2;
    const hit = Math.max(CONFIG.TAP_MIN_PX, pr * CONFIG.TAP_SCALE);
    const d = Math.hypot(s.x - cx, s.y - cy) / hit;
    if (d < 1 && d < bestD) { best = p; bestD = d; }
  }
  return best;
}
function onTap(cx, cy) {
  if (state !== 'play') return;
  const p = findTarget(cx, cy);
  if (!p) { ring(cx, cy); return; }
  p.from.copy(p.pos); p.gt = 0; p.s = 1;
  handScene.add(p.mesh); // つかんだ粒は手と一緒に手前に描く
  startHands(p);
  const gripAt = CONFIG.HAND_REACH + CONFIG.GRIP_TIME;
  Sound.clap(gripAt);
  if (p.burnt) {
    p.mode = 'crumble'; burntN++; score -= CONFIG.BURNT_PENALTY;
    floatText(cx, cy, '−' + CONFIG.BURNT_PENALTY + ' 焦げ！', 'minus');
    Sound.burnt(gripAt);
  } else {
    p.mode = 'grab'; grabbedN++; score += 1;
    floatText(cx, cy, '+1', 'plus');
    boxWorldTarget(boxTarget);
    Sound.grab(gripAt);
  }
  ui.hud();
}
function boxWorldTarget(out) {
  const br = $('box').getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  const nx = (br.left + br.width / 2 - cr.left) / cr.width * 2 - 1, ny = -((br.top + br.height * 0.3 - cr.top) / cr.height * 2 - 1);
  return out.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize().multiplyScalar(2.5).add(camera.position);
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.clientX, e.clientY); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ===== [SEC:UI] =====
const ui = {
  hud() { $('hScore').textContent = score; $('hLeft').textContent = CONFIG.TOTAL - nextIdx; $('boxN').textContent = boxCount; },
  box() { const b = $('box'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); $('boxN').textContent = boxCount; },
  msg(t) { const m = $('msg'); m.textContent = t; m.classList.toggle('show', !!t); },
  play() {
    $('title').classList.add('hide'); $('result').classList.add('hide'); $('rank').classList.add('hide');
    $('hud').classList.add('show'); $('box').classList.add('show');
    this.hud(); this.msg('あたため中…');
  },
  result() {
    this.msg('');
    const best = Number(store(CONFIG.BEST_KEY)) || 0, played = store(CONFIG.BEST_KEY) !== null;
    const isNew = !played || score > best;
    if (isNew) store(CONFIG.BEST_KEY, score);
    const rate = Math.max(0, score) / normalTotal;
    const title = score < 0 ? CONFIG.NEG_TITLE : CONFIG.TITLES.find(t => rate >= t[0])[1];
    $('rScore').textContent = score; $('rGrab').textContent = grabbedN; $('rNormal').textContent = normalTotal;
    $('rRate').textContent = Math.round(grabbedN / normalTotal * 100); $('rBurnt').textContent = burntN;
    $('rPen').textContent = burntN ? '−' + burntN * CONFIG.BURNT_PENALTY : '0';
    $('rTitle').textContent = title; $('rNew').style.display = isNew && played ? '' : 'none';
    $('rBest').textContent = isNew ? score : best;
    this.lastShare = `「つかめ！ポップコーン」で${score}点！\n${CONFIG.TOTAL}粒中${grabbedN}粒つかんだ（焦げ${burntN}粒）\n称号：${title}\n#つかめポップコーン`;
    $('result').classList.remove('hide'); resultShownAt = performance.now();
    Rank.onResult();
  },
  title() { const b = store(CONFIG.BEST_KEY); $('tBest').textContent = b === null ? '−' : b + '点'; $('tTotal').textContent = CONFIG.TOTAL; },
  lastShare: '',
};
let resultShownAt = 0;
const resultReady = () => state !== 'result' || performance.now() - resultShownAt > CONFIG.RESULT_GUARD * 1000;
function begin() { if (!resultReady()) return; Sound.init(); Sound.resume(); startGame((Date.now() % 2147483647) | 0); }
$('startBtn').addEventListener('click', begin);
$('againBtn').addEventListener('click', begin);
document.querySelectorAll('a.sup').forEach(a => { a.href = a.dataset.k === 'follow' ? CONFIG.FOLLOW_URL : CONFIG.OFUSE_URL; a.addEventListener('click', e => { if (!resultReady()) e.preventDefault(); }); });
$('shareBtn').addEventListener('click', () => {
  if (!resultReady()) return;
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(ui.lastShare) + '&url=' + encodeURIComponent(CONFIG.URL), '_blank', 'noopener');
});
const sndBtn = $('snd');
sndBtn.textContent = Sound.on ? '🔊' : '🔇';
sndBtn.addEventListener('click', () => { Sound.init(); Sound.resume(); Sound.setOn(!Sound.on); sndBtn.textContent = Sound.on ? '🔊' : '🔇'; });
ui.title();

// ===== [SEC:RANKUI] =====
const Rank = {
  name: store(CONFIG.NAME_KEY) || '',
  msg(t, cls) { const m = $('rankMsg'); m.textContent = t; m.className = 'rankMsg' + (cls ? ' ' + cls : ''); },
  title() { $('rankNoteT').textContent = rankOpen() ? `${CONFIG.RANK_END_TEXT}まで開催中` : 'ランキングは終了しました（最終結果を見られます）'; },
  onResult() {
    $('nameRow').classList.add('off'); $('nameEdit').classList.add('off'); $('nameIn').value = this.name;
    if (!rankOpen()) { this.msg(CONFIG.MSG_ENDED); return; }
    if (score <= 0) { this.msg('1点以上で、今週のランキングにのります'); return; }
    if (!this.name) { this.msg(`名前を入れると、今週のランキングにのります（${CONFIG.RANK_END_TEXT}まで）`); $('nameRow').classList.remove('off'); return; }
    this.send(score, grabbedN, burntN);
  },
  async send(s, g, b) {
    const n = this.name; this.msg('ランキングに記録しています…');
    try {
      const net = await getNet(), r = await net.submit(n, s, g, b), rk = await net.rank(r.s);
      this.msg(r.best ? `今週のランキング ${rk}位！（${n}）` : `今週のランキング ${rk}位（${n}の記録 ${r.s}点）`, 'ok');
      $('nameEdit').classList.remove('off');
    } catch (e) { this.msg(isQuota(e) ? CONFIG.MSG_QUOTA : CONFIG.MSG_NET, 'err'); }
  },
  saveName() {
    const c = checkName($('nameIn').value);
    if (!c.ok) { this.msg(c.msg, 'err'); return; }
    this.name = c.name; store(CONFIG.NAME_KEY, c.name); $('nameRow').classList.add('off'); $('nameIn').blur();
    if (rankOpen() && score > 0) this.send(score, grabbedN, burntN);
  },
  async open() {
    $('rank').classList.remove('hide');
    $('rankPeriod').textContent = rankOpen() ? `${CONFIG.RANK_END_TEXT}まで・1人ひとつ、いちばん良いスコア` : CONFIG.MSG_ENDED + '。最終結果です';
    $('rankErr').textContent = ''; this.rows(null);
    try { const net = await getNet(); this.rows(await net.list()); }
    catch (e) { this.rows([]); $('rankErr').textContent = isQuota(e) ? CONFIG.MSG_QUOTA_LIST : CONFIG.MSG_NET_LIST; }
  },
  rows(items) { // 名前は textContent で入れる（HTMLとして読まない）
    const ol = $('rankList'); ol.innerHTML = '';
    const li = (cls, text) => { const e = document.createElement('li'); e.className = cls; e.textContent = text; ol.appendChild(e); };
    if (!items) return li('empty', '読みこみ中…');
    if (!items.length) return $('rankErr').textContent ? null : li('empty', 'まだ記録がありません');
    let prev = null, no = 0;
    items.forEach((it, i) => {
      if (it.s !== prev) { no = i + 1; prev = it.s; }
      const e = document.createElement('li'); e.className = (it.me ? 'me ' : '') + (no <= 3 ? 'top' : '');
      const add = (tag, cls, t) => { const x = document.createElement(tag); x.className = cls; x.textContent = t; e.appendChild(x); return x; };
      add('span', 'no', no + '位'); add('span', 'nm', it.n + (it.me ? '（あなた）' : '')); add('span', 'sc', it.s + '点');
      if (!it.me) { const b = add('button', 'rp', '通報'); b.dataset.id = it.id; }
      ol.appendChild(e);
    });
  },
  async report(btn) { // 1回目は「本当に？」、2回目で通報
    if (btn.dataset.step !== '1') { btn.dataset.step = '1'; btn.textContent = '本当に？'; return; }
    btn.disabled = true;
    try { const net = await getNet(); btn.textContent = (await net.report(btn.dataset.id)) ? '通報しました' : '通報できません'; }
    catch (e) { btn.textContent = isQuota(e) ? '今日は通報できません' : '通報できません'; }
  },
};
$('rankBtnT').addEventListener('click', () => Rank.open());
$('rankBtnR').addEventListener('click', () => { if (resultReady()) Rank.open(); });
$('rankClose').addEventListener('click', () => $('rank').classList.add('hide'));
$('nameBtn').addEventListener('click', () => Rank.saveName());
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') Rank.saveName(); });
$('nameEdit').addEventListener('click', () => { $('nameRow').classList.remove('off'); $('nameEdit').classList.add('off'); $('nameIn').value = Rank.name; });
$('rankList').addEventListener('click', e => { const b = e.target.closest('button.rp'); if (b) Rank.report(b); });
Rank.title();

// ===== [SEC:LOOP] =====
let acc = 0, last = performance.now(), manual = false, paused = false;
function update(frameDt) {
  acc += Math.min(Math.max(frameDt, 0), CONFIG.MAX_FRAME);
  while (acc >= CONFIG.FIXED) { tick(CONFIG.FIXED); acc -= CONFIG.FIXED; }
  syncVisuals();
}
function render() {
  const t = performance.now() / 1000;
  for (let i = 0; i < flames.length; i++) flames[i].scale.set(1, 0.8 + 0.35 * Math.sin(t * 23 + i * 1.7) * Math.sin(t * 7 + i), 1);
  if (shakeT > 0) camera.position.copy(camBase).add(_v.set((Math.random() - 0.5), (Math.random() - 0.5), 0).multiplyScalar(0.14 * shakeT / 0.25));
  else camera.position.copy(camBase);
  renderer.clear(); renderer.render(scene, camera);
  renderer.clearDepth(); renderer.render(handScene, camera); // 手はいつも手前
}
function frame(now) {
  if (!paused && !manual) update((now - last) / 1000);
  last = now; render(); requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) Sound.suspend(); else { last = performance.now(); Sound.resume(); }
});
requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
window.__TEST__ = {
  keys: [],
  randomInput(r) {
    if (state !== 'play') return;
    const air = pops.filter(p => p.mode === 'air' && !p.demo);
    if (r < 0.7 && air.length) {
      const p = air[Math.floor(r / 0.7 * air.length)], s = toScreen(p.pos);
      onTap(s.x + ((r * 37) % 1 - 0.5) * 20, s.y + ((r * 53) % 1 - 0.5) * 20);
    } else {
      const cr = canvas.getBoundingClientRect();
      onTap(cr.left + (r * 7919) % 1 * cr.width, cr.top + (r * 104729) % 1 * cr.height);
    }
  },
  reset(seed) { manual = true; paused = false; acc = 0; startGame(seed); },
  step(sec, frameDt) { for (let t = 0; t < sec - 1e-9; t += frameDt) update(frameDt); render(); },
  tap: onTap, toScreen: pos => toScreen(pos),
  view(p, t) { camBase.set(...p); camera.position.copy(camBase); camera.lookAt(...t); camera.updateMatrixWorld(); }, // 宣伝画像を撮る時だけ使うカメラ位置
  pops: () => pops,
  state() {
    return { state, t: +gameTime.toFixed(2), popped: nextIdx, air: pops.filter(p => p.mode === 'air').length, score, grabbed: grabbedN, burnt: burntN, missed: missedN, box: boxCount, over: state === 'result' };
  },
  check() {
    const v = [], V_LIMIT = Math.hypot(CONFIG.VY_MAX, CONFIG.VH_MAX) * 1.5;
    let inFlight = 0;
    for (const p of pops) {
      const nums = [p.pos.x, p.pos.y, p.pos.z, p.vel.x, p.vel.y, p.vel.z];
      if (nums.some(n => !Number.isFinite(n))) v.push('位置か速度がNaN');
      if (p.mode === 'air') {
        if (!p.demo) inFlight++;
        const g = groundAt(p.pos.x, p.pos.z, p.rest);
        if (p.pos.y - p.rest < g - 0.02) v.push(`粒が床・フライパンにめり込み y=${p.pos.y.toFixed(3)} 床=${g.toFixed(3)}`);
        if (Math.hypot(p.pos.x, p.pos.z) > CONFIG.LAND_MAX_R + 0.6) v.push('粒が範囲の外に出た');
        if (p.vel.length() > V_LIMIT) v.push('速すぎる ' + p.vel.length().toFixed(2));
        if (p.age > CONFIG.POPIN_TIME) {
          const vis = p.mesh.geometry.boundingSphere.radius * p.mesh.scale.x;
          if (Math.abs(vis - p.R) / p.R > 0.1) v.push('見た目と当たり判定の大きさがちがう');
        }
      }
      if (p.mode === 'landed' && p.pos.y - p.rest < groundAt(p.pos.x, p.pos.z, p.rest) - 0.02) v.push('落ちた粒がめり込み');
    }
    if (state === 'play' || state === 'result') {
      if (score !== grabbedN - burntN * CONFIG.BURNT_PENALTY) v.push('スコアの計算がおかしい');
      if (grabbedN + burntN + missedN + inFlight !== nextIdx) v.push(`粒の数が合わない ${grabbedN}+${burntN}+${missedN}+${inFlight}≠${nextIdx}`);
      if (boxCount > grabbedN) v.push('カップの数がつかんだ数より多い');
      if (nextIdx > CONFIG.TOTAL) v.push('粒が多すぎる');
      if (state === 'result' && nextIdx !== CONFIG.TOTAL) v.push('全部弾ける前に終わった');
      if ($('hLeft').textContent !== String(CONFIG.TOTAL - nextIdx)) v.push('のこりの表示がずれている');
    }
    const maxLife = CONFIG.HAND_REACH + CONFIG.GRIP_TIME + Math.max(CONFIG.GRAB_TIME + CONFIG.HAND_LEAVE, CONFIG.OUCH_TIME) + 0.3;
    for (const h of handPairs) {
      const r = h.hand.root;
      if (!h.active) { if (r.visible) v.push('使っていない手が見えている'); continue; }
      if (h.t > maxLife) v.push('手が消えずに残っている');
      if (![r.position.x, r.position.y, r.position.z, r.scale.x].every(Number.isFinite)) v.push('手の位置がNaN');
    }
    if (handPairs.length > 40) v.push('手が増えすぎ');
    return v;
  },
  ready: true,
};
</script>
