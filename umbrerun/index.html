<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="google-adsense-account" content="ca-pub-2073267239630350">
<title>アンブレラン</title>
<meta name="description" content="自分で描いた傘1本で、雨・風・水はね・崖をこえて、山の上の会社へ走るタイムアタック。始業9:00に間に合うか！">
<meta name="theme-color" content="#1c2436">
<meta property="og:type" content="website">
<meta property="og:title" content="アンブレラン">
<meta property="og:description" content="傘を1本 描いて、町から山の上の会社まで走りぬけろ。雨・風・水風船・崖…ぜんぶ その傘で。">
<meta property="og:url" content="https://nkworks-games.com/umbrerun/">
<meta property="og:image" content="https://nkworks-games.com/umbrerun/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322304a'/%3E%3Cpath d='M8 34Q32 2 56 34Z' fill='%23e8503a'/%3E%3Cpath d='M32 34v16q0 6-6 6' stroke='%23fbf5ea' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --navy:#22304a; --red:#e8503a; --cream:#fbf5ea; --ink:#1c2230; --page:#121722; --sky:#9fd4ff; --gold:#f2b632;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --ad-h:50px;      /* 広告バナーの高さ（スマホ） */
  --ad-gap:150px;   /* バナーとゲームの間。まちがって広告を押さないように、いつも150px以上あける（Googleのおすすめ） */
}
@media (orientation: landscape) and (min-width: 728px) and (min-height: 500px){:root{--ad-h:90px}}
html,body{margin:0;height:100%;background:var(--page);color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--ad-h) + env(safe-area-inset-bottom,0px) + var(--ad-gap));display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;touch-action:none;outline:none;contain:strict;width:360px;height:480px}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;left:0;top:0;width:360px;height:480px;transform-origin:0 0;font-family:var(--maru);font-weight:800;pointer-events:none}
#ui button,#ui a,#pad{pointer-events:auto;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.hide{display:none!important}
.ov{position:absolute;left:0;top:0;right:0;bottom:0}
/* 広告の帯：高さは いつも同じ（広告が出ない時・まだコードがない時も）。中の広告が大きくても はみ出さない。ゲームの操作は この帯では反応しない */
#ad-zone{position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--ad-h);padding-bottom:env(safe-area-inset-bottom,0px);background:#0c1018;box-shadow:0 -1px 0 rgba(255,255,255,.08);touch-action:manipulation;-webkit-user-select:auto;user-select:auto}
#ad-banner{width:100%;height:var(--ad-h);max-height:var(--ad-h);overflow:hidden;display:flex;align-items:center;justify-content:center;contain:layout paint}
#ad-banner ins{max-height:var(--ad-h)!important;overflow:hidden}
.btn{height:50px;padding:0 20px;border:0;border-radius:25px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.b1{background:var(--red);color:#fff;box-shadow:0 4px 0 #a8321f}
.b2{background:var(--cream);color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.b3{background:var(--navy);color:#fff;box-shadow:0 4px 0 #111826}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
/* ---- タイトル ---- */
#title{background:linear-gradient(#5e6e86 0%,#8ea3bb 46%,#cfd9e0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--navy);overflow:hidden}
#title .rain{position:absolute;inset:0;background:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.22) 22px 23px,rgba(255,255,255,0) 23px 47px);background-size:120px 120px;animation:rain .5s linear infinite;opacity:.8}
@keyframes rain{to{background-position:-30px 120px}}
#logo{position:relative;margin:0;text-align:center;line-height:1}
#logo svg{display:block;width:96px;height:78px;margin:0 auto 6px}
#logo .t{display:block;font-family:var(--pop);font-weight:400;font-size:44px;color:#fff;text-shadow:0 4px 0 var(--navy)}
#logo .lc{font-size:16px;vertical-align:top;color:#e6edf5;text-shadow:none}
#logo small{display:block;margin-top:10px;font-size:14px;color:#fff;letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#how{position:relative;margin:14px 22px 0;padding:12px 14px 10px;border-radius:16px;background:rgba(251,245,234,.94);font-size:12.5px;line-height:1.45;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15)}
#how p{margin:0 0 6px;display:flex;gap:8px;align-items:flex-start}#how p:last-child{margin:0}
#how i{flex:none;width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-style:normal;font-size:12px;text-align:center;line-height:20px}
#how b{color:var(--red)}
#best0{position:relative;margin-top:10px;font-size:12.5px;color:var(--navy);min-height:16px}
.tbtns{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px}
#go{width:236px;height:56px;font-family:var(--pop);font-weight:400;font-size:22px;border-radius:28px}
#again0{width:236px;height:44px;font-size:15px}
.cr{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(28,34,48,.5)}
/* ---- 傘を描く ---- */
#draw{background:#efe6d4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--navy)}
#dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#dh b{font-family:var(--pop);font-weight:400;font-size:21px}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(34,48,74,.1);color:rgba(34,48,74,.55)}
.pill.on{background:var(--red);color:#fff}.pill.ok{background:var(--navy);color:#fff}
#dt{height:36px;margin:0 22px 6px;font-size:12.5px;line-height:1.4;text-align:center;display:flex;align-items:center;justify-content:center}
#dt b{color:var(--red)}
#pad{display:block;width:300px;height:330px;border-radius:14px;background:#fffdf7;box-shadow:inset 0 0 0 2px rgba(34,48,74,.18),0 3px 0 rgba(0,0,0,.08);touch-action:none}
.drow{display:flex;gap:10px;margin-top:12px}
.drow .btn{height:46px;font-size:15px}
#dok{min-width:160px}
/* ---- 傘の確認 ---- */
#conf .top{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:var(--pop);font-weight:400;font-size:20px;color:var(--navy)}
#cpanel{position:absolute;left:12px;right:12px;bottom:12px;padding:12px 14px 14px;border-radius:18px;background:rgba(251,245,234,.97);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;height:22px}
.bar span{width:78px;flex:none}.bar em{flex:1;height:10px;border-radius:5px;background:rgba(34,48,74,.12);overflow:hidden;font-style:normal}.bar em u{display:block;height:100%;border-radius:5px;background:var(--red)}
.bar small{width:62px;flex:none;font-size:11px;color:#6a6458;text-align:right}
#cn{margin-top:8px;font-size:12px;line-height:1.5}#cn b{display:inline-block;min-width:34px;padding:0 6px;margin-right:4px;border-radius:8px;color:#fff;font-size:11px;text-align:center}#cn .g{background:#2f8a5a}#cn .x{background:#b8463a}
.crow{display:flex;gap:10px;margin-top:10px}.crow .btn{flex:1;height:48px;font-size:15px}
#cgo{flex:1.4!important;font-family:var(--pop);font-weight:400;font-size:19px!important}
/* ---- 走っている時 ---- */
#spd{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;left:0;top:0;right:0;bottom:0}
#clk{position:absolute;left:10px;top:8px;padding:5px 12px 6px;border-radius:14px;background:rgba(20,26,40,.78);line-height:1}
#clk small{display:block;font-size:10.5px;color:#cfd8e6;letter-spacing:.06em}
#clk b{font-family:var(--pop);font-weight:400;font-size:25px;letter-spacing:.02em;font-variant-numeric:tabular-nums}#clk i{font-style:normal;font-size:14px;opacity:.8;font-variant-numeric:tabular-nums}
#clk.late b,#clk.late i{color:#ff7a6a}
#mute{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:18px;border:0;background:rgba(20,26,40,.78);color:#fff;font-size:16px;padding:0}
#mute.off{opacity:.45}
#prog{position:absolute;left:16px;right:16px;top:66px;height:30px}
#prog .ln{position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
#prog .fl{position:absolute;left:0;top:8px;height:4px;border-radius:2px;background:#fff}
#prog .mk{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:6px;background:#5a6a84;border:2px solid #fff;box-sizing:border-box}
#prog .mk.done{background:var(--red)}
#prog .mk span{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-size:9.5px;white-space:nowrap;color:#fff;text-shadow:0 1px 2px #000}
#prog .me,#prog .gh{position:absolute;top:-3px;width:0;height:0;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--red)}
#prog .gh{border-top-color:var(--sky);opacity:.9}
#pv{position:absolute;left:0;right:0;top:98px;text-align:center;opacity:0;pointer-events:none}
#pv b{display:inline-block;padding:4px 12px 5px;border-radius:12px;background:rgba(20,26,40,.8);font-family:var(--pop);font-weight:400;font-size:16px}
#pv b em{font-style:normal;color:var(--gold)}
#pv small{display:block;margin-top:3px;font-size:11.5px;text-shadow:0 1px 3px #000,0 0 6px #000}
#pv.in{animation:pv 2.4s ease-out forwards}
@keyframes pv{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#wz{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);padding:5px 12px;border-radius:12px;font-size:14px;color:#fff;transition:opacity .2s;opacity:0;white-space:nowrap}
#wz.on{opacity:1}#wz.h{background:#3a6ab0}#wz.t{background:#e0782a}
#cap{position:absolute;left:0;right:0;bottom:152px;text-align:center;font-family:var(--pop);font-weight:400;font-size:24px;color:#fff;opacity:0;text-shadow:0 3px 0 var(--navy),0 0 12px rgba(0,0,0,.5)}
#cap small{display:block;font-family:var(--maru);font-weight:800;font-size:12.5px;margin-top:2px}
#cap.in{animation:cap 1.5s ease-out forwards}
@keyframes cap{0%{opacity:0;transform:scale(.8)}10%{opacity:1;transform:scale(1.06)}20%{transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.warn{position:absolute;top:46%;padding:8px 12px;border-radius:14px;background:rgba(232,80,58,.92);font-size:15px;opacity:0;transition:opacity .12s}
.warn.on{opacity:1;animation:wb .35s ease-in-out infinite alternate}
@keyframes wb{to{transform:scale(1.08)}}
#wl{left:8px}#wr{right:8px}
#risk{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);padding:6px 12px;border-radius:12px;background:rgba(242,182,50,.95);color:var(--ink);font-size:13px;opacity:0;white-space:nowrap}
#risk.on{opacity:1}
#tip{position:absolute;left:14px;right:14px;bottom:76px;text-align:center;opacity:0;transition:opacity .25s}
#tip.on{opacity:1}
#tip span{display:inline-block;padding:8px 14px 9px;border-radius:14px;background:rgba(251,245,234,.95);color:var(--ink);font-size:13.5px;line-height:1.4}
#tip b{color:var(--red)}
#wet{position:absolute;left:10px;bottom:12px;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;background:rgba(20,26,40,.78);font-size:12px;opacity:0;transition:opacity .3s}
#wet.on{opacity:1}#wet i{width:60px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}#wet u{display:block;height:100%;width:0;background:#6ab8ff}
#guide{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border-radius:14px;background:rgba(20,26,40,.8);font-size:11px;transition:opacity .4s;white-space:nowrap}
#guide div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 3px}
#guide svg{width:30px;height:30px}
#guide.off{opacity:0}
#ring{position:absolute;left:0;top:0;width:104px;height:104px;margin:-52px 0 0 -52px;opacity:0;transition:opacity .08s}
#ring.on{opacity:1}
#ring svg{width:104px;height:104px;overflow:visible}
#ring path{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.55);stroke-width:1.5}
#ring path.on{fill:rgba(232,80,58,.85);stroke:#fff}
#ring circle{fill:rgba(255,255,255,.22);stroke:rgba(255,255,255,.7);stroke-width:1.5}#ring circle.on{fill:rgba(232,80,58,.85)}
#cd{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--pop);font-weight:400;font-size:72px;color:#fff;text-shadow:0 5px 0 var(--navy);opacity:0}
#cd.in{animation:cd .8s ease-out forwards}
#cd.go{font-size:46px;color:var(--gold)}
@keyframes cd{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
/* ---- 結果 ---- */
#res{background:rgba(18,23,34,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px}
#rarr{font-size:13px;color:#cfd8e6;letter-spacing:.08em}
#rclk{font-family:var(--pop);font-weight:400;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}#rclk small{font-size:20px;margin-left:4px}
#rtt{margin-top:4px;padding:5px 20px 6px;border-radius:20px;background:var(--red);font-family:var(--pop);font-weight:400;font-size:22px}
#rtt.late{background:#5a6a84}
#rgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;align-items:center;margin-top:12px;width:100%;max-width:310px}
#rimg{grid-row:span 2;width:88px;height:97px;border-radius:12px;background:#fffdf7}
.rl{font-size:13px;color:#cfd8e6;line-height:1.35}.rl b{display:block;font-family:var(--pop);font-weight:400;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.rl b em{font-style:normal;font-size:10.5px;margin-left:4px;padding:1px 6px;border-radius:6px;background:var(--gold);color:var(--ink);font-family:var(--maru);font-weight:800;vertical-align:3px}
#rmiss small{display:block;font-size:11px;color:#9aa8bc}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;width:100%;max-width:320px}
.rbtns .btn{height:44px;font-size:14.5px;padding:0 10px}
#rsame{grid-column:span 2;height:50px!important;font-family:var(--pop);font-weight:400;font-size:19px!important}
#rhome{background:none;border:2px solid rgba(255,255,255,.28);color:#d8dee8;box-shadow:none}
#shot{background:rgba(10,12,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#shot img{width:280px;height:280px;border-radius:12px;pointer-events:auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#shot p{margin:0;font-size:13px;color:#dfe6f0}
#rot{background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:18px;z-index:5}
#rot svg{width:64px;height:64px}
#load{position:absolute;left:0;right:0;top:45%;text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="stage" tabindex="-1">
    <canvas id="c"></canvas>
    <div id="ui">
      <canvas id="spd" width="360" height="480"></canvas>
      <div id="hud" class="hide">
        <div id="clk"><small>始業 9:00</small><b id="clkv">8:58:32</b><i id="clkc">.00</i></div>
        <div id="prog"><div class="ln"></div><div class="fl" id="pfl"></div><div id="pmk"></div><div class="gh hide" id="pgh"></div><div class="me" id="pme"></div></div>
        <div id="wz"></div>
        <div id="pv"><b id="pvb"></b><small id="pvs"></small></div>
        <div id="risk">グラグラ… 裏返りそう！</div>
        <div id="tip"><span id="tipt"></span></div>
        <div id="wl" class="warn">◀ 車</div><div id="wr" class="warn">車 ▶</div>
        <div id="cap"></div>
        <div id="cd"></div>
        <div id="wet">ぬれ<i><u id="wetb"></u></i></div>
        <div id="guide">
          <div><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/></svg>はなす：とじる</div>
          <div><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" fill="#e8503a"/></svg>さわる：上</div>
          <div><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="5" fill="#fff"/><path d="M15 2l4 5h-8zM15 28l4-5h-8zM2 15l5-4v8zM28 15l-5-4v8z" fill="#e8503a"/></svg>ずらす：その向き</div>
        </div>
        <div id="ring"><svg viewBox="-52 -52 104 104"><path data-d="2" d="M-14 -20 L0 -48 L14 -20 Z"/><path data-d="3" d="M-14 20 L0 48 L14 20 Z"/><path data-d="4" d="M-20 -14 L-48 0 L-20 14 Z"/><path data-d="5" d="M20 -14 L48 0 L20 14 Z"/><circle data-d="1" r="16"/></svg></div>
      </div>
      <button id="mute" class="hide" aria-label="音">♪</button>
      <div id="title" class="ov hide">
        <div class="rain"></div>
        <h1 id="logo"><svg viewBox="0 0 118 96"><path d="M8 50 Q59 -4 110 50 Q96 42 84 50 Q72 42 59 50 Q46 42 34 50 Q22 42 8 50Z" fill="#e8503a"/><path d="M59 50 V82 Q59 92 49 92 Q41 92 41 84" fill="none" stroke="#22304a" stroke-width="5" stroke-linecap="round"/><path d="M59 6 V0" stroke="#22304a" stroke-width="4" stroke-linecap="round"/></svg><span class="t">アンブレラン<span class="lc hide">（仮）</span></span><small>描いた傘1本で、山の上の会社まで走れ</small></h1>
        <div id="how">
          <p><i>1</i><span>傘を<b>描く</b>（布と柄の2本の線）。形で性能が変わる</span></p>
          <p><i>2</i><span>人は自動で走る。指で<b>傘だけ</b>動かす<br>はなす＝とじる・さわる＝上・ずらす＝その向き</span></p>
          <p><i>3</i><span>当たる直前に開くと<b>ジャスト</b>で加速。<b>始業9:00</b>に間に合え！</span></p>
        </div>
        <div id="best0"></div>
        <div class="tbtns"><button id="go" class="btn b1">傘を描く</button><button id="again0" class="btn b2 hide">前の傘で走る</button></div>
        <div class="cr">N.K. Works</div>
      </div>
      <div id="draw" class="ov hide">
        <div id="dh"><b>傘を描こう</b><span class="pill on" id="p1">① 布</span><span class="pill" id="p2">② 柄</span></div>
        <div id="dt"></div>
        <canvas id="pad" width="600" height="660"></canvas>
        <div class="drow"><button id="dclr" class="btn b2">描き直す</button><button id="dok" class="btn b1" disabled>これで決定 ▶</button></div>
      </div>
      <div id="conf" class="ov hide">
        <div class="top">この傘で走る？</div>
        <div id="cpanel">
          <div id="bars"></div>
          <div id="cn"></div>
          <div class="crow"><button id="cre" class="btn b2">描き直す</button><button id="cgo" class="btn b1">スタート ▶</button></div>
        </div>
      </div>
      <div id="res" class="ov hide">
