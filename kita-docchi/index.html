function questionParams(mode, qi) {   // その問の難しさ（10問モードは3段階、エンドレスは毎問じわじわ）

  }

    if (!['title', 'brief', 'ride', 'ask', 'reveal', 'result'].includes(state)) v.push('状態がおかしい: ' + state);
    if (![camera.position.x, camera.position.y, camera.position.z, taxi.position.x, taxi.position.z, camera.rotation.x, camera.rotation.y, camera.rotation.z].every(fin)) v.push('カメラ/タクシーの位置がNaN');
    if (!(fadeA >= 0 && fadeA <= 1)) v.push('fadeが範囲外');
    if (game.qi < 0 || (game.mode === 'normal' && game.qi >= CONFIG.QUESTIONS && state !== 'result')) v.push('問番号が範囲外 ' + game.qi);
    if (game.score < 0 || game.score > game.marks.length || (game.mode === 'normal' && game.marks.length > CONFIG.QUESTIONS)) v.push('スコアがおかしい');
    if (game.mode === 'endless' && game.marks.length && game.marks.slice(0, -1).some(m => !m)) v.push('エンドレスなのに途中で間違えても続いている');
    if (game.marks.filter(Boolean).length !== game.score) v.push('スコアと○の数が合わない');
    if (q) {
      const st = questionParams(q.mode, q.qi), P = q.path;
      if (q.roads !== st.roads) v.push('道の数が段階と違う');
      if (q.turns.length < st.turns[0] || q.turns.length > st.turns[1]) v.push('曲がる回数が段階の範囲外');
      if (Math.abs(q.params.speedMul - st.speedMul) > 1e-9 || q.params.speedMul > (q.mode === 'endless' ? CONFIG.ENDLESS.MAX_SPEED : 1) + 1e-9) v.push('速度倍率がおかしい');
      if (q.endHeading % 90 !== 0) v.push('停車時の向きが90度の倍数でない');
      if (mod(q.endHeading + q.correctIdx * 360 / q.roads, 360) !== q.target) v.push('正解の道と行き先が一致しない');
      if (q.roads === 4 && q.target % 90 !== 0) v.push('4本の道なのに斜めが行き先');
      if (mod(P.pts[P.pts.length - 1].phi, 360) !== q.endHeading) v.push('道のりの最後の向きがendHeadingと違う');
      // タクシーの位置は道路の上
      const onRoad = (x, z) => P.rects.some(r => x >= r.x0 - .3 && x <= r.x1 + .3 && z >= r.z0 - .3 && z <= r.z1 + .3);
      if (state === 'ride' || state === 'reveal') { if (!onRoad(taxi.position.x, taxi.position.z)) v.push('タクシーが道路から外れた'); }
      if (state === 'ride') {
        if (rideT < 0 || rideT > P.T + CONFIG.STOP_HOLD + .5) v.push('rideTが範囲外');
        if (Math.abs(camera.rotation.z) > CONFIG.ROLL_DEG * D2R * 1.5) v.push('車体の傾きが大きすぎる');
        if (poseAt(P, 't', Math.min(rideT, P.T)).speed > CONFIG.SPEED_STRAIGHT * q.params.speedMul * 1.1) v.push('速すぎる');
        let prev = -1; for (let t = 0; t <= P.T; t += P.T / 40) { const s = poseAt(P, 't', t).s; if (s < prev - 1e-6) { v.push('進む距離が戻った'); break; } prev = s; }
      }
      if (world) {   // 建物が道路にめり込んでいない・建物どうしが重ならない
        const br = world.bRects;
        for (const b of br) if (P.rects.some(r => overlap(b, r, 0))) { v.push('建物が道路にめり込んでいる'); break; }
        outer: for (let i = 0; i < br.length; i++) for (let j = i + 1; j < br.length; j++) if (overlap(br[i], br[j], -.5)) { v.push('建物どうしがめり込んでいる'); break outer; }
      }
    }
    if (state === 'ask' && askT > 600) v.push('askが終わらない');
    return v;
  },
  genCheck(seed, mode = 'normal', n = CONFIG.QUESTIONS) {   // 描画なしで、seedごとの問題を総点検（道路上を走る／建物がめり込まない／なめらかにつながる）
    const bad = [];
    for (let qi = 0; qi < n; qi++) {
      const qq = makeQuestion((seed * 2654435761 + qi * 40503 + 1) >>> 0, qi, mode), P = qq.path, tag = mode + ' seed' + seed + '/問' + (qi + 1) + ': ';
      for (let i = 0; i < P.pts.length; i++) {
        const p = P.pts[i];
        if (!P.rects.some(r => p.x >= r.x0 - .3 && p.x <= r.x1 + .3 && p.z >= r.z0 - .3 && p.z <= r.z1 + .3)) { bad.push(tag + '道路から外れた点 ' + i); break; }
        if (i && (Math.hypot(p.x - P.pts[i - 1].x, p.z - P.pts[i - 1].z) > 1.3 || Math.abs(p.phi - P.pts[i - 1].phi) > 15)) { bad.push(tag + '道のりが飛んでいる ' + i); break; }
      }
      if (!(P.T > 3 && P.T < 60)) bad.push(tag + '所要時間が変 ' + P.T);
      if (mode === 'endless' && qi > 0) { const pv = questionParams(mode, qi - 1), cu = questionParams(mode, qi); if (cu.speedMul < pv.speedMul - 1e-9 || cu.turns[0] < pv.turns[0] || (pv.roads === 8 && cu.roads !== 8)) bad.push(tag + '難しさが下がった'); }
      if (mod(P.pts[P.pts.length - 1].phi, 360) !== qq.endHeading) bad.push(tag + '最後の向きが違う');
      if (mod(qq.endHeading + qq.correctIdx * 360 / qq.roads, 360) !== qq.target) bad.push(tag + '正解の道がずれている');
      const w = buildWorld(qq);
      for (const b of w.bRects) if (P.rects.some(r => overlap(b, r, 0))) { bad.push(tag + '建物が道路にめり込み'); break; }
      for (let i = 0; i < w.bRects.length; i++) for (let j = i + 1; j < w.bRects.length; j++) if (overlap(w.bRects[i], w.bRects[j], -.5)) { bad.push(tag + '建物どうしがめり込み'); i = 1e9; break; }
      if (w.bRects.length < 20) bad.push(tag + '建物が少なすぎる ' + w.bRects.length);
      scene.remove(w.root); w.geos.forEach(g => g.dispose());
    }
    return bad;
  },
  ready: true,
};
</script>
