<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
// ===== [SEC:CONFIG] =====
const CONFIG = {
  REC: {
    N: 32,              // 読み取りに使う点の数
    REJECT: 3.0,        // これより距離が大きいと「読めない」
    MIN_LEN: 0.04,      // 線の長さがこれ未満（描く場所の大きさ比）は無視
    DEBOUNCE_MS: 280,   // 描き終わってから読み取るまでの待ち
    W: { frame: [2.6, 0.45], elem: [1.0, 0.12], mod: [1.0, 0.12] }, // 形の特徴の重み [ふくらみ, 角の数]
  },
  PAD: {
    FRAME_R: 0.47,      // 外の形のガイド円（描く場所の大きさ比）
    FRAME_MIN: 0.40,    // これ以上大きい線は「外の形」とみなす
    ELEM_X: 0.165, ELEM_Y: 0.05, ELEM_R: 0.135,   // 中央の2つの枠
    MOD_Y: -0.245, MOD_R: 0.115,                  // 上の枠
    LINE_W: 0.016,      // 線の太さ
  },
  POWER: {
    COMBO: 1.6, DOUBLE: 1.5,
    FORM: { ball: 1.0, arrow: 1.1, wall: 1.0, rain: 1.3, pillar: 1.4 },
    MOD:  { big: 2.0, small: 0.4, many: 1.4, fast: 1.2, spin: 1.2, chase: 1.1, gentle: 0.8, reverse: 1.0 },
  },
  MAGIC: {
    CIRCLE_TIME: 0.9,   // 魔法陣が光ってから魔法が出るまで（秒）
    BALL_TIME: 0.95, ARROW_TIME: 0.42, WALL_TIME: 0.6, RAIN_TIME: 2.0, PILLAR_TIME: 1.1,
    FAST: 2.4,          // はやい：速さ倍率
    BIG: 2.1, SMALL: 0.45, MANY: 6,
    AFTER: 3.2,         // 成功：当たってから結果が出るまで（秒）
    AFTER_FAIL: 1.8,    // 失敗：当たってから結果が出るまで（秒）
  },
  STAGE_COUNT: 10,
  SAVE_KEY: 'mahoujin_tegaki_v1',
  URL: 'https://nkworks-games.com/mahoujin/',
};
// ===== [SEC:DATA] =====
const PI = Math.PI;
function arcP(cx, cy, rx, ry, a0, a1, n = 36) { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return p; }
function fnP(f, t0, t1, n = 48) { const p = []; for (let i = 0; i <= n; i++) p.push(f(t0 + (t1 - t0) * i / n)); return p; }
function fit01(stroke) { // 1本の線を0〜1の箱に収める（縦横比は保つ）
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of stroke) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const s = Math.max(x1 - x0, y1 - y0) || 1, ox = (s - (x1 - x0)) / 2, oy = (s - (y1 - y0)) / 2;
  return stroke.map(([x, y]) => [(x - x0 + ox) / s, (y - y0 + oy) / s]);
}
const pentagram = () => { const p = []; for (let k = 0; k <= 5; k++) { const a = (-90 + 144 * k) * PI / 180; p.push([.5 + .5 * Math.cos(a), .52 + .5 * Math.sin(a)]); } return p; };
const starOutline = () => { const p = []; for (let k = 0; k <= 10; k++) { const a = (-90 + 36 * k) * PI / 180, r = k % 2 ? .2 : .5; p.push([.5 + r * Math.cos(a), .52 + r * Math.sin(a)]); } return p; };
const wave = (per, amp) => fnP(t => [t, .5 - amp * Math.sin(t * per * 2 * PI)], 0, 1, 40);
const spiral = (dir) => fit01(fnP(t => { const r = .04 + .46 * t / (4 * PI); return [.5 + dir * r * Math.cos(t), .5 + r * Math.sin(t)]; }, 0, 4 * PI, 60));
const crescent = () => [...arcP(.5, .5, .5, .5, PI / 3, PI * 5 / 3, 30), ...arcP(.72, .5, .4, .44, -PI * 0.47, -PI * 1.53, 24)];
const lemniscate = () => fit01(fnP(t => { const d = 1 + Math.sin(t) ** 2; return [Math.cos(t) / d, Math.sin(t) * Math.cos(t) / d]; }, 0, 2 * PI, 64));
const sCurve = () => [...arcP(.5, .27, .27, .25, -PI / 9, -PI * 1.5, 22), ...arcP(.5, .73, .27, .25, -PI / 2, PI * 8 / 9, 22)];
const heart = () => fit01(fnP(t => [16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))], 0, 2 * PI, 64));

// slot: frame=外の形 / elem=中央 / mod=上の枠。tpl=お手本（線の配列の配列）
const SYMBOLS = [
  { id: 'circle',   slot: 'frame', name: 'まる',     key: 'ball',   tpl: [[arcP(.5, .5, .5, .5, -PI / 2, PI * 1.5)], [arcP(.5, .5, .5, .4, -PI / 2, PI * 1.5)], [arcP(.5, .5, .4, .5, -PI / 2, PI * 1.5)]] },
  { id: 'triangle', slot: 'frame', name: 'さんかく', key: 'arrow',  tpl: [[[[.5, 0], [1, .87], [0, .87], [.5, 0]]], [[[.5, 0], [.95, 1], [.05, 1], [.5, 0]]]] },
  { id: 'square',   slot: 'frame', name: 'しかく',   key: 'wall',   tpl: [[[[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]]], [[[0, 0], [1, 0], [1, .75], [0, .75], [0, 0]]], [[[.1, 0], [1, .1], [.9, 1], [0, .9], [.1, 0]]], [[[0, .1], [.9, 0], [1, .9], [.1, 1], [0, .1]]]] },
  { id: 'star',     slot: 'frame', name: 'ほし',     key: 'rain',   tpl: [[pentagram()], [starOutline()]] },
  { id: 'diamond',  slot: 'frame', name: 'ひしがた', key: 'pillar', tpl: [[[[.5, 0], [1, .5], [.5, 1], [0, .5], [.5, 0]]], [[[.5, 0], [.85, .5], [.5, 1], [.15, .5], [.5, 0]]]] },
  { id: 'fire',    slot: 'elem', name: 'やま',       key: 'fire',    tpl: [[[[0, 1], [.5, 0], [1, 1]]], [[[.2, 1], [.5, 0], [.8, 1]]]] },
  { id: 'water',   slot: 'elem', name: 'なみ',       key: 'water',   tpl: [[wave(1.5, .18)], [wave(1, .2)], [wave(2, .15)]] },
  { id: 'wind',    slot: 'elem', name: 'うずまき',   key: 'wind',    tpl: [[spiral(1)], [spiral(-1)]] },
  { id: 'earth',   slot: 'elem', name: '三本線',     key: 'earth',   tpl: [[[[0, .15], [1, .15]], [[0, .5], [1, .5]], [[0, .85], [1, .85]]], [[[.1, .2], [.9, .2]], [[0, .5], [1, .5]], [[.1, .8], [.9, .8]]]] },
  { id: 'ice',     slot: 'elem', name: 'ゆきの結晶', key: 'ice',     tpl: [[[[.5, 0], [.5, 1]], [[.07, .25], [.93, .75]], [[.93, .25], [.07, .75]]], [[[.5, 0], [.5, 1]], [[0, .5], [1, .5]], [[.15, .15], [.85, .85]], [[.85, .15], [.15, .85]]]] },
  { id: 'thunder', slot: 'elem', name: 'いなずま',   key: 'thunder', tpl: [[[[.65, 0], [.2, .55], [.75, .45], [.3, 1]]], [[[.7, 0], [.3, .5], [.7, .5], [.3, 1]]]] },
  { id: 'light',   slot: 'elem', name: 'じゅうじ',   key: 'light',   tpl: [[[[.5, 0], [.5, 1]], [[0, .5], [1, .5]]]] },
  { id: 'dark',    slot: 'elem', name: 'みかづき',   key: 'dark',    tpl: [[crescent()], [arcP(.5, .5, .5, .5, PI * .3, PI * 1.7)], [[...arcP(.5, .5, .5, .5, PI * .35, PI * 1.65, 30), ...arcP(.85, .5, .5, .5, -PI * .62, -PI * 1.38, 20)]]] },

const REC = (() => {
  const N = CONFIG.REC.N;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    const pts = [];

      const s = st.map(p => Array.isArray(p) ? { x: p[0], y: p[1] } : { x: p.x, y: p.y });
      if (s.length === 1) s.push({ x: s[0].x + 0.001, y: s[0].y + 0.001 });
      s.forEach(p => pts.push({ x: p.x, y: p.y, id }));
    });
    return pts;
  }
  function pathLen(pts) { let d = 0; for (let i = 1; i < pts.length; i++) if (pts[i].id === pts[i - 1].id) d += dist(pts[i - 1], pts[i]); return d; }

    const pts = src.map(p => ({ ...p }));
    const I = pathLen(pts) / (n - 1); let D = 0; const out = [{ ...pts[0] }];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].id !== pts[i - 1].id) continue;
      const d = dist(pts[i - 1], pts[i]);
      if (D + d >= I && d > 0) {
        const t = (I - D) / d, q = { x: pts[i - 1].x + t * (pts[i].x - pts[i - 1].x), y: pts[i - 1].y + t * (pts[i].y - pts[i - 1].y), id: pts[i].id };
        out.push(q); pts.splice(i, 0, q); D = 0;

    const open = SAVE.stageOpen(i), b = document.createElement('button'); b.className = 'stg' + (open ? '' : ' lock');
    b.innerHTML = `<div class="n">お題 ${i + 1}</div><div class="t">${open ? s.title : '？？？'}</div><div class="s">${open ? starStr(SAVE.d.stars[i] || 0) : '🔒'}</div>`;

  });

}
function updateHUD() {
  const s = STAGES[CUR], best = SAVE.d.stars[CUR] || 0;
  $('odaiNo').textContent = `お題 ${CUR + 1} / ${STAGES.length}`; $('odaiStars').textContent = best ? starStr(best) : '';
  $('odaiTitle').textContent = s.title; $('odaiStory').textContent = s.story;
}
function enterStage(i) {
  CUR = i; ['select', 'result', 'menu', 'title'].forEach(id => ov(id, false));
  buildStage(i); updateHUD(); PAD.clear(); PAD.setEnabled(true); casting = false;
  if (i === 0 && !SAVE.d.intro) { const box = $('introSyms'); box.innerHTML = ''; UNLOCK_START.forEach(id => box.appendChild(symCard(SYM[id]))); ov('intro', true); SAVE.d.intro = true; SAVE.save(); }
}
function onPad(s) {
  const el = $('spellName'); el.textContent = s.msg; el.className = s.cls;
  $('btnCast').disabled = !s.ready || casting;
}
PAD.onChange(onPad);
$('btnCast').onclick = async () => {
  const s = PAD.state(); if (!s.ready || casting || !ST) return;
  casting = true; PAD.setEnabled(false); $('btnCast').disabled = true;
  const sp = s.spell, res = judgeSpell(STAGES[CUR], sp);
  try { await castSpell(sp, PAD.drawing(), res); } catch (e) { console.error(e); }
  finishCast(sp, res);
};
function finishCast(sp, res) {
  const def = STAGES[CUR], isNew = SAVE.addDex(sp.key); let newSyms = [];
  if (res.pass) {
    const prev = SAVE.d.stars[CUR] || 0; if (res.stars > prev) SAVE.d.stars[CUR] = res.stars;
    if (prev === 0) { newSyms = UNLOCK_BY_STAGE[CUR].filter(id => !SAVE.isUnlocked(id)); SAVE.d.unlocked.push(...newSyms); }
    SAVE.save(); SFX.win();
  } else SFX.lose();
  LAST = { sp, res };
  $('resStars').innerHTML = res.pass ? '★'.repeat(res.stars) + `<span class="off">${'★'.repeat(3 - res.stars)}</span>` : '<span style="font-size:28px">しっぱい…</span>';
  $('resName').innerHTML = `「${sp.name}」` + (isNew ? ' <span style="color:#ff9ad5;font-size:13px">図鑑に登録！</span>' : '');
  $('resMsg').textContent = res.msg;
  $('resHint').textContent = (res.pass ? (res.stars < 3 ? '★3のヒント：' + def.hint3 : '★3達成！') : 'ヒント：' + def.hint) + `　（図鑑 ${SAVE.dexCount()} / ${TOTAL_SPELLS}）`;
  const nw = $('resNew'); nw.innerHTML = '';
  if (newSyms.length) { nw.innerHTML = '<div style="text-align:center;font-weight:900;color:#ffd36b;margin-bottom:6px">新しい記号を覚えた！</div>'; const box = document.createElement('div'); box.className = 'newsym'; newSyms.forEach(id => box.appendChild(symCard(SYM[id]))); nw.appendChild(box); }
  const last = CUR === STAGES.length - 1;
  $('btnNext').style.display = res.pass ? '' : 'none'; $('btnNext').textContent = last ? 'お題一覧へ' : '次のお題へ';
  updateHUD(); ov('result', true); casting = false;
}
$('btnRetry').onclick = () => { ov('result', false); buildStage(CUR); PAD.setEnabled(true); PAD.refresh(); };
$('btnNext').onclick = () => { if (CUR < STAGES.length - 1) enterStage(CUR + 1); else { ov('result', false); openSelect(); } };
$('btnResList').onclick = () => { ov('result', false); openSelect(); };
$('btnResShare').onclick = () => { if (!LAST) return; const { sp, res } = LAST; shareX(res.pass ? `「${sp.name}」で「${STAGES[CUR].title}」を${'★'.repeat(res.stars)}でクリア！` : `「${sp.name}」を発動したら…${res.msg}`); };
$('btnDexShare').onclick = () => shareX(`魔法図鑑 ${SAVE.dexCount()} / ${TOTAL_SPELLS} 種類の魔法を見つけた！`);
$('btnBook').onclick = openBook;
$('btnUndo').onclick = () => { if (!casting) PAD.undo(); };
$('btnClear').onclick = () => { if (!casting) PAD.clear(); };
$('btnMenu').onclick = () => ov('menu', true);
$('mBack').onclick = () => ov('menu', false);
$('mList').onclick = () => { ov('menu', false); openSelect(); };
$('mDex').onclick = () => { ov('menu', false); openDex(); };
$('mTitle').onclick = () => { ov('menu', false); ov('title', true); };
$('btnStart').onclick = () => { SFX.unlock(); ov('title', false); openSelect(); };
$('btnTitleDex').onclick = openDex;
$('btnSelBook').onclick = openBook; $('btnSelDex').onclick = openDex; $('btnSelTitle').onclick = () => { ov('select', false); ov('title', true); };
const soundLabel = () => { const t = SAVE.d.sound ? '音：ON' : '音：OFF'; $('btnSound').textContent = t; $('mSound').textContent = t; };
$('btnSound').onclick = $('mSound').onclick = () => { SAVE.d.sound = !SAVE.d.sound; SAVE.save(); soundLabel(); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => ov(b.dataset.close, false));
soundLabel();
// タイトルの魔法陣
const tc = $('titleCircle'), tg = tc.getContext('2d');
function drawTitle(t) {
  const s = tc.clientWidth; if (!s) return; if (tc.width !== s * 2) { tc.width = tc.height = s * 2; }
  tg.setTransform(2, 0, 0, 2, s, s); tg.clearRect(-s / 2, -s / 2, s, s); tg.lineCap = tg.lineJoin = 'round';
  tg.shadowColor = '#ffd36b'; tg.shadowBlur = 14; tg.strokeStyle = '#ffe9a8';
  tg.lineWidth = 3; tg.beginPath(); tg.arc(0, 0, s * 0.47, 0, Math.PI * 2); tg.stroke(); tg.lineWidth = 1.5; tg.beginPath(); tg.arc(0, 0, s * 0.41, 0, Math.PI * 2); tg.stroke();
  tg.save(); tg.rotate(t * 0.15); for (let i = 0; i < 24; i++) { tg.save(); tg.rotate(i / 24 * Math.PI * 2); tg.translate(0, -s * 0.44); runeMark(tg, i, 9); tg.restore(); } tg.restore();
  tg.save(); tg.rotate(-t * 0.25); tg.lineWidth = 2.5; tg.beginPath(); for (let k = 0; k <= 5; k++) { const a = -Math.PI / 2 + k * Math.PI * 4 / 5, r = s * 0.38; k ? tg.lineTo(Math.cos(a) * r, Math.sin(a) * r) : tg.moveTo(Math.cos(a) * r, Math.sin(a) * r); } tg.stroke(); tg.restore();
  const p = (t % 4) / 4; tg.strokeStyle = '#ff9a5a'; tg.shadowColor = '#ff7a1a'; tg.lineWidth = 4; tg.beginPath(); tg.moveTo(-s * 0.1, s * 0.07); tg.lineTo(0, -s * 0.1); tg.lineTo(s * 0.1, s * 0.07); tg.globalAlpha = 0.6 + 0.4 * Math.sin(p * Math.PI * 2); tg.stroke(); tg.globalAlpha = 1;
}
// ===== [SEC:MAIN] =====
const clock = new THREE.Clock(); let TIME = 0;
const DEBUG_SPEED = Math.min(8, +(new URLSearchParams(location.search).get('speed') || 1)); // 動作確認用（ふだんは1）
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta()) * DEBUG_SPEED; TIME += dt;
  const titleOn = $('title').classList.contains('on');
  if (titleOn) drawTitle(TIME);
  if (ST) { ST.time += dt; for (let i = 0; i < ST.upd.length; i++) ST.upd[i](dt, TIME); for (const a of ST.actors) a.update(dt); }
  updateTweens(dt); PADD.update(dt); PNORM.update(dt); updateCamera(TIME, dt); bgClouds.rotation.y += dt * 0.01;
  if (!titleOn) renderer.render(scene, camera);
}
resize3D(); PAD.layout();
addEventListener('resize', () => { PAD.layout(); resize3D(); });
loop();
loadAssets(p => $('loadBar').firstElementChild.style.width = (p * 100) + '%')
  .then(() => { $('loadBar').style.display = 'none'; $('titleBtns').style.display = ''; window.__ready = true; })

window.__SYM = SYM; window.__UNLOCK = UNLOCK_BY_STAGE;
window.__game = { STAGES, SAVE, PAD, buildSpell, judgeSpell, enterStage, castSpell, get ST() { return ST; }, finishCast };
