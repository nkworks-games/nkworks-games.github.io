    { t:45,  label:'チェンソー',      lead:0.75, gap:[0.5,0.8],   dbl:0.4,  tri:0.15, dm:1.1,  rm:1.15, pool:{chainsaw:3,chainJab:2,knife:1,scissors:1,twist:1} },
    { t:60,  label:'拳銃・マシンガン', lead:0.62, gap:[0.35,0.6],  dbl:0.5,  tri:0.25, dm:1.2,  rm:1.2,  mix:true, pool:{pistol:3,mgun:2,scissors:2,chainJab:2,chainsaw:1,twist:1} },
    { t:75,  label:'ショベルカー',    lead:0.55, gap:[0.3,0.5],   dbl:0.6,  tri:0.3,  dm:1.3,  rm:1.25, mix:true, pool:{shovel:2,sweep:2,pistol:2,mgun:1,chainsaw:1,twist:1,scissors:1} },
    { t:90,  label:'戦車・ミサイル',  lead:0.5,  gap:[0.25,0.45], dbl:0.7,  tri:0.4,  dm:1.45, rm:1.3,  mix:true, pool:{tank:2,missile:3,mgun5:2,chainsaw:1,shovel:1,knife:1,chainJab:1} },
    { t:105, label:'宇宙レーザー',    lead:0.45, gap:[0.2,0.4],   dbl:0.8,  tri:0.5,  dm:1.6,  rm:1.35, mix:true, pool:{laser:3,missile:2,tank:1,mgun5:1,chainJab:2,scissors:2,knife:1} },
  ],
  FINAL_SPAWN: 116.4, FINALS: [[117.7,'laser'],[118.4,'laser'],[119.1,'final']], // 最後は宇宙レーザー3連発
  TAP_SEP: 0.26, MAX_TAPS: 3, MIN_GAP: 0.95,                                       // MIN_GAP:マークどうしの最小の距離                                                       // 押す攻撃どうしの最小の間（秒）・同時に出る数

const P = CONFIG.PACK;

// ===== [SEC:UTIL] =====
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t,0,1),3), ei=t=>Math.pow(clamp(t,0,1),3), sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(1);
const rr=(a,b)=>a+(b-a)*rnd(), pick=a=>a[Math.floor(rnd()*a.length)];
function pickW(pool){let s=0;for(const k in pool)s+=pool[k];let r=rnd()*s;for(const k in pool){r-=pool[k];if(r<=0)return k}return Object.keys(pool)[0]}
const $=id=>document.getElementById(id);

// ===== [SEC:STATE] =====
const G={state:'title',t:0,vt:0,gauge:0,phase:-1,attacks:[],nextSpawn:0,calm:0,hop:null,tears:[],face:'normal',faceUntil:0,labelDirty:true,
  shake:0,flash:0,pops:[],banner:null,splats:[],endT:0,resultShown:false,finalDone:false,nextId:1,wob:{x:0,y:0,vx:0,vy:0},
  stats:{perfect:0,dodge:0,hit:0},bot:false,result:null,view:{halfW:3,halfH:2,topY:3,dist:6},ui:{W:800,H:600,R:40,top:0},
  home:new THREE.Vector3(0,P.H/2,0.05),homeS:{x:0,y:0},camBase:new THREE.Vector3()};

// ===== [SEC:AUDIO] =====
let actx=null,master=null,noiseBuf=null,muted=false;
function audioInit(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=muted?0:0.8; master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){ actx=null; }
}
function tone(f,d,type='sine',v=0.2,f2=0,dl=0){
  if(!actx) return; const t=actx.currentTime+dl,o=actx.createOscillator(),g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.03);
}
function noise(d,v=0.3,f=1000,type='bandpass',q=1,dl=0,f2=0){
  if(!actx) return; const t=actx.currentTime+dl,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=noiseBuf; fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d); fl.Q.value=q;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t,Math.random()*0.8); s.stop(t+d+0.03);
}
const SFX={
  warn(){tone(1250,0.05,'square',0.05)},
  perfect(){tone(1320,0.1,'triangle',0.2);tone(1980,0.16,'sine',0.13,0,0.05)},
  good(){tone(990,0.1,'triangle',0.16)},
  block(){noise(0.07,0.22,3500,'highpass');tone(2400,0.14,'square',0.04,1900)},
  rip(){noise(0.28,0.45,2200,'bandpass',0.9,0,500)},
  tear(){noise(0.1,0.22,2600,'bandpass',1.3)},
  mash(){tone(520+Math.random()*90,0.035,'square',0.045)},
  whoosh(){noise(0.2,0.26,500,'bandpass',0.8,0,2600)},
  shot(){noise(0.14,0.5,1400,'lowpass',0.8);tone(160,0.1,'square',0.13,60)},
  boom(){noise(0.95,0.6,600,'lowpass',0.7,0,70);tone(75,0.6,'sine',0.45,28)},
  charge(d){tone(180,d,'sawtooth',0.05,1300)},
  laser(){tone(1500,0.5,'sawtooth',0.1,180);noise(0.5,0.25,4500,'highpass')},
  alarm(){for(let i=0;i<3;i++)tone(i%2?660:880,0.12,'square',0.09,0,i*0.14)},
  splash(){noise(0.7,0.65,800,'lowpass',0.6,0,150);tone(110,0.45,'sine',0.35,40)},
  clear(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.28,'triangle',0.15,0,i*0.1))},
  hop(){tone(500,0.12,'sine',0.12,900)},
};
let saw=null,sawRefs=0;
function sawOn(){ sawRefs++; if(!actx||saw) return;
  const o=actx.createOscillator(),lfo=actx.createOscillator(),lg=actx.createGain(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=95; lfo.frequency.value=24; lg.gain.value=25; f.type='lowpass'; f.frequency.value=1800; g.gain.value=0.06;
  lfo.connect(lg); lg.connect(o.frequency); o.connect(f); f.connect(g); g.connect(master); o.start(); lfo.start(); saw={o,lfo,g};
}
function sawStopNode(){ if(!saw) return; const t=actx.currentTime; saw.g.gain.setTargetAtTime(0,t,0.05); saw.o.stop(t+0.3); saw.lfo.stop(t+0.3); saw=null; }
function sawOff(){ sawRefs=Math.max(0,sawRefs-1); if(sawRefs===0) sawStopNode(); }
function sawKill(){ sawRefs=0; sawStopNode(); }
const BGM={on:false,next:0,step:0};
function bgmUpdate(){
  if(!actx||!BGM.on||actx.state!=='running') return;
  const bpm=100+Math.max(0,G.phase)*10,s16=60/bpm/4,now=actx.currentTime,V=CONFIG.BGM_VOL;
  if(BGM.next<now) BGM.next=now+0.03;
  while(BGM.next<now+0.15){
    const st=BGM.step%16,dl=BGM.next-now;
    if(st%4===0) tone(150,0.16,'sine',0.32*V,45,dl);
    if(st%4===2) noise(0.04,0.1*V,8000,'highpass',1,dl);
    if(G.phase>=3&&st%2===1) noise(0.03,0.05*V,9000,'highpass',1,dl);
    if(st%2===0){ const seq=[0,0,3,0,7,0,5,3]; tone(55*Math.pow(2,seq[(BGM.step>>1)%8]/12),s16*1.5,'triangle',0.13*V,0,dl); }
    BGM.step++; BGM.next+=s16;
  }

function applyDeform(defs){ // つままれた所のねじれ(tw)・引っぱり(pl)・浮き(lift)

      let x=A[i],y=A[i+1],z=A[i+2];
      if(d.tw){ const ph=d.tw*w,c=Math.cos(ph),sn=Math.sin(ph),al=(x-d.px)*d.nx+(y-d.py)*d.ny,tg=(x-d.px)*tx+(y-d.py)*ty,tg2=tg*c-z*sn; z=tg*sn+z*c; x=d.px+al*d.nx+tg2*tx; y=d.py+al*d.ny+tg2*ty; }
      if(d.pl){ x-=d.nx*d.pl*w; y-=d.ny*d.pl*w; }
      if(d.lift) z+=d.lift*w;
      if(d.dent){ const L=Math.hypot(d.px,d.py)||1; x-=d.px/L*d.dent*w; y-=d.py/L*d.dent*w; z-=d.dent*0.35*w; }

  for(let i=0;i<nx;i++){lx.lineTo(i*tx+tx/2,0);lx.lineTo((i+1)*tx,dep)}

  for(let i=0;i<ny;i++){lx.lineTo(0,h-(i*ty+ty/2));lx.lineTo(dep,h-(i+1)*ty)}
  lx.closePath();
}

function leadOf(d,ph){ return Math.max(d.input==='tap'?(ph.mix?0.42:0.55):0.5, CONFIG.LEAD[d.input]*ph.lead); }
function spanOf(d){ return (d.dur||0)+((d.shots||1)-1)*(d.interval||0); }
function canSpawn(d,ph){ // マウス1つ＋矢印キーでも遊べる組み合わせだけ重ねる
  const live=G.attacks.filter(a=>a.state!=='done'),ptr=live.filter(a=>a.input!=='swipe'),sw=live.length-ptr.length;
  if(!ph.mix) return d.input==='tap'?live.every(a=>a.input==='tap'):live.length===0;
  if(d.input==='swipe') return sw===0;
  if(d.input==='tap') return ptr.every(a=>a.input==='tap')&&ptr.length<CONFIG.MAX_TAPS;
  return ptr.length===0;
}
function freeT(T){ for(let k=0;k<8;k++){ if(!G.attacks.some(o=>o.state!=='done'&&o.input==='tap'&&!o.result&&Math.abs(o.T-T)<CONFIG.TAP_SEP)) return T; T+=CONFIG.TAP_SEP; } return T; }
function schedule(){
  if(!G.finalDone&&G.t>=CONFIG.FINAL_SPAWN){ G.finalDone=true; for(const [T,k] of CONFIG.FINALS) spawnAttack(k,T); G.nextSpawn=Infinity;
    G.banner={title:'最終兵器',sub:'宇宙レーザー3連発',t0:G.t}; SFX.alarm(); return; }
  if(G.t<G.nextSpawn||G.t<G.calm) return;
  const ph=CONFIG.PHASES[G.phase],key=pickW(ph.pool),d=CONFIG.ATK[key],lead=leadOf(d,ph),span=spanOf(d);
  if(G.t+lead+span>CONFIG.FINALS[0][0]-0.4||!canSpawn(d,ph)){ G.nextSpawn=G.t+0.08; return; }
  const a=spawnAttack(key,d.input==='tap'?freeT(G.t+lead):G.t+lead); if(!a){ G.nextSpawn=G.t+0.08; return; } let lastT=a.T;
  if(d.input==='tap'){ const taps=Object.keys(ph.pool).filter(k=>CONFIG.ATK[k].input==='tap'),n=rnd()<ph.tri?2:rnd()<ph.dbl?1:0;
    for(let i=0;i<n;i++){ const b=spawnAttack(pick(taps),freeT(lastT+rr(0.3,0.42))); if(!b) break; lastT=b.T; } }
  G.nextSpawn=ph.mix?G.t+rr(ph.gap[0],ph.gap[1]):(d.input==='tap'?lastT-lead*0.5:a.T+span)+rr(ph.gap[0],ph.gap[1]);

function spawnAttack(key,T,forceSide){

  const ph=CONFIG.PHASES[Math.max(0,G.phase)]; a.dmg=d.dmg*ph.dm; a.rise=(d.rise||0)*ph.rm; // 段階ごとの強さ

  } else {

  pack.wob.rotation.set(G.wob.x,G.wob.y,0); pack.tw.rotation.set(G.wob.x,G.wob.y,0); pack.scl.scale.set(sx,sy*sq,1); pack.mesh.scale.z=bz;
  const low=lowestPacketY(); if(low<TABLE_Y) pack.root.position.y+=TABLE_Y-low; // 傾いても机にめり込まないよう押し戻す
  const ns=nextSwipe(); G.nextSw=ns&&ns.id; // 次によける攻撃
  const defs=[];
  if(G.dent&&G.state==='play'){ const p=(G.t-G.dent.t0)/CONFIG.HOP_DUR; if(p>=0&&p<1){ const [x,y]=TGT[OPP[G.dent.dir]]||[0,-P.H/2+0.15]; defs.push({px:x,py:y,nx:1,ny:0,tw:0,pl:0,lift:0,dent:CONFIG.DENT*Math.pow(Math.sin(Math.PI*p),0.6)}); } } // なぞった向きの反対側がへこむ
  for(const a of G.attacks){ if(!a.box) continue; if(a.input==='swipe') animSwipe(a); else { animMount(a); if(a.dm) defs.push(a.dm); if(a.dm2) defs.push(a.dm2); } }
  applyDeform(defs);
  if(G.attacks.some(a=>a.def.tool==='chainsaw'&&a.state!=='done')) sawTex.offset.x=(G.vt*6)%1;
  // カメラのゆれ
  cam.position.copy(G.camBase); if(G.shake>0){ cam.position.x+=(Math.random()-.5)*G.shake*0.14; cam.position.y+=(Math.random()-.5)*G.shake*0.14; }
  if(G.labelDirty) drawLabel();
  drawPS(S,true); drawPS(K,false);
  scene.updateMatrixWorld();
  for(const a of G.attacks){ if(a.input==='swipe') continue; const ix=a.side==='l'?0.13:a.side==='r'?-0.13:0,iy=a.side==='t'?-0.13:0;
    const w=pack.mesh.localToWorld(_v.set(a.lx+ix,a.ly+iy,0.03)),home=w.clone(); home.x-=pack.root.position.x; home.y-=pack.root.position.y-TABLE_Y; const h=toScreen(home); a.hx=h.x; a.hy=h.y; const s=toScreen(w); a.sx=s.x; a.sy=s.y; }
  G.homeS=toScreen(_v.copy(G.home));
}

// ===== [SEC:LOOP] =====
let acc=0,last=performance.now(),manual=false,paused=false;
function update(frameDt){ acc+=Math.min(frameDt,CONFIG.MAX_FRAME); while(acc>=CONFIG.FIXED){ tick(CONFIG.FIXED); acc-=CONFIG.FIXED; } }
function render(){ updateVisual(); renderer.render(scene,cam); drawHUD(); bgmUpdate(); }
function frame(now){ if(!paused&&!manual) update((now-last)/1000); last=now; render(); requestAnimationFrame(frame); }
function resize(){
  const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio,2),asp=W/H,tanV=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
  renderer.setSize(W,H,false); hud.width=W*dpr; hud.height=H*dpr; hx.setTransform(dpr,0,0,dpr,0,0);
  const dist=Math.max((asp<1?1.9:2.65)/(tanV*asp),2.35/tanV),pitch=0.21,look=new THREE.Vector3(0,P.H*0.62,0);
  cam.aspect=asp; cam.position.set(0,look.y+Math.sin(pitch)*dist,Math.cos(pitch)*dist); cam.lookAt(look); cam.updateProjectionMatrix();
  G.camBase.copy(cam.position); G.view={halfW:dist*tanV*asp,halfH:dist*tanV,topY:look.y+dist*tanV,dist};
  G.ui={W,H,R:clamp(Math.min(W,H)*CONFIG.MARKER_R,28,52),top:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--st'))||0};
}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ paused=true; for(const id of [...ptrs.keys()]) release(id); ptrs.clear(); if(actx) actx.suspend(); }
  else { paused=false; last=performance.now(); if(actx) actx.resume(); } });

// ===== [SEC:UI] =====
const BEST_KEY='akeraremasen_best';
const LOSE_MSG=['素手で開けられた。しょうゆの袋としては、正しい姿。','ハサミには勝てなかった。袋なので。','包丁でスパッと。いさぎよい最期だった。','チェンソー相手によくがんばった。',
  '銃弾を受けて、あえなく開封。','ショベルカーに開けられた袋は、たぶん世界初。','戦車とミサイルに開けられた。もはや軍事目標。','宇宙から開けられた。人類の技術の勝利。'];
const RANK_MSG={S:'宇宙レーザーにも無傷。もはや開封不能。',A:'ほぼ無傷。メーカーに苦情が来るレベル。',B:'ボロボロだけど、中身は守りきった。',C:'ギリギリ…あと一押しで開いていた。'};
function loadBest(){ try{ return JSON.parse(localStorage.getItem(BEST_KEY))||null; }catch(e){ return null; } }
function saveBest(){ const r=G.result,b=loadBest();
  const better=!b||(r.clear&&!b.clear)||(r.clear&&b.clear&&r.gauge<b.gauge)||(!r.clear&&!b.clear&&r.t>b.t);
  if(better){ try{ localStorage.setItem(BEST_KEY,JSON.stringify({clear:r.clear,t:r.t,gauge:r.gauge,rank:r.rank||null})); }catch(e){} } r.newBest=better; }
function bestText(){ const b=loadBest(); if(!b) return ''; return b.clear?`最高記録：クリア（ランク${b.rank}）`:`最高記録：${b.t.toFixed(1)}秒`; }
function showResult(){
  const r=G.result;
  $('rTitle').textContent=r.clear?'耐えきった！':'開いた…';
  $('rTime').textContent=r.clear?'120秒、開けられなかった':`${r.t.toFixed(1)}秒 耐えた`;
  $('rRank').textContent=r.clear?r.rank:''; $('rRank').classList.toggle('hidden',!r.clear);
  $('rMsg').innerHTML=(r.clear?RANK_MSG[r.rank]:`第${r.phase+1}段階「${CONFIG.PHASES[r.phase].label}」で開封。<br>`+LOSE_MSG[r.phase])+`<br><small>PERFECT ${G.stats.perfect}回・よけた ${G.stats.dodge}回</small>`;
  $('bestR').textContent=(r.newBest?'★ 最高記録 更新！　':'')+bestText();
  $('result').classList.remove('hidden');
}
function startGame(){ audioInit(); reset(); $('title').classList.add('hidden'); $('result').classList.add('hidden'); BGM.on=true; BGM.step=0; if(actx) BGM.next=actx.currentTime+0.05; }
function toTitle(){ clearAttacks(); S.alive.fill(0); K.alive.fill(0); S.dirty=K.dirty=true; G.state='title'; G.tears=[]; G.splats=[]; setFace('normal'); G.labelDirty=true; pack.mesh.scale.set(1,1,1);
  $('result').classList.add('hidden'); $('title').classList.remove('hidden'); $('bestT').textContent=bestText(); }
$('startBtn').onclick=startGame; $('retryBtn').onclick=startGame; $('titleBtn').onclick=toTitle;
$('mute').onclick=()=>{ muted=!muted; if(master) master.gain.value=muted?0:0.8; $('mute').textContent=muted?'🔇':'🔊'; };
$('bestT').textContent=bestText();
document.querySelectorAll('.fbtn').forEach(a=>{ a.href='https://x.com/intent/follow?screen_name='+CONFIG.FOLLOW_X; a.textContent='𝕏 @'+CONFIG.FOLLOW_X; });
resize(); requestAnimationFrame(frame);

// ===== [SEC:TEST] =====
const baseChildren=scene.children.length; let tLast=0;
window.__TEST__={
  keys:[],
  randomInput(r){ if(G.state!=='play') return; const live=G.attacks.filter(a=>a.state!=='done'&&!a.result);
    if(r<0.4&&live.length){ const a=live[Math.floor(r*997)%live.length]; if(a.input==='swipe'){ const d=a.dirs[Math.min(a.shot,a.shots-1)]; doSwipe(d==='any'?'l':d); } else press(900+Math.floor(r*10),a.sx,a.sy); }
    else if(r<0.6){ for(let i=900;i<910;i++) release(i); }
    else if(r<0.7) doSwipe(['l','r','u','d','ul','ur','dl','dr'][Math.floor(r*80)%8]); },
  reset(seed){ manual=true; reset(seed); $('title').classList.add('hidden'); $('result').classList.add('hidden'); tLast=0; },
  step(sec,frameDt){ for(let t=0;t<sec-1e-9;t+=frameDt) update(frameDt); render(); },
  state(){ return {state:G.state,t:+G.t.toFixed(2),gauge:+G.gauge.toFixed(1),phase:G.phase,attacks:G.attacks.length,hop:G.hop&&G.hop.dir,over:G.state!=='play'&&G.endT>2.3}; },
  check(){ const v=[],fin=o=>isFinite(o.x)&&isFinite(o.y)&&isFinite(o.z);
    if(!fin(pack.root.position)) v.push('袋の位置がNaN'); if(!fin(cam.position)) v.push('カメラがNaN');
    const low=lowestPacketY(); if(low<TABLE_Y-0.015) v.push('袋が机にめり込み '+low.toFixed(3));
    for(let i=0;i<SAUCE_N;i++) if(S.alive[i]){ const y=S.p[i*3+1]; if(!isFinite(y)) {v.push('しょうゆ粒がNaN');break} if(y<TABLE_Y-0.02){v.push('しょうゆ粒が机の下');break} }
    if(!(G.gauge>=0&&G.gauge<=CONFIG.GAUGE_MAX+1e-6)) v.push('ちぎれ度が範囲外 '+G.gauge);
    if(G.t+1e-9<tLast) v.push('時間が戻った'); tLast=G.t;
    if(G.t>CONFIG.TOTAL+1e-6) v.push('120秒を超えた');
    if(G.attacks.length>12) v.push('攻撃がたまりすぎ '+G.attacks.length);
    if(scene.children.length>baseChildren+16) v.push('3Dの物が消えずに増えている '+scene.children.length);
    const b3=new THREE.Box3(); for(const a of G.attacks) for(const o of [a.tool,a.tool2]){ if(!o||!a.box||!o.visible) continue; b3.setFromObject(o); if(isFinite(b3.min.y)&&b3.min.y<TABLE_Y-0.03&&b3.min.y>-20) v.push(a.key+(o===a.tool2?'(押さえる手)':'')+'が机にめり込み '+b3.min.y.toFixed(2)); }
    return v; },
  bot(on,skill=1){ G.bot=on; G.botSkill=skill; },
  spawnAt(key,lead,side,y){ G.nextSpawn=Infinity; G.calm=1e9; const a=spawnAttack(key,G.t+lead,side); if(a&&y!=null&&a.box){ if(side==='t'){a.lx=y;a.box.position.x=y;} else {a.ly=y;a.box.position.y=y+P.H/2;} } return a&&a.id; },
  cfg(k,v){ CONFIG[k]=v; },
  dirs(id){ const a=G.attacks.find(o=>o.id===id); return a&&a.dirs; },
  atk(id){ const a=G.attacks.find(o=>o.id===id); return a&&{result:a.result,sx:a.sx,sy:a.sy,T:a.T,t:G.t,state:a.state,shot:a.shot,shotRes:a.shotRes}; },
  spawn(key,lead,side){ G.nextSpawn=Infinity; G.calm=1e9; return spawnAttack(key,G.t+lead,side).id; },
  view(x,y,z,dist,az,el){ const tg=new THREE.Vector3(x,y,z); cam.position.set(x+dist*Math.sin(az)*Math.cos(el),y+dist*Math.sin(el),z+dist*Math.cos(az)*Math.cos(el)); cam.lookAt(tg); G.camBase.copy(cam.position); hud.style.display='none'; },
  low(){ const r=[]; const b3=new THREE.Box3(); for(const a of G.attacks) for(const o of [a.tool,a.tool2]){ if(!o) continue; b3.setFromObject(o); if(b3.min.y<0){ let worst=null; o.traverse(n=>{ if(n.isMesh){ const bb=new THREE.Box3().setFromObject(n); if(!worst||bb.min.y<worst.y) worst={y:+bb.min.y.toFixed(3),geo:n.geometry.type,par:n.parent&&n.parent.type}; } });
      r.push({key:a.key,holder:o===a.tool2,state:a.state,res:a.result,side:a.side,hpSide:a.hp&&a.hp.side,ly:+a.ly.toFixed(2),t:+G.t.toFixed(2),T:+a.T.toFixed(2),rx:+(a.lastRx||0).toFixed(2),x:+(a.lastX||0).toFixed(2),worst}); } } return r; },
  info(){ const a=G.attacks[0]; return a&&a.tool&&a.tool.userData.sep; },
  skip(t){ G.t=t; G.nextSpawn=t; G.calm=0; },
  ready:true,
};
</script>
